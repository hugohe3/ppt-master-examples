    <text x="560" y="646" font-family="KaiTi" font-size="60" font-weight="bold" fill="#1C1A17">萎凋</text>
    <text x="560" y="708" font-size="46" fill="#1C1A17">不炒不揉，只有两步</text>
  </g>
  <g id="p02-row-yellow" data-pptx-bounds="204 798 966 156">
