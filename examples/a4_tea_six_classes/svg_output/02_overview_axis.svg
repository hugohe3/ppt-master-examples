    <image href="../images/word_green.png" x="370" y="372" width="150" height="82" preserveAspectRatio="xMidYMid meet" />
    <text x="560" y="424" font-family="KaiTi" font-size="60" font-weight="bold" fill="#1C1A17">杀青</text>
    <text x="560" y="486" font-size="46" fill="#1C1A17">灭活酶，氧化按在起点</text>
  </g>
  <g id="p02-row-white" data-pptx-bounds="204 576 966 156">
