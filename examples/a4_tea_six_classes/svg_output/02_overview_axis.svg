    <text x="560" y="930" font-size="46" fill="#1C1A17">绿茶工序上多加的一道</text>
  </g>
  <g id="p02-row-oolong" data-pptx-bounds="204 1020 966 156">
    <image href="../images/leaf_oolong.png" x="210" y="1026" width="130" height="130" preserveAspectRatio="xMidYMid meet" />
