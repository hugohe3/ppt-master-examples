    <text x="72" y="252" font-size="46">轴上排的是<tspan font-weight="bold">发酵（氧化）程度</tspan>——<tspan x="72" dy="68">绿茶把酶按住，黑茶把发酵交给微生物。</tspan></text>
  </g>

