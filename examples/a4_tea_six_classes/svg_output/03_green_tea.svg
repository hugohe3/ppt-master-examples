    <text x="712" y="1216" font-size="46" fill="#1C1A17" text-anchor="middle">揉捻</text>
    <text x="962" y="1216" font-size="46" fill="#1C1A17" text-anchor="middle">干燥</text>
    <text x="72" y="1294" font-size="34" fill="#6B665C">鲜叶采摘在最前，做形并入揉捻</text>
  </g>

