    <line x1="500" y1="768" x2="596" y2="826" stroke="#1C1A17" stroke-width="3" marker-end="url(#inkArrow)" />
    <text x="616" y="588" font-size="46" fill="#1C1A17">酶被灭活，氧化停在起点</text>
    <text x="652" y="714" font-size="46" fill="#1C1A17">所以是<tspan fill="#6E9B3A" font-weight="bold">清汤绿叶</tspan></text>
