    <text x="1160" y="368" font-size="24" fill="#F6EFE4">تُنقل إلى مدرّجات تحفظ الماء والتربة</text>
    <text x="1186" y="414" font-size="24" font-weight="bold" fill="#B8862B">3</text>
    <text x="1160" y="414" font-size="24" fill="#F6EFE4">تُثمر بعد 2 إلى 3 سنوات من الزراعة</text>
