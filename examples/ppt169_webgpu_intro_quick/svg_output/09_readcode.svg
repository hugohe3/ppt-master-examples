  <g id="p09-code" data-pptx-bounds="56 176 744 508">
    <rect x="56" y="176" width="744" height="508" rx="6" fill="#0B1120" stroke="#22354F" stroke-width="1.5"/>
    <text x="84" y="212" font-family="Consolas" font-size="16" letter-spacing="1.6" fill="#6F8399">js · 基础渲染 demo 的渲染流程</text>
    <line x1="84" y1="220" x2="756" y2="220" stroke="#22354F" stroke-width="1"/>
    <text x="84" y="232" font-family="Consolas" font-size="17" fill="#BFD6EE" xml:space="preserve">const commandEncoder = device.createCommandEncoder();<tspan x="84" dy="24">const clearColor = { r: 0.0, g: 0.5, b: 1.0, a: 1.0 };</tspan><tspan x="84" dy="24">const renderPassDescriptor = {</tspan><tspan x="84" dy="24">  colorAttachments: [</tspan><tspan x="84" dy="24">    {</tspan><tspan x="84" dy="24">      clearValue: clearColor,</tspan><tspan x="84" dy="24">      loadOp: "clear",</tspan><tspan x="84" dy="24">      storeOp: "store",</tspan><tspan x="84" dy="24">      view: context.getCurrentTexture().createView(),</tspan><tspan x="84" dy="24">    },</tspan><tspan x="84" dy="24">  ],</tspan><tspan x="84" dy="24">};</tspan><tspan x="84" dy="24">const passEncoder =</tspan><tspan x="84" dy="24">  commandEncoder.beginRenderPass(renderPassDescriptor);</tspan><tspan x="84" dy="24">passEncoder.setPipeline(renderPipeline);</tspan><tspan x="84" dy="24">passEncoder.setVertexBuffer(0, vertexBuffer);</tspan><tspan x="84" dy="24">passEncoder.draw(3);</tspan><tspan x="84" dy="24">passEncoder.end();</tspan><tspan x="84" dy="24">device.queue.submit([commandEncoder.finish()]);</tspan></text>
    <circle cx="776" cy="370" r="11" fill="#0B3B5C" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="776" y="375" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">1</text>
    <line x1="787" y1="370" x2="798" y2="370" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="776" cy="562" r="11" fill="#0B3B5C" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="776" y="567" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">2</text>
    <line x1="787" y1="562" x2="798" y2="562" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="776" cy="610" r="11" fill="#0B3B5C" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="776" y="615" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">3</text>
    <line x1="787" y1="610" x2="798" y2="610" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="776" cy="658" r="11" fill="#0B3B5C" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="776" y="663" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">4</text>
