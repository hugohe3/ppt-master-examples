  </g>
  <g id="p09-notes" data-pptx-bounds="810 180 414 508">
    <rect x="832" y="186" width="392" height="122" rx="6" fill="#101B2C" stroke="#22354F" stroke-width="1.5"/>
    <circle cx="856" cy="208" r="11" fill="#132238" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="856" y="213" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">1</text>
    <text x="880" y="228" font-size="18" fill="#8DA2C0">视图会先被清成 clearColor,<tspan x="880" dy="26">三角形背后那块纯蓝就是这么</tspan><tspan x="880" dy="26">来的;storeOp 为 "store" 表示</tspan><tspan x="880" dy="26">这一趟的结果要存下来。</tspan></text>
    <rect x="832" y="328" width="392" height="122" rx="6" fill="#101B2C" stroke="#22354F" stroke-width="1.5"/>
    <circle cx="856" cy="350" r="11" fill="#132238" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="856" y="355" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">2</text>
    <text x="880" y="370" font-size="18" fill="#8DA2C0">setPipeline 指定这一趟用哪<tspan x="880" dy="26">条管线;setVertexBuffer 的第</tspan><tspan x="880" dy="26">一个参数是槽位,对应顶点缓</tspan><tspan x="880" dy="26">冲布局数组里的下标。</tspan></text>
    <rect x="832" y="580" width="392" height="104" rx="6" fill="#101B2C" stroke="#22354F" stroke-width="1.5"/>
    <circle cx="856" cy="602" r="11" fill="#132238" stroke="#3E6E9E" stroke-width="1.5"/>
    <text x="856" y="607" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">4</text>
    <text x="880" y="624" font-size="18" fill="#8DA2C0">end() 结束命令列表,finish()<tspan x="880" dy="26">封装成 command buffer,再由</tspan><tspan x="880" dy="26">submit() 交给设备的命令队列。</tspan></text>
    <g id="p09-note-3-callout" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="wedgeRectCallout" data-pptx-frame="832 470 392 90" data-pptx-av-adj1="val -55612" data-pptx-av-adj2="val 105556" fill="#0B3B5C" stroke="#38BDF8" stroke-width="1.5">
      <path d="M 832 470 L 897.33 470 L 897.33 470 L 995.33 470 L 1224 470 L 1224 522.5 L 1224 522.5 L 1224 545 L 1224 560 L 995.33 560 L 810 610 L 897.33 560 L 832 560 L 832 545 L 832 522.5 L 832 522.5 Z"/>
    </g>
    <circle cx="856" cy="492" r="11" fill="#132238" stroke="#7FD4FA" stroke-width="1.5"/>
    <text x="856" y="497" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">3</text>
    <text x="880" y="504" font-size="18" fill="#CFE0F2">vertexBuffer 里放着三个顶点的<tspan x="880" dy="26">数据,所以这里是 <tspan fill="#38BDF8" font-weight="bold">draw(3)</tspan>。</tspan></text>
  </g>
