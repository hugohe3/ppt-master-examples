    <text x="518" y="320">要被管线处理的数<tspan x="518" dy="26">据,得先放进 GPU</tspan><tspan x="518" dy="26">buffer 或 texture</tspan><tspan x="518" dy="26">里才能被访问。</tspan></text>
    <text x="747" y="320">用描述符写清数据<tspan x="747" dy="26">结构、绑定、着色</tspan><tspan x="747" dy="26">器与资源布局,再</tspan><tspan x="747" dy="26">据此创建管线。</tspan></text>
    <text x="976" y="320">创建编码器、下达<tspan x="976" dy="26">命令、封装成命令</tspan><tspan x="976" dy="26">缓冲,最后提交到</tspan><tspan x="976" dy="26">设备的命令队列。</tspan></text>
