    <rect x="56" y="176" width="584" height="324" rx="4" fill="#0E1A2E" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.55" />
    <rect x="80" y="206" width="536" height="60" rx="8" fill="#16304F" stroke="#3E6E9E" stroke-width="1.5" />
    <text x="104" y="232" font-family="Consolas" font-size="19" fill="#CFE0F2">navigator.gpu</text>
    <text x="104" y="255" font-size="16" fill="#7E96B4">取得当前上下文的 GPU 对象</text>
    <g id="p04-flow-1" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="downArrow" data-pptx-frame="340 272 16 26" fill="#38BDF8" stroke="none">
