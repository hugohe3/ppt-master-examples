    <rect x="80" y="398" width="536" height="60" rx="8" fill="#0B3B5C" stroke="#38BDF8" stroke-width="1.5" />
    <text x="104" y="424" font-family="Consolas" font-size="19" fill="#E8EEF9">GPUAdapter.requestDevice()</text>
    <text x="104" y="447" font-size="16" fill="#8CC6EA">取得逻辑设备,可用描述符指定 features 与 limits</text>
    <text x="80" y="484" font-size="18" fill="#8DA2C0">两个方法的参数都可以省略,默认值对多数场景已经够用。</text>
  </g>

