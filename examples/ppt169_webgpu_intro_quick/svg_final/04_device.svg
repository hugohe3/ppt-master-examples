    </g>
    <rect x="80" y="302" width="536" height="60" rx="8" fill="#16304F" stroke="#3E6E9E" stroke-width="1.5" />
    <text x="104" y="328" font-family="Consolas" font-size="19" fill="#CFE0F2">GPU.requestAdapter()</text>
    <text x="104" y="351" font-size="16" fill="#7E96B4">取得适配器,不传参就是默认适配器</text>
    <g id="p04-flow-2" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="downArrow" data-pptx-frame="340 368 16 26" fill="#38BDF8" stroke="none">
