  <g id="p04-code" data-pptx-bounds="664 176 560 488">
    <g id="p04-code-panel" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="664 176 560 488" data-pptx-av-adj="val 8000" fill="#0B1120" stroke="#22354F" stroke-width="1.5">
      <path d="M 664 176 L 1184.96 176 L 1224 215.04 L 1224 664 L 664 664 Z" />
    </g>
    <text x="692" y="210" font-family="Consolas" font-size="16" letter-spacing="1.6" fill="#6F8399">js · 特性检测 + 取设备</text>
    <line x1="692" y1="226" x2="1196" y2="226" stroke="#22354F" stroke-width="1" />
    <text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="262">async function init() {</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="290">  if (!navigator.gpu) {</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="318">    throw Error("WebGPU not supported.");</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="346">  }</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="374">  let adapter;</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="402">  try {</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="430">    adapter = await navigator.gpu.requestAdapter();</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="458">  } catch (error) {</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="486">    console.error(error);</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="514">  }</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="542">  if (!adapter) {</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="570">    throw Error("Couldn't request WebGPU adapter.");</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="598">  }</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="626">  const device = await adapter.requestDevice();</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="692" y="654">}</text></g>
</svg>