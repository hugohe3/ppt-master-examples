    <line x1="84" y1="220" x2="756" y2="220" stroke="#22354F" stroke-width="1" />
    <text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="252">const output = device.createBuffer({</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="277">  size: BUFFER_SIZE,</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="302">  usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="327">});</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="352">const stagingBuffer = device.createBuffer({</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="377">  size: BUFFER_SIZE,</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="402">  usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="427">});</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="452">commandEncoder.copyBufferToBuffer(</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="477">  output, 0, stagingBuffer, 0, BUFFER_SIZE);</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="502">device.queue.submit([commandEncoder.finish()]);</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="527">await stagingBuffer.mapAsync(GPUMapMode.READ, 0, BUFFER_SIZE);</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="552">const copyArrayBuffer = stagingBuffer.getMappedRange(0, BUFFER_SIZE);</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="577">const data = copyArrayBuffer.slice();</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="602">stagingBuffer.unmap();</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="627">console.log(new Float32Array(data));</text><text x="84" y="668" font-size="18" fill="#6F8399">GPU buffer 紧贴 GPU 核心存放,浏览器这样的主机进程读不到,所以要中转。</text>
  </g>
