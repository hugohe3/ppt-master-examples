    <g id="p02-problem-bracket" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="bracketPair" data-pptx-frame="56 232 560 380" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.75">
