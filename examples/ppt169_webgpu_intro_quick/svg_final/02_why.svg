    <g id="p02-problem-1">
      <text x="96" y="272" font-size="24" font-weight="bold" fill="#E8EEF9"><tspan font-family="Consolas" fill="#F59E0B">01 </tspan>拿不到现代 GPU 新特性</text>
      <text fill="#8DA2C0" font-size="18" x="96" y="308">Direct3D 12、Metal、Vulkan 提供大量新功能;</text><text fill="#8DA2C0" font-size="18" x="96" y="335">OpenGL 与 WebGL 已无更新计划,不会再拿到。</text></g>
    <g id="p02-problem-2">
      <text x="96" y="392" font-size="24" font-weight="bold" fill="#E8EEF9"><tspan font-family="Consolas" fill="#F59E0B">02 </tspan>对通用计算支持很差</text>
      <text fill="#8DA2C0" font-size="18" x="96" y="428">WebGL 完全围绕“画到 canvas”这一用例设计;</text><text fill="#8DA2C0" font-size="18" x="96" y="455">而机器学习等 GPGPU 场景越来越重要。</text></g>
    <g id="p02-problem-3">
      <text x="96" y="512" font-size="24" font-weight="bold" fill="#E8EEF9"><tspan font-family="Consolas" fill="#F59E0B">03 </tspan>3D 应用越来越吃资源</text>
      <text fill="#8DA2C0" font-size="18" x="96" y="548">同屏需要渲染的对象越来越多,</text><text fill="#8DA2C0" font-size="18" x="96" y="575">新的渲染特性也在不断加码。</text></g>
  </g>

