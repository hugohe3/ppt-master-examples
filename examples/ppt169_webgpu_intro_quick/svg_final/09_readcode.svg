  <g id="p09-code" data-pptx-bounds="56 176 744 508">
    <rect x="56" y="176" width="744" height="508" rx="6" fill="#0B1120" stroke="#22354F" stroke-width="1.5" />
    <text x="84" y="212" font-family="Consolas" font-size="16" letter-spacing="1.6" fill="#6F8399">js · 基础渲染 demo 的渲染流程</text>
    <line x1="84" y1="220" x2="756" y2="220" stroke="#22354F" stroke-width="1" />
    <text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="232">const commandEncoder = device.createCommandEncoder();</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="256">const clearColor = { r: 0.0, g: 0.5, b: 1.0, a: 1.0 };</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="280">const renderPassDescriptor = {</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="304">  colorAttachments: [</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="328">    {</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="352">      clearValue: clearColor,</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="376">      loadOp: "clear",</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="400">      storeOp: "store",</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="424">      view: context.getCurrentTexture().createView(),</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="448">    },</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="472">  ],</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="496">};</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="520">const passEncoder =</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="544">  commandEncoder.beginRenderPass(renderPassDescriptor);</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="568">passEncoder.setPipeline(renderPipeline);</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="592">passEncoder.setVertexBuffer(0, vertexBuffer);</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="616">passEncoder.draw(3);</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="640">passEncoder.end();</text><text fill="#BFD6EE" font-family="Consolas" font-size="17" xml:space="preserve" x="84" y="664">device.queue.submit([commandEncoder.finish()]);</text><circle cx="776" cy="370" r="11" fill="#0B3B5C" stroke="#38BDF8" stroke-width="1.5" />
    <text x="776" y="375" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">1</text>
    <line x1="787" y1="370" x2="798" y2="370" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="776" cy="562" r="11" fill="#0B3B5C" stroke="#38BDF8" stroke-width="1.5" />
    <text x="776" y="567" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">2</text>
    <line x1="787" y1="562" x2="798" y2="562" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="776" cy="610" r="11" fill="#0B3B5C" stroke="#38BDF8" stroke-width="1.5" />
    <text x="776" y="615" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">3</text>
    <line x1="787" y1="610" x2="798" y2="610" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="776" cy="658" r="11" fill="#0B3B5C" stroke="#38BDF8" stroke-width="1.5" />
    <text x="776" y="663" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">4</text>
    <line x1="787" y1="658" x2="798" y2="658" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
  </g>
  <g id="p09-notes" data-pptx-bounds="810 180 414 508">
    <rect x="832" y="186" width="392" height="122" rx="6" fill="#101B2C" stroke="#22354F" stroke-width="1.5" />
    <circle cx="856" cy="208" r="11" fill="#132238" stroke="#3E6E9E" stroke-width="1.5" />
    <text x="856" y="213" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">1</text>
    <text fill="#8DA2C0" font-size="18" x="880" y="228">视图会先被清成 clearColor,</text><text fill="#8DA2C0" font-size="18" x="880" y="254">三角形背后那块纯蓝就是这么</text><text fill="#8DA2C0" font-size="18" x="880" y="280">来的;storeOp 为 "store" 表示</text><text fill="#8DA2C0" font-size="18" x="880" y="306">这一趟的结果要存下来。</text><rect x="832" y="328" width="392" height="122" rx="6" fill="#101B2C" stroke="#22354F" stroke-width="1.5" />
    <circle cx="856" cy="350" r="11" fill="#132238" stroke="#3E6E9E" stroke-width="1.5" />
    <text x="856" y="355" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">2</text>
    <text fill="#8DA2C0" font-size="18" x="880" y="370">setPipeline 指定这一趟用哪</text><text fill="#8DA2C0" font-size="18" x="880" y="396">条管线;setVertexBuffer 的第</text><text fill="#8DA2C0" font-size="18" x="880" y="422">一个参数是槽位,对应顶点缓</text><text fill="#8DA2C0" font-size="18" x="880" y="448">冲布局数组里的下标。</text><rect x="832" y="580" width="392" height="104" rx="6" fill="#101B2C" stroke="#22354F" stroke-width="1.5" />
    <circle cx="856" cy="602" r="11" fill="#132238" stroke="#3E6E9E" stroke-width="1.5" />
    <text x="856" y="607" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">4</text>
    <text fill="#8DA2C0" font-size="18" x="880" y="624">end() 结束命令列表,finish()</text><text fill="#8DA2C0" font-size="18" x="880" y="650">封装成 command buffer,再由</text><text fill="#8DA2C0" font-size="18" x="880" y="676">submit() 交给设备的命令队列。</text><g id="p09-note-3-callout" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="wedgeRectCallout" data-pptx-frame="832 470 392 90" data-pptx-av-adj1="val -55612" data-pptx-av-adj2="val 105556" fill="#0B3B5C" stroke="#38BDF8" stroke-width="1.5">
      <path d="M 832 470 L 897.33 470 L 897.33 470 L 995.33 470 L 1224 470 L 1224 522.5 L 1224 522.5 L 1224 545 L 1224 560 L 995.33 560 L 810 610 L 897.33 560 L 832 560 L 832 545 L 832 522.5 L 832 522.5 Z" />
    </g>
    <circle cx="856" cy="492" r="11" fill="#132238" stroke="#7FD4FA" stroke-width="1.5" />
    <text x="856" y="497" font-family="Consolas" font-size="14" text-anchor="middle" fill="#7FD4FA">3</text>
    <text fill="#CFE0F2" font-size="18" x="880" y="504">vertexBuffer 里放着三个顶点的</text><text fill="#CFE0F2" font-size="18" x="880" y="530"><tspan>数据,所以这里是 <tspan fill="#38BDF8" font-weight="bold">draw(3)</tspan>。</tspan></text></g>
</svg>