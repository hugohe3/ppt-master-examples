<text font-size="22" fill="#1F2328" x="128" y="230"><tspan><tspan fill="#0070C0" font-weight="bold">编制监理规划和监理实施细则</tspan>，建立与项目规</tspan></text><text font-size="22" fill="#1F2328" x="128" y="262">模、专业相适应的监理机构，确定总监理工程</text><text font-size="22" fill="#1F2328" x="128" y="294">师和监理人员。监理工程师不得擅自调整，</text><text font-size="22" fill="#1F2328" x="128" y="326">确需调整的应符合监理合同约定要求并征得建</text><text font-size="22" fill="#1F2328" x="128" y="358">设单位同意。</text></g>
