<text font-size="22" fill="#1F2328" x="128" y="446"><tspan>检查施工单位的质量和安全生产<tspan fill="#0070C0" font-weight="bold">制度及措施</tspan></tspan></text><text font-size="22" fill="#1F2328" x="128" y="478"><tspan>落实情况；核查主要<tspan fill="#0070C0" font-weight="bold">管理人员</tspan>和<tspan fill="#0070C0" font-weight="bold">关键设备</tspan>到位</tspan></text><text font-size="22" fill="#1F2328" x="128" y="510">情况、相关从业人员依法应当取得的执业</text><text font-size="22" fill="#1F2328" x="128" y="542"><tspan><tspan fill="#0070C0" font-weight="bold">资格证书</tspan>或者考核合格证书情况、设备合格</tspan></text><text font-size="22" fill="#1F2328" x="128" y="574"><tspan>证书和施工<tspan fill="#0070C0" font-weight="bold">技术档案</tspan>情况；督促施工单位及时</tspan></text><text font-size="22" fill="#1F2328" x="128" y="606"><tspan>整改<tspan fill="#0070C0" font-weight="bold">工程质量问题</tspan>，消除安全生产隐患。</tspan></text></g>
