<text font-size="22" fill="#1F2328" x="724" y="230"><tspan>按建设单位要求，组织或参加<tspan fill="#0070C0" font-weight="bold">设计交底、施工</tspan></tspan></text><text font-size="22" fill="#1F2328" x="724" y="262"><tspan><tspan fill="#0070C0" font-weight="bold">组织方案审查、开工报告审查</tspan>、存在较大危险</tspan></text><text font-size="22" fill="#1F2328" x="724" y="294"><tspan>性隐患的分部分项工程<tspan fill="#0070C0" font-weight="bold">专项施工方案审查</tspan>、现</tspan></text><text font-size="22" fill="#1F2328" x="724" y="326">场验槽、单元工程阶段性验收、质量事故分析</text><text font-size="22" fill="#1F2328" x="724" y="358">以及工程初步验收与竣工验收等工作。</text></g>
