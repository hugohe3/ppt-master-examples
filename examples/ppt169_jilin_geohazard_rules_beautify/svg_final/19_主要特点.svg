<text x="549" y="196" font-size="28" font-weight="bold" fill="#0070C0">项目运行规范化</text>
<text font-size="24" fill="#1F2328" x="469" y="264">建立完善了项目入库流程、项</text><text font-size="24" fill="#1F2328" x="469" y="300">目实施单位职责、项目验收阶</text><text font-size="24" fill="#1F2328" x="469" y="336">段划分、工程后期运维管护和</text><text font-size="24" fill="#1F2328" x="469" y="372">全过程监督检查的整套运行规</text><text font-size="24" fill="#1F2328" x="469" y="408">程。规范化的运行有助于各级</text><text font-size="24" fill="#1F2328" x="469" y="444">主管部门和参建单位明确项目</text><text font-size="24" fill="#1F2328" x="469" y="480">步骤、自身职责、时间期限和</text><text font-size="24" fill="#1F2328" x="469" y="516">质量标准，有效提高工作效率</text><text font-size="24" fill="#1F2328" x="469" y="552">和项目质量。</text></g>
