<text font-size="24" fill="#1F2328" x="72" y="264">《办法》明确了项目支持的范</text><text font-size="24" fill="#1F2328" x="72" y="300">围、入库流程、专家评审论证</text><text font-size="24" fill="#1F2328" x="72" y="336">和动态调整等内容。将有利于</text><text font-size="24" fill="#1F2328" x="72" y="372">夯实项目实施基础，加快资金</text><text font-size="24" fill="#1F2328" x="72" y="408">分配，避免“资金等项目”的情</text><text font-size="24" fill="#1F2328" x="72" y="444">况，提升资金使用效益。</text></g>
