<text x="946" y="196" font-size="28" font-weight="bold" fill="#C45F14">监督检查常态化</text>
<text font-size="24" fill="#1F2328" x="866" y="264">按照“双随机、一公开”规定了</text><text font-size="24" fill="#1F2328" x="866" y="300">监督检查要求，建立了报告、</text><text font-size="24" fill="#1F2328" x="866" y="336">通报、激励、惩戒、责任追究</text><text font-size="24" fill="#1F2328" x="866" y="372">等制度，加强了项目事前、事</text><text font-size="24" fill="#1F2328" x="866" y="408">中、事后全过程监督管理，有</text><text font-size="24" fill="#1F2328" x="866" y="444">利于及时发现项目问题，及时</text><text font-size="24" fill="#1F2328" x="866" y="480">整改，确保项目顺利完成。</text></g>
