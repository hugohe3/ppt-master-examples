<g id="p15-stage-1-badge" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="56 120 72 36" fill="#0070C0" stroke="none">
<path d="M 56 120 L 110 120 L 128 138 L 110 156 L 56 156 Z" />
</g>
<text x="84" y="149" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">01</text>
<text x="140" y="148" font-size="26" font-weight="bold" fill="#0B2A5B">自行检验</text>
<rect x="56" y="166" width="226" height="30" rx="15" fill="#EEF4FB" />
<text x="68" y="187" font-size="18" font-weight="bold" fill="#0070C0">项目完工之日起1个月内</text>
<circle cx="288" cy="138" r="7" fill="#0070C0" />
<text font-size="22" fill="#1F2328" x="300" y="146"><tspan>工程竣工后，市、县级自然资源主管部门应组织勘查、设计、施工、监理等<tspan fill="#0070C0" font-weight="bold">参建单位自</tspan></tspan></text><text font-size="22" fill="#1F2328" x="300" y="176"><tspan><tspan fill="#0070C0" font-weight="bold">验</tspan>，主要核对施工设计和合同约定的各项<tspan fill="#D7141A" font-weight="bold">工程内容</tspan>是否已完成、监理单位对<tspan fill="#D7141A" font-weight="bold">工程质量</tspan>的评</tspan></text><text font-size="22" fill="#1F2328" x="300" y="206"><tspan>定是否合格、施工及监理单位工作总结等<tspan fill="#D7141A" font-weight="bold">竣工资料</tspan>准备是否齐全等，</tspan></text><text font-size="22" fill="#1F2328" x="300" y="236">为初步验收做好准备。</text></g>
<g id="stage-2-preliminary" data-pptx-bounds="56 252 1168 140">
<g id="p15-stage-2-badge" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="56 258 72 36" fill="#0070C0" stroke="none">
<path d="M 56 258 L 110 258 L 128 276 L 110 294 L 56 294 Z" />
</g>
<text x="84" y="287" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">02</text>
<text x="140" y="286" font-size="26" font-weight="bold" fill="#0B2A5B">初步验收</text>
<rect x="56" y="304" width="226" height="30" rx="15" fill="#EEF4FB" />
<text x="68" y="325" font-size="18" font-weight="bold" fill="#0070C0">项目完工之日起3个月内</text>
<circle cx="288" cy="276" r="7" fill="#0070C0" />
<text font-size="22" fill="#1F2328" x="300" y="284">中央财政出资的项目，由市（州）级自然资源主管部门会同同级财政部门组织专家进行审</text><text font-size="22" fill="#1F2328" x="300" y="314">查验收；省级财政出资的项目，由县级自然资源主管部门会同同级财政部门组织专家进行</text><text font-size="22" fill="#1F2328" x="300" y="344"><tspan>审查验收，<tspan fill="#D7141A" font-weight="bold">专家组</tspan>（不少于5人，含1名财审专家）<tspan fill="#D7141A" font-weight="bold">提出初步验收结论</tspan>。</tspan></text><text font-size="22" fill="#1F2328" x="300" y="374">对于质量评定为不合格的，经整改后，重新组织初验。</text></g>
<g id="stage-3-completion" data-pptx-bounds="56 392 1168 228">
<g id="p15-stage-3-badge" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="56 396 72 36" fill="#0070C0" stroke="none">
<path d="M 56 396 L 110 396 L 128 414 L 110 432 L 56 432 Z" />
</g>
<text x="84" y="425" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">03</text>
<text x="140" y="424" font-size="26" font-weight="bold" fill="#0B2A5B">竣工验收</text>
<rect x="56" y="442" width="226" height="30" rx="15" fill="#EEF4FB" />
<text x="68" y="463" font-size="18" font-weight="bold" fill="#0070C0">初步验收通过后3个月内</text>
<circle cx="288" cy="414" r="7" fill="#0070C0" />
<text font-size="22" fill="#1F2328" x="300" y="422">项目通过初步验收后，中央财政出资的项目，市（州）级自然资源主管部门应向省自然资</text><text font-size="22" fill="#1F2328" x="300" y="452">源厅提出申请，由省自然资源厅会同省财政厅组织专家进行验收。省级财政出资的项目，</text><text font-size="22" fill="#1F2328" x="300" y="482">县级自然资源主管部门应向市（州）级自然资源主管部门提出申请，由市（州）级自然资</text><text font-size="22" fill="#1F2328" x="300" y="512">源主管部门会同同级财政部门组织专家进行验收。专家组（不少于5人，含1名财审专家）</text><text font-size="22" fill="#1F2328" x="300" y="542"><tspan>对项目<tspan fill="#0070C0" font-weight="bold">工程质量、建设情况及预算执行情况</tspan>进行全面检查，对项目工程质量进行<tspan fill="#D7141A" font-weight="bold">综合评</tspan></tspan></text><text font-size="22" fill="#1F2328" x="300" y="572"><tspan><tspan fill="#D7141A" font-weight="bold">分、评定等级</tspan>，形成验收意见，并提出该处地质灾害隐患点的<tspan fill="#D7141A" font-weight="bold">核销或降级意见</tspan>。验收结果</tspan></text><text font-size="22" fill="#1F2328" x="300" y="602">为不合格的，经整改后重新组织竣工验收。</text></g>
<g id="stage-4-archive" data-pptx-bounds="56 620 1168 74">
<g id="p15-stage-4-badge" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="56 624 72 36" fill="#0070C0" stroke="none">
<path d="M 56 624 L 110 624 L 128 642 L 110 660 L 56 660 Z" />
</g>
<text x="84" y="653" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">04</text>
<text x="140" y="652" font-size="26" font-weight="bold" fill="#0B2A5B">资料归档</text>
<circle cx="288" cy="642" r="7" fill="#0070C0" />
<text font-size="22" fill="#1F2328" x="300" y="650"><tspan>市、县级自然资源主管部门应做好项目<tspan fill="#D7141A" font-weight="bold">全周期资料</tspan>的整理归档工作，备查备检；项目完成</tspan></text><text font-size="22" fill="#1F2328" x="300" y="680">财务结算后，将项目全过程资料按要求报送省自然资源厅。</text></g>
</svg>