<text x="80" y="149" font-size="24" font-weight="bold" fill="#FFFFFF">第11-13条 对项目设计的其它要求</text>
</g>
<g id="article-11" data-pptx-bounds="56 186 1168 166" font-size="22" fill="#1F2328">
<rect x="56" y="186" width="1168" height="166" rx="6" fill="#EEF4FB" />
<rect x="56" y="186" width="5" height="166" fill="#0070C0" />
<text x="88" y="224"><tspan fill="#0070C0" font-weight="bold">第十一条</tspan> 由市、县级自然资源主管部门负责<tspan fill="#0070C0" font-weight="bold">提交项目设计方案</tspan>。</text>
<line x1="108" y1="242" x2="108" y2="330" stroke="#5B9BD5" stroke-width="2" />
<text x="124" y="258">☆ 中央财政出资的项目设计，由<tspan fill="#0070C0" font-weight="bold">省自然资源厅</tspan>审核；</text>
<text x="124" y="292">☆ 省级财政出资的项目设计，由<tspan fill="#0070C0" font-weight="bold">市（州）级</tspan>自然资源主管部门审核。</text>
<text x="124" y="326">☆ 审核部门应组织专家到项目现场进行<tspan fill="#D7141A" font-weight="bold">实地核查</tspan>，由专家组出具<tspan fill="#0070C0" font-weight="bold">书面审核意见</tspan>并对审核结果负责。</text>
</g>
<g id="article-12" data-pptx-bounds="56 368 1168 132" font-size="22" fill="#1F2328">
<rect x="56" y="368" width="1168" height="132" rx="6" fill="#EEF4FB" />
<rect x="56" y="368" width="5" height="132" fill="#0070C0" />
<text x="88" y="406"><tspan><tspan fill="#0070C0" font-weight="bold">第十二条</tspan> 市、县级自然资源主管部门应监管施工单位严格按审定的设计方案施工，</tspan></text><text x="88" y="440"><tspan>因客观原因需<tspan fill="#0070C0" font-weight="bold">变更设计方案</tspan>，由原设计单位编制设计变更方案，报经原审批单位组织<tspan fill="#0070C0" font-weight="bold">评审并经批准后实施</tspan>；</tspan></text><line x1="108" y1="456" x2="108" y2="482" stroke="#5B9BD5" stroke-width="2" />
<text x="124" y="474"><tspan fill="#D7141A" font-weight="bold">重大设计变更方案</tspan>需经市（州）级自然资源主管部门审核后，报<tspan fill="#0070C0" font-weight="bold">省自然资源厅和省财政厅</tspan>审批。</text>
</g>
<g id="article-13" data-pptx-bounds="56 516 1168 132" font-size="22" fill="#1F2328">
<rect x="56" y="516" width="1168" height="132" rx="6" fill="#EEF4FB" />
<rect x="56" y="516" width="5" height="132" fill="#0070C0" />
<text x="88" y="554"><tspan><tspan fill="#0070C0" font-weight="bold">第十三条</tspan> 施工中发现地质环境等客观条件变化或实际与勘查成果出入较大，原设计的地质灾害治理主体工程</tspan></text><text x="88" y="588"><tspan><tspan fill="#0070C0" font-weight="bold">类型、结构、数量以及位置和范围</tspan>需要调整，对工程的安全性需要重新进行复核论证的，</tspan></text><text x="88" y="622"><tspan>属于<tspan fill="#D7141A" font-weight="bold">重大设计变更</tspan>。</tspan></text></g>
</svg>