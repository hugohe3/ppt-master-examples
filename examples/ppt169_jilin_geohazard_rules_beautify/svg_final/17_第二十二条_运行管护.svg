<g id="warranty" data-pptx-bounds="56 112 1168 124">
<rect x="56" y="112" width="1168" height="124" rx="6" fill="#EEF4FB" />
<rect x="56" y="112" width="6" height="124" fill="#0070C0" />
<text font-size="22" fill="#1F2328" x="88" y="150"><tspan>施工单位在向建设单位提交工程竣工验收报告时，应当出具<tspan fill="#0070C0" font-weight="bold">工程质量保修书</tspan>。质量保修书中应当明确地质灾</tspan></text><text font-size="22" fill="#1F2328" x="88" y="182"><tspan>害治理工程的<tspan fill="#D7141A" font-weight="bold">保修范围</tspan>、<tspan fill="#D7141A" font-weight="bold">保修期限</tspan>和<tspan fill="#D7141A" font-weight="bold">保修责任</tspan>等，保修期限以施工合同约定为准，</tspan></text><text font-size="22" fill="#1F2328" x="88" y="214">自竣工验收通过之日起计算。国家对保修期限有明确规定的，施工合同约定的保修期限不得低于国家规定。</text></g>
<g id="maintenance-duty" data-pptx-bounds="56 252 1168 108">
<rect x="56" y="252" width="264" height="108" rx="6" fill="#EEF4FB" />

  <g transform="translate(72, 266) scale(1.33333)" fill="#0070C0">
    <path d="M6 11c-.483 0 -1.021 .725 -1 1.983c.013 .783 .29 1.3 1.035 2.07l.107 .107l.101 -.134c.466 -.643 .714 -1.266 .752 -1.864l.005 -.162l-.003 -.563c-.017 -1.284 -.13 -1.422 -.807 -1.436zm12 -9c1.673 0 3 1.327 3 3v1h-6v-1c0 -1.673 1.327 -3 3 -3m2.707 15.707l-2 2l-.08 .071l-.043 .034l-.084 .054l-.103 .052l-.084 .032l-.08 .023l-.143 .023l-.071 .004h-2.519c-1.616 0 -2.954 -.83 -4.004 -2.393l-.026 -.04l-.273 .431l-.365 .557c-1.356 2.034 -2.942 1.691 -4.7 -.41l-.064 -.076l-.176 .147q -.897 .727 -2.045 1.438l-.332 .203a1 1 0 1 1 -1.03 -1.714a19 19 0 0 0 2.17 -1.498l.078 -.065l-.147 -.15c-.998 -1.033 -1.498 -1.904 -1.576 -3.157l-.01 -.256c-.038 -2.273 1.257 -4.017 3 -4.017c2.052 0 3 .948 3 4c0 1.218 -.47 2.392 -1.392 3.532l-.11 .13l.28 .36c.784 .985 .994 .992 1.343 .492l.047 -.069q .97 -1.456 1.437 -2.392a1 1 0 0 1 1.814 .053c.858 2.002 1.878 2.894 3.081 2.894l.085 -.001l-.292 -.292a1 1 0 0 1 -.293 -.707v-9h6v9a1 1 0 0 1 -.293 .707" />
  </g>
<text x="114" y="290" font-size="24" font-weight="bold" fill="#0B2A5B">明确管护责任</text>
<text font-size="22" fill="#1F2328" x="340" y="288"><tspan>市、县级自然资源主管部门应在项目竣工验收合格并投入运行的<tspan fill="#D7141A" font-weight="bold">15个工作日内</tspan>，</tspan></text><text font-size="22" fill="#1F2328" x="340" y="320"><tspan>与指定的管护单位进行交接，签订《<tspan fill="#0070C0" font-weight="bold">工程移交接管协议书</tspan>》，明确管护单位管理维护</tspan></text><text font-size="22" fill="#1F2328" x="340" y="352">制度，做好项目后续管理和维护。</text></g>
<g id="maintenance-strengthen" data-pptx-bounds="56 376 1168 190">
<line x1="340" y1="376" x2="1224" y2="376" stroke="#C9D6E5" stroke-width="1" />
<rect x="56" y="388" width="264" height="176" rx="6" fill="#EEF4FB" />

  <g transform="translate(72, 402) scale(1.33333)" fill="#0070C0">
    <path d="M18.364 4.636a9 9 0 0 1 .203 12.519l-.203 .21l-4.243 4.242a3 3 0 0 1 -4.097 .135l-.144 -.135l-4.244 -4.243a9 9 0 0 1 12.728 -12.728zm-6.364 3.364a3 3 0 1 0 0 6a3 3 0 0 0 0 -6" />
  </g>
<text x="114" y="426" font-size="24" font-weight="bold" fill="#0B2A5B">加强后续管护</text>
<text font-size="22" fill="#1F2328" x="340" y="424"><tspan>市、县级自然资源主管部门应在项目治理区内<tspan fill="#0070C0" font-weight="bold">设置标牌</tspan>，载明项目勘查、设计、施</tspan></text><text font-size="22" fill="#1F2328" x="340" y="456"><tspan>工、监理、管护等<tspan fill="#0070C0" font-weight="bold">单位相关信息</tspan>，加强项目运行管护监督，督促管护单位履行好工程</tspan></text><text font-size="22" fill="#1F2328" x="340" y="488"><tspan>运行管护责任。在<tspan fill="#E07A1F" font-weight="bold">保修期限内</tspan>发生质量问题的项目，由项目<tspan fill="#E07A1F" font-weight="bold">施工单位</tspan>进行维修，</tspan></text><text font-size="22" fill="#1F2328" x="340" y="520"><tspan>所需维修费用由相关责任方按照国家和省有关规定承担；<tspan fill="#0070C0" font-weight="bold">超出保修期限</tspan>后，</tspan></text><text font-size="22" fill="#1F2328" x="340" y="552"><tspan>项目管护费用由<tspan fill="#0070C0" font-weight="bold">管护单位</tspan>承担。</tspan></text></g>
<g id="maintenance-writeoff" data-pptx-bounds="56 578 1168 112">
<line x1="340" y1="580" x2="1224" y2="580" stroke="#C9D6E5" stroke-width="1" />
<rect x="56" y="592" width="264" height="96" rx="6" fill="#EEF4FB" />

  <g transform="translate(72, 606) scale(1.33333)" fill="#0070C0">
    <path d="M17 3.34a10 10 0 1 1 -14.995 8.984l-.005 -.324l.005 -.324a10 10 0 0 1 14.995 -8.336zm-1.293 5.953a1 1 0 0 0 -1.32 -.083l-.094 .083l-3.293 3.292l-1.293 -1.292l-.094 -.083a1 1 0 0 0 -1.403 1.403l.083 .094l2 2l.094 .083a1 1 0 0 0 1.226 0l.094 -.083l4 -4l.083 -.094a1 1 0 0 0 -.083 -1.32z" />
  </g>
<text x="114" y="630" font-size="24" font-weight="bold" fill="#0B2A5B">履行认定核销程序</text>
<text font-size="22" fill="#1F2328" x="340" y="628"><tspan>经<tspan fill="#0070C0" font-weight="bold">工程治理后的隐患点</tspan>，由市、县级自然资源主管部门根据专家组竣工验收意见，</tspan></text><text font-size="22" fill="#1F2328" x="340" y="660"><tspan>向省自然资源厅申请地质灾害隐患点<tspan fill="#D7141A" font-weight="bold">核销或降级</tspan>。</tspan></text></g>
</svg>