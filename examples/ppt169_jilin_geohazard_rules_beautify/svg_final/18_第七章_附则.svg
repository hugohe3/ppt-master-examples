<text x="161" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">第二十七条</text>
<text font-size="26" fill="#1F2328" x="300" y="222">本办法由省自然资源厅负责解释。市、县级自然资源主管部门可以参照本</text><text font-size="26" fill="#1F2328" x="300" y="264">办法，结合当地实际，制定本地区地质灾害防治项目管理制度，</text><text font-size="26" fill="#1F2328" x="300" y="306">报上一级自然资源主管部门备案。</text></g>
