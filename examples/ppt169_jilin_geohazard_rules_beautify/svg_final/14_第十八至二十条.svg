<text font-size="22" fill="#1F2328" x="870" y="270">项目实施期限原则上应</text><text font-size="22" fill="#1F2328" x="870" y="302"><tspan><tspan fill="#0070C0" font-weight="bold">自预算下达之日起</tspan><tspan fill="#D7141A" font-weight="bold">2年内</tspan></tspan></text><text font-size="22" fill="#1F2328" x="870" y="334">完成竣工验收及财务决算；</text><line x1="870" y1="360" x2="1204" y2="360" stroke="#C9D6E5" stroke-width="1.5" />
<text font-size="22" fill="#1F2328" x="870" y="398">因施工条件等不可抗力客观因素</text><text font-size="22" fill="#1F2328" x="870" y="430">确需延期的，市、县级自然资源</text><text font-size="22" fill="#1F2328" x="870" y="462">主管部门须向省自然资源厅和省</text><text font-size="22" fill="#1F2328" x="870" y="494"><tspan>财政厅<tspan fill="#0070C0" font-weight="bold">书面说明</tspan>情况，经同意后</tspan></text><text font-size="22" fill="#1F2328" x="870" y="526"><tspan>可<tspan fill="#D7141A" font-weight="bold">延期1年</tspan>。</tspan></text></g>
