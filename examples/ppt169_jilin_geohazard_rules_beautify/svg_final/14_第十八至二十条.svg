<text font-size="22" fill="#1F2328" x="473" y="270">项目相关单位应当按照档案管理</text><text font-size="22" fill="#1F2328" x="473" y="302">有关法律、法规、规章规定，</text><text font-size="22" fill="#1F2328" x="473" y="334">及时、真实、完整记录工程建设</text><text font-size="22" fill="#1F2328" x="473" y="366">过程中的信息资料，</text><text font-size="22" fill="#1F2328" x="473" y="398"><tspan><tspan fill="#0070C0" font-weight="bold">建立工程项目档案</tspan>，并及时向</tspan></text><text font-size="22" fill="#1F2328" x="473" y="430">建设单位移交。</text></g>
