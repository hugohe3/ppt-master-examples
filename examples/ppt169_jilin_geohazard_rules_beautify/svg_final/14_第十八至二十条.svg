<text font-size="22" fill="#1F2328" x="76" y="270">项目的勘查、设计成果以及施工</text><text font-size="22" fill="#1F2328" x="76" y="302">组织方案、监理规划等技术文</text><text font-size="22" fill="#1F2328" x="76" y="334">件，应当符合相关法律、法规、</text><text font-size="22" fill="#1F2328" x="76" y="366">规章规定，工程建设强制性标</text><text font-size="22" fill="#1F2328" x="76" y="398">准、规范规程以及合同约定。</text><line x1="76" y1="424" x2="409" y2="424" stroke="#C9D6E5" stroke-width="1.5" />
<text font-size="22" fill="#1F2328" x="76" y="462"><tspan>任何单位和个人<tspan fill="#0070C0" font-weight="bold">不得</tspan>擅自压缩工</tspan></text><text font-size="22" fill="#1F2328" x="76" y="494">程勘查、设计周期和施工工期；</text><text font-size="22" fill="#1F2328" x="76" y="526"><tspan><tspan fill="#0070C0" font-weight="bold">不得</tspan>提供虚假的工程资料；</tspan></text><text font-size="22" fill="#1F2328" x="76" y="558"><tspan><tspan fill="#0070C0" font-weight="bold">不得</tspan>代签有关工程资料。</tspan></text></g>
