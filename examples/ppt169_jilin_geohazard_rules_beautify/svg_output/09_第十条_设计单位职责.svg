<text x="80" y="149" font-size="24" font-weight="bold" fill="#FFFFFF">第十条：<tspan fill="#FFC000">设计</tspan>单位在项目实施过程中职责</text>
</g>
<g id="design-duty-1" data-pptx-bounds="56 186 1168 140">
<rect x="56" y="186" width="1168" height="140" rx="6" fill="#EEF4FB"/>
<circle cx="96" cy="224" r="24" fill="#0070C0"/>
<text x="96" y="234" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">01</text>
<text x="140" y="230" font-size="22" fill="#1F2328"><tspan x="140" dy="0">按照勘查成果和有关规范规程开展设计工作，<tspan fill="#D7141A" font-weight="bold">明确工程的设计使用年限</tspan>。</tspan><tspan x="140" dy="34">建设单位对建设工程的设计使用年限有<tspan fill="#0070C0" font-weight="bold">特殊要求</tspan>的，须由建设单位与设计单位签订合同时予以明确，</tspan><tspan x="140" dy="34">并由设计单位<tspan fill="#0070C0" font-weight="bold">在设计文件中注明</tspan>。</tspan></text>
</g>
<g id="design-duty-2" data-pptx-bounds="56 346 572 120">
<rect x="56" y="346" width="572" height="120" rx="6" fill="#EEF4FB"/>
<circle cx="96" cy="384" r="24" fill="#0070C0"/>
<text x="96" y="394" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">02</text>
<text x="136" y="390" font-size="22" fill="#1F2328"><tspan x="136" dy="0">对工程施工可能存在的安全风险进行分析，</tspan><tspan x="136" dy="34">并提出相应<tspan fill="#D7141A" font-weight="bold">风险防控措施</tspan>。</tspan></text>
<use data-icon="tabler-filled/alert-triangle" x="580" y="414" width="32" height="32" fill="#5B9BD5"/>
</g>
<g id="design-duty-3" data-pptx-bounds="652 346 572 120">
<rect x="652" y="346" width="572" height="120" rx="6" fill="#EEF4FB"/>
<circle cx="692" cy="384" r="24" fill="#0070C0"/>
<text x="692" y="394" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">03</text>
<text x="732" y="390" font-size="22" fill="#1F2328"><tspan x="732" dy="0">施工期间进行设计变更时，</tspan><tspan x="732" dy="34">按有关要求编制设计<tspan fill="#D7141A" font-weight="bold">变更报告</tspan></tspan></text>
<use data-icon="tabler-filled/file-text" x="1176" y="414" width="32" height="32" fill="#5B9BD5"/>
</g>
<g id="design-duty-4" data-pptx-bounds="56 486 572 154">
<rect x="56" y="486" width="572" height="154" rx="6" fill="#EEF4FB"/>
<circle cx="96" cy="524" r="24" fill="#0070C0"/>
<text x="96" y="534" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">04</text>
<text x="136" y="530" font-size="22" fill="#1F2328"><tspan x="136" dy="0">负责项目实施期间设计服务，参加技术交底、</tspan><tspan x="136" dy="34">现场验槽、单元工程阶段性验收，质量事故</tspan><tspan x="136" dy="34">分析以及工程初步验收与竣工验收等工作</tspan></text>
</g>
<g id="design-duty-5" data-pptx-bounds="652 486 572 154">
<rect x="652" y="486" width="572" height="154" rx="6" fill="#EEF4FB"/>
<circle cx="692" cy="524" r="24" fill="#0070C0"/>
<text x="692" y="534" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">05</text>
<text x="732" y="530" font-size="22" fill="#1F2328"><tspan x="732" dy="0">在设计中采用<tspan fill="#0070C0" font-weight="bold">新技术、新工艺、新材料、</tspan></tspan><tspan x="732" dy="34"><tspan fill="#0070C0" font-weight="bold">新设备</tspan>的，应当说明其技术性能和使用注意</tspan><tspan x="732" dy="34">事项，并提出质量保障措施。</tspan></text>
</g>
</svg>
