<g id="article-15" data-pptx-bounds="56 206 600 124">
<rect x="56" y="214" width="5" height="106" fill="#0070C0"/>
<text x="80" y="236" font-size="24" fill="#1F2328"><tspan x="80" dy="0"><tspan fill="#0070C0" font-weight="bold">第十五条</tspan> 地质灾害治理工程实行<tspan fill="#0070C0" font-weight="bold">施工总承包制</tspan>，</tspan><tspan x="80" dy="38">施工单位不得将其承接的工程进行<tspan fill="#D7141A" font-weight="bold">转包</tspan></tspan><tspan x="80" dy="38">或者<tspan fill="#D7141A" font-weight="bold">违法分包</tspan>。</tspan></text>
</g>
<g id="article-16" data-pptx-bounds="56 354 600 250">
<rect x="56" y="362" width="5" height="144" fill="#0070C0"/>
<text x="80" y="384" font-size="24" fill="#1F2328"><tspan x="80" dy="0"><tspan fill="#0070C0" font-weight="bold">第十六条</tspan> 施工单位应当根据设计要求，</tspan><tspan x="80" dy="38">做好地质灾害治理工程监测工作并形成<tspan fill="#0070C0" font-weight="bold">监测记录</tspan>，</tspan><tspan x="80" dy="38">监测周期包含施工期间以及竣工验收后</tspan><tspan x="80" dy="38"><tspan fill="#D7141A" font-weight="bold">不少于一个水文年</tspan>。</tspan></text>
<rect x="80" y="524" width="556" height="80" rx="6" fill="#EEF4FB"/>
<text x="100" y="556" font-size="24" fill="#1F2328"><tspan x="100" dy="0">设计文件要求委托<tspan fill="#0070C0" font-weight="bold">第三方进行监测</tspan>的，</tspan><tspan x="100" dy="34">由建设单位另行委托。</tspan></text>
</g>
