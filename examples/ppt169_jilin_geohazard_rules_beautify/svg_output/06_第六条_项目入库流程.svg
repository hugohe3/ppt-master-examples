<g id="p06-article-band" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="56 112 1168 80" data-pptx-av-adj="val 30000" fill="#0070C0" stroke="none">
