<rect x="104" y="130" width="4" height="22" />
<text x="118" y="148" font-size="20" font-weight="bold">背景介绍</text>
</g>
<line id="context-rail" data-pptx-role="decoration" x1="72" y1="186" x2="72" y2="640" stroke="#C9D6E5" stroke-width="2" />
<g id="context-2023-07" data-pptx-bounds="56 172 620 244">
<circle cx="72" cy="186" r="9" fill="#0070C0" />
<text font-size="24" fill="#1F2328" x="104" y="194"><tspan x="104" dy="0">为规范省级以上（含省级）地质灾害治理工程项目</tspan><tspan x="104" dy="35">管理，2023年7月下旬，省厅印发了《<tspan fill="#0070C0" font-weight="bold">吉林省自然</tspan></tspan><tspan x="104" dy="35"><tspan fill="#0070C0" font-weight="bold">资源厅关于加强吉林省地质灾害工程治理项目管理</tspan></tspan><tspan x="104" dy="35"><tspan fill="#0070C0" font-weight="bold">的通知</tspan>》（吉自然资办发〔2023〕137号），</tspan><tspan x="104" dy="35">该通知主要在地质灾害治理工程项目管理流程上提</tspan><tspan x="104" dy="35">出了具体要求，进一步规范了全省地质灾害治理工</tspan><tspan x="104" dy="35">程项目管理。</tspan></text>
</g>
<g id="context-2023-09" data-pptx-bounds="56 432 620 246">
<circle cx="72" cy="446" r="9" fill="#FFFFFF" stroke="#0070C0" stroke-width="3" />
<text font-size="24" fill="#1F2328" x="104" y="454"><tspan x="104" dy="0">2023年9月以来，在已下发项目管理通知的基础</tspan><tspan x="104" dy="35">上，我厅通过电话沟通、调研，并学习借鉴四川、</tspan><tspan x="104" dy="35">云南、贵州、浙江、辽宁、甘肃等省外项目管理先</tspan><tspan x="104" dy="35">进经验与做法的基础上，针对我省地质灾害治理工</tspan><tspan x="104" dy="35">程项目管理中存在的突出问题和薄弱环节，</tspan><tspan x="104" dy="35">对原项目管理通知进行了修改补充完善，</tspan><tspan x="104" dy="35">形成了本《办法》。</tspan></text>
</g>
