<text x="1037" y="163" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">第二十条</text>
<rect x="850" y="178" width="374" height="430" fill="#EEF4FB"/>
<use data-icon="tabler-filled/calendar" x="870" y="196" width="36" height="36" fill="#0070C0"/>
<text x="870" y="270" font-size="22" fill="#1F2328"><tspan x="870" dy="0">项目实施期限原则上应</tspan><tspan x="870" dy="32"><tspan fill="#0070C0" font-weight="bold">自预算下达之日起</tspan><tspan fill="#D7141A" font-weight="bold">2年内</tspan></tspan><tspan x="870" dy="32">完成竣工验收及财务决算；</tspan></text>
<line x1="870" y1="360" x2="1204" y2="360" stroke="#C9D6E5" stroke-width="1.5"/>
<text x="870" y="398" font-size="22" fill="#1F2328"><tspan x="870" dy="0">因施工条件等不可抗力客观因素</tspan><tspan x="870" dy="32">确需延期的，市、县级自然资源</tspan><tspan x="870" dy="32">主管部门须向省自然资源厅和省</tspan><tspan x="870" dy="32">财政厅<tspan fill="#0070C0" font-weight="bold">书面说明</tspan>情况，经同意后</tspan><tspan x="870" dy="32">可<tspan fill="#D7141A" font-weight="bold">延期1年</tspan>。</tspan></text>
</g>
