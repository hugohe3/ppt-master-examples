</g>
<text x="639.5" y="163" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">第十九条</text>
<rect x="453" y="178" width="373" height="430" fill="#EEF4FB"/>
<use data-icon="tabler-filled/archive" x="473" y="196" width="36" height="36" fill="#0070C0"/>
<text x="473" y="270" font-size="22" fill="#1F2328"><tspan x="473" dy="0">项目相关单位应当按照档案管理</tspan><tspan x="473" dy="32">有关法律、法规、规章规定，</tspan><tspan x="473" dy="32">及时、真实、完整记录工程建设</tspan><tspan x="473" dy="32">过程中的信息资料，</tspan><tspan x="473" dy="32"><tspan fill="#0070C0" font-weight="bold">建立工程项目档案</tspan>，并及时向</tspan><tspan x="473" dy="32">建设单位移交。</tspan></text>
</g>
<g id="article-20" data-pptx-bounds="850 124 374 488">
<g id="p14-tab-20" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="round2SameRect" data-pptx-frame="850 128 374 50" fill="#0070C0" stroke="none">
