<text x="242.5" y="163" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF">第十八条</text>
<rect x="56" y="178" width="373" height="430" fill="#EEF4FB"/>
<use data-icon="tabler-filled/file-text" x="76" y="196" width="36" height="36" fill="#0070C0"/>
<text x="76" y="270" font-size="22" fill="#1F2328"><tspan x="76" dy="0">项目的勘查、设计成果以及施工</tspan><tspan x="76" dy="32">组织方案、监理规划等技术文</tspan><tspan x="76" dy="32">件，应当符合相关法律、法规、</tspan><tspan x="76" dy="32">规章规定，工程建设强制性标</tspan><tspan x="76" dy="32">准、规范规程以及合同约定。</tspan></text>
<line x1="76" y1="424" x2="409" y2="424" stroke="#C9D6E5" stroke-width="1.5"/>
<text x="76" y="462" font-size="22" fill="#1F2328"><tspan x="76" dy="0">任何单位和个人<tspan fill="#0070C0" font-weight="bold">不得</tspan>擅自压缩工</tspan><tspan x="76" dy="32">程勘查、设计周期和施工工期；</tspan><tspan x="76" dy="32"><tspan fill="#0070C0" font-weight="bold">不得</tspan>提供虚假的工程资料；</tspan><tspan x="76" dy="32"><tspan fill="#0070C0" font-weight="bold">不得</tspan>代签有关工程资料。</tspan></text>
</g>
<g id="article-19" data-pptx-bounds="453 124 373 488">
<g id="p14-tab-19" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="round2SameRect" data-pptx-frame="453 128 373 50" fill="#0070C0" stroke="none">
