<use data-icon="tabler-filled/zoom-check" x="1168" y="470" width="32" height="32" fill="#5B9BD5"/>
<text x="680" y="562" font-size="24" fill="#1F2328"><tspan x="680" dy="0">施工期间发现实际与勘查成果出入较大时，</tspan><tspan x="680" dy="36">应进行<tspan fill="#D7141A" font-weight="bold">补充勘查</tspan>。</tspan></text>
