<text x="80" y="149" font-size="24" font-weight="bold" fill="#FFFFFF">第九条：<tspan fill="#FFC000">勘查</tspan>单位在项目实施过程中职责</text>
</g>
<g id="survey-duty-1" data-pptx-bounds="56 186 572 236">
<rect x="56" y="186" width="572" height="236" rx="6" fill="#EEF4FB"/>
<circle cx="100" cy="234" r="26" fill="#0070C0"/>
<text x="100" y="245" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">1</text>
<use data-icon="tabler-filled/file-text" x="572" y="214" width="32" height="32" fill="#5B9BD5"/>
<text x="84" y="306" font-size="24" fill="#1F2328"><tspan x="84" dy="0">针对地质环境条件、致灾地质体特征和</tspan><tspan x="84" dy="36">危害程度，制定相应的工程</tspan><tspan x="84" dy="36"><tspan fill="#0070C0" font-weight="bold">勘查设计书或者勘查方案</tspan>。</tspan></text>
</g>
<g id="survey-duty-2" data-pptx-bounds="652 186 572 236">
<rect x="652" y="186" width="572" height="236" rx="6" fill="#EEF4FB"/>
<circle cx="696" cy="234" r="26" fill="#0070C0"/>
<text x="696" y="245" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">2</text>
<use data-icon="tabler-filled/clipboard-check" x="1168" y="214" width="32" height="32" fill="#5B9BD5"/>
<text x="680" y="306" font-size="24" fill="#1F2328"><tspan x="680" dy="0">勘查工作应当满足国家规定的<tspan fill="#0070C0" font-weight="bold">规范规程</tspan>、</tspan><tspan x="680" dy="36"><tspan fill="#0070C0" font-weight="bold">委托书</tspan>、<tspan fill="#0070C0" font-weight="bold">勘查合同</tspan>以及相应<tspan fill="#0070C0" font-weight="bold">勘查阶段</tspan>要求，</tspan><tspan x="680" dy="36">工作成果应当进行<tspan fill="#D7141A" font-weight="bold">野外验收</tspan>。</tspan></text>
</g>
<g id="survey-duty-3" data-pptx-bounds="56 442 572 236">
<rect x="56" y="442" width="572" height="236" rx="6" fill="#EEF4FB"/>
<circle cx="100" cy="490" r="26" fill="#0070C0"/>
<text x="100" y="501" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">3</text>
<use data-icon="tabler-filled/briefcase" x="572" y="470" width="32" height="32" fill="#5B9BD5"/>
<text x="84" y="562" font-size="24" fill="#1F2328"><tspan x="84" dy="0">参加设计交底、现场验槽、设计变更、</tspan><tspan x="84" dy="36">单元工程阶段性验收、质量事故分析</tspan><tspan x="84" dy="36">以及工程初步验收与竣工验收等工作。</tspan></text>
</g>
<g id="survey-duty-4" data-pptx-bounds="652 442 572 236">
