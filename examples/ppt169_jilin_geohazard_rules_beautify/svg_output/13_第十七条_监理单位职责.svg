<text x="80" y="149" font-size="24" font-weight="bold" fill="#FFFFFF">第十七条：<tspan fill="#FFC000">监理</tspan>单位在项目实施过程中职责</text>
<rect x="1024" y="121" width="164" height="38" rx="19" fill="#FFC000"/>
<text x="1106" y="148" text-anchor="middle" font-size="22" font-weight="bold" fill="#0B2A5B">全过程监理</text>
</g>
<g id="supervise-plan" data-pptx-bounds="56 186 572 200">
<rect x="56" y="186" width="572" height="200" rx="6" fill="#EEF4FB"/>
<use data-icon="tabler-filled/file-text" x="76" y="206" width="36" height="36" fill="#0070C0"/>
<text x="128" y="230" font-size="22" fill="#1F2328"><tspan x="128" dy="0"><tspan fill="#0070C0" font-weight="bold">编制监理规划和监理实施细则</tspan>，建立与项目规</tspan><tspan x="128" dy="32">模、专业相适应的监理机构，确定总监理工程</tspan><tspan x="128" dy="32">师和监理人员。监理工程师不得擅自调整，</tspan><tspan x="128" dy="32">确需调整的应符合监理合同约定要求并征得建</tspan><tspan x="128" dy="32">设单位同意。</tspan></text>
</g>
<g id="supervise-review" data-pptx-bounds="652 186 572 200">
<rect x="652" y="186" width="572" height="200" rx="6" fill="#EEF4FB"/>
<use data-icon="tabler-filled/clipboard-check" x="672" y="206" width="36" height="36" fill="#0070C0"/>
<text x="724" y="230" font-size="22" fill="#1F2328"><tspan x="724" dy="0">按建设单位要求，组织或参加<tspan fill="#0070C0" font-weight="bold">设计交底、施工</tspan></tspan><tspan x="724" dy="32"><tspan fill="#0070C0" font-weight="bold">组织方案审查、开工报告审查</tspan>、存在较大危险</tspan><tspan x="724" dy="32">性隐患的分部分项工程<tspan fill="#0070C0" font-weight="bold">专项施工方案审查</tspan>、现</tspan><tspan x="724" dy="32">场验槽、单元工程阶段性验收、质量事故分析</tspan><tspan x="724" dy="32">以及工程初步验收与竣工验收等工作。</tspan></text>
</g>
<g id="supervise-inspect" data-pptx-bounds="56 402 572 232">
<rect x="56" y="402" width="572" height="232" rx="6" fill="#EEF4FB"/>
<use data-icon="tabler-filled/zoom-check" x="76" y="422" width="36" height="36" fill="#0070C0"/>
<text x="128" y="446" font-size="22" fill="#1F2328"><tspan x="128" dy="0">检查施工单位的质量和安全生产<tspan fill="#0070C0" font-weight="bold">制度及措施</tspan></tspan><tspan x="128" dy="32">落实情况；核查主要<tspan fill="#0070C0" font-weight="bold">管理人员</tspan>和<tspan fill="#0070C0" font-weight="bold">关键设备</tspan>到位</tspan><tspan x="128" dy="32">情况、相关从业人员依法应当取得的执业</tspan><tspan x="128" dy="32"><tspan fill="#0070C0" font-weight="bold">资格证书</tspan>或者考核合格证书情况、设备合格</tspan><tspan x="128" dy="32">证书和施工<tspan fill="#0070C0" font-weight="bold">技术档案</tspan>情况；督促施工单位及时</tspan><tspan x="128" dy="32">整改<tspan fill="#0070C0" font-weight="bold">工程质量问题</tspan>，消除安全生产隐患。</tspan></text>
</g>
<g id="supervise-onsite" data-pptx-bounds="652 402 572 232">
<rect x="652" y="402" width="572" height="232" rx="6" fill="#EEF4FB"/>
<use data-icon="tabler-filled/eye" x="672" y="422" width="36" height="36" fill="#0070C0"/>
<text x="724" y="446" font-size="22" fill="#1F2328"><tspan x="724" dy="0">监理工程师应当按照工程监理规范的要求，</tspan><tspan x="724" dy="32">采取<tspan fill="#0070C0" font-weight="bold">旁站、巡视和平行检验</tspan>等形式对工程实施</tspan><tspan x="724" dy="32">监理，并及时、真实、完整地做好<tspan fill="#D7141A" font-weight="bold">监理记录</tspan>。</tspan></text>
</g>
