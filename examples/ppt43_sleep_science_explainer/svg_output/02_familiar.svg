<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" font-family="Microsoft YaHei, Verdana, sans-serif" data-pptx-page-role="content">
  <defs>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.10" />
    </filter>
  </defs>
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1024" height="768" fill="#FBF5E9" />
  <polygon id="paper-band" data-pptx-role="decoration" points="0,706 118,698 236,707 354,699 472,708 590,700 708,709 826,701 944,710 1024,703 1024,768 0,768" fill="#F0E4CE" />
  <g id="header" data-pptx-bounds="56 70 912 78">
    <text x="56" y="120" font-family="Microsoft YaHei, Trebuchet MS, sans-serif" font-size="52" font-weight="bold" fill="#2A2622">每个人都熬过一次夜</text>
    <rect x="56" y="140" width="132" height="8" fill="#E08A32" />
  </g>
  <g id="experience-list" data-pptx-bounds="56 246 444 172" fill="#2A2622" font-size="34">
    <text x="56" y="280">反应慢半拍</text>
    <text x="56" y="340">情绪一碰就碎</text>
    <text x="56" y="400">眼睛发涩,躺下却睡不着</text>
  </g>
  <g id="scene-night" data-pptx-bounds="560 230 400 392">
    <image href="../images/el_night_window.png" x="560" y="230" width="400" height="392" preserveAspectRatio="xMidYMid meet" />
  </g>
  <g id="transition-note" data-pptx-bounds="56 492 444 84">
    <text x="56" y="520" font-size="28" fill="#5C554C">这种迟钝有生理原因,<tspan x="56" dy="42" font-weight="bold" fill="#2E4A7D">不是意志力的问题。</tspan></text>
  </g>
  <g id="footer" data-pptx-bounds="880 720 88 26">
    <text x="968" y="736" font-size="18" fill="#5C554C" text-anchor="end">02</text>
  </g>
</svg>
