    <text x="548" y="278" font-size="20" fill="#5C554C">Nature Neuroscience</text>
    <text x="548" y="322" font-size="28" fill="#2A2622">同样在小鼠中,示踪分子<tspan x="548" dy="42">的清除在睡眠与麻醉期间</tspan><tspan x="548" dy="42">显著降低,而不是升高。</tspan></text>
