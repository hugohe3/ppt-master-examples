    <rect x="536" y="520" width="200" height="76" rx="12" fill="#2E4A7D"/>
    <line x1="264" y1="558" x2="286" y2="558" stroke="#E08A32" stroke-width="3" marker-end="url(#arrowHead)"/>
    <line x1="504" y1="558" x2="526" y2="558" stroke="#E08A32" stroke-width="3" marker-end="url(#arrowHead)"/>
    <text x="156" y="568" font-size="28" fill="#2A2622" text-anchor="middle">光进入眼睛</text>
    <text x="396" y="568" font-size="28" fill="#2A2622" text-anchor="middle">视交叉上核</text>
    <text x="636" y="568" font-size="28" fill="#FBF5E9" text-anchor="middle">褪黑素上升</text>
