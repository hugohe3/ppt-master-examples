    <text x="100" y="240" font-size="34" font-weight="bold" fill="#E08A32">主时钟在脑内一个具体的位置</text>
    <text x="56" y="300" font-size="28">视交叉上核(SCN)按眼睛收到的光量<tspan x="56" dy="42">控制褪黑素分泌;傍晚光线一暗,</tspan><tspan x="56" dy="42">分泌增加,人就开始犯困。</tspan></text>
    <text x="56" y="440" font-size="28" font-weight="bold" fill="#B4553E">夜里的强光不是让你精神,<tspan x="56" dy="42">是让主时钟以为天还没黑。</tspan></text>
  </g>
  <g id="light-path" data-pptx-bounds="56 516 720 92">
    <rect x="56" y="520" width="200" height="76" rx="12" fill="#F0E4CE"/>
