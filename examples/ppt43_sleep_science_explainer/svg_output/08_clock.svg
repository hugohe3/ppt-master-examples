  <g id="header" data-pptx-bounds="56 70 912 78">
    <text x="56" y="120" font-family="Microsoft YaHei, Trebuchet MS, sans-serif" font-size="52" font-weight="bold" fill="#2A2622">潮汐由光对时</text>
    <rect x="56" y="140" width="132" height="8" fill="#E08A32"/>
