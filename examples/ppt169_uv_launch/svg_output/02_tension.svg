    <text x="588" y="440" font-size="18" fill="#E6EDF3"><tspan x="588" dy="0">Python tooling can be a low-confidence experience: it&apos;s a</tspan><tspan x="588" dy="28">significant amount of work to stand up a new or existing</tspan><tspan x="588" dy="28">project, and commands fail in confusing ways.</tspan></text>
    <text x="588" y="520" font-size="16" fill="#9BA9BC">— Astral,uv: Python packaging in Rust,2024-02-15</text>
