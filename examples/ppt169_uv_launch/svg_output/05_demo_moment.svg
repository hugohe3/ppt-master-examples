    <text x="1184" y="202" font-family="Consolas, monospace" font-size="18" fill="#9BA9BC" text-anchor="end">docs.astral.sh/uv</text>
    <text x="104" y="232" font-family="Consolas, monospace" font-size="18" fill="#E6EDF3"><tspan x="104" dy="0"><tspan fill="#FF8A3D">$ </tspan>uv init example</tspan><tspan x="104" dy="24" fill="#9BA9BC">Initialized project `example` at `/home/user/example`</tspan><tspan x="104" dy="24"><tspan fill="#FF8A3D">$ </tspan>cd example</tspan><tspan x="104" dy="24"><tspan fill="#FF8A3D">$ </tspan>uv add ruff</tspan><tspan x="104" dy="24" fill="#9BA9BC">Creating virtual environment at: .venv</tspan><tspan x="104" dy="24" fill="#9BA9BC">Resolved 2 packages in <tspan fill="#4CC9F0">170ms</tspan></tspan><tspan x="104" dy="24" fill="#9BA9BC">   Built example @ file:///home/user/example</tspan><tspan x="104" dy="24" fill="#9BA9BC">Prepared 2 packages in <tspan fill="#4CC9F0">627ms</tspan></tspan><tspan x="104" dy="24" fill="#9BA9BC">Installed 2 packages in <tspan fill="#4CC9F0">1ms</tspan></tspan><tspan x="104" dy="24" fill="#9BA9BC"> + example==0.1.0 (from file:///home/user/example)</tspan><tspan x="104" dy="24" fill="#9BA9BC"> + ruff==0.5.4</tspan><tspan x="104" dy="24"><tspan fill="#FF8A3D">$ </tspan>uv run ruff check</tspan><tspan x="104" dy="24" fill="#9BA9BC">All checks passed!</tspan><tspan x="104" dy="24"><tspan fill="#FF8A3D">$ </tspan>uv lock</tspan><tspan x="104" dy="24" fill="#9BA9BC">Resolved 2 packages in <tspan fill="#4CC9F0">0.33ms</tspan></tspan></text>
  </g>

