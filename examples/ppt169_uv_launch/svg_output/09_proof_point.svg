  <g id="p09-basis" data-pptx-bounds="752 224 456 360">
    <text x="752" y="244" font-size="18" fill="#FF8A3D" letter-spacing="3">测量口径</text>
    <text x="752" y="284" font-size="18" fill="#E6EDF3"><tspan x="752" dy="0">测量者:Astral(uv 的作者)</tspan><tspan x="752" dy="32">平台:macOS,非 uv 工具用 Python 3.12.4</tspan><tspan x="752" dy="32">对象:Trio 的 docs-requirements.in</tspan><tspan x="752" dy="32">日期:2024-02-15(Astral 发布博文)</tspan></text>
    <rect x="752" y="412" width="456" height="120" rx="4" fill="#131C2E" stroke="#243349" stroke-width="1" />
    <text x="776" y="444" font-size="18" fill="#9BA9BC">博文原句给的是区间,不是单一数字</text>
    <text x="776" y="484" font-family="Consolas, monospace" font-size="20" fill="#E6EDF3"><tspan x="776" dy="0">cold  <tspan fill="#4CC9F0">8-10x</tspan>   faster than pip</tspan><tspan x="776" dy="28">warm  <tspan fill="#FF8A3D">80-115x</tspan> faster than pip</tspan></text>
    <text x="752" y="566" font-size="18" fill="#9BA9BC">不是你机器上的结果,本 deck 未做本机复测</text>
  </g>

  <g id="p09-note" data-pptx-bounds="72 596 1136 50" fill="#9BA9BC" font-size="18">
    <text x="72" y="614">官方文档首页另写作「10-100x faster than pip」,指向同一份 BENCHMARKS.md。</text>
    <text x="72" y="638">BENCHMARKS.md 提醒:不同操作系统与文件系统上差异可能很大,不同依赖集也会显著改变结果。</text>
  </g>

  <g id="p09-footer" data-pptx-bounds="72 646 1136 40">
