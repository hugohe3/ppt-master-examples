    <text x="72" y="76" font-size="18" fill="#4CC9F0" letter-spacing="3">能力全景</text>
    <text x="72" y="124" font-size="42" font-weight="bold" fill="#E6EDF3">你可以只用其中一块,也可以整套换过来</text>
    <rect x="72" y="142" width="64" height="3" fill="url(#accentRule)"/>
  </g>

