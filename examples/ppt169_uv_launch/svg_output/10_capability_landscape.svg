    <use data-icon="tabler-outline/package" x="96" y="344" width="32" height="32" fill="#4CC9F0" stroke-width="2"/>
    <text x="148" y="370" font-size="24" fill="#E6EDF3">项目</text>
    <text x="368" y="370" font-family="Consolas, monospace" font-size="18" fill="#9BA9BC">uv init / add / remove / sync / lock / run / tree / build / publish</text>

    <rect x="72" y="400" width="1136" height="64" rx="4" fill="#131C2E" stroke="#243349" stroke-width="1"/>
