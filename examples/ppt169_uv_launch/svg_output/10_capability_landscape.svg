    <text x="148" y="514" font-size="24" fill="#E6EDF3">pip 接口</text>
    <text x="368" y="514" font-family="Consolas, monospace" font-size="18" fill="#9BA9BC">uv venv / uv pip install / compile / sync / freeze / tree</text>

    <rect x="72" y="544" width="1136" height="64" rx="4" fill="none" stroke="#243349" stroke-width="1" stroke-dasharray="4,4"/>
