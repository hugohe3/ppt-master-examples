    <use data-icon="tabler-outline/file-code" x="96" y="272" width="32" height="32" fill="#4CC9F0" stroke-width="2"/>
    <text x="148" y="298" font-size="24" fill="#E6EDF3">脚本</text>
    <text x="368" y="298" font-family="Consolas, monospace" font-size="18" fill="#9BA9BC">uv run / uv add --script / uv remove --script</text>

