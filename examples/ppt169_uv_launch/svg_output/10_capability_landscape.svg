    <text x="148" y="442" font-size="24" fill="#E6EDF3">工具</text>
    <text x="368" y="442" font-family="Consolas, monospace" font-size="18" fill="#9BA9BC">uvx (= uv tool run) / uv tool install / uninstall / list</text>

