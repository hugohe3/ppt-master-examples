    <text x="140" y="206" font-family="Consolas, monospace" font-size="18" fill="#9BA9BC">bash — uv python</text>
    <text font-size="18" fill="#E6EDF3" font-family="Consolas, monospace" x="104" y="254"><tspan><tspan fill="#FF8A3D">$ </tspan>uv python install 3.10 3.11 3.12</tspan></text><text font-size="18" fill="#E6EDF3" font-family="Consolas, monospace" x="104" y="278"><tspan fill="#9BA9BC">Installed 3 versions in <tspan fill="#4CC9F0">3.42s</tspan></tspan></text><text font-size="18" fill="#9BA9BC" font-family="Consolas, monospace" x="104" y="302"> + cpython-3.10.14-macos-aarch64-none</text><text font-size="18" fill="#9BA9BC" font-family="Consolas, monospace" x="104" y="326"> + cpython-3.11.9-macos-aarch64-none</text><text font-size="18" fill="#9BA9BC" font-family="Consolas, monospace" x="104" y="350"> + cpython-3.12.4-macos-aarch64-none</text><text font-size="18" fill="#E6EDF3" font-family="Consolas, monospace" x="104" y="374"><tspan><tspan fill="#FF8A3D">$ </tspan>uv venv --python 3.12.0</tspan></text><text font-size="18" fill="#9BA9BC" font-family="Consolas, monospace" x="104" y="398">Using CPython 3.12.0</text><text font-size="18" fill="#9BA9BC" font-family="Consolas, monospace" x="104" y="422">Creating virtual environment at: .venv</text><text font-size="18" fill="#E6EDF3" font-family="Consolas, monospace" x="104" y="446"><tspan><tspan fill="#FF8A3D">$ </tspan>uv python pin 3.11</tspan></text><text font-size="18" fill="#9BA9BC" font-family="Consolas, monospace" x="104" y="470">Pinned `.python-version` to `3.11`</text></g>

