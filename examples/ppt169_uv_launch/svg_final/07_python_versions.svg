  <g id="p07-note" data-pptx-bounds="72 556 1136 64" fill="#9BA9BC" font-size="18">
    <text x="72" y="580">.python-version 决定 uv 为这个项目创建虚拟环境时使用哪个 Python 版本。</text>
    <text x="72" y="608">上面输出末尾的 macos-aarch64 说明这段官方示例是在 macOS 上执行的;你机器上的标识会不同。</text>
  </g>

