    <path d="M12 3l8 4.5l0 9l-8 4.5l-8 -4.5l0 -9l8 -4.5" />
    <path d="M12 12l8 -4.5" />
    <path d="M12 12l0 9" />
    <path d="M12 12l-8 -4.5" />
  </g>
    <text x="608" y="460" font-size="24" fill="#E6EDF3">用 Rust 写成的单个静态二进制</text>
    
  <g transform="translate(560, 492) scale(1.33333)" fill="none" stroke="#4CC9F0" stroke-width="2">
    <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
    <path d="M7 11l5 5l5 -5" />
    <path d="M12 4l0 12" />
  </g>
    <text x="608" y="516" font-size="24" fill="#E6EDF3">不需要先有 Rust 或 Python 就能装</text>
    
  <g transform="translate(560, 548) scale(1.33333)" fill="none" stroke="#4CC9F0" stroke-width="2">
    <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6" />
    <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0" />
    <path d="M8 11v-4a4 4 0 1 1 8 0v4" />
  </g>
    <text x="608" y="572" font-size="24" fill="#E6EDF3">提供跨平台的 uv.lock,一份锁文件走遍机器</text>
  </g>

  <g id="p03-caveat" data-pptx-bounds="72 504 452 96">
    
  <g transform="translate(72, 508) scale(1.16667)" fill="none" stroke="#FF8A3D" stroke-width="2">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
