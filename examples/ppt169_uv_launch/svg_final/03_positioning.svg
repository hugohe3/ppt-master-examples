    <text font-size="24" fill="#E6EDF3" x="112" y="532">后面每一个倍数都会标出:</text><text font-size="24" fill="#E6EDF3" x="112" y="570">谁测的、什么机器、什么时候</text></g>

  <g id="p03-footer" data-pptx-bounds="72 646 1136 40">
