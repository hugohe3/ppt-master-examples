    <text x="792" y="380" font-size="18" fill="#9BA9BC">uv run 在隔离的虚拟环境里执行脚本</text>
    <line x1="792" y1="412" x2="1208" y2="412" stroke="#243349" stroke-width="1" />

    
  <g transform="translate(792, 440) scale(1.33333)" fill="none" stroke="#4CC9F0" stroke-width="2">
    <path d="M7 10h3v-3l-3.5 -3.5a6 6 0 0 1 8 8l6 6a2 2 0 0 1 -3 3l-6 -6a6 6 0 0 1 -8 -8l3.5 3.5" />
