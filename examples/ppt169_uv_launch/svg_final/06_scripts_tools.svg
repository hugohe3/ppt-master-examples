    <line x1="72" y1="218" x2="752" y2="218" stroke="#243349" stroke-width="1" />
    <circle cx="96" cy="199" r="5" fill="#FF8A3D" />
    <circle cx="116" cy="199" r="5" fill="#243349" />
    <text x="140" y="206" font-family="Consolas, monospace" font-size="18" fill="#9BA9BC">bash — example.py</text>
    <text font-size="18" fill="#E6EDF3" font-family="Consolas, monospace" x="104" y="254"><tspan><tspan fill="#FF8A3D">$ </tspan>uv add --script example.py requests</tspan></text><text font-size="18" fill="#9BA9BC" font-family="Consolas, monospace" x="104" y="278">Updated `example.py`</text><text font-size="18" fill="#E6EDF3" font-family="Consolas, monospace" x="104" y="302"><tspan><tspan fill="#FF8A3D">$ </tspan>uv run example.py</tspan></text><text font-size="18" fill="#9BA9BC" font-family="Consolas, monospace" x="104" y="326">Reading inline script metadata from: example.py</text><text font-size="18" fill="#E6EDF3" font-family="Consolas, monospace" x="104" y="350"><tspan fill="#9BA9BC">Installed 5 packages in <tspan fill="#4CC9F0">12ms</tspan></tspan></text><text font-size="18" fill="#9BA9BC" font-family="Consolas, monospace" x="104" y="374">&lt;Response [200]&gt;</text></g>

  <g id="p06-tools" data-pptx-bounds="72 444 680 172">
    <rect x="72" y="444" width="328" height="172" rx="4" fill="#131C2E" stroke="#243349" stroke-width="1" />
    <text x="96" y="480" font-size="18" fill="#FF8A3D" letter-spacing="2">临时跑一次</text>
    <text font-size="18" fill="#E6EDF3" font-family="Consolas, monospace" x="96" y="522">uvx pycowsay</text><text font-size="18" fill="#E6EDF3" font-family="Consolas, monospace" x="96" y="546">'hello world!'</text><text x="96" y="588" font-size="18" fill="#9BA9BC">uvx 即 uv tool run</text>

    <rect x="424" y="444" width="328" height="172" rx="4" fill="#131C2E" stroke="#243349" stroke-width="1" />
    <text x="448" y="480" font-size="18" fill="#FF8A3D" letter-spacing="2">装成常驻</text>
    <text font-size="18" fill="#E6EDF3" font-family="Consolas, monospace" x="448" y="522">uv tool install ruff</text><text font-size="18" fill="#9BA9BC" font-family="Consolas, monospace" x="448" y="546">Installed 1 executable</text><text x="448" y="588" font-size="18" fill="#9BA9BC">此后直接敲 ruff 即可</text>
  </g>

  <g id="p06-explain" data-pptx-bounds="792 180 416 436">
    
