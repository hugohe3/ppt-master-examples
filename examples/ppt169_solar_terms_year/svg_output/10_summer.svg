    <text x="96" y="352" font-size="24" fill="#FFFFFF" fill-opacity="0.90">夏天从 <tspan font-family="Trebuchet MS, sans-serif" font-weight="bold">5 月 5 日 19:49</tspan> 开始，<tspan x="96" dy="38">六格里从将满走到最热。</tspan></text>
    <line x1="96" y1="424" x2="300" y2="424" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" />
    <text x="96" y="470" font-size="24" fill="#FFFFFF" fill-opacity="0.90">立夏 <tspan font-family="Trebuchet MS, sans-serif">5月5日 19:49</tspan><tspan x="96" dy="36">大暑 <tspan font-family="Trebuchet MS, sans-serif">7月23日 03:13</tspan></tspan></text>
    <text x="96" y="556" font-size="18" fill="#FFFFFF" fill-opacity="0.75">全年第 7–12 格</text>
  </g>

  <g id="year-ring" data-pptx-bounds="1102 42 100 100">
