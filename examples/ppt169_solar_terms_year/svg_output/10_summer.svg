<path d="M 1190 92 A 38 38 0 0 1 1152 130 L 1152 110.24 A 18.24 18.24 0 0 0 1170.24 92 Z" />
</g>
    <circle cx="1190.0" cy="92.0" r="6" fill="#7A5470" />
  </g>

