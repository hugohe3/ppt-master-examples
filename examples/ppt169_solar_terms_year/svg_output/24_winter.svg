      <stop offset="0%" stop-color="#6C8FB3" />
      <stop offset="100%" stop-color="#4C6C8D" />
    </linearGradient>
  </defs>
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBF8F3" />

  <g id="season-disc" data-pptx-bounds="0 0 548 720">
    <circle cx="110" cy="360" r="440" fill="url(#discField)" />
    <text x="96" y="286" font-size="96" font-weight="bold" fill="#FFFFFF">冬</text>
    <text x="216" y="286" font-size="32" fill="#FFFFFF" fill-opacity="0.85" font-family="Trebuchet MS, sans-serif">Winter</text>
    <text x="96" y="352" font-size="24" fill="#FFFFFF" fill-opacity="0.90">冬天从 <tspan font-family="Trebuchet MS, sans-serif" font-weight="bold">11 月 7 日 17:52</tspan> 开始，<tspan x="96" dy="38">六格里天地闭塞又见回头的太阳。</tspan></text>
    <line x1="96" y1="424" x2="300" y2="424" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" />
    <text x="96" y="470" font-size="24" fill="#FFFFFF" fill-opacity="0.90">立冬 <tspan font-family="Trebuchet MS, sans-serif">11月7日 17:52</tspan><tspan x="96" dy="36">大寒 <tspan font-family="Trebuchet MS, sans-serif">1月20日 09:45</tspan></tspan></text>
    <text x="96" y="556" font-size="18" fill="#FFFFFF" fill-opacity="0.75">全年第 19–24 格 · 小寒与大寒落在 2026 年 1 月</text>
  </g>

  <g id="year-ring" data-pptx-bounds="1102 42 100 100">
