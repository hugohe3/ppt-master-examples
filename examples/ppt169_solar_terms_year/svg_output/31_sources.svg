    <text x="144" y="228" font-size="24" font-weight="bold" fill="#7A5C3E">交节时刻</text>
    <text x="96" y="272" font-size="18" fill="#3A332C">中国科学院紫金山天文台发布，经荔枝新闻整理。</text>
    <text x="96" y="302" font-size="18" fill="#8A8078">覆盖全部 24 格的公历日期与交节时刻（北京时间）。</text>
    <text x="96" y="346" font-size="18" fill="#7A5470"><tspan font-family="Trebuchet MS, sans-serif">→ </tspan><a href="https://finance.sina.com.cn/jjxw/2026-01-05/doc-inhffsfn9506531.shtml"><tspan text-decoration="underline">2026 年二十四节气精确到分钟（新浪财经）</tspan></a></text>
