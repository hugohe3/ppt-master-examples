  <g id="source-pentads" data-pptx-bounds="64 406 556 210">
    <rect x="64" y="406" width="556" height="210" rx="24" fill="#FFFFFF" />
    <use data-icon="tabler-filled/book" x="96" y="434" width="32" height="32" fill="#D99A2B" />
    <text x="144" y="458" font-size="24" font-weight="bold" fill="#7A5C3E">三候原文</text>
    <text x="96" y="502" font-size="18" fill="#3A332C">《月令七十二候集解》，24 组共 72 候，逐条对应本手账。</text>
    <text x="96" y="532" font-size="18" fill="#8A8078">本手账依通行本作「玄鸟」，维基文库本作「元鸟」。</text>
    <text x="96" y="576" font-size="18" fill="#7A5470"><tspan font-family="Trebuchet MS, sans-serif">→ </tspan><a href="https://zh.wikisource.org/wiki/%E6%9C%88%E4%BB%A4%E4%B8%83%E5%8D%81%E4%BA%8C%E5%80%99%E9%9B%86%E8%A7%A3"><tspan text-decoration="underline">月令七十二候集解（维基文库）</tspan></a></text>
