  <g id="source-astro" data-pptx-bounds="660 176 556 210">
    <rect x="660" y="176" width="556" height="210" rx="24" fill="#FFFFFF" />
    <use data-icon="tabler-filled/sun" x="692" y="204" width="32" height="32" fill="#CC5B4C" />
    <text x="740" y="228" font-size="24" font-weight="bold" fill="#7A5C3E">天文交叉印证</text>
    <text x="692" y="272" font-size="18" fill="#3A332C">12 个中气时刻与太阳上中天仰角，与上一条完全一致。</text>
    <text x="692" y="310" font-size="18" fill="#7A5470"><tspan x="692" dy="0"><tspan font-family="Trebuchet MS, sans-serif">→ </tspan><a href="https://www.hko.gov.hk/en/gts/astron2026/files/2026SolarTerms24.pdf"><tspan text-decoration="underline">《香港天文台年曆2026》二十四節氣</tspan></a></tspan><tspan x="692" dy="38"><tspan font-family="Trebuchet MS, sans-serif">→ </tspan><a href="https://finance.sina.com.cn/jjxw/2026-02-03/doc-inhkpvfi7233217.shtml"><tspan text-decoration="underline">新华社：立春 2 月 4 日 4 时 2 分</tspan></a></tspan></text>
