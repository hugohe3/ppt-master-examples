    <text x="740" y="458" font-size="24" font-weight="bold" fill="#7A5C3E">习俗与时令</text>
    <text x="692" y="502" font-size="18" fill="#3A332C">中国气象网「二十四节气」专题，逐节气一页。</text>
    <text x="692" y="540" font-size="18" fill="#7A5470"><tspan x="692" dy="0"><tspan font-family="Trebuchet MS, sans-serif">→ </tspan><a href="https://www.cma.gov.cn/ztbd/2025zt/24jq/lichun/index.html"><tspan text-decoration="underline">中国气象网 · 二十四节气（以立春页为例）</tspan></a></tspan><tspan x="692" dy="38"><tspan font-family="Trebuchet MS, sans-serif">→ </tspan><a href="https://www.unesco.org/zh/articles/ershisijieqiruxuanrenleifeiwuzhiwenhuayichandaibiaominglu"><tspan text-decoration="underline">UNESCO 人类非物质文化遗产代表作名录</tspan></a></tspan></text>
