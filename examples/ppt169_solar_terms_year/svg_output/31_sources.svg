  <g id="page-footer" data-pptx-bounds="64 636 1152 64" fill="#8A8078">
    <text x="64" y="664" font-size="18">口径：紫金山天文台为北京时间、香港天文台为香港时间，同属 UTC+8；12 个中气时刻两处实测完全一致。</text>
    <text x="64" y="694" font-size="16">「三候释义」「怎么过」为本手账整理，不属引文。</text>
    <text x="1216" y="694" font-size="16" text-anchor="end" font-family="Trebuchet MS, sans-serif">31 / 31</text>
