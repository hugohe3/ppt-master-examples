    <text x="96" y="352" font-size="24" fill="#FFFFFF" fill-opacity="0.90">春天从 <tspan font-family="Trebuchet MS, sans-serif" font-weight="bold">2 月 4 日 4:02</tspan> 开始，<tspan x="96" dy="38">六格里草木先动、雷起、雨落。</tspan></text>
