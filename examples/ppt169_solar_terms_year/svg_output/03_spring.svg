<path d="M 1152 54 A 38 38 0 0 1 1190 92 L 1170.24 92 A 18.24 18.24 0 0 0 1152 73.76 Z" />
</g>
    <circle cx="1152.0" cy="54.0" r="6" fill="#7A5470" />
  </g>

