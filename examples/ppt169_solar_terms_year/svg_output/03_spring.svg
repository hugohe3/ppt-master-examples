    <text x="96" y="470" font-size="24" fill="#FFFFFF" fill-opacity="0.90">立春 <tspan font-family="Trebuchet MS, sans-serif">2月4日 04:02</tspan><tspan x="96" dy="36">谷雨 <tspan font-family="Trebuchet MS, sans-serif">4月20日 09:39</tspan></tspan></text>
    <text x="96" y="556" font-size="18" fill="#FFFFFF" fill-opacity="0.75">全年第 1–6 格</text>
  </g>

