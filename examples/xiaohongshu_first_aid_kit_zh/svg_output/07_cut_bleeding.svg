  <g id="flow-notes" data-pptx-bounds="88 1272 1066 200">
    <text x="88" y="1300" font-size="32" fill="#6B6558">渗血后在原敷料上加盖继续压,不要揭下原敷料;<tspan x="88" dy="40">不按压眼部损伤、嵌入异物处,疑颅骨骨折不压头部伤口;</tspan><tspan x="88" dy="40">止血带只在有成品且受过训练时用,不用围巾皮带自制。</tspan><tspan x="88" dy="40">立即打 120:持续胸痛超 15 分钟 / 意识模糊或抽搐昏迷 /</tspan><tspan x="88" dy="40">严重创伤或出血不止 / 呼吸困难面色青紫。</tspan></text>
