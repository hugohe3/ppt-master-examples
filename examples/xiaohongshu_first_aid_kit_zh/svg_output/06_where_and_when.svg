<path d="M 1112.6 880 L 1120.88 846.88 L 1154 838.6 Z" fill="#D1CFCB" stroke="none"/>
<path d="M 1112.6 880 L 1120.88 846.88 L 1154 838.6 L 1112.6 880 L 96 880 L 96 420 L 1154 420 L 1154 838.6" fill="none"/>
</g>
    <use data-icon="tabler-outline/home" x="150" y="456" width="48" height="48" fill="#1F6F5C" stroke-width="2"/>
    <text x="214" y="496" font-family="SimHei, Arial Black, sans-serif" font-size="56" font-weight="bold" fill="#1F6F5C">放哪儿</text>
    <image href="../images/kit_storage.jpg" x="920" y="560" width="200" height="200" preserveAspectRatio="xMidYMid meet"/>
    <text x="150" y="580" font-size="44" fill="#2B2A26">· 阴凉干燥、通风避光</text>
    <text x="150" y="642" font-size="44" fill="#2B2A26">· 远离炉灶、水槽和发热电器</text>
    <text x="150" y="704" font-size="44" fill="#2B2A26">· 别放卫生间:潮气让药提前变质</text>
    <text x="150" y="766" font-size="44" fill="#2B2A26">· 孩子够不着,大人一伸手就到</text>
    <g id="storage-car-note">
      <use data-icon="tabler-outline/alert-triangle" x="150" y="800" width="34" height="34" fill="#E8A33D" stroke-width="2"/>
      <text x="196" y="828" font-size="32" fill="#6B6558">车上可另放一个包,但药别放汽车手套箱</text>
    </g>
  </g>

  <g id="check-cycle" data-pptx-bounds="88 910 1066 232">
    <use data-icon="tabler-outline/calendar-repeat" x="150" y="930" width="48" height="48" fill="#1F6F5C" stroke-width="2"/>
    <text x="214" y="970" font-family="SimHei, Arial Black, sans-serif" font-size="56" font-weight="bold" fill="#1F6F5C">多久查一次</text>
    <g id="p06-cycle-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="circularArrow" data-pptx-frame="150 1000 130 130" fill="#E8A33D" stroke="none">
<path d="M 158.12 1065 A 56.88 56.88 0 0 1 269.61 1049.1 L 277.33 1049.1 L 263.75 1065 L 244.83 1049.1 L 252.38 1049.1 A 40.62 40.62 0 0 0 174.38 1065 Z"/>
</g>
    <text x="312" y="1090" font-family="SimHei, Arial Black, sans-serif" font-size="96" font-weight="bold" fill="#D94F3D">3 个月</text>
    <text x="680" y="1058" font-size="44" fill="#2B2A26">自查一次</text>
    <text x="680" y="1120" font-size="44" fill="#2B2A26">每年再彻底复核</text>
  </g>

  <g id="check-steps" data-pptx-bounds="88 1200 1066 90">
    <text x="150" y="1230" font-size="32" fill="#6B6558">检查五步:查箱体 → 逐件查包装与有效期 → 清灰尘<tspan x="150" dy="44">→ 换掉过期或破损的 → 记下检查时间,把记录留在箱边</tspan></text>
  </g>

  <g id="shelf-life-note" data-pptx-bounds="88 1342 1066 122">
    <text x="88" y="1370" font-size="32" fill="#6B6558">保质期参考:胶带、敷料、纱布、冰袋、手套、剪刀镊子<tspan x="88" dy="40">包装完好可达 5 年;酒精湿巾、抗生素软膏约 2 年。</tspan><tspan x="88" dy="40">创可贴黏性会下降,纱布包装受潮或变色也要换。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-bounds="88 1480 1066 80" font-size="26" fill="#6B6558">
