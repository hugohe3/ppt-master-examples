  </g>

  <g id="page-title" data-pptx-bounds="88 166 1066 130">
    <text x="88" y="250" font-family="SimHei, Arial Black, sans-serif" font-size="80" font-weight="bold" fill="#2B2A26">放哪儿,多久查一次</text>
  </g>

  <g id="page-lead" data-pptx-bounds="88 310 1066 90">
    <text x="88" y="360" font-size="52" fill="#2B2A26">阴凉干燥、孩子够不着;每 <tspan fill="#D94F3D" font-weight="bold">3 个月</tspan>一查。</text>
  </g>

  <g id="storage-card" data-pptx-bounds="88 410 1066 480">
    <g id="p06-storage-card" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="foldedCorner" data-pptx-frame="96 420 1058 460" data-pptx-av-adj="val 9000" fill="#FFFDF7" stroke="#2B2A26" stroke-width="3">
