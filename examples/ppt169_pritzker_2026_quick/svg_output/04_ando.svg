<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F4F0E9"/>

  <g id="p4-photo-hero" data-pptx-bounds="0 0 640 440">
    <image href="../images/640.jpg" x="0" y="0" width="640" height="440" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <g id="p4-photo-pair" data-pptx-bounds="0 452 640 268">
    <image href="../images/640_1.jpg" x="0" y="452" width="314" height="268" preserveAspectRatio="xMidYMid slice"/>
    <image href="../images/640_2.jpg" x="326" y="452" width="314" height="268" preserveAspectRatio="xMidYMid slice"/>
    <rect x="326" y="672" width="314" height="48" fill="#14120F" fill-opacity="0.55"/>
    <text x="340" y="700" font-size="13" fill="#F4F0E9">屋顶以水为主题的空间 · 面向天空与水</text>
    <rect x="0" y="672" width="314" height="48" fill="#14120F" fill-opacity="0.55"/>
    <text x="14" y="700" font-size="13" fill="#F4F0E9">美术馆内部 · 光影留白（图源：H+美术馆）</text>
  </g>

  <g id="p4-title" data-pptx-bounds="690 44 530 226">
    <use data-icon="tabler-outline/award" x="690" y="50" width="20" height="20" fill="#B4532A"/>
    <text x="718" y="66" font-size="14" letter-spacing="1" fill="#6F675E">安藤忠雄 · 1995年普利兹克奖得主</text>
    <text x="690" y="176" font-family="Georgia" font-size="120" font-weight="bold" fill="#B4532A" fill-opacity="0.16">01</text>
    <text x="690" y="150" font-size="42" font-weight="bold" fill="#1C1A17">苏州H+美术馆</text>
    <text x="690" y="196" font-family="KaiTi" font-size="24" fill="#B4532A">在江南园林里写一首混凝土诗</text>
    <g id="p4-chips">
      <rect x="690" y="226" width="150" height="30" rx="15" fill="none" stroke="#D6CEC2" stroke-width="1"/>
      <use data-icon="tabler-outline/map-pin" x="702" y="233" width="16" height="16" fill="#B4532A"/>
      <text x="724" y="246" font-size="14" fill="#3F3A34">苏州 · 姑苏区</text>
      <rect x="852" y="226" width="160" height="30" rx="15" fill="none" stroke="#D6CEC2" stroke-width="1"/>
      <use data-icon="tabler-outline/calendar-event" x="864" y="233" width="16" height="16" fill="#B4532A"/>
      <text x="886" y="246" font-size="14" fill="#3F3A34">2026年1月 开馆</text>
      <rect x="1024" y="226" width="150" height="30" rx="15" fill="none" stroke="#D6CEC2" stroke-width="1"/>
      <use data-icon="tabler-outline/building" x="1036" y="233" width="16" height="16" fill="#B4532A"/>
      <text x="1058" y="246" font-size="14" fill="#3F3A34">清水混凝土</text>
    </g>
  </g>

  <g id="p4-body" data-pptx-bounds="690 284 530 136">
    <text x="690" y="306" font-size="19" fill="#3F3A34">延续标志性的清水混凝土肌理，以纯粹的几何线条<tspan x="690" dy="30">和光影留白，打造静谧空灵的艺术空间。核心理念</tspan><tspan x="690" dy="30">是“立体园林—回游性”：人们穿行于城市，进入并</tspan><tspan x="690" dy="30">回游于建筑内部，最终抵达一个面向天空与水的场所。</tspan></text>
  </g>

  <g id="p4-principles" data-pptx-bounds="690 434 530 140">
    <text x="690" y="450" font-size="13" letter-spacing="1" fill="#6F675E">从苏州园林记忆中汲取的三条构建方式</text>
    <line x1="690" y1="462" x2="1220" y2="462" stroke="#D6CEC2" stroke-width="1"/>
    <g id="p4-principle-1">
      <use data-icon="tabler-outline/layers-intersect" x="690" y="476" width="22" height="22" fill="#B4532A"/>
      <text x="724" y="493" font-size="18" fill="#1C1A17">在有限空间创造深度</text>
    </g>
    <g id="p4-principle-2">
      <use data-icon="tabler-outline/eye" x="690" y="512" width="22" height="22" fill="#B4532A"/>
      <text x="724" y="529" font-size="18" fill="#1C1A17">设计视线和步行体验</text>
    </g>
    <g id="p4-principle-3">
      <use data-icon="tabler-outline/droplet" x="690" y="548" width="22" height="22" fill="#B4532A"/>
      <text x="724" y="565" font-size="18" fill="#1C1A17">通过水和光传递时间</text>
    </g>
    <text x="1000" y="529" font-size="14" fill="#6F675E">不流于形式，而是<tspan x="1000" dy="22">作为设计的构建方式</tspan></text>
  </g>

  <g id="p4-quote" data-pptx-bounds="690 590 530 90">
    <rect x="690" y="590" width="4" height="72" fill="#B4532A"/>
    <text x="712" y="618" font-family="KaiTi" font-size="22" fill="#1C1A17">让建筑归于自然，让艺术治愈人心。</text>
    <text x="712" y="650" font-size="13" fill="#6F675E">东方美学与西方现代主义在上塘河畔的一次深度对话</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="1140 686 80 24">
    <text x="1220" y="702" text-anchor="end" font-family="Georgia" font-size="13" fill="#6F675E">04 / 13</text>
  </g>
</svg>
