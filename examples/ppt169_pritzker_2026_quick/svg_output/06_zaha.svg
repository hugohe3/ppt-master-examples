  <g id="p6-title" data-pptx-bounds="60 330 640 262">
    <use data-icon="tabler-outline/award" x="60" y="336" width="20" height="20" fill="#E8A47C"/>
    <text x="88" y="352" font-size="14" letter-spacing="1" fill="#F4F0E9" fill-opacity="0.85">扎哈·哈迪德事务所 · 2004年普利兹克奖得主 · 遗作</text>
    <text x="60" y="470" font-family="Georgia" font-size="120" font-weight="bold" fill="#F4F0E9" fill-opacity="0.14">03</text>
    <text x="60" y="440" font-size="56" font-weight="bold" fill="#F4F0E9">淡江大桥</text>
    <text x="60" y="486" font-family="KaiTi" font-size="26" fill="#E8A47C">跨越江河的流动态势</text>
    <text x="60" y="522" font-size="18" fill="#F4F0E9" fill-opacity="0.9">以流畅动感的曲线和极具张力的解构造型，颠覆传统桥梁的<tspan x="60" dy="28">刻板形态；历经多次方案调整与技术攻坚，最终以近乎100%</tspan><tspan x="60" dy="28">的还原度呈现。大师已逝，其突破边界的思想仍在延续。</tspan></text>
  </g>

