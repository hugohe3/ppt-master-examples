    <text x="700" y="410" font-family="KaiTi" font-size="24" fill="#B4532A">苏州河畔绽放的钢铁花瓣</text>
    <text x="470" y="458" font-size="18" fill="#3F3A34">不是传统意义上的白盒子，更像一座在城市中缓慢生长的生命体：外立面<tspan x="470" dy="29">模拟花朵扎根地面、向天空延展的轨迹，将“由内而外”的结构美学绽放为</tspan><tspan x="470" dy="29">舒展的花瓣立面，并最大限度引入自然采光与河畔景致。</tspan></text>
