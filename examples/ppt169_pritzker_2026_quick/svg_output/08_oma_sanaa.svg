  <g id="p8-body" data-pptx-bounds="400 506 500 176">
    <text x="400" y="530" font-size="17" fill="#3F3A34">OMA 的先锋解构思维与 SANAA 的轻盈通透美学碰撞交融，<tspan x="400" dy="28">为这座百年美术馆注入全新活力。新翼与主楼无缝衔接，</tspan><tspan x="400" dy="28">以通透立面、错落空间和开放布局打破内外壁垒，让城市</tspan><tspan x="400" dy="28">街景与艺术空间相互渗透；以年轻化、国际化的设计语言</tspan><tspan x="400" dy="28">适配当代艺术的多元表达——迭代更新，兼容并蓄。</tspan></text>
  </g>

