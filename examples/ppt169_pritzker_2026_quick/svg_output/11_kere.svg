<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <defs>
    <clipPath id="p11ClipCourt" clipPathUnits="userSpaceOnUse">
      <circle cx="170" cy="580" r="110"/>
    </clipPath>
  </defs>
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#EFE3D3"/>

  <g id="p11-photo-hero" data-pptx-bounds="0 0 640 440">
    <image href="../images/640_22.jpg" x="0" y="0" width="640" height="440" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="400" width="640" height="40" fill="#14120F" fill-opacity="0.5"/>
    <text x="16" y="425" font-size="13" fill="#F4F0E9">塞内加尔歌德学院，达喀尔（图源：Archdaily，摄影：Iwan Baan）</text>
  </g>

  <g id="p11-court" data-pptx-bounds="52 462 236 236">
    <circle cx="170" cy="580" r="118" fill="none" stroke="#B4532A" stroke-width="1.5"/>
    <image href="../images/640_23.jpg" x="60" y="470" width="220" height="220" preserveAspectRatio="xMidYMid slice" clip-path="url(#p11ClipCourt)"/>
  </g>

  <g id="p11-principles" data-pptx-bounds="310 470 330 220">
    <text x="310" y="490" font-size="15" font-weight="bold" fill="#1C1A17">顺应自然，而非与之对抗</text>
    <line x1="310" y1="502" x2="640" y2="502" stroke="#B4532A" stroke-width="1"/>
    <g id="p11-principle-1">
      <use data-icon="tabler-outline/leaf" x="310" y="516" width="22" height="22" fill="#B4532A"/>
      <text x="344" y="533" font-size="16" fill="#1C1A17">本土压制的土砖构筑主体结构</text>
    </g>
    <g id="p11-principle-2">
      <use data-icon="tabler-outline/wind" x="310" y="552" width="22" height="22" fill="#B4532A"/>
      <text x="344" y="569" font-size="16" fill="#1C1A17">自然通风，摆脱对传统空调的依赖</text>
    </g>
    <g id="p11-principle-3">
      <use data-icon="tabler-outline/tree" x="310" y="588" width="22" height="22" fill="#B4532A"/>
      <text x="344" y="605" font-size="16" fill="#1C1A17">一棵猴面包树置于核心院落，象征生命</text>
    </g>
    <g id="p11-principle-4">
      <use data-icon="tabler-outline/users" x="310" y="624" width="22" height="22" fill="#B4532A"/>
      <text x="344" y="641" font-size="16" fill="#1C1A17">开放包容，连接社区、服务民众</text>
    </g>
    <text x="310" y="678" font-size="12" fill="#6F675E">左：学院立面（摄影：Iwan Baan）</text>
  </g>

  <g id="p11-title" data-pptx-bounds="690 44 530 226">
    <use data-icon="tabler-outline/award" x="690" y="50" width="20" height="20" fill="#B4532A"/>
    <text x="718" y="66" font-size="14" letter-spacing="1" fill="#6F675E">迪埃贝多·弗朗西斯·凯雷 · 2022年普利兹克奖得主</text>
    <text x="690" y="176" font-family="Georgia" font-size="120" font-weight="bold" fill="#B4532A" fill-opacity="0.16">08</text>
    <text x="690" y="150" font-size="40" font-weight="bold" fill="#1C1A17">塞内加尔歌德学院</text>
    <text x="690" y="196" font-family="KaiTi" font-size="22" fill="#B4532A">夯土砖“屏风”，扎根乡土的温暖建筑</text>
    <g id="p11-chips">
      <rect x="690" y="226" width="110" height="30" rx="15" fill="none" stroke="#C9B9A3" stroke-width="1"/>
      <use data-icon="tabler-outline/map-pin" x="702" y="233" width="16" height="16" fill="#B4532A"/>
      <text x="724" y="246" font-size="14" fill="#3F3A34">达喀尔</text>
      <rect x="812" y="226" width="160" height="30" rx="15" fill="none" stroke="#C9B9A3" stroke-width="1"/>
      <use data-icon="tabler-outline/calendar-event" x="824" y="233" width="16" height="16" fill="#B4532A"/>
      <text x="846" y="246" font-size="14" fill="#3F3A34">2026年4月 开幕</text>
      <rect x="984" y="226" width="170" height="30" rx="15" fill="none" stroke="#C9B9A3" stroke-width="1"/>
      <use data-icon="tabler-outline/compass" x="996" y="233" width="16" height="16" fill="#B4532A"/>
      <text x="1018" y="246" font-size="14" fill="#3F3A34">出生于非洲的建筑师</text>
    </g>
  </g>

  <g id="p11-body" data-pptx-bounds="690 284 530 150">
    <text x="690" y="306" font-size="18" fill="#3F3A34">凯雷始终坚持以本土材料与可持续建造服务社区。这座<tspan x="690" dy="28">新作深深扎根非洲地域文化与自然环境，以当地原生材质</tspan><tspan x="690" dy="28">和适配本土气候的建筑结构，兼顾节能、通风与采光；</tspan><tspan x="690" dy="28">空间开放包容，既承担文化交流、教育传播与艺术展演</tspan><tspan x="690" dy="28">的功能，又以温润亲和的气质连接社区。</tspan></text>
  </g>

  <g id="p11-quote" data-pptx-bounds="690 452 530 110">
    <rect x="690" y="454" width="4" height="86" fill="#B4532A"/>
    <text x="712" y="480" font-family="KaiTi" font-size="21" fill="#1C1A17">顶级建筑从不是千篇一律的奢华，<tspan x="712" dy="30">而是扎根土地、温暖人心的人文坚守。</tspan></text>
    <text x="712" y="534" font-size="13" fill="#6F675E">在全球建筑日趋同质化的当下，凯雷再次证明</text>
  </g>

  <g id="p11-photo-interior" data-pptx-bounds="690 584 530 100">
    <image href="../images/640_24.jpg" x="690" y="584" width="150" height="100" preserveAspectRatio="xMidYMid slice"/>
    <text x="856" y="622" font-size="13" fill="#3F3A34">学院内部 · 温润亲和的空间气质</text>
    <text x="856" y="644" font-size="12" fill="#6F675E">图源：Archdaily，摄影：Iwan Baan</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="1140 686 80 24">
    <text x="1220" y="702" text-anchor="end" font-family="Georgia" font-size="13" fill="#6F675E">11 / 13</text>
  </g>
</svg>
