      <text x="84" y="203" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A2B4A">Theme<tspan font-weight="normal" fill="#22262B">　可复用的颜色、字体与效果</tspan></text>
      <line x1="40" y1="222" x2="788" y2="222" stroke="#E7E2D6" stroke-width="1"/>
