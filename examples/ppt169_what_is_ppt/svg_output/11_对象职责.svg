      <text x="84" y="255" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A2B4A">Slide Master<tspan font-weight="normal" fill="#22262B">　一组 Layout 共同继承的格式与对象</tspan></text>
      <line x1="40" y1="274" x2="788" y2="274" stroke="#E7E2D6" stroke-width="1"/>
  </g>
