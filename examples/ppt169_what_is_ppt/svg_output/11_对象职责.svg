  </g>

  <g id="assert-card" data-pptx-bounds="812 172 428 468">
    <rect x="812" y="178" width="428" height="462" fill="#1A2B4A"/>
    <rect x="812" y="178" width="428" height="6" fill="#C8102E"/>
    <text x="840" y="240" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">视觉正确</text>
    <text x="840" y="284" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#C8102E">≠ 结构良好</text>
    <line x1="840" y1="312" x2="1212" y2="312" stroke="#5E7089" stroke-width="1"/>
    <text x="840" y="352" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#F4F1EA">真正可用的 deck 还需要：</text>
    <text x="840" y="392" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#FFFFFF">· 合理的对象边界</text>
    <text x="840" y="424" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#FFFFFF">· 继承关系与可编辑性</text>
    <text x="840" y="456" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#FFFFFF">· 包关系</text>
    <text x="840" y="488" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#FFFFFF">· 演示行为</text>
    <line x1="840" y1="520" x2="1212" y2="520" stroke="#5E7089" stroke-width="1"/>
    <text x="840" y="560" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#F4F1EA">Microsoft 明确把 Slide</text>
    <text x="840" y="588" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#F4F1EA">Layout 置于 Slide Master</text>
    <text x="840" y="616" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#F4F1EA">之下。</text>
  </g>

  <g id="footer" data-pptx-bounds="40 674 1200 38">
