      <use data-icon="tabler-outline/layout" x="668" y="490" width="30" height="30" fill="#1A2B4A" stroke-width="2" />
      <text x="668" y="550" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A2B4A">Slide Layout</text>
      <text x="668" y="592" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">占位符与构图</text>
  </g>
  <g id="lay-preset" data-pptx-bounds="952 470 288 150">
