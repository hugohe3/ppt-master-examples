      <text x="364" y="592" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">共用格式与对象</text>
  </g>
  <g id="lay-layout" data-pptx-bounds="648 470 284 150">
