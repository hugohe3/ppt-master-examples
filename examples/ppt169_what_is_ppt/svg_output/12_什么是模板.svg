      <use data-icon="tabler-outline/file-text" x="972" y="490" width="30" height="30" fill="#C8102E" stroke-width="2" />
      <text x="972" y="550" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A2B4A">预置内容</text>
