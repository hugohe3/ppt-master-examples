    <text x="96" y="74" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="18" letter-spacing="2" fill="#5E7089">03 · 模板</text>
    <text x="40" y="128" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1A2B4A">模板存在，是因为某种东西预计会重复出现</text>
    <line x1="40" y1="152" x2="1240" y2="152" stroke="#1A2B4A" stroke-width="1.5" />
  </g>

  <g id="tvt-theme" data-pptx-bounds="40 168 580 116">
      <rect x="40" y="168" width="580" height="116" fill="#F4F1EA" stroke="#1A2B4A" stroke-width="1.2" />
      <text x="64" y="212" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1A2B4A">Theme 主题</text>
      <text x="64" y="254" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">提供协调的颜色、字体与效果。</text>
  </g>
  <g id="tvt-template" data-pptx-bounds="660 168 580 116">
      <rect x="660" y="168" width="580" height="116" fill="#1A2B4A" stroke="#1A2B4A" stroke-width="1.2" />
      <text x="684" y="212" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Template 模板</text>
      <text x="684" y="254" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#F4F1EA">在 Theme 之上，增加面向用途的内容与结构。</text>
  </g>

  <g id="quote" data-pptx-bounds="40 306 1200 100">
    <rect x="40" y="324" width="6" height="64" fill="#C8102E" />
    <text x="72" y="366" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1A2B4A">“模板之所以存在，是因为某种演示身份、结构或沟通场景预计会重复出现。”</text>
  </g>

  <g id="layers-intro" data-pptx-bounds="40 424 1200 40">
    <text x="40" y="452" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="18" fill="#5E7089">一个模板可组合多个可复用层次：</text>
  </g>
  <g id="lay-theme" data-pptx-bounds="40 470 284 150">
