<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header" data-pptx-bounds="40 48 1200 108">
    <rect x="40" y="60" width="42" height="4" fill="#C8102E"/>
    <text x="96" y="74" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="18" letter-spacing="2" fill="#5E7089">02 · 沟通任务</text>
    <text x="40" y="128" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="40" font-weight="bold" fill="#1A2B4A">一份演示，可能同时在完成九种任务</text>
    <line x1="40" y1="152" x2="1240" y2="152" stroke="#1A2B4A" stroke-width="1.5"/>
  </g>

  <g id="task-inform" data-pptx-bounds="40 168 386 140">
      <rect x="40" y="168" width="386" height="140" fill="#F4F1EA" stroke="#1A2B4A" stroke-width="1.2"/>
      <use data-icon="tabler-outline/info-circle" x="60" y="188" width="30" height="30" fill="#1A2B4A" stroke-width="2"/>
      <text x="102" y="212" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A2B4A">告知</text>
      <text x="60" y="256" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">受众知道此前</text>
      <text x="60" y="282" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">不知道的事实</text>
  </g>
  <g id="task-explain" data-pptx-bounds="446 168 386 140">
