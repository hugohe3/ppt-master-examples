      <use data-icon="tabler-outline/users-group" x="466" y="346" width="30" height="30" fill="#1A2B4A" stroke-width="2"/>
      <text x="508" y="370" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A2B4A">对齐</text>
      <text x="466" y="414" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">形成共同优先级、</text>
      <text x="466" y="440" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">语言和下一步</text>
  </g>
