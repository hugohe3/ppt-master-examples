      <use data-icon="tabler-outline/school" x="872" y="346" width="30" height="30" fill="#1A2B4A" stroke-width="2"/>
      <text x="914" y="370" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A2B4A">教学</text>
      <text x="872" y="414" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">能够理解、记忆</text>
      <text x="872" y="440" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">或执行某件事</text>
  </g>

  <g id="task-report" data-pptx-bounds="40 484 386 140">
      <rect x="40" y="484" width="386" height="140" fill="#F4F1EA" stroke="#1A2B4A" stroke-width="1.2"/>
      <use data-icon="tabler-outline/report" x="60" y="504" width="30" height="30" fill="#1A2B4A" stroke-width="2"/>
      <text x="102" y="528" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A2B4A">汇报与问责</text>
      <text x="60" y="572" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">评价进展、证据、</text>
      <text x="60" y="598" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">风险与责任</text>
  </g>
  <g id="task-mobilize" data-pptx-bounds="446 484 386 140">
      <rect x="446" y="484" width="386" height="140" fill="#F4F1EA" stroke="#1A2B4A" stroke-width="1.2"/>
      <use data-icon="tabler-outline/flag" x="466" y="504" width="30" height="30" fill="#1A2B4A" stroke-width="2"/>
      <text x="508" y="528" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A2B4A">动员</text>
      <text x="466" y="572" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">从意识到问题</text>
      <text x="466" y="598" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">转向采取行动</text>
  </g>
  <g id="task-record" data-pptx-bounds="852 484 388 140">
      <rect x="852" y="484" width="388" height="140" fill="#F4F1EA" stroke="#C8102E" stroke-width="1.5"/>
      <use data-icon="tabler-outline/archive" x="872" y="504" width="30" height="30" fill="#C8102E" stroke-width="2"/>
      <text x="914" y="528" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A2B4A">留档与交接</text>
      <text x="872" y="572" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">获得可审批、审计、</text>
      <text x="872" y="598" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">复用的正式成果</text>
  </g>

  <g id="footer" data-pptx-bounds="40 674 1200 38">
    <text x="40" y="696" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="16" fill="#5E7089">P05 / 17</text>
    <text x="1240" y="696" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="16" fill="#5E7089">要澄清的不是哪个标签胜出，而是它们的主次与顺序</text>
  </g>
