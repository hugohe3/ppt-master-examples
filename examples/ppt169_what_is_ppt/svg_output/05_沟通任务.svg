      <use data-icon="tabler-outline/bulb" x="466" y="188" width="30" height="30" fill="#1A2B4A" stroke-width="2"/>
      <text x="508" y="212" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A2B4A">解释</text>
      <text x="466" y="256" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">理解某种机制、</text>
      <text x="466" y="282" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">关系或原因</text>
  </g>
  <g id="task-persuade" data-pptx-bounds="852 168 388 140">
      <rect x="852" y="168" width="388" height="140" fill="#F4F1EA" stroke="#1A2B4A" stroke-width="1.2"/>
      <use data-icon="tabler-outline/speakerphone" x="872" y="188" width="30" height="30" fill="#1A2B4A" stroke-width="2"/>
      <text x="914" y="212" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A2B4A">说服</text>
      <text x="872" y="256" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">接受或认真考虑</text>
      <text x="872" y="282" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">某个立场</text>
  </g>

  <g id="task-decide" data-pptx-bounds="40 326 386 140">
      <rect x="40" y="326" width="386" height="140" fill="#FFFFFF" stroke="#1A2B4A" stroke-width="1.2"/>
      <use data-icon="tabler-outline/checkbox" x="60" y="346" width="30" height="30" fill="#1A2B4A" stroke-width="2"/>
      <text x="102" y="370" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A2B4A">决策</text>
      <text x="60" y="414" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">从多个选项走向</text>
      <text x="60" y="440" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">明确选择</text>
  </g>
  <g id="task-align" data-pptx-bounds="446 326 386 140">
