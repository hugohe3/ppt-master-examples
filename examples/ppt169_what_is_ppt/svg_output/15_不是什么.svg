  <g id="n3" data-pptx-bounds="500 278 740 44">
      <text x="500" y="304" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#C8102E">✕</text>
      <text x="538" y="304" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" fill="#22262B">演讲者将要说的话的逐字稿</text>
