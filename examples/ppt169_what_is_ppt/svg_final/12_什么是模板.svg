    <text x="72" y="366" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1A2B4A">“模板之所以存在，是因为某种演示身份、结构或沟通场景预计会重复出现。”</text>
