      <text x="64" y="254" font-family="&quot;Microsoft YaHei&quot;, Consolas, monospace" font-size="22" fill="#22262B">提供协调的颜色、字体与效果。</text>
  </g>
  <g id="tvt-template" data-pptx-bounds="660 168 580 116">
