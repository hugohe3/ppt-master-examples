    <rect x="608" y="300" width="230" height="96" fill="#FFFFFF" stroke="#1A2B4A" stroke-width="1.5"/>
    <text x="723" y="342" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A2B4A">共同的</text>
    <text x="723" y="372" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A2B4A">视觉体验</text>
