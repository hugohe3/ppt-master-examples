    <rect x="324" y="300" width="230" height="96" fill="#FFFFFF" stroke="#1A2B4A" stroke-width="1.5"/>
    <text x="439" y="342" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A2B4A">有顺序的论证</text>
