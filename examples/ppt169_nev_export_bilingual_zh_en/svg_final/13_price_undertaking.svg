  <g id="lead-claim" data-pptx-bounds="72 172 1136 72">
    <text x="72" y="204" font-size="22" fill="#1B2430">2026 年 1 月,欧盟发布《关于提交价格承诺申请的指导文件》,中国商务部同日通报。</text>
    <text x="72" y="234" font-family="Cambria" font-size="18" fill="#5C6673">In January 2026 the EU issued its guidance on price-undertaking applications; MOFCOM notified the same day.</text>
  </g>

  <g id="p13-mip-bar" data-pptx-bounds="72 282 1136 100">
    <rect x="72" y="296" width="1136" height="28" fill="#F57C00" />
    <text x="72" y="356" font-size="26" fill="#1B2430">最低进口价格机制(MIP)可替代 17%–35.3% 的反补贴税</text>
    <text x="1208" y="356" font-family="Cambria" font-size="18" fill="#5C6673" text-anchor="end">Minimum import price may replace the duties</text>
  </g>

  <g id="mip-replaces" data-pptx-bounds="72 400 368 210">
    <text x="72" y="428" font-size="22" font-weight="bold" fill="#0E3A66">替代对象</text>
    <text x="72" y="454" font-family="Cambria" font-size="18" fill="#2E7D8F">What it replaces</text>
    <text font-size="22" fill="#1B2430" x="72" y="500">17%–35.3% 反补贴税,</text><text font-size="22" fill="#1B2430" x="72" y="530">原综合税负最高 45.3%</text><text font-size="18" fill="#5C6673" font-family="Cambria" x="72" y="562">The 7.8%–35.3% duties, a burden</text><text font-size="18" fill="#5C6673" font-family="Cambria" x="72" y="586">of up to 45.3% with import duty</text></g>

  <g id="mip-pricing" data-pptx-bounds="460 400 368 210">
    <text x="460" y="428" font-size="22" font-weight="bold" fill="#0E3A66">定价依据</text>
    <text x="460" y="454" font-family="Cambria" font-size="18" fill="#2E7D8F">How the price is set</text>
    <text font-size="22" fill="#1B2430" x="460" y="500">调查期到岸价加反补贴</text><text font-size="22" fill="#1B2430" x="460" y="530">税额,并对标欧盟同类</text><text font-size="22" fill="#1B2430" x="460" y="560">非补贴纯电车售价</text><text font-size="18" fill="#5C6673" font-family="Cambria" x="460" y="570">CIF price plus the duty,</text><text font-size="18" fill="#5C6673" font-family="Cambria" x="460" y="594">benchmarked against EU cars</text></g>

  <g id="mip-condition" data-pptx-bounds="848 400 360 210">
    <text x="848" y="428" font-size="22" font-weight="bold" fill="#0E3A66">附加条件</text>
    <text x="848" y="454" font-family="Cambria" font-size="18" fill="#2E7D8F">The condition attached</text>
    <text font-size="22" fill="#1B2430" x="848" y="500">企业需承诺在欧建厂的</text><text font-size="22" fill="#1B2430" x="848" y="530">投资规模与时间表</text><text font-size="18" fill="#5C6673" font-family="Cambria" x="848" y="562">A committed European plant</text><text font-size="18" fill="#5C6673" font-family="Cambria" x="848" y="586">investment and timetable</text></g>

