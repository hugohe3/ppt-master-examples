  <g id="p12-combined-burden-bar" data-pptx-bounds="72 512 568 96">
    <text x="72" y="536" font-size="20" fill="#1B2430">叠加 10% 进口关税后,综合税负最高 <tspan font-weight="bold" fill="#C62828">45.3%</tspan></text>
