  <g id="lead-claim" data-pptx-bounds="72 172 1136 68">
    <text x="72" y="204" font-size="22" fill="#1B2430">欧盟按企业征收 7.8%–35.3% 反补贴税并叠加 10% 进口关税;美国统一提高到 100%。</text>
    <text x="72" y="232" font-family="Cambria" font-size="18" fill="#5C6673">EU: 7.8%–35.3% duties plus the 10% import duty. US: a flat 100%.</text>
  </g>

  <g id="eu-tariff-ladder" data-pptx-bounds="72 248 568 252">
    <text x="72" y="272" font-size="22" font-weight="bold" fill="#0E3A66">欧盟 · 分企业反补贴税率</text>
