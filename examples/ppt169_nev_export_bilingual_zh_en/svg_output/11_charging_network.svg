  <g id="build-out-reality" data-pptx-bounds="72 376 568 278">
    <text x="72" y="408" font-size="22" font-weight="bold" fill="#0E3A66">网络投入的两个现实</text>
    <text x="72" y="434" font-family="Cambria" font-size="18" fill="#2E7D8F">Two realities of network build-out</text>
    <text x="72" y="482" font-size="22" fill="#1B2430">充电难与维修难,需要售后服务中心、<tspan x="72" dy="30">零件仓库与充换电设施同时配套。</tspan></text>
    <text x="72" y="544" font-family="Cambria" font-size="18" fill="#5C6673">Charging and repair gaps need service centres,<tspan x="72" dy="24">parts warehouses and charging sites together.</tspan></text>
    <text x="72" y="600" font-size="22" fill="#1B2430">投入大、回报周期长;用地审批与<tspan x="72" dy="30">跨行业协作使进度常不及预期。</tspan></text>
    <text x="72" y="652" font-family="Cambria" font-size="18" fill="#5C6673">Heavy capex, slow payback, permits and partners.</text>
  </g>

