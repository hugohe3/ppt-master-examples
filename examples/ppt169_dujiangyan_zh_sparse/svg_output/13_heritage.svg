  <path id="page-grid" data-pptx-role="decoration" d="M160 0V720 M320 0V720 M480 0V720 M640 0V720 M800 0V720 M960 0V720 M1120 0V720 M0 120H1280 M0 240H1280 M0 360H1280 M0 480H1280 M0 600H1280" fill="none" stroke="#17304A" stroke-width="1"/>

  <g id="page-title" data-pptx-bounds="68 66 620 62">
    <text x="72" y="108" font-family="SimHei, Consolas, sans-serif" font-size="42" font-weight="bold" fill="#EAF3FB">两块牌子：2000 与 2018</text>
  </g>

  <g id="page-lead" data-pptx-bounds="68 140 1088 42">
    <text x="72" y="168" font-size="30" fill="#7FD1C3">一块认的是它的历史价值，另一块认的是它今天仍在灌溉。</text>
  </g>

  <g id="heritage-2000" data-pptx-bounds="72 196 556 356">
    <g id="p13-plate-2000" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="plaque" data-pptx-frame="72 200 556 340" fill="#11263D" stroke="#4A90C2" stroke-width="2">
<path d="M 72 256.67 A 56.67 56.67 0 0 0 128.67 200 L 571.33 200 A 56.67 56.67 0 0 0 628 256.67 L 628 483.33 A 56.67 56.67 0 0 0 571.33 540 L 128.67 540 A 56.67 56.67 0 0 0 72 483.33 Z"/>
</g>
    <use data-icon="tabler-outline/award" x="136" y="250" width="32" height="32" fill="#4A90C2" stroke-width="2"/>
    <text x="136" y="356" font-family="SimHei, Consolas, sans-serif" font-size="72" font-weight="bold" fill="#4A90C2">2000</text>
    <text x="136" y="398" font-family="SimHei, Consolas, sans-serif" font-size="32" fill="#EAF3FB">世界文化遗产</text>
    <text x="136" y="440" font-size="24" fill="#D6E4F0">青城山—都江堰列入联合国教科文组织<tspan x="136" dy="34">《世界遗产名录》，编号 1001。</tspan></text>
    <text x="136" y="512" font-size="18" fill="#93AEC8">标准 (ii)：水管理与技术发展史上的重大<tspan x="136" dy="28">里程碑，至今仍在完美履行其功能。</tspan></text>
  </g>

  <g id="heritage-2018" data-pptx-bounds="652 196 556 356">
    <g id="p13-plate-2018" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="plaque" data-pptx-frame="652 200 556 340" fill="#11263D" stroke="#E8A33D" stroke-width="2">
<path d="M 652 256.67 A 56.67 56.67 0 0 0 708.67 200 L 1151.33 200 A 56.67 56.67 0 0 0 1208 256.67 L 1208 483.33 A 56.67 56.67 0 0 0 1151.33 540 L 708.67 540 A 56.67 56.67 0 0 0 652 483.33 Z"/>
</g>
    <use data-icon="tabler-outline/award" x="716" y="250" width="32" height="32" fill="#E8A33D" stroke-width="2"/>
    <text x="716" y="356" font-family="SimHei, Consolas, sans-serif" font-size="72" font-weight="bold" fill="#E8A33D">2018</text>
    <text x="716" y="398" font-family="SimHei, Consolas, sans-serif" font-size="32" fill="#EAF3FB">世界灌溉工程遗产</text>
    <text x="716" y="440" font-size="24" fill="#D6E4F0">国际灌溉排水委员会第 69 届理事会<tspan x="716" dy="34">通过 2018 年度评选，正式列入名录。</tspan></text>
    <text x="716" y="512" font-size="18" fill="#93AEC8">加拿大时间 2018 年 8 月 13 日晚，<tspan x="716" dy="28">于加拿大萨斯卡通召开的理事会上通过。</tspan></text>
  </g>

  <g id="three-heritage-note" data-pptx-bounds="72 558 1136 70">
    <text x="72" y="582" font-size="24" fill="#D6E4F0">连同 2006 年入选的世界自然遗产"四川大熊猫栖息地"重要组成部分，<tspan x="72" dy="34">都江堰成为全球为数不多同时拥有 3 个世界遗产的城市。</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="72 634 1136 42">
