<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Consolas, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="maximScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1B2E" stop-opacity="0.94"/>
      <stop offset="55%" stop-color="#0B1B2E" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0B1B2E" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="maximFoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B2E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B1B2E" stop-opacity="0.82"/>
    </linearGradient>
  </defs>
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1B2E"/>
  <image id="maxim-photo" data-pptx-role="background" href="../images/dujiangyan_channel_scene.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect id="maxim-scrim" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#maximScrim)"/>
  <rect id="maxim-foot-fade" data-pptx-role="decoration" x="0" y="500" width="1280" height="220" fill="url(#maximFoot)"/>

  <g id="page-title" data-pptx-bounds="68 66 600 62">
    <text x="72" y="108" font-family="SimHei, Consolas, sans-serif" font-size="42" font-weight="bold" fill="#EAF3FB">六个字，管了两千年</text>
  </g>

  <g id="quote-maxim" data-pptx-bounds="112 262 620 178" font-family="SimHei, Consolas, sans-serif">
    <text x="120" y="330" font-size="72" font-weight="bold" fill="#E8A33D">深淘滩，低作堰</text>
    <text x="124" y="412" font-size="56" fill="#EAF3FB">逢正抽心，遇弯截角</text>
  </g>

  <g id="maxim-reading" data-pptx-bounds="112 476 600 76">
    <text x="120" y="500" font-size="24" fill="#D6E4F0">滩要淘到规定深度，堰不能筑高——<tspan x="120" dy="38">高了就挡住洪水与泥沙的出路。</tspan></text>
  </g>

  <g id="image-credit" data-pptx-bounds="800 578 408 40">
    <text x="1208" y="600" font-size="16" fill="#93AEC8" text-anchor="end">《都江堰鱼嘴》星星 / Openverse / CC BY-SA 4.0</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="72 634 1136 42">
    <line x1="72" y1="640" x2="1208" y2="640" stroke="#1E3A57" stroke-width="1"/>
    <text x="72" y="668" font-size="16" fill="#93AEC8">两句口诀作为遗迹保存至今，"深淘滩，低作堰"镶嵌于二王庙石壁。来源：水利文明网（2022-09-03）</text>
    <text x="1208" y="668" font-size="16" fill="#93AEC8" text-anchor="end">09 / 14</text>
  </g>
</svg>
