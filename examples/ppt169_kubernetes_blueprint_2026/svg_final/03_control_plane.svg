      <text x="700" y="581" font-family="Consolas" font-size="16" font-weight="bold" fill="#C7D2E3">cloud-controller-manager <tspan font-size="12" font-weight="normal" fill="#8FA0B8">可选</tspan></text>
      <text fill="#C7D2E3" font-size="14" x="700" y="604">仅云托管集群有；封装厂商逻辑，让核心二进制保持厂商中立。</text><text fill="#C7D2E3" font-size="14" x="700" y="626">子控制器：Node / Route / Service（云负载均衡）。</text></g>
