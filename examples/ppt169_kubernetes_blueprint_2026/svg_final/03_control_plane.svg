      <text x="700" y="381" font-family="Consolas" font-size="16" font-weight="bold" fill="#38BDF8">kube-scheduler</text>
      <text fill="#C7D2E3" font-size="14" x="700" y="404">监听还没有 nodeName 的 Pod，为它挑一个节点。</text><text fill="#C7D2E3" font-size="14" x="700" y="426">只把绑定决定写回 API server，从不直接和节点对话。</text></g>
