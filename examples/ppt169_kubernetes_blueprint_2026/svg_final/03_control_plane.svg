      <text x="700" y="181" font-family="Consolas" font-size="16" font-weight="bold" fill="#38BDF8">kube-apiserver</text>
      <text fill="#C7D2E3" font-size="14" x="700" y="204">集群前端，暴露 Kubernetes HTTP API；校验、准入后再持久化。</text><text fill="#C7D2E3" font-size="14" x="700" y="226">唯一直接读写 etcd 的组件；可水平扩展（多实例 + 负载均衡）。</text></g>
