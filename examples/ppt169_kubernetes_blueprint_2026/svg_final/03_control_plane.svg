  </g>
      <text x="700" y="281" font-family="Consolas" font-size="16" font-weight="bold" fill="#A78BFA">etcd</text>
      <text fill="#C7D2E3" font-size="14" x="700" y="304">分布式、一致、高可用的 KV 存储，保存全部集群状态。</text><text fill="#C7D2E3" font-size="14" x="700" y="326">Raft 共识，奇数成员（3 或 5）；丢 etcd 即丢集群，备份是命脉。</text></g>
