      <text x="700" y="481" font-family="Consolas" font-size="16" font-weight="bold" fill="#38BDF8">kube-controller-manager</text>
      <text fill="#C7D2E3" font-size="14" x="700" y="504">一个二进制、多个逻辑控制器，各自跑 watch → diff → act 循环。</text><text fill="#C7D2E3" font-size="14" x="700" y="526">Leader 选举保证高可用：同一时刻只有一个副本活跃。</text></g>
