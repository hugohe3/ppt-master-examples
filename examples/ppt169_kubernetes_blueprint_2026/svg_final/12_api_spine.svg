  <g id="p12-statement" data-pptx-bounds="60 612 1160 70">
    <line x1="60" y1="612" x2="1220" y2="612" stroke="#243350" stroke-width="1"/>
    <text x="60" y="642" font-size="17" fill="#E6EDF7">没有任何组件直接对话另一个组件——一切经由 API server；也只有 API server 对话 etcd。</text>
    <text x="60" y="668" font-size="15" fill="#8FA0B8">于是每一次状态变化都是一个 API 事件：这正是 Kubernetes 可插拔、可观测的根源。</text>
