<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <defs>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220"/>
  <path id="page-grid" data-pptx-role="decoration" d="M80 0V720 M160 0V720 M240 0V720 M320 0V720 M400 0V720 M480 0V720 M560 0V720 M640 0V720 M720 0V720 M800 0V720 M880 0V720 M960 0V720 M1040 0V720 M1120 0V720 M1200 0V720 M0 80H1280 M0 160H1280 M0 240H1280 M0 320H1280 M0 400H1280 M0 480H1280 M0 560H1280 M0 640H1280" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>

  <g id="page-header" data-pptx-role="header" data-pptx-bounds="60 40 1160 26" font-family="Consolas" font-size="12" fill="#8FA0B8">
    <text x="60" y="58" letter-spacing="3">01 · TOPOLOGY OVERVIEW</text>
    <text x="1220" y="58" text-anchor="end" letter-spacing="2">02 / 13</text>
  </g>

  <g id="p2-title" data-pptx-bounds="60 84 1160 80">
    <text x="60" y="122" font-size="36" font-weight="bold" fill="#E6EDF7">两个平面，一条脊柱</text>
    <text x="60" y="154" font-size="17" fill="#8FA0B8">一个 Kubernetes 集群是两平面系统；所有组件都只通过 kube-apiserver 交流，这是整座架构的脊柱。</text>
  </g>

  <g id="p2-control-plane" data-pptx-bounds="60 190 480 290">
    <rect x="60" y="190" width="480" height="290" fill="#111C30" stroke="#243350" stroke-width="1"/>
    <rect x="60" y="190" width="6" height="290" fill="#A78BFA"/>
    <use data-icon="phosphor-duotone/cpu" x="90" y="214" width="36" height="36" fill="#A78BFA"/>
    <text x="140" y="232" font-size="22" font-weight="bold" fill="#E6EDF7">控制平面</text>
    <text x="140" y="254" font-family="Consolas" font-size="12" letter-spacing="2" fill="#A78BFA">CONTROL PLANE</text>
    <text x="90" y="296" font-size="17" fill="#C7D2E3">全局决策者。</text>
    <text x="90" y="330" font-size="16" fill="#C7D2E3">• 调度工作负载到节点<tspan x="90" dy="28">• 响应集群事件</tspan><tspan x="90" dy="28">• 保存每个 API 对象的期望状态</tspan></text>
    <text x="90" y="448" font-size="13" fill="#8FA0B8">最小集群：1 台控制平面主机 + 1 个工作节点</text>
  </g>

  <g id="p2-spine" data-pptx-bounds="548 190 184 290">
    <rect x="600" y="190" width="80" height="290" rx="6" fill="#0F2A44" stroke="#38BDF8" stroke-width="1.5" filter="url(#glowCyan)"/>
    <text x="640" y="238" text-anchor="middle" font-family="Consolas" font-size="13" font-weight="bold" fill="#38BDF8">kube-</text>
    <text x="640" y="256" text-anchor="middle" font-family="Consolas" font-size="13" font-weight="bold" fill="#38BDF8">apiserver</text>
    <line x1="612" y1="272" x2="668" y2="272" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="640" y="296" text-anchor="middle" font-size="12" fill="#C7D2E3">唯一直接</text>
    <text x="640" y="314" text-anchor="middle" font-size="12" fill="#C7D2E3">读写 etcd</text>
    <g id="p2-exchange" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="leftRightArrow" data-pptx-frame="548 330 184 56" fill="#38BDF8" stroke="#38BDF8" fill-opacity="0.18" stroke-width="1.5">
<path d="M 548 358 L 576 330 L 576 344 L 704 344 L 704 330 L 732 358 L 704 386 L 704 372 L 576 372 L 576 386 Z"/>
</g>
    <text x="640" y="412" text-anchor="middle" font-size="12" fill="#C7D2E3">所有状态</text>
    <text x="640" y="430" text-anchor="middle" font-size="12" fill="#C7D2E3">读写经此</text>
    <text x="640" y="462" text-anchor="middle" font-family="Consolas" font-size="11" letter-spacing="2" fill="#38BDF8">SPINE</text>
  </g>

  <g id="p2-data-plane" data-pptx-bounds="740 190 480 290">
    <rect x="740" y="190" width="480" height="290" fill="#111C30" stroke="#243350" stroke-width="1"/>
    <rect x="1214" y="190" width="6" height="290" fill="#38BDF8"/>
    <use data-icon="phosphor-duotone/hard-drives" x="770" y="214" width="36" height="36" fill="#38BDF8"/>
    <text x="820" y="232" font-size="22" font-weight="bold" fill="#E6EDF7">数据平面</text>
    <text x="820" y="254" font-family="Consolas" font-size="12" letter-spacing="2" fill="#38BDF8">DATA PLANE · WORKER NODES</text>
    <text x="770" y="296" font-size="17" fill="#C7D2E3">真正运行应用 Pod 的地方。</text>
    <text x="770" y="330" font-size="16" fill="#C7D2E3">• 一个或多个工作节点<tspan x="770" dy="28">• 每个节点：kubelet + 容器运行时 + kube-proxy</tspan><tspan x="770" dy="28">• 节点池规模按工作负载确定</tspan></text>
    <text x="770" y="448" font-size="13" fill="#8FA0B8">生产：控制平面与 etcd 跨 ≥3 台主机、跨可用区分布</text>
  </g>

  <g id="p2-stats" data-pptx-bounds="60 510 1160 150">
    <line x1="60" y1="510" x2="1220" y2="510" stroke="#243350" stroke-width="1"/>
    <g id="p2-stat-1">
      <text x="60" y="576" font-family="Consolas" font-size="44" font-weight="bold" fill="#E6EDF7">≥3</text>
      <text x="140" y="560" font-size="16" font-weight="bold" fill="#E6EDF7">台控制平面主机</text>
      <text x="140" y="584" font-size="13" fill="#8FA0B8">生产环境；kube-apiserver 置于负载均衡之后</text>
    </g>
    <line x1="440" y1="536" x2="440" y2="600" stroke="#243350" stroke-width="1"/>
    <g id="p2-stat-2">
      <text x="470" y="576" font-family="Consolas" font-size="44" font-weight="bold" fill="#E6EDF7">3/5</text>
      <text x="560" y="560" font-size="16" font-weight="bold" fill="#E6EDF7">个 etcd 成员（奇数）</text>
      <text x="560" y="584" font-size="13" fill="#8FA0B8">Raft 共识需要奇数成员形成法定人数</text>
    </g>
    <line x1="840" y1="536" x2="840" y2="600" stroke="#243350" stroke-width="1"/>
    <g id="p2-stat-3">
      <text x="870" y="576" font-family="Consolas" font-size="44" font-weight="bold" fill="#38BDF8">1</text>
      <text x="910" y="560" font-size="16" font-weight="bold" fill="#E6EDF7">个组件直接对话 etcd</text>
      <text x="910" y="584" font-size="13" fill="#8FA0B8">其余组件都经由 API server 读写状态</text>
    </g>
    <text x="60" y="640" font-size="14" fill="#8FA0B8">接下来：先拆控制平面的五个组件，再看每个工作节点上的三个组件。</text>
  </g>
</svg>
