  <g id="header" data-pptx-bounds="80 36 1120 84">
    <text x="82" y="58" font-family="Consolas" font-size="14" fill="#F5A623" letter-spacing="2">§ 04 · ABLATIONS &amp; GENERALIZATION</text>
    <text x="80" y="104" font-size="38" font-weight="bold" fill="#E8F1FA">What the ablations taught (Table 3)</text>
  </g>

  <g id="ablation-heads" data-pptx-bounds="80 156 660 74">
      <use data-icon="tabler-outline/git-branch" x="90" y="168" width="32" height="32" fill="#9CC3E6"/>
      <text x="140" y="178" font-family="Consolas" font-size="13" fill="#F5A623" letter-spacing="2">HEADS · h</text>
      <text x="140" y="204" font-size="18" fill="#E8F1FA">A single head is 0.9 BLEU worse than the best setting</text>
      <line x1="140" y1="222" x2="720" y2="222" stroke="#3C5A80" stroke-width="1"/>
  </g>
  <g id="ablation-dk" data-pptx-bounds="80 240 660 74">
