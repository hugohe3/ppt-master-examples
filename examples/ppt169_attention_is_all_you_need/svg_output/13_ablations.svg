    <text x="814" y="440" font-size="17" fill="#C9DBEA">A 4-layer Transformer trained on WSJ<tspan x="814" dy="26">alone reaches 91.3 F1; with semi-</tspan><tspan x="814" dy="26">supervised data it reaches 92.7.</tspan><tspan x="814" dy="26">The abstract's claim holds: the</tspan><tspan x="814" dy="26">architecture generalizes beyond</tspan><tspan x="814" dy="26">translation, large data or small.</tspan></text>
