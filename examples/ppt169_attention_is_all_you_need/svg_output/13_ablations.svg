      <text x="140" y="262" font-family="Consolas" font-size="13" fill="#F5A623" letter-spacing="2">KEY SIZE · d_k</text>
      <text x="140" y="288" font-size="18" fill="#E8F1FA">Smaller d_k hurts — compatibility is not trivial to compute</text>
      <line x1="140" y1="306" x2="720" y2="306" stroke="#3C5A80" stroke-width="1"/>
  </g>
  <g id="ablation-size" data-pptx-bounds="80 324 660 74">
      <use data-icon="tabler-outline/stack-2" x="90" y="336" width="32" height="32" fill="#9CC3E6"/>
      <text x="140" y="346" font-family="Consolas" font-size="13" fill="#F5A623" letter-spacing="2">MODEL SIZE</text>
      <text x="140" y="372" font-size="18" fill="#E8F1FA">Bigger is better; the big model wins on both tasks</text>
      <line x1="140" y1="390" x2="720" y2="390" stroke="#3C5A80" stroke-width="1"/>
  </g>
  <g id="ablation-dropout" data-pptx-bounds="80 408 660 74">
