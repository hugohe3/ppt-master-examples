      <text x="140" y="456" font-size="18" fill="#E8F1FA">Dropout is very helpful in avoiding over-fitting</text>
      <line x1="140" y1="474" x2="720" y2="474" stroke="#3C5A80" stroke-width="1"/>
  </g>
  <g id="ablation-positions" data-pptx-bounds="80 492 660 66">
