<g id="colophon-text" data-pptx-bounds="564 190 458 475">
<text x="1000" y="228" font-family="KaiTi, Times New Roman" font-size="34" fill="#1F2422" text-anchor="middle"><tspan x="1000" dy="0">政</tspan><tspan x="1000" dy="40">和</tspan><tspan x="1000" dy="40">三</tspan><tspan x="1000" dy="40">年</tspan><tspan x="1000" dy="40">闰</tspan><tspan x="1000" dy="40">四</tspan><tspan x="1000" dy="40">月</tspan><tspan x="1000" dy="40">一</tspan><tspan x="1000" dy="40">日</tspan><tspan x="1000" dy="40">赐</tspan><tspan x="1000" dy="40">。</tspan></text>
<text x="948" y="228" font-family="KaiTi, Times New Roman" font-size="34" fill="#1F2422" text-anchor="middle"><tspan x="948" dy="0">希</tspan><tspan x="948" dy="40">孟</tspan><tspan x="948" dy="40">年</tspan><tspan x="948" dy="40">十</tspan><tspan x="948" dy="40">八</tspan><tspan x="948" dy="40">岁</tspan><tspan x="948" dy="40">，</tspan><tspan x="948" dy="40">昔</tspan><tspan x="948" dy="40">在</tspan><tspan x="948" dy="40">画</tspan><tspan x="948" dy="40">学</tspan></text>
<text x="896" y="228" font-family="KaiTi, Times New Roman" font-size="34" fill="#1F2422" text-anchor="middle"><tspan x="896" dy="0">为</tspan><tspan x="896" dy="40">生</tspan><tspan x="896" dy="40">徒</tspan><tspan x="896" dy="40">，</tspan><tspan x="896" dy="40">召</tspan><tspan x="896" dy="40">入</tspan><tspan x="896" dy="40">禁</tspan><tspan x="896" dy="40">中</tspan><tspan x="896" dy="40">文</tspan><tspan x="896" dy="40">书</tspan><tspan x="896" dy="40">库</tspan></text>
<text x="844" y="228" font-family="KaiTi, Times New Roman" font-size="34" fill="#1F2422" text-anchor="middle"><tspan x="844" dy="0">，</tspan><tspan x="844" dy="40">数</tspan><tspan x="844" dy="40">以</tspan><tspan x="844" dy="40">画</tspan><tspan x="844" dy="40">献</tspan><tspan x="844" dy="40">，</tspan><tspan x="844" dy="40">未</tspan><tspan x="844" dy="40">甚</tspan><tspan x="844" dy="40">工</tspan><tspan x="844" dy="40">。</tspan><tspan x="844" dy="40">上</tspan></text>
<text x="792" y="228" font-family="KaiTi, Times New Roman" font-size="34" fill="#1F2422" text-anchor="middle"><tspan x="792" dy="0">知</tspan><tspan x="792" dy="40">其</tspan><tspan x="792" dy="40">性</tspan><tspan x="792" dy="40">可</tspan><tspan x="792" dy="40">教</tspan><tspan x="792" dy="40">，</tspan><tspan x="792" dy="40">遂</tspan><tspan x="792" dy="40">诲</tspan><tspan x="792" dy="40">谕</tspan><tspan x="792" dy="40">之</tspan><tspan x="792" dy="40">，</tspan></text>
<text x="740" y="228" font-family="KaiTi, Times New Roman" font-size="34" fill="#1F2422" text-anchor="middle"><tspan x="740" dy="0">亲</tspan><tspan x="740" dy="40">授</tspan><tspan x="740" dy="40">其</tspan><tspan x="740" dy="40">法</tspan><tspan x="740" dy="40">，</tspan><tspan x="740" dy="40">不</tspan><tspan x="740" dy="40">逾</tspan><tspan x="740" dy="40">半</tspan><tspan x="740" dy="40">岁</tspan><tspan x="740" dy="40">，</tspan><tspan x="740" dy="40">乃</tspan></text>
<text x="688" y="228" font-family="KaiTi, Times New Roman" font-size="34" fill="#1F2422" text-anchor="middle"><tspan x="688" dy="0">以</tspan><tspan x="688" dy="40">此</tspan><tspan x="688" dy="40">图</tspan><tspan x="688" dy="40">进</tspan><tspan x="688" dy="40">。</tspan><tspan x="688" dy="40">上</tspan><tspan x="688" dy="40">嘉</tspan><tspan x="688" dy="40">之</tspan><tspan x="688" dy="40">，</tspan><tspan x="688" dy="40">因</tspan><tspan x="688" dy="40">以</tspan></text>
<text x="636" y="228" font-family="KaiTi, Times New Roman" font-size="34" fill="#1F2422" text-anchor="middle"><tspan x="636" dy="0">赐</tspan><tspan x="636" dy="40">臣</tspan><tspan x="636" dy="40">京</tspan><tspan x="636" dy="40">，</tspan><tspan x="636" dy="40">谓</tspan><tspan x="636" dy="40">天</tspan><tspan x="636" dy="40">下</tspan><tspan x="636" dy="40">士</tspan><tspan x="636" dy="40">在</tspan><tspan x="636" dy="40">作</tspan><tspan x="636" dy="40">之</tspan></text>
<text x="584" y="228" font-family="KaiTi, Times New Roman" font-size="34" fill="#1F2422" text-anchor="middle"><tspan x="584" dy="0">而</tspan><tspan x="584" dy="40">已</tspan><tspan x="584" dy="40">。</tspan></text>
</g>
