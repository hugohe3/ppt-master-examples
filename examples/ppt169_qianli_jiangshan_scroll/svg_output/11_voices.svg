<text x="255.4" y="412" font-size="16" fill="#6E675B"><tspan x="255.4" dy="0">溥光题跋</tspan><tspan x="255.4" dy="22">真迹局部</tspan></text>
</g>
<g id="quote-qianlong" data-pptx-bounds="684 170 524 380">
<text x="690" y="236" font-family="KaiTi, Times New Roman" font-size="72" fill="#D8CDB2">“</text>
<text x="714" y="262" font-family="KaiTi, Times New Roman" font-size="34" fill="#1F2422">江山千里望无垠</text>
<text x="714" y="306" font-size="20" fill="#6E675B">—— 清 · 乾隆 题诗首句，画名由此而来</text>
