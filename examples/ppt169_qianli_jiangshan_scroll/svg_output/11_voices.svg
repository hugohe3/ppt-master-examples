<g id="quote-puguang" data-pptx-bounds="66 170 530 392">
<text x="72" y="236" font-family="KaiTi, Times New Roman" font-size="72" fill="#D8CDB2">“</text>
<text x="96" y="262" font-family="KaiTi, Times New Roman" font-size="34" fill="#1F2422"><tspan x="96" dy="0">在古今丹青小景中，自可独</tspan><tspan x="96" dy="48">步千载，殆众星之孤月耳。</tspan></text>
<text x="96" y="354" font-size="20" fill="#6E675B">—— 元 · 溥光 题跋</text>
<svg id="puguang-crop" x="96" y="382" width="143.4" height="170" viewBox="0 0 0.18130539887187752 1" preserveAspectRatio="none" overflow="hidden"><image href="../images/scroll_end.jpg" x="0" y="0" width="1" height="1" preserveAspectRatio="none"/></svg>
