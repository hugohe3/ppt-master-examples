<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="content">
  <defs>
    <filter id="paperLift" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#05070F" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#131A33"/>
  <image id="p04-sprig" data-pptx-role="decoration" href="../images/osmanthus_sprig.png" x="1092" y="56" width="140" height="145" preserveAspectRatio="xMidYMid meet"/>
  <image id="p04-reflection" data-pptx-role="decoration" href="../images/moon_reflection.png" x="906" y="372" width="260" height="260" preserveAspectRatio="xMidYMid meet"/>

  <g id="p04-header" data-pptx-bounds="72 74 1000 100">
    <text x="72" y="112" font-family="KaiTi, Georgia, serif" font-size="42" fill="#F2ECE0">先有「中秋夜迎寒」，一千年后才有赏月的诗</text>
    <text x="72" y="158" font-size="28" fill="#B9C2D8">唐代把神话接进月亮，赏月才从祭仪变成风尚</text>
  </g>

  <g id="p04-stages" data-pptx-bounds="72 206 700 128">
    <g id="p04-stage-zhou" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="72 210 340 120" fill="#26305A" stroke="none">
<path d="M 72 210 L 352 210 L 412 270 L 352 330 L 72 330 Z"/>
</g>
    <g id="p04-stage-tang" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="400 210 340 120" fill="#E8B04B" stroke="none" filter="url(#paperLift)">
<path d="M 400 210 L 680 210 L 740 270 L 680 330 L 400 330 L 460 270 Z"/>
</g>
    <text x="104" y="252" font-size="24" font-weight="bold" fill="#E8B04B">周代 · 礼</text>
    <text x="104" y="288" font-size="20" fill="#F2ECE0">中秋夜迎寒 · 中秋献良裘<tspan x="104" dy="30">秋分夕月（拜月）</tspan></text>
    <text x="486" y="252" font-size="24" font-weight="bold" fill="#131A33">唐代 · 诗</text>
    <text x="486" y="288" font-size="20" fill="#26305A">神话入月，赏月大兴<tspan x="486" dy="30">从祭仪走向风尚</tspan></text>
  </g>

  <g id="p04-evidence" data-pptx-bounds="72 388 760 198">
    <text x="72" y="470" font-family="Georgia, serif" font-size="88" font-weight="bold" fill="#E8B04B">111</text>
    <text x="238" y="432" font-size="18" fill="#7FA8C9">写八月十五赏月的唐诗</text>
    <text x="238" y="470" font-size="30" fill="#F2ECE0">首</text>
    <text x="72" y="532" font-size="24" fill="#F2ECE0">四万余首《全唐诗》中，写八月十五赏月者共 <tspan font-weight="bold" fill="#E8B04B">111</tspan> 首，<tspan x="72" dy="38">出自 <tspan font-weight="bold" fill="#E8B04B">65</tspan> 位诗人之手——赏月已是文人阶层的普遍习惯。</tspan></text>
  </g>

  <g id="p04-scenes" data-pptx-bounds="72 594 1136 44">
    <text x="72" y="616" font-size="18" fill="#B9C2D8">唐人赏月的去处：寺院与观星台 · 泛舟水滨 · 登山望月 · 值宿宫禁 · 置酒赋诗联句 · 借月思远人</text>
  </g>
</svg>
