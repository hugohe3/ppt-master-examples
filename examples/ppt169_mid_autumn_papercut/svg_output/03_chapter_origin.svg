      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#05070F" flood-opacity="0.20"/>
    </filter>
    <linearGradient id="chapterField" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#1E2748" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#131A33" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#131A33"/>
  <rect id="p03-field" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#chapterField)"/>
  <g id="p03-moon" data-pptx-bounds="940 136 208 209">
    <image href="../images/moon_gibbous.png" x="944" y="140" width="200" height="201" preserveAspectRatio="xMidYMid meet" filter="url(#paperLift)"/>
  </g>
  <image id="p03-cloud" data-pptx-role="decoration" href="../images/cloud_band.png" x="756" y="296" width="420" height="178" preserveAspectRatio="xMidYMid meet"/>

  <g id="p03-mark" data-pptx-bounds="140 204 284 212">
