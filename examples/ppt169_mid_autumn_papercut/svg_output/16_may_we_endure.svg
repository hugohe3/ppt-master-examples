<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="ending">
  <defs>
    <filter id="paperLift" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#05070F" flood-opacity="0.20"/>
    </filter>
    <linearGradient id="p16Scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0C1026" stop-opacity="0.86"/>
      <stop offset="58%" stop-color="#0C1026" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0C1026" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="p16Halo" cx="0.5" cy="0.5" r="0.5" fx="0.5" fy="0.5">
      <stop offset="0%" stop-color="#E8B04B" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#E8B04B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#131A33"/>
  <image id="p16-field" data-pptx-role="decoration" href="../images/cover_night_field_dawn.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid meet"/>
  <rect id="p16-scrim" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#p16Scrim)"/>
  <circle id="p16-halo" data-pptx-role="decoration" cx="1000" cy="282" r="250" fill="url(#p16Halo)"/>
  <g id="p16-moon" data-pptx-bounds="826 106 348 351">
    <image href="../images/moon_full.png" x="830" y="110" width="340" height="343" preserveAspectRatio="xMidYMid meet" filter="url(#paperLift)"/>
  </g>

  <g id="p16-preface" data-pptx-bounds="72 160 700 42">
    <text x="72" y="182" font-size="18" fill="#7FA8C9">丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。</text>
  </g>

  <g id="p16-quote" data-pptx-bounds="72 214 700 106">
    <text x="72" y="252" font-family="KaiTi, Georgia, serif" font-size="34" fill="#F2ECE0">但愿人长久，<tspan x="72" dy="52">千里共婵娟。</tspan></text>
  </g>

  <g id="p16-context" data-pptx-bounds="72 352 700 84">
    <text x="72" y="382" font-size="24" fill="#B9C2D8">1076 年（熙宁九年）中秋，苏轼在密州任太守；<tspan x="72" dy="38">作此词时，他与胞弟苏辙分别已七年。</tspan></text>
  </g>

  <g id="p16-takeaway" data-pptx-bounds="72 458 700 92">
    <text x="72" y="492" font-size="28" fill="#E8B04B">这条线的末端是今晚：同一轮月亮，<tspan x="72" dy="38">第九百五十次照着有人在等另一个人。</tspan></text>
  </g>

  <g id="p16-source" data-pptx-bounds="72 570 700 42">
    <text x="72" y="596" font-size="16" fill="#7FA8C9">苏轼《水调歌头 · 明月几时有》，1076 年作于密州</text>
  </g>

  <g id="p16-mark" data-pptx-bounds="890 470 220 164">
    <image href="../images/letter_tuanyuan.png" x="900" y="480" width="200" height="142" preserveAspectRatio="xMidYMid meet" filter="url(#paperLift)"/>
  </g>
</svg>
