<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="content">
  <defs>
    <filter id="paperLift" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#05070F" flood-opacity="0.20"/>
    </filter>
    <linearGradient id="p06Field" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1E2748" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#131A33" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#131A33"/>
  <rect id="p06-field" data-pptx-role="decoration" x="0" y="360" width="1280" height="360" fill="url(#p06Field)"/>
  <image id="p06-walkers" data-pptx-role="decoration" href="../images/walking_pair.png" x="990" y="250" width="213" height="380" preserveAspectRatio="xMidYMid meet" filter="url(#paperLift)"/>

  <g id="p06-header" data-pptx-bounds="72 72 760 80">
    <text x="72" y="92" font-size="18" fill="#7FA8C9">南宋 · 临安</text>
    <text x="72" y="132" font-family="KaiTi, Georgia, serif" font-size="42" fill="#F2ECE0">虽陋巷贫窭之人……不肯虚度</text>
  </g>

  <g id="p06-quote" data-pptx-bounds="72 186 880 246">
    <text x="72" y="220" font-family="KaiTi, Georgia, serif" font-size="34" fill="#F2ECE0">王孙公子，富家巨室，莫不登危楼，<tspan x="72" dy="52">临轩玩月……至如铺席之家，亦登小小月台，</tspan><tspan x="72" dy="52">安排家宴，团子女，以酬佳节。虽陋巷贫窭之人，</tspan><tspan x="72" dy="52">解衣市酒，勉强迎欢，不肯虚度。</tspan></text>
    <text x="72" y="418" font-size="18" fill="#7FA8C9">南宋 · 吴自牧《梦粱录》卷四</text>
  </g>

  <g id="p06-note" data-pptx-bounds="72 474 880 142">
    <text x="72" y="500" font-size="24" fill="#B9C2D8">此夜天街卖买，直到五鼓，玩月游人，婆娑于市，<tspan x="72" dy="38">至晚不绝。<tspan font-weight="bold" fill="#E8B04B">盖金吾不禁故也。</tspan></tspan></text>
    <text x="72" y="596" font-size="28" fill="#E8B04B">这一夜，连宵禁都为它让路。</text>
  </g>
</svg>
