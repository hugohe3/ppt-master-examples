<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="content">
  <defs>
    <filter id="paperLift" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#05070F" flood-opacity="0.20"/>
    </filter>
    <linearGradient id="p05Scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0C1026" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#0C1026" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0C1026" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#131A33"/>
  <image id="p05-scene" data-pptx-role="decoration" href="../images/kaifeng_night_market.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid meet"/>
  <rect id="p05-scrim" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#p05Scrim)"/>
  <image id="p05-moon" data-pptx-role="decoration" href="../images/moon_veiled.png" x="1000" y="44" width="220" height="156" preserveAspectRatio="xMidYMid meet"/>

  <g id="p05-title" data-pptx-bounds="72 76 570 158">
    <text x="72" y="118" font-family="KaiTi, Georgia, serif" font-size="42" fill="#F2ECE0">至午未间，家家无酒，<tspan x="72" dy="54">拽下望子</tspan></text>
    <text x="72" y="220" font-size="28" fill="#E8B04B">北宋定八月十五为中秋节</text>
  </g>

  <g id="p05-facts" data-pptx-bounds="72 254 470 380">
    <text x="72" y="282" font-size="20" font-weight="bold" fill="#E8B04B">节前 · 酒市</text>
    <text x="72" y="320" font-size="24" fill="#F2ECE0">诸店皆卖新酒，重新结络门面<tspan x="72" dy="38">彩楼花头；市人争饮。</tspan></text>
    <text x="72" y="410" font-size="20" font-weight="bold" fill="#E8B04B">节夜 · 通宵</text>
    <text x="72" y="448" font-size="24" fill="#F2ECE0">贵家结饰台榭，民间争占酒楼<tspan x="72" dy="38">玩月；夜市骈阗，至于通晓。</tspan></text>
    <text x="72" y="538" font-size="20" font-weight="bold" fill="#E8B04B">结构性证据</text>
    <text x="72" y="576" font-size="24" fill="#F2ECE0">《东京梦华录》卷八「中秋」条<tspan x="72" dy="38">与端午、七夕、中元、重阳并列。</tspan></text>
  </g>
</svg>
