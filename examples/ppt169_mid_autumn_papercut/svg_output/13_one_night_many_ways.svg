<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="content">
  <defs>
    <filter id="paperLift" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#05070F" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#131A33"/>

  <g id="p13-header" data-pptx-bounds="72 74 1000 96">
    <text x="72" y="112" font-family="KaiTi, Georgia, serif" font-size="42" fill="#F2ECE0">同一个晚上，有人扎火龙，有人掷骰子</text>
    <text x="72" y="158" font-size="28" fill="#B9C2D8">中秋从来不是一种过法</text>
  </g>

  <g id="p13-dragon" data-pptx-bounds="40 176 660 380">
    <image href="../images/fire_dragon.png" x="40" y="180" width="324" height="372" preserveAspectRatio="xMidYMid meet" filter="url(#paperLift)"/>
    <text x="396" y="250" font-size="24" font-weight="bold" fill="#E8B04B">香港大坑 · 舞火龙</text>
    <text x="396" y="288" font-size="20" fill="#F2ECE0">相传光绪六年（1880）瘟疫，<tspan x="396" dy="32">村民扎火龙巡游驱瘟。</tspan><tspan x="396" dy="32">龙骨内插满点燃的线香；</tspan><tspan x="396" dy="32">八月十四开光，连巡三晚，</tspan><tspan x="396" dy="32">十六晚「游大运」后投龙入海。</tspan></text>
  </g>

  <g id="p13-tower" data-pptx-bounds="716 190 248 314">
    <image href="../images/lantern_tower.png" x="770" y="200" width="110" height="161" preserveAspectRatio="xMidYMid meet"/>
    <text x="730" y="400" font-size="20" font-weight="bold" fill="#E8B04B">江西烧塔 · 瓦子灯</text>
    <text x="730" y="430" font-size="18" fill="#F2ECE0">湖广以瓦片叠塔燃灯，<tspan x="730" dy="26">称「瓦子灯」；江西烧塔</tspan><tspan x="730" dy="26">分垒塔、烧塔、封塔三段。</tspan></text>
  </g>

  <g id="p13-pole" data-pptx-bounds="980 190 228 314">
    <image href="../images/lantern_pole.png" x="1060" y="200" width="80" height="198" preserveAspectRatio="xMidYMid meet"/>
    <text x="990" y="430" font-size="20" font-weight="bold" fill="#E8B04B">广东香港 · 树中秋</text>
    <text x="990" y="460" font-size="18" fill="#F2ECE0">彩灯竖于高杆，<tspan x="990" dy="26">又称「竖中秋」。</tspan></text>
  </g>

  <g id="p13-dice" data-pptx-bounds="72 560 560 138">
    <image href="../images/dice_bowl.png" x="80" y="572" width="130" height="101" preserveAspectRatio="xMidYMid meet"/>
    <text x="230" y="598" font-size="20" font-weight="bold" fill="#E8B04B">福建厦门 · 博饼</text>
    <text x="230" y="630" font-size="18" fill="#F2ECE0">六个骰子轮流投掷，博状元、榜眼、探花、<tspan x="230" dy="26">进士、举人、秀才六个等第，按等第取饼。</tspan></text>
  </g>

  <g id="p13-walk" data-pptx-bounds="660 560 548 138">
    <image href="../images/walking_pair.png" x="670" y="562" width="90" height="162" preserveAspectRatio="xMidYMid meet"/>
    <text x="780" y="598" font-size="20" font-weight="bold" fill="#E8B04B">江南明清 · 走月</text>
    <text x="780" y="630" font-size="18" fill="#F2ECE0">衣着华美，三五结伴，游街市、泛舟或<tspan x="780" dy="26">登楼观月华；明代曾有望月楼、玩月桥。</tspan></text>
  </g>
</svg>
