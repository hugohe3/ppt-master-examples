<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="cover">
  <defs>
    <linearGradient id="coverScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0C1026" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#0C1026" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0C1026" stop-opacity="0"/>
    </linearGradient>
    <filter id="paperLift" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#05070F" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#131A33"/>
  <image id="cover-field" data-pptx-role="decoration" href="../images/cover_night_field.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid meet"/>
  <rect id="cover-scrim" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#coverScrim)"/>
  <image id="cover-sprig" data-pptx-role="decoration" href="../images/osmanthus_sprig.png" x="1092" y="26" width="150" height="155" preserveAspectRatio="xMidYMid meet"/>
  <image id="cover-cloud" data-pptx-role="decoration" href="../images/cloud_band.png" x="836" y="196" width="380" height="162" preserveAspectRatio="xMidYMid meet"/>
  <g id="p01-moon" data-pptx-bounds="1020 400 158 187">
    <image href="../images/moon_crescent.png" x="1024" y="404" width="150" height="179" preserveAspectRatio="xMidYMid meet" filter="url(#paperLift)"/>
  </g>

  <g id="cover-mark" data-pptx-bounds="90 92 232 166">
    <image id="cover-lettering" href="../images/letter_zhongqiu.png" x="90" y="96" width="213" height="150" preserveAspectRatio="xMidYMid meet" filter="url(#paperLift)"/>
  </g>

  <g id="cover-title" data-pptx-bounds="90 286 920 216">
    <text x="90" y="352" font-family="KaiTi, Georgia, serif" font-size="72" fill="#F2ECE0">一枚月饼里的八百年</text>
    <text x="90" y="412" font-size="30" fill="#E8B04B">南宋的一张菜单上，月饼还只是一味「四时皆有」的点心</text>
    <text x="90" y="470" font-size="28" fill="#B9C2D8">它和「团圆」发生关系，是三百年以后的事</text>
  </g>

  <g id="cover-meta" data-pptx-bounds="90 528 420 36">
    <text x="90" y="550" font-size="16" fill="#7FA8C9">2026 年中秋 · 公历 9 月 25 日</text>
  </g>
</svg>
