    <text x="76" y="372" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#A8452B">RULE</text>
    <text x="154" y="372" font-size="18" fill="#6B6259">Borland &amp; Taylor 2007: three documented defects</text>
    <g id="defect-1">
      <text x="64" y="418" font-family="Consolas" font-size="22" fill="#A8452B">1</text>
      <text fill="#2E2A25" font-size="18" x="102" y="418">No perceptual ordering: equal-looking color steps are not</text><text fill="#2E2A25" font-size="18" x="102" y="442">equal data steps.</text></g>
    <g id="defect-2">
      <text x="64" y="484" font-family="Consolas" font-size="22" fill="#A8452B">2</text>
      <text fill="#2E2A25" font-size="18" x="102" y="484">Uncontrolled luminance variation across hues obscures</text><text fill="#2E2A25" font-size="18" x="102" y="508">the data.</text></g>
    <g id="defect-3">
      <text x="64" y="550" font-family="Consolas" font-size="22" fill="#A8452B">3</text>
      <text fill="#2E2A25" font-size="18" x="102" y="550">It can create gradients that are not in the underlying</text><text fill="#2E2A25" font-size="18" x="102" y="574">data at all.</text></g>
    <g id="p12-chip-recommendation" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="64 596 192 26" fill="#EDE7DC" stroke="none">
<path d="M 64 596 L 251.67 596 L 256 600.33 L 256 622 L 64 622 Z" />
</g>
    <text x="76" y="614" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#A8452B">RECOMMENDATION</text>
    <text x="64" y="652" font-size="18" font-weight="bold" fill="#A8452B">Crameri et al. (2020): use a perceptually uniform map.</text>
  </g>

