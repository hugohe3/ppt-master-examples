  <g id="rainbow-defects" data-pptx-bounds="64 350 576 310">
    <g id="p12-chip-rule" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="64 354 74 26" fill="#EDE7DC" stroke="none">
