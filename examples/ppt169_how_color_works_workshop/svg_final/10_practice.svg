    <text x="98" y="210" font-size="16" font-weight="bold" letter-spacing="2" fill="#A8452B">TASK</text>
    <text fill="#2E2A25" font-size="24" x="64" y="260">Open any image you own. Sample five colors in</text><text fill="#2E2A25" font-size="24" x="64" y="294">the order we just used, then measure the</text><text fill="#2E2A25" font-size="24" x="64" y="328">pair you would actually put together for body</text><text fill="#2E2A25" font-size="24" x="64" y="362">text on a background.</text></g>

