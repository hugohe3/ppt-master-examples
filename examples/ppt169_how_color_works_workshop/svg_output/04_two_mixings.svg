    <text x="512" y="496" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#A8452B">RULE</text>
    <text x="590" y="496" font-size="18" fill="#6B6259">Two machines, two directions.</text>
    <text x="500" y="548" font-size="24" fill="#2E2A25">The two primary sets are <tspan font-weight="bold" fill="#23201C">complements</tspan> of each other:<tspan x="500" dy="34">each additive primary is a secondary in the other</tspan><tspan x="500" dy="34">system, and the other way round.</tspan></text>
    <text x="500" y="650" font-size="24" font-weight="bold" fill="#A8452B">A screen color need not be reachable in ink.</text>
