<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#EDE7DC"/>

  <g id="page-header" data-pptx-bounds="64 56 1152 104">
    <text x="64" y="72" font-size="16" font-weight="bold" letter-spacing="2" fill="#A8452B">UNDERSTANDING CHECK</text>
    <rect x="64" y="84" width="48" height="3" fill="#A8452B"/>
    <text x="64" y="132" font-family="Trebuchet MS" font-size="42" fill="#23201C">Check yourself — three questions</text>
    <line x1="64" y1="158" x2="1216" y2="158" stroke="#D8D0C3" stroke-width="1"/>
  </g>

  <g id="question-1" data-pptx-bounds="64 188 368 276">
    <rect x="64" y="190" width="368" height="270" fill="#FFFFFF"/>
    <text x="88" y="228" font-family="Consolas" font-size="22" font-weight="bold" fill="#A8452B">Q1</text>
    <text x="88" y="272" font-size="24" fill="#23201C">You have two colors<tspan x="88" dy="32">measured at 3.8:1 and</tspan><tspan x="88" dy="32">you need them for 16 px</tspan><tspan x="88" dy="32">body text. What exactly</tspan><tspan x="88" dy="32">do you change, and why</tspan><tspan x="88" dy="32">that and not the hue?</tspan></text>
  </g>

  <g id="question-2" data-pptx-bounds="456 188 368 276">
    <rect x="456" y="190" width="368" height="270" fill="#FFFFFF"/>
    <text x="480" y="228" font-family="Consolas" font-size="22" font-weight="bold" fill="#A8452B">Q2</text>
    <text x="480" y="272" font-size="24" fill="#23201C">A colleague says a<tspan x="480" dy="32">palette is harmonious</tspan><tspan x="480" dy="32">because it is triadic.</tspan><tspan x="480" dy="32">Which part of that is a</tspan><tspan x="480" dy="32">rule and which part is a</tspan><tspan x="480" dy="32">convention?</tspan></text>
  </g>

  <g id="question-3" data-pptx-bounds="848 188 368 276">
    <rect x="848" y="190" width="368" height="270" fill="#FFFFFF"/>
    <text x="872" y="228" font-family="Consolas" font-size="22" font-weight="bold" fill="#A8452B">Q3</text>
    <text x="872" y="272" font-size="24" fill="#23201C">You have a sequential<tspan x="872" dy="32">heat map drawn in a</tspan><tspan x="872" dy="32">rainbow ramp. Name two</tspan><tspan x="872" dy="32">things that go wrong</tspan><tspan x="872" dy="32">before anyone’s vision is</tspan><tspan x="872" dy="32">involved.</tspan></text>
  </g>

  <g id="answers" data-pptx-bounds="64 484 1152 154">
    <line x1="64" y1="488" x2="1216" y2="488" stroke="#A8452B" stroke-width="2"/>
    <text x="64" y="516" font-size="16" font-weight="bold" letter-spacing="2" fill="#A8452B">ANSWERS — ALL THREE ARE CHECKABLE AGAINST THIS DECK</text>
    <g id="answer-1">
      <text x="64" y="552" font-size="18" fill="#2E2A25">4.5:1 is the AA floor at that size, so<tspan x="64" dy="24">move the lightness until the measured</tspan><tspan x="64" dy="24">ratio clears it. The formula has no hue</tspan><tspan x="64" dy="24">term in it.</tspan></text>
    </g>
    <g id="answer-2">
      <text x="456" y="552" font-size="18" fill="#2E2A25">None of it is a rule. Triadic is an<tspan x="456" dy="24">angular convention on the hue dial, and</tspan><tspan x="456" dy="24">harmony is not a measurable property.</tspan></text>
    </g>
    <g id="answer-3">
      <text x="848" y="552" font-size="18" fill="#2E2A25">No perceptual ordering, and<tspan x="848" dy="24">uncontrolled luminance variation</tspan><tspan x="848" dy="24">across hues.</tspan></text>
    </g>
  </g>

  <g id="page-footer" data-pptx-bounds="64 674 1152 24" font-size="16" fill="#6B6259">
    <text x="1216" y="690" text-anchor="end">13 / 14</text>
  </g>
</svg>
