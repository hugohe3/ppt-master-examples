  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FAF8F4"/>

  <g id="page-header" data-pptx-bounds="64 56 1152 104">
    <text x="64" y="72" font-size="16" font-weight="bold" letter-spacing="2" fill="#A8452B">MINIMUM CONCEPT · 3 OF 3</text>
    <rect x="64" y="84" width="48" height="3" fill="#A8452B"/>
    <text x="64" y="132" font-family="Trebuchet MS" font-size="42" fill="#23201C">Three dials — schemes turn only one of them</text>
    <line x1="64" y1="158" x2="1216" y2="158" stroke="#D8D0C3" stroke-width="1"/>
  </g>

  <g id="hsl-dials" data-pptx-bounds="64 188 636 314">
    <g id="dial-hue">
      <text x="64" y="210" font-size="24" font-weight="bold" fill="#23201C">HUE — an angle, 0–360°</text>
      <rect x="64" y="220" width="560" height="30" fill="url(#hueRamp)"/>
      <text x="64" y="274" font-size="18" fill="#6B6259">red 0 / 360 · green 120 · blue 240</text>
    </g>
    <g id="dial-saturation">
      <text x="64" y="320" font-size="24" font-weight="bold" fill="#23201C">SATURATION — 0% gray to 100%</text>
      <rect x="64" y="330" width="560" height="30" fill="url(#satRamp)"/>
      <text x="64" y="384" font-size="18" fill="#6B6259">how much of the hue is left in the color</text>
    </g>
    <g id="dial-lightness">
      <text x="64" y="430" font-size="24" font-weight="bold" fill="#A8452B">LIGHTNESS — 0% black to 100% white</text>
      <rect x="64" y="440" width="560" height="30" fill="url(#lightRamp)"/>
      <text x="64" y="494" font-size="18" font-weight="bold" fill="#A8452B">the only dial the contrast rule looks at</text>
    </g>
  </g>

  <g id="harmony-provenance" data-pptx-bounds="64 506 636 152">
    <g id="p05-chip-convention" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="64 512 148 26" fill="#EDE7DC" stroke="none">
<path d="M 64 512 L 207.67 512 L 212 516.33 L 212 538 L 64 538 Z"/>
</g>
    <text x="76" y="530" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#A8452B">CONVENTION</text>
    <text x="228" y="530" font-size="18" fill="#6B6259">harmony schemes</text>
    <text x="64" y="570" font-size="18" fill="#2E2A25">The scheme names come from Johannes Itten’s 1961 Art of Color,<tspan x="64" dy="24">taught at the Bauhaus. Munsell drew a different wheel — so which</tspan><tspan x="64" dy="24">colors count as “complementary” depends on which wheel you</tspan><tspan x="64" dy="24">started from.</tspan></text>
  </g>

