    <text x="76" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#A8452B">RULE</text>
    <text x="154" y="208" font-size="18" fill="#6B6259">WCAG SC 1.4.3</text>
    <text x="64" y="244" font-size="24" fill="#2E2A25">The W3C’s text-contrast rule is defined purely by<tspan x="64" dy="30">relative luminance. There is <tspan font-weight="bold" fill="#A8452B">no hue term</tspan> and no</tspan><tspan x="64" dy="30">saturation term in it.</tspan></text>
  </g>

  <g id="luminance-formula" data-pptx-bounds="64 328 636 48">
