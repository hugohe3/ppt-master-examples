  <g id="gelb-hinein" data-pptx-bounds="64 234 676 190" fill="#1C1C1A">
    <rect x="64" y="240" width="676" height="6" fill="#F4C400" />
    <text x="64" y="288" font-family="Cambria" font-size="26" font-weight="bold">Das gehört hinein – nur leere Verpackungen</text>
    <text font-size="20" x="64" y="330">Kunststoff: Becher, Folien, Flaschen, Tuben</text><text font-size="20" x="64" y="356">Metall: Konservendosen, Alu-Schalen, Deckel</text><text font-size="20" x="64" y="382">Verbund: Getränkekartons, Vakuumbeutel</text><text font-size="20" x="64" y="408">Styropor-Verpackungen und Chipstüten</text></g>

  <g id="gelb-nicht" data-pptx-bounds="64 444 676 162" fill="#1C1C1A">
    <rect x="64" y="450" width="676" height="6" fill="#B3261E" />
    <text x="64" y="498" font-family="Cambria" font-size="26" font-weight="bold">Das gehört nicht hinein</text>
    <text font-size="20" x="64" y="540">Nicht-Verpackungen: Gießkanne, Spielzeug</text><text font-size="20" x="64" y="566">Glas- und Papierverpackungen, Speisereste</text><text font-size="20" x="64" y="592">Elektrogeräte und Batterien</text></g>

  <g id="gelb-wertstofftonne" data-pptx-bounds="64 618 676 48">
    <text font-size="18" fill="#57574F" x="64" y="634">Ausnahme: Wo es eine Wertstofftonne gibt (z. B. in Berlin),</text><text font-size="18" fill="#57574F" x="64" y="656">darf auch stoffgleicher Kunststoff und Metall hinein.</text></g>

  <g id="gelb-faustregeln" data-pptx-bounds="755 234 461 306" fill="#1C1C1A">
    <g id="gelb-callout" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="wedgeRectCallout" data-pptx-frame="790 234 426 306" data-pptx-av-adj1="val -58000" data-pptx-av-adj2="val -5600" fill="#E1EDEF" stroke="#12525C" stroke-width="1.5">
<path d="M 790 234 L 861 234 L 861 234 L 967.5 234 L 1216 234 L 1216 285 L 1216 285 L 1216 361.5 L 1216 540 L 967.5 540 L 861 540 L 861 540 L 790 540 L 790 361.5 L 755.92 369.86 L 790 285 Z" />
</g>
    <text x="822" y="290" font-family="Cambria" font-weight="bold">Drei Faustregeln</text>
    <text x="822" y="336" font-size="20" font-weight="bold">1. Löffelrein genügt.</text>
    <text x="848" y="360" font-size="18" fill="#57574F">Ausspülen ist nicht nötig.</text>
    <text x="822" y="400" font-size="20" font-weight="bold">2. Deckel ab vom Becher.</text>
    <text x="848" y="424" font-size="18" fill="#57574F">Getrennt sortiert es sich besser.</text>
    <text x="822" y="464" font-size="20" font-weight="bold">3. Nicht ineinander stapeln.</text>
    <text x="848" y="488" font-size="18" fill="#57574F">Das stört die Sortiertechnik.</text>
  </g>

