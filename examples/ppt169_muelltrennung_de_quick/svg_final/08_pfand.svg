    <text font-size="20" fill="#57574F" x="712" y="486">Mehrwegflaschen aus Glas werden</text><text font-size="20" fill="#57574F" x="712" y="512">bis zu 50-mal neu befüllt.</text><text font-size="20" fill="#57574F" x="712" y="538">Das Pfand legt der Hersteller fest:</text><text font-size="20" fill="#57574F" x="712" y="564">meist 8 oder 15 Cent.</text></g>

