    <text font-size="20" fill="#57574F" x="96" y="486">Gesetzlich einheitlich auf fast alle</text><text font-size="20" fill="#57574F" x="96" y="512">Einweg-Kunststoffflaschen und alle</text><text font-size="20" fill="#57574F" x="96" y="538">Getränkedosen. Wein und Spirituosen</text><text font-size="20" fill="#57574F" x="96" y="564">aus Glas sind ausgenommen.</text></g>

