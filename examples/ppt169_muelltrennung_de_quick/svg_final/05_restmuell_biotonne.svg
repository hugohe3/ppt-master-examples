    <text font-size="22" x="96" y="584"><tspan><tspan font-weight="bold" fill="#12525C">Keine kompostierbaren Plastiktüten</tspan> – sie werden in den meisten Anlagen aussortiert.</tspan></text><text font-size="22" x="96" y="614"><tspan>Bioabfälle machen <tspan font-weight="bold" fill="#12525C">30 bis 40 %</tspan> des Siedlungsabfalls aus; seit Mai 2025 gilt eine</tspan></text><text font-size="22" x="96" y="644"><tspan>Fremdstoffgrenze von höchstens <tspan font-weight="bold" fill="#12525C">1,0 %</tspan>.</tspan></text></g>
