    <text x="80" y="78" font-size="18" font-weight="bold" letter-spacing="1.6" fill="#12525C">ÜBERBLICK</text>
    <text x="64" y="128" font-family="Cambria" font-size="44" font-weight="bold">Wohin gehört was? Die Wege im Überblick</text>
    <line x1="64" y1="152" x2="1216" y2="152" stroke="#D8D3C8" stroke-width="1" />
  </g>

  <g id="einleitung" data-pptx-bounds="64 170 1152 44" fill="#1C1C1A">
    <text x="64" y="196" font-size="28">Fünf Tonnen stehen am Haus. Drei Wege führen aus dem Haus hinaus.</text>
  </g>

  <g id="tonnen-leiste" data-pptx-bounds="64 226 1160 156" fill="#1C1C1A">
