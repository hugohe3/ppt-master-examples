    <text x="859" y="334" font-size="18" font-weight="bold" text-anchor="middle">Pfand</text>
    <text x="859" y="356" font-size="14" fill="#57574F" text-anchor="middle">Flaschen, Dosen<tspan x="859" dy="18">mit Pfandlogo</tspan></text>

    <rect x="940" y="230" width="130" height="76" rx="6" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.5" />
    <use data-icon="chunk-filled/box" x="985" y="250" width="40" height="40" />
    <text x="1005" y="334" font-size="18" font-weight="bold" text-anchor="middle">Sperrmüll</text>
    <text x="1005" y="356" font-size="14" fill="#57574F" text-anchor="middle">Möbel, große<tspan x="1005" dy="18">Gegenstände</tspan></text>

