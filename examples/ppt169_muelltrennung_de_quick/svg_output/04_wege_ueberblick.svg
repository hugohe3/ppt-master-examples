    <use data-icon="chunk-filled/trash" x="109" y="250" width="40" height="40" fill="#FFFFFF" />
    <text x="129" y="334" font-size="18" font-weight="bold" text-anchor="middle">Restmüll</text>
    <text x="129" y="356" font-size="14" fill="#57574F" text-anchor="middle">Hygiene, Asche,<tspan x="129" dy="18">Keramik</tspan></text>

    <rect x="210" y="230" width="130" height="76" rx="6" fill="#6B4423" />
    <use data-icon="chunk-filled/leaf" x="255" y="250" width="40" height="40" fill="#FFFFFF" />
    <text x="275" y="334" font-size="18" font-weight="bold" text-anchor="middle">Biotonne</text>
    <text x="275" y="356" font-size="14" fill="#57574F" text-anchor="middle">Küche und<tspan x="275" dy="18">Garten</tspan></text>

    <rect x="356" y="230" width="130" height="76" rx="6" fill="#F4C400" />
    <use data-icon="chunk-filled/recycle" x="401" y="250" width="40" height="40" />
    <text x="421" y="334" font-size="18" font-weight="bold" text-anchor="middle">Gelbe Tonne</text>
    <text x="421" y="356" font-size="14" fill="#57574F" text-anchor="middle">Verpackungen<tspan x="421" dy="18">Kunststoff/Metall</tspan></text>

    <rect x="502" y="230" width="130" height="76" rx="6" fill="#0F4C9E" />
    <use data-icon="chunk-filled/newspaper" x="547" y="250" width="40" height="40" fill="#FFFFFF" />
    <text x="567" y="334" font-size="18" font-weight="bold" text-anchor="middle">Altpapier</text>
    <text x="567" y="356" font-size="14" fill="#57574F" text-anchor="middle">Papier, Pappe<tspan x="567" dy="18">und Karton</tspan></text>

    <rect x="648" y="230" width="130" height="76" rx="6" fill="#2E7D32" />
    <use data-icon="chunk-filled/bottle" x="693" y="250" width="40" height="40" fill="#FFFFFF" />
