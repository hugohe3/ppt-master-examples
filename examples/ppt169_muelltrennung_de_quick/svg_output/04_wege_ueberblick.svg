    <text x="713" y="356" font-size="14" fill="#57574F" text-anchor="middle">Flaschen und<tspan x="713" dy="18">Gläser</tspan></text>

    <rect x="794" y="230" width="130" height="76" rx="6" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.5" />
