    <use data-icon="chunk-filled/truck" x="1131" y="250" width="40" height="40" />
    <text x="1151" y="334" font-size="18" font-weight="bold" text-anchor="middle">Wertstoffhof</text>
    <text x="1151" y="356" font-size="14" fill="#57574F" text-anchor="middle">Elektro, Bau,<tspan x="1151" dy="18">Schadstoffe</tspan></text>
