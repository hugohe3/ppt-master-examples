  <g id="leiste-legende" data-pptx-bounds="64 402 1152 28">
    <text x="64" y="420" font-size="18" fill="#57574F">Farbig = Tonne am Haus · Umrandet = Weg außer Haus: Rückgabe, Abholung oder selbst hinbringen (eigene Einteilung)</text>
  </g>

  <g id="weg-hinweis" data-pptx-bounds="64 452 1152 130" fill="#1C1C1A">
    <rect x="64" y="458" width="1152" height="118" rx="6" fill="#E1EDEF" />
    <text x="96" y="502" font-size="22">Verpackungen trennen Sie nach Material: Kunststoff, Metall und Verbund in die Gelbe Tonne,<tspan x="96" dy="30">Papier in die Blaue, Glas in den Container. Alles andere entscheidet der Weg – und</tspan><tspan x="96" dy="30">Elektrogeräte, Batterien und Glas <tspan font-weight="bold" fill="#12525C">gehören nie in den Restmüll</tspan>.</tspan></text>
  </g>

  <g id="seitenfuss" data-pptx-role="footer" data-pptx-bounds="64 675 1152 24" fill="#8A8A82" font-size="15">
