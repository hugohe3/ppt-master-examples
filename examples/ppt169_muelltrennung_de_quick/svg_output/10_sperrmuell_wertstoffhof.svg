    <text x="64" y="310" font-size="20">Große Gegenstände wie Möbel und Matratzen<tspan x="64" dy="26">holt die Kommune nach Anmeldung ab –</tspan><tspan x="64" dy="26">nicht einfach an die Straße stellen.</tspan><tspan x="64" dy="26">2017 waren das 33,9 kg je Einwohner.</tspan></text>
