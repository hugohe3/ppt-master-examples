<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="de-DE" data-pptx-page-role="content" font-family="Segoe UI" font-size="24">
  <rect id="grund" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FAF8F4" />

  <g id="seitentitel" data-pptx-bounds="64 56 1152 100" fill="#1C1C1A">
    <rect x="64" y="58" width="4" height="26" fill="#12525C" />
    <text x="80" y="78" font-size="18" font-weight="bold" letter-spacing="1.6" fill="#12525C">AUSSER HAUS</text>
    <text x="64" y="128" font-family="Cambria" font-size="44" font-weight="bold">Elektrogeräte und Batterien</text>
    <line x1="64" y1="152" x2="1216" y2="152" stroke="#D8D3C8" stroke-width="1" />
  </g>

  <g id="tonnen-leiste" data-pptx-bounds="64 168 1152 46">
    <rect x="64" y="172" width="130" height="30" rx="4" fill="#3C3C3B" fill-opacity="0.35" />
    <text x="129" y="192" font-size="14" font-weight="bold" fill="#8A8A82" text-anchor="middle">Restmüll</text>
    <rect x="210" y="172" width="130" height="30" rx="4" fill="#6B4423" fill-opacity="0.35" />
    <text x="275" y="192" font-size="14" font-weight="bold" fill="#8A8A82" text-anchor="middle">Biotonne</text>
    <rect x="356" y="172" width="130" height="30" rx="4" fill="#F4C400" fill-opacity="0.35" />
    <text x="421" y="192" font-size="14" font-weight="bold" fill="#8A8A82" text-anchor="middle">Gelbe Tonne</text>
    <rect x="502" y="172" width="130" height="30" rx="4" fill="#0F4C9E" fill-opacity="0.35" />
    <text x="567" y="192" font-size="14" font-weight="bold" fill="#8A8A82" text-anchor="middle">Altpapier</text>
    <rect x="648" y="172" width="130" height="30" rx="4" fill="#2E7D32" fill-opacity="0.35" />
    <text x="713" y="192" font-size="14" font-weight="bold" fill="#8A8A82" text-anchor="middle">Altglas</text>
    <rect x="794" y="172" width="130" height="30" rx="4" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1.2" />
    <text x="859" y="192" font-size="14" font-weight="bold" fill="#8A8A82" text-anchor="middle">Pfand</text>
    <rect x="940" y="172" width="130" height="30" rx="4" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1.2" />
    <text x="1005" y="192" font-size="14" font-weight="bold" fill="#8A8A82" text-anchor="middle">Sperrmüll</text>
    <rect x="1086" y="172" width="130" height="30" rx="4" fill="#FFFFFF" stroke="#1C1C1A" stroke-width="1.2" />
    <text x="1151" y="192" font-size="14" font-weight="bold" fill="#1C1C1A" text-anchor="middle">Wertstoffhof</text>
    <rect x="1086" y="206" width="130" height="3" fill="#12525C" />
  </g>

  <g id="elektro-wohin" data-pptx-bounds="64 234 556 330" fill="#1C1C1A">
    <rect x="64" y="240" width="556" height="6" fill="#3C3C3B" />
    <use data-icon="chunk-filled/plug" x="64" y="258" width="36" height="36" fill="#12525C" />
    <text x="112" y="290" font-family="Cambria" font-size="28" font-weight="bold">Wohin damit?</text>
    <text x="64" y="336" font-size="20" font-weight="bold" fill="#B3261E">Nie in den Restmüll</text>
    <text x="64" y="368" font-size="20">Lithium-Ionen-Akkus können in Fahrzeugen<tspan x="64" dy="26">und Sortieranlagen in Brand geraten. Für</tspan><tspan x="64" dy="26">Altbatterien ist die getrennte Entsorgung</tspan><tspan x="64" dy="26">gesetzlich vorgeschrieben.</tspan></text>
    <text x="64" y="492" font-size="20" font-weight="bold" fill="#2E7D32">Drei richtige Wege</text>
    <text x="64" y="524" font-size="20">Wertstoffhof, kommunale Sammelstelle<tspan x="64" dy="26">oder Rückgabe im Handel.</tspan></text>
  </g>

  <g id="handel-ruecknahme" data-pptx-bounds="660 234 556 330" fill="#1C1C1A">
    <rect x="660" y="240" width="556" height="6" fill="#12525C" />
    <use data-icon="chunk-filled/shop" x="660" y="258" width="36" height="36" fill="#12525C" />
    <text x="708" y="290" font-family="Cambria" font-size="28" font-weight="bold">Der Handel muss zurücknehmen</text>
    <text x="660" y="336" font-size="20" font-weight="bold">Wer verpflichtet ist</text>
    <text x="660" y="368" font-size="20">Händler ab 400 m² Verkaufsfläche für<tspan x="660" dy="26">Elektrogeräte und Lebensmittelmärkte ab</tspan><tspan x="660" dy="26">800 m² Gesamtverkaufsfläche.</tspan></text>
    <text x="660" y="466" font-size="20" font-weight="bold">Was Sie abgeben dürfen</text>
    <text x="660" y="498" font-size="20">Geräte bis 25 cm ohne Neukauf, höchstens<tspan x="660" dy="26">drei je Geräteart. Beim Neukauf zusätzlich</tspan><tspan x="660" dy="26">ein Altgerät gleicher Art – immer kostenlos.</tspan></text>
  </g>

  <g id="elektro-quoten" data-pptx-bounds="64 570 1152 94" fill="#1C1C1A">
    <rect x="64" y="576" width="1152" height="82" rx="6" fill="#E1EDEF" />
    <text x="96" y="612" font-size="20">Sammelquote Elektroaltgeräte 2023: <tspan font-weight="bold" fill="#12525C">29,5 %</tspan> – das gesetzliche Ziel liegt bei <tspan font-weight="bold" fill="#12525C">65 %</tspan>.<tspan x="96" dy="28">Bei Gerätealtbatterien wurden 2024 <tspan font-weight="bold" fill="#12525C">53,8 %</tspan> erreicht, bei einer Mindestquote von 50 %.</tspan></text>
  </g>

  <g id="seitenfuss" data-pptx-role="footer" data-pptx-bounds="64 675 1152 24" fill="#8A8A82" font-size="15">
    <text x="64" y="690">Quelle: § 17 ElektroG, Batterierecht-Durchführungsgesetz (seit 7. Oktober 2025), Umweltbundesamt 2023/2024</text>
    <text x="1216" y="690" text-anchor="end">9</text>
  </g>
</svg>
