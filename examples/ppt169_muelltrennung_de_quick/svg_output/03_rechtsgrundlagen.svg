  <g id="gesetz-krwg" data-pptx-bounds="700 196 516 210" fill="#1C1C1A">
    <rect x="700" y="196" width="4" height="210" fill="#12525C" />
    <text x="722" y="226" font-size="22" font-weight="bold">Kreislaufwirtschaftsgesetz (KrWG)</text>
    <text x="722" y="262" font-size="20">Das KrWG schreibt die fünfstufige<tspan x="722" dy="26">Abfallhierarchie vor und verpflichtet</tspan><tspan x="722" dy="26">die Kommunen, Bioabfall, Papier, Metall,</tspan><tspan x="722" dy="26">Kunststoff, Glas, Sperrmüll und Textilien</tspan><tspan x="722" dy="26">getrennt zu sammeln.</tspan></text>
    <text x="722" y="396" font-size="15" fill="#8A8A82">§ 6 Abs. 1 und § 20 Abs. 2 KrWG</text>
  </g>

  <g id="gesetz-verpackg" data-pptx-bounds="700 426 516 212" fill="#1C1C1A">
    <rect x="700" y="426" width="4" height="212" fill="#12525C" />
    <text x="722" y="456" font-size="22" font-weight="bold">Verpackungsgesetz (VerpackG)</text>
    <text x="722" y="492" font-size="20">Das VerpackG verpflichtet die dualen<tspan x="722" dy="26">Systeme auf materialspezifische</tspan><tspan x="722" dy="26">Mindestquoten, schreibt das Einwegpfand</tspan><tspan x="722" dy="26">von 25 Cent fest und setzt ein</tspan><tspan x="722" dy="26">Mehrwegziel von 70 % für Getränke.</tspan></text>
    <text x="722" y="626" font-size="15" fill="#8A8A82">§ 1 Abs. 3 und § 16 Abs. 2 VerpackG</text>
  </g>

  <g id="seitenfuss" data-pptx-role="footer" data-pptx-bounds="64 675 1152 24" fill="#8A8A82" font-size="15">
    <text x="64" y="690">Quelle: Kreislaufwirtschaftsgesetz und Verpackungsgesetz, gesetze-im-internet.de und buzer.de (Stand 2026)</text>
    <text x="1216" y="690" text-anchor="end">3</text>
  </g>
</svg>
