  <rect id="grund" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FAF8F4" />

  <g id="seitentitel" data-pptx-bounds="64 56 1152 100" fill="#1C1C1A">
    <rect x="64" y="58" width="4" height="26" fill="#12525C" />
    <text x="80" y="78" font-size="18" font-weight="bold" letter-spacing="1.6" fill="#12525C">RECHTSGRUNDLAGEN</text>
    <text x="64" y="128" font-family="Cambria" font-size="44" font-weight="bold">Zwei Gesetze – in je einem Satz</text>
    <line x1="64" y1="152" x2="1216" y2="152" stroke="#D8D3C8" stroke-width="1" />
  </g>

  <g id="hierarchie" data-pptx-bounds="64 196 596 346">
    <g id="hierarchie-pfeil" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="downArrow" data-pptx-frame="64 206 34 292" fill="#E1EDEF" stroke="#6E9EA8" stroke-width="1.5">
<path d="M 64 481 L 72.5 481 L 72.5 206 L 89.5 206 L 89.5 481 L 98 481 L 81 498 Z" />
</g>
    <rect x="116" y="206" width="544" height="52" rx="4" fill="#12525C" />
    <text x="136" y="240" font-size="20" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="168" y="240" font-size="22" fill="#FFFFFF">Vermeidung</text>
    <rect x="116" y="266" width="544" height="52" rx="4" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1" />
    <text x="136" y="300" font-size="20" font-weight="bold" fill="#12525C">2</text>
    <text x="168" y="300" font-size="22" fill="#1C1C1A">Vorbereitung zur Wiederverwendung</text>
    <rect x="116" y="326" width="544" height="52" rx="4" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1" />
    <text x="136" y="360" font-size="20" font-weight="bold" fill="#12525C">3</text>
    <text x="168" y="360" font-size="22" fill="#1C1C1A">Recycling</text>
    <rect x="116" y="386" width="544" height="52" rx="4" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1" />
    <text x="136" y="420" font-size="20" font-weight="bold" fill="#12525C">4</text>
    <text x="168" y="420" font-size="22" fill="#1C1C1A">Sonstige Verwertung, z. B. energetisch</text>
    <rect x="116" y="446" width="544" height="52" rx="4" fill="#FFFFFF" stroke="#D8D3C8" stroke-width="1" />
    <text x="136" y="480" font-size="20" font-weight="bold" fill="#12525C">5</text>
    <text x="168" y="480" font-size="22" fill="#1C1C1A">Beseitigung</text>
    <text x="116" y="530" font-size="15" fill="#8A8A82">Abfallhierarchie nach § 6 Abs. 1 KrWG</text>
