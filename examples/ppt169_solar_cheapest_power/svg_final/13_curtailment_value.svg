  <g id="p13-headline" data-pptx-bounds="72 100 1136 112">
    <text font-size="44" fill="#111111" font-weight="bold" x="72" y="140">弃电与负电价同步上升，</text><text font-size="44" fill="#111111" font-weight="bold" x="72" y="194">光伏卖出的每度电正在贬值</text></g>

  <g id="p13-curtail" data-pptx-bounds="72 240 560 202">
    <text x="72" y="264" font-size="24" font-weight="bold" fill="#111111">弃电：可治理，但治理有代价</text>
    <text font-size="18" fill="#1A1A1A" x="72" y="302">中国 2010 年代初弃风弃光率曾达 15%，经省级</text><text font-size="18" fill="#1A1A1A" x="72" y="328">&lt;5% 目标、电价改革与年均 USD 880 亿电网投资</text><text font-size="18" fill="#1A1A1A" x="72" y="354">降至 3% 以下；2024 年为缓解拥堵将高渗透率省</text><text font-size="18" fill="#1A1A1A" x="72" y="380"><tspan>份上限由 5% 提高到 10%，弃光率升至 <tspan font-weight="bold" fill="#C8102E">3.2%</tspan></tspan></text><text font-size="18" fill="#1A1A1A" x="72" y="406">加州 2024 年 CAISO 弃电 340 万 MWh（+29%），光伏</text><text font-size="18" fill="#1A1A1A" x="72" y="432">占 93%；WEIM 当年避免逾 274,000 MWh 弃电</text></g>

  <g id="p13-capture" data-pptx-bounds="72 462 560 180">
    <text x="72" y="488" font-size="24" font-weight="bold" fill="#111111">价值贬损：捕获率同步崩塌</text>
    <text font-size="18" fill="#1A1A1A" x="72" y="526">捕获系数（2025 → 2026 同月）：法国 <tspan font-weight="bold" fill="#C8102E">0.42 → 0.10</tspan></text><text font-size="18" fill="#1A1A1A" x="72" y="552">德国 0.40 → 0.26 · 波兰 0.54 → 0.40</text><text font-size="18" fill="#1A1A1A" x="72" y="578">意大利 0.75 → 0.71 · 西班牙 0.71 → 0.18</text><text font-size="18" fill="#1A1A1A" x="72" y="604">德国 2024 捕获电价 EUR 47/MWh、捕获率 59%（欧洲最低）</text><text font-size="18" fill="#1A1A1A" x="72" y="630">2025 年约 54%，2022 年曾达 98%</text></g>

