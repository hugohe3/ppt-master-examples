  <g id="p15-headline" data-pptx-bounds="72 96 1136 62">
    <text x="72" y="140" font-size="44" font-weight="bold" fill="#111111">把预算从最便宜的组件，移到最好的并网位置</text>
  </g>

  <g id="p15-rec-01" data-pptx-bounds="72 194 1136 70">
    <text x="72" y="220" font-family="Arial Black" font-size="24" font-weight="bold" fill="#C8102E">01</text>
    <text x="136" y="220" font-size="24" font-weight="bold" fill="#111111">不要用 2020 年前的价格表做 2026 年的决策</text>
    <text x="136" y="252" font-size="18" fill="#6E6E6E">同一口径下光伏 LCOE 已降 81–90%，且已是多数市场最便宜的新增电源</text>
  </g>

  <line id="p15-rule-1" data-pptx-role="decoration" x1="72" y1="268" x2="1208" y2="268" stroke="#D4D4D4" stroke-width="1" />

  <g id="p15-rec-02" data-pptx-bounds="72 272 1136 70">
    <text x="72" y="298" font-family="Arial Black" font-size="24" font-weight="bold" fill="#C8102E">02</text>
    <text x="136" y="298" font-size="24" font-weight="bold" fill="#111111">但也不要假设它会一直更便宜</text>
    <text x="136" y="330" font-size="18" fill="#6E6E6E">两条独立序列都在 2021 年触底并回升；低价含卖方亏损；WACC 4.2%→10.0% 使 LCOE $53→$83</text>
  </g>

  <line id="p15-rule-2" data-pptx-role="decoration" x1="72" y1="346" x2="1208" y2="346" stroke="#D4D4D4" stroke-width="1" />

  <g id="p15-rec-03" data-pptx-bounds="72 350 1136 70">
    <text x="72" y="376" font-family="Arial Black" font-size="24" font-weight="bold" fill="#C8102E">03</text>
    <text x="136" y="376" font-size="24" font-weight="bold" fill="#111111">把重心从「买便宜组件」转向「买可调度性与并网位置」</text>
    <text x="136" y="408" font-size="18" fill="#6E6E6E">成本中心已从组件转向 BOS 与储能；储能 LCOS 2020–2026 上涨 39%；firm LCOE（USD 54–82/MWh）已是可用指标</text>
  </g>

  <line id="p15-rule-3" data-pptx-role="decoration" x1="72" y1="424" x2="1208" y2="424" stroke="#D4D4D4" stroke-width="1" />

  <g id="p15-rec-04" data-pptx-bounds="72 428 1136 70">
    <text x="72" y="454" font-family="Arial Black" font-size="24" font-weight="bold" fill="#C8102E">04</text>
    <text x="136" y="454" font-size="24" font-weight="bold" fill="#111111">稀缺资源是并网容量与消纳空间，不是价格</text>
    <text x="136" y="486" font-size="18" fill="#6E6E6E">美国队列中位等待 61 个月、全球 3,000 GW 排队；排在队列里的便宜电不产生度电价值</text>
  </g>

