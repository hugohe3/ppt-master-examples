  <g id="p04-branch-03" data-pptx-bounds="840 470 368 162">
    <text x="840" y="492" font-size="18" fill="#C8102E">什么时候它不便宜？</text>
    <text font-size="24" fill="#111111" font-weight="bold" x="840" y="530">真正的稀缺是并网</text><text font-size="24" fill="#111111" font-weight="bold" x="840" y="566">容量与消纳空间</text><text font-size="18" fill="#6E6E6E" x="840" y="598">美国并网中位等待</text><text font-size="18" fill="#6E6E6E" x="840" y="624">已达 61 个月</text></g>

