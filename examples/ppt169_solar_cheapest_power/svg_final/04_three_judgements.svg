  <g id="p04-num-01" data-pptx-bounds="72 334 140 128">
    <text x="72" y="420" font-family="Arial Black" font-size="96" font-weight="bold" fill="#111111">01</text>
  </g>
  <g id="p04-branch-01" data-pptx-bounds="72 470 368 162">
    <text x="72" y="492" font-size="18" fill="#C8102E">便宜从哪来？</text>
    <text x="72" y="530" font-size="24" font-weight="bold" fill="#111111">成本下降来自学习率</text>
    <text font-size="18" fill="#6E6E6E" x="72" y="598">累计装机每翻一番，</text><text font-size="18" fill="#6E6E6E" x="72" y="624">组件价格下降 20%</text></g>

  <g id="p04-num-02" data-pptx-bounds="456 334 140 128">
    <text x="456" y="420" font-family="Arial Black" font-size="96" font-weight="bold" fill="#111111">02</text>
  </g>
  <g id="p04-branch-02" data-pptx-bounds="456 470 368 162">
    <text x="456" y="492" font-size="18" fill="#C8102E">还会继续便宜吗？</text>
    <text font-size="24" fill="#111111" font-weight="bold" x="456" y="530">成本中心已从组件</text><text font-size="24" fill="#111111" font-weight="bold" x="456" y="566">挪到 BOS 与储能</text><text font-size="18" fill="#6E6E6E" x="456" y="598">2024 年组件只占</text><text font-size="18" fill="#6E6E6E" x="456" y="624">系统成本的 30%</text></g>

  <g id="p04-num-03" data-pptx-bounds="840 334 140 128">
    <text x="840" y="420" font-family="Arial Black" font-size="96" font-weight="bold" fill="#111111">03</text>
