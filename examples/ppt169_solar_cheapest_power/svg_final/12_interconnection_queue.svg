  <g id="p12-queue" data-pptx-bounds="672 238 536 152">
    <text x="672" y="264" font-size="24" font-weight="bold" fill="#111111">队列里有什么</text>
    <text font-size="18" fill="#1A1A1A" x="672" y="302">8,244 个项目、约 <tspan font-weight="bold" fill="#C8102E">2,061 GW</tspan>（2025 年底）</text><text font-size="18" fill="#6E6E6E" x="672" y="328">光伏 773 GW（−19%）· 储能 749 GW（−16%）</text><text font-size="18" fill="#6E6E6E" x="672" y="354">风电 220 GW（−19%）· 天然气 253 GW（+86%）</text><text font-size="18" fill="#6E6E6E" x="672" y="380">另有 549 GW 已签或已出草签并网协议未投运</text></g>

  <g id="p12-global" data-pptx-bounds="672 422 536 194">
    <text x="672" y="448" font-size="24" font-weight="bold" fill="#111111">全球尺度</text>
    <text font-size="18" fill="#1A1A1A" x="672" y="486">至少 3,000 GW 可再生项目在接入队列等待，</text><text font-size="18" fill="#1A1A1A" x="672" y="512">其中 1,500 GW 已进入后期阶段——相当于</text><text font-size="18" fill="#1A1A1A" x="672" y="538">2022 年全球新增风光装机的五倍</text><text font-size="18" fill="#1A1A1A" x="672" y="574">2040 年前需新增或更换 <tspan font-weight="bold" fill="#C8102E">8,000 万公里</tspan>输配</text><text font-size="18" fill="#1A1A1A" x="672" y="600">电线路，相当于现有全球电网的总长度</text></g>

