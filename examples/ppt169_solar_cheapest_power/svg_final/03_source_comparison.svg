    <text font-size="18" fill="#1A1A1A" x="872" y="264">Lazard 原文：该分析不考虑部分</text><text font-size="18" fill="#1A1A1A" x="872" y="290">可再生技术的间歇性特征，也不</text><text font-size="18" fill="#1A1A1A" x="872" y="316">考虑新增可再生部署带来的电网</text><text font-size="18" fill="#1A1A1A" x="872" y="342">影响。</text></g>

  <g id="p03-irena" data-pptx-bounds="872 380 336 156">
    <text font-size="18" fill="#1A1A1A" x="872" y="408">IRENA 全球口径（2024）：</text><text font-size="18" fill="#1A1A1A" x="872" y="434">新建光伏比最低成本化石方案</text><text font-size="18" fill="#1A1A1A" x="872" y="460"><tspan>便宜 <tspan fill="#C8102E" font-weight="bold">41%</tspan>，陆上风电便宜 53%；</tspan></text><text font-size="18" fill="#1A1A1A" x="872" y="486">当年投产的新建可再生项目中，</text><text font-size="18" fill="#1A1A1A" x="872" y="512"><tspan><tspan fill="#C8102E" font-weight="bold">91%</tspan> 成本低于新建化石机组</tspan></text></g>

  <g id="p03-geography" data-pptx-bounds="872 542 336 112">
    <text font-size="18" fill="#1A1A1A" x="872" y="560">「最便宜」不是全球均匀的</text><text font-size="18" fill="#6E6E6E" x="872" y="586">中国 0.036 ｜ 印度 0.035 ｜</text><text font-size="18" fill="#6E6E6E" x="872" y="612">美国 0.062 ｜ 德国 0.065</text><text font-size="18" fill="#6E6E6E" x="872" y="638">日本 0.123（2024，约中国 3.7 倍）</text></g>

