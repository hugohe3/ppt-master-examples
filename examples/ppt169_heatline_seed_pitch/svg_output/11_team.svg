    <text x="461" y="440" font-size="18" fill="#1F2733">Eleven years building constraint-<tspan x="461" dy="24">solver scheduling for logistics</tspan><tspan x="461" dy="24">fleets. Owns the planner and the</tspan><tspan x="461" dy="24">solver.</tspan></text>
