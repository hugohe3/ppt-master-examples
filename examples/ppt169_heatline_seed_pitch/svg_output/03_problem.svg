<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Calibri, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="photoFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBF7F1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FBF7F1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FBF7F1"/>
  <g id="problem-photo" data-pptx-bounds="1000 0 280 720">
    <image href="../images/problem_capacity_yard.jpg" x="1000" y="0" width="280" height="720" preserveAspectRatio="xMidYMid slice"/>
    <rect x="1000" y="0" width="120" height="720" fill="url(#photoFade)"/>
  </g>
  <g id="page-header" data-pptx-bounds="64 66 896 69">
    <text id="page-claim" x="64" y="104" font-family="Arial Black, sans-serif" font-size="42" fill="#16233A">The bottleneck is people.</text>
    <line id="claim-rule" data-pptx-role="decoration" x1="64" y1="132" x2="960" y2="132" stroke="#16233A" stroke-width="2"/>
  </g>
  <g id="shortage-figure" data-pptx-bounds="64 164 896 195">
    <text x="64" y="256" font-family="Arial Black, sans-serif" font-size="108" fill="#D65A1E">750,000</text>
    <text x="64" y="306" font-size="30" fill="#16233A">more installers Europe needs — and at least half of<tspan x="64" dy="42">today&apos;s installers must be reskilled for heat pumps.</tspan></text>
  </g>
  <g id="capacity-gap" data-pptx-bounds="64 360 896 200">
    <path id="capacity-gap-area" d="M 100 500 C 320 486 520 436 900 388 L 900 484 C 520 498 320 506 100 512 Z" fill="#D65A1E" fill-opacity="0.14"/>
    <path id="capacity-gap-demand" d="M 100 500 C 320 486 520 436 900 388" fill="none" stroke="#16233A" stroke-width="3" stroke-linecap="round"/>
    <path id="capacity-gap-supply" d="M 100 512 C 320 506 520 498 900 484" fill="none" stroke="#2E6F5E" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="530" x2="900" y2="530" stroke="#C9BCA8" stroke-width="1"/>
    <text x="900" y="380" font-size="18" fill="#16233A" text-anchor="end">Required installation capacity</text>
    <text x="900" y="512" font-size="18" fill="#2E6F5E" text-anchor="end">Installer headcount</text>
    <text x="640" y="460" font-family="Consolas, monospace" font-size="20" letter-spacing="2" fill="#D65A1E" text-anchor="middle">THE GAP</text>
    <text x="100" y="392" font-size="18" fill="#6B6154">Schematic — shape of the gap, not a measured series.</text>
    <text x="100" y="552" font-size="18" fill="#6B6154">2022</text>
    <text x="900" y="552" font-size="18" fill="#6B6154" text-anchor="end">2030</text>
  </g>
  <g id="installer-evidence" data-pptx-bounds="64 578 896 72">
    <rect x="64" y="578" width="3" height="72" fill="#D65A1E"/>
    <text x="80" y="594" font-size="18" fill="#1F2733">In a survey of 345 installers, 30% named staffing the top barrier — 41% at firms with 6+ staff.<tspan x="80" dy="24">Lack of demand ranked higher overall (41%); staffing binds firms that already have work.</tspan><tspan x="80" dy="24">UK: about 3,000 heat-pump engineers today against at least 27,000 needed by 2028.</tspan></text>
  </g>
  <g id="page-sources" data-pptx-bounds="64 652 896 28">
    <text x="64" y="668" font-size="16" fill="#6B6154">Sources: European Commission · EHPA · Nesta · retrieved 2026-09-10</text>
  </g>
</svg>
