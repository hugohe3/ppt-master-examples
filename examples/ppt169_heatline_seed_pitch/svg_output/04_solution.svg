    <text x="640" y="452" font-family="Consolas, monospace" font-size="20" letter-spacing="2" fill="#D65A1E" text-anchor="middle">THROUGHPUT</text>
    <text x="100" y="392" font-size="18" fill="#6B6154">Same schematic. The lever is jobs completed per engineer, not new hires.</text>
    <text x="100" y="552" font-size="18" fill="#6B6154">2022</text>
    <text x="900" y="552" font-size="18" fill="#6B6154" text-anchor="end">2030</text>
