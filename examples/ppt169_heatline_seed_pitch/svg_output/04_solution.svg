    <text x="208" y="221" font-size="24" fill="#FBF7F1" text-anchor="middle">Forecast capacity</text>
    <text x="480" y="221" font-size="24" fill="#FBF7F1" text-anchor="middle">Sequence the chain</text>
    <text x="752" y="221" font-size="24" fill="#FBF7F1" text-anchor="middle">Hold the paperwork</text>
    <text x="101" y="290" font-size="18" fill="#1F2733">by crew and accreditation,<tspan x="101" dy="24">months ahead</tspan></text>
    <text x="373" y="290" font-size="18" fill="#1F2733">survey → install → commission,<tspan x="373" dy="24">against part lead times</tspan></text>
    <text x="645" y="290" font-size="18" fill="#1F2733">grant and compliance kept<tspan x="645" dy="24">on the same job record</tspan></text>
