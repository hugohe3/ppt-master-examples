    <text x="1140" y="500" font-size="40" fill="#A8502A">怎么过</text>
    <text x="1140" y="575" font-size="68" font-family="KaiTi" fill="#33302A">昼夜刚好一样长，<tspan x="1140" dy="85">去菜场逛一逛。</tspan></text>
    <text x="1140" y="730" font-size="30" fill="#33302A" fill-opacity="0.65">秋祭月、送秋牛、放风筝、吃秋菜</text>
  </g>

  <g id="harvest-fact" data-pptx-bounds="580 640 520 165">
    <text x="600" y="700" font-size="40" fill="#6F8C5A">这天全国的农民过节</text>
