    <text x="130" y="550" font-size="40" fill="#33302A">雷于二月阳中发生，<tspan x="130" dy="50">八月阴中收声。</tspan></text>
    <text x="130" y="665" font-size="40" fill="#33302A" fill-opacity="0.8">二候　蛰虫坯户</text>
    <text x="130" y="715" font-size="40" fill="#33302A" fill-opacity="0.8">三候　水始涸</text>
    <text x="130" y="760" font-size="30" fill="#33302A" fill-opacity="0.6">《月令七十二候集解》</text>
  </g>

  <g id="term-how" data-pptx-bounds="1100 430 720 350">
    <g id="p05-how-fold" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="foldedCorner" data-pptx-frame="1100 440 700 250" fill="#FBF6EA" stroke="#33302A" stroke-width="3" stroke-opacity="0.5">
