      <path d="M 1758.33 690 L 1766.67 656.67 L 1800 648.33 Z" fill="#CECAC0" stroke="none"/>
      <path d="M 1758.33 690 L 1766.67 656.67 L 1800 648.33 L 1758.33 690 L 1100 690 L 1100 440 L 1800 440 L 1800 648.33" fill="none"/>
