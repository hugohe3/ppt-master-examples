  <g id="page-title" data-pptx-bounds="80 160 1020 112">
    <text font-weight="bold" fill="#16232E" font-size="44" x="80" y="200">Every figure above is one link from its</text><text font-weight="bold" fill="#16232E" font-size="44" x="80" y="254">primary source</text></g>

  <g id="page-lead" data-pptx-bounds="80 290 1020 80">
    <text fill="#4A6B7C" font-size="30" x="80" y="316">Where credible sources disagree, this memo names the disagreement</text><text fill="#4A6B7C" font-size="30" x="80" y="358">rather than reconciling it.</text></g>

  <g id="standing-limitations" data-pptx-bounds="80 404 1020 220" fill="#16232E" font-size="16">
    <text x="80" y="420">Standing limitations that apply to every study below: management self-selects participation; company financial data is self-reported;</text><text x="80" y="444">control arms are absent, small or non-random; and follow-up samples shrink.</text><text x="80" y="482">Definitions: 100-80-100 is 100% pay for 80% of the time at 100% output, as defined by 4 Day Week Global. “Continuation” means still</text><text x="80" y="506">operating the policy, which is not the same as a contractual entitlement. “Not statistically significant” is the reporting authors’ own</text><text x="80" y="530">wording.</text><text x="80" y="568">Deliberately not claimed: any figure for this firm; any productivity forecast; any saving derived from the 2014 replacement-cost figure as</text><text x="80" y="592">anything other than illustrative arithmetic. The named company accounts (Awin, Atom bank) are self-published, not independent</text><text x="80" y="616">evaluations.</text></g>

