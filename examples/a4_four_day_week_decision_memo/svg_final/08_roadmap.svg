  <g id="phase-redesign-margin" data-pptx-bounds="80 564 330 104">
    <text font-weight="bold" fill="#16232E" font-size="30" x="80" y="590">Phase 0</text><text font-weight="bold" fill="#16232E" font-size="30" x="80" y="626">Redesign</text><text x="80" y="660" font-size="20" fill="#5C6871">Weeks 1–10 · COO</text>
  </g>

  <g id="phase-redesign" data-pptx-bounds="460 566 700 112">
    <text fill="#16232E" font-size="26" x="460" y="590">Cut meeting length and frequency and reform email</text><text fill="#16232E" font-size="26" x="460" y="628">etiquette — the pilots’ most common changes. Agree</text><text fill="#16232E" font-size="26" x="460" y="666">the metric set and the client communication plan.</text></g>

  <g id="phase-operate-margin" data-pptx-bounds="80 724 330 104">
    <text font-weight="bold" fill="#16232E" font-size="30" x="80" y="750">Phase 1</text><text font-weight="bold" fill="#16232E" font-size="30" x="80" y="786">Operate</text><text x="80" y="820" font-size="20" fill="#5C6871">Months 1–6 · Practice heads</text>
  </g>

  <g id="phase-operate" data-pptx-bounds="460 726 700 74">
    <text fill="#16232E" font-size="26" x="460" y="750">Two practice groups, a universal day off, contractual</text><text fill="#16232E" font-size="26" x="460" y="788">position unchanged.</text></g>

  <g id="gate-a-margin" data-pptx-bounds="80 884 330 104">
    <text font-weight="bold" fill="#B4471C" font-size="30" x="80" y="910">Gate A</text><text font-weight="bold" fill="#B4471C" font-size="30" x="80" y="946">Interim read</text><text x="80" y="980" font-size="20" fill="#5C6871">Month 3 · Executive committee</text>
  </g>

  <g id="gate-a" data-pptx-bounds="460 886 700 148">
    <text fill="#16232E" font-size="26" x="460" y="910">Are the kill criteria holding? Most Portuguese indicators</text><text fill="#16232E" font-size="26" x="460" y="948">slipped between three and six months for reasons the</text><text fill="#16232E" font-size="26" x="460" y="986">authors could not fully explain, so month 3 is the</text><text fill="#16232E" font-size="26" x="460" y="1024">high-water mark, not the trend.</text></g>

  <g id="phase-evaluate-margin" data-pptx-bounds="80 1084 330 104">
    <text font-weight="bold" fill="#16232E" font-size="30" x="80" y="1110">Phase 2</text><text font-weight="bold" fill="#16232E" font-size="30" x="80" y="1146">Evaluate</text><text x="80" y="1180" font-size="20" fill="#5C6871">Month 7 · Finance director</text>
  </g>

  <g id="phase-evaluate" data-pptx-bounds="460 1086 700 112">
    <text fill="#16232E" font-size="26" x="460" y="1110">Compare against the non-participating practice groups</text><text fill="#16232E" font-size="26" x="460" y="1148">as a control — the design Portugal used and the UK</text><text fill="#16232E" font-size="26" x="460" y="1186">2022 pilot lacked.</text></g>

  <g id="gate-b-margin" data-pptx-bounds="80 1244 330 104">
    <text font-weight="bold" fill="#B4471C" font-size="30" x="80" y="1270">Gate B</text><text font-weight="bold" fill="#B4471C" font-size="30" x="80" y="1306">Decide</text><text x="80" y="1340" font-size="20" fill="#5C6871">Month 8 · Executive committee</text>
  </g>

  <g id="gate-b" data-pptx-bounds="460 1246 700 74">
    <text fill="#16232E" font-size="26" x="460" y="1270">Extend, adjust, or stop. A decision to extend is a</text><text fill="#16232E" font-size="26" x="460" y="1308">decision to reopen contracts.</text></g>

