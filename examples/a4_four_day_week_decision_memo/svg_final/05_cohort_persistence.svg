    <text x="80" y="990" font-size="16" font-weight="bold" letter-spacing="1.6" fill="#B4471C">NOT AN ENTITLEMENT</text>
    <text fill="#5C6871" font-size="20" x="80" y="1024">UK twelve-month follow-up,</text><text fill="#5C6871" font-size="20" x="80" y="1050">28 organisations.</text><text x="80" y="1090" font-size="16" fill="#6E777E">F025</text>
  </g>

  <g id="qualification-entitlement" data-pptx-bounds="460 968 700 184">
    <text fill="#16232E" font-size="26" x="460" y="990">Of the 28 organisations in the twelve-month follow-up,</text><text fill="#16232E" font-size="26" x="460" y="1028">39% were permanent with updated terms and</text><text fill="#16232E" font-size="26" x="460" y="1066">conditions and 39% were permanent without changing</text><text fill="#16232E" font-size="26" x="460" y="1104">contracts — an opt-in policy the employer can withdraw</text><text fill="#16232E" font-size="26" x="460" y="1142">at will.</text></g>

  <g id="qualification-base-margin" data-pptx-bounds="80 1246 330 120">
    <text x="80" y="1260" font-size="16" font-weight="bold" letter-spacing="1.6" fill="#6E777E">BASE SIZE</text>
    <text fill="#5C6871" font-size="20" x="80" y="1294">Continuation rates against</text><text fill="#5C6871" font-size="20" x="80" y="1320">their cohort size.</text><text x="80" y="1360" font-size="16" fill="#6E777E">F029 · F071</text>
  </g>

  <g id="qualification-base" data-pptx-bounds="460 1228 700 222">
    <text fill="#16232E" font-size="26" x="460" y="1250">A 100% continuation rate on 17 self-selected</text><text fill="#16232E" font-size="26" x="460" y="1288">companies is a weaker signal than 89% on 61, and this</text><text fill="#16232E" font-size="26" x="460" y="1326">memo does not lead with it. Universal or staggered</text><text fill="#16232E" font-size="26" x="460" y="1364">day-off models converted to permanence in 95% of</text><text fill="#16232E" font-size="26" x="460" y="1402">cases against 60% for flexible ones — on a sample the</text><text fill="#16232E" font-size="26" x="460" y="1440">authors call too small for significance.</text></g>

