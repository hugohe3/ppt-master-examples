    <text x="80" y="1668" font-size="16" fill="#5C6871">Sources: Autonomy (2023) · Portugal final report (2024) · Germany pilot (2024) · Awin · Oxford Economics (2014)</text>
    <text x="1160" y="1668" font-size="16" text-anchor="end" fill="#5C6871">10 September 2026 · Page 3 of 10</text>
  </g>
</svg>
