<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" font-family="Arial" data-pptx-page-role="content">
  <rect id="page-field" x="0" y="0" width="1240" height="1754" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-role="header" data-pptx-bounds="80 96 1080 41">
    <text x="80" y="112" font-size="16" letter-spacing="1.6" fill="#5C6871">FOUR-DAY WEEK — DECISION MEMO</text>
    <text x="1160" y="112" font-size="16" text-anchor="end" fill="#5C6871">3 · Driver decomposition</text>
    <line x1="80" y1="132" x2="1160" y2="132" stroke="#D6D2C9" stroke-width="1"/>
  </g>

  <g id="page-title" data-pptx-bounds="80 160 1020 112">
    <text x="80" y="200" font-size="44" font-weight="bold" fill="#16232E"><tspan x="80" dy="0">Three of the four drivers are ours; the one</tspan><tspan x="80" dy="54">that stopped a consultancy is not</tspan></text>
  </g>

  <g id="page-lead" data-pptx-bounds="80 290 1020 78">
    <text x="80" y="316" font-size="30" fill="#4A6B7C"><tspan x="80" dy="0">Whether 100-80-100 holds here is decided by four conditions, and only</tspan><tspan x="80" dy="42">one of them sits outside our control.</tspan></text>
  </g>

  <g id="governing-question" data-pptx-bounds="80 368 1080 132">
    <rect x="80" y="370" width="1080" height="130" fill="#F2F0EB"/>
    <text x="104" y="418" font-size="26" fill="#16232E"><tspan x="104" dy="0">Governing question: how many hours can this firm recover through redesign, and</tspan><tspan x="104" dy="38">what does removing the rest cost in client service?</tspan></text>
  </g>

  <g id="control-boundary" data-pptx-bounds="200 502 400 24">
    <text x="200" y="518" font-size="16" font-weight="bold" letter-spacing="1.6" fill="#5C6871">WITHIN OUR CONTROL</text>
  </g>

  <g id="p03-control-brace" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="leftBrace" data-pptx-frame="120 530 40 668" fill="none" stroke="#5C6871" stroke-width="2">
<path d="M 160 1198 A 20 3.33 0 0 1 140 1194.67 L 140 867.33 A 20 3.33 0 0 0 120 864 A 20 3.33 0 0 0 140 860.67 L 140 533.33 A 20 3.33 0 0 1 160 530 Z" stroke="none"/>
<path d="M 160 1198 A 20 3.33 0 0 1 140 1194.67 L 140 867.33 A 20 3.33 0 0 0 120 864 A 20 3.33 0 0 0 140 860.67 L 140 533.33 A 20 3.33 0 0 1 160 530"/>
</g>

  <g id="driver-recoverable-hours" data-pptx-bounds="200 530 960 208">
    <text x="200" y="564" font-size="34" font-weight="bold" fill="#16232E">1 Recoverable hours</text>
    <text x="1160" y="564" font-size="16" text-anchor="end" fill="#6E777E">F021 · F050</text>
    <text x="200" y="610" font-size="26" fill="#16232E"><tspan x="200" dy="0">The pilots’ main levers were shorter and fewer meetings with clearer</tspan><tspan x="200" dy="38">agendas, email-etiquette reform, protected focus periods and automated</tspan><tspan x="200" dy="38">reporting. Germany’s participants named meeting culture and reduced</tspan><tspan x="200" dy="38">distraction as their main efficiency levers.</tspan></text>
  </g>

  <g id="driver-redesign-effort" data-pptx-bounds="200 760 960 208">
    <text x="200" y="794" font-size="34" font-weight="bold" fill="#16232E">2 Redesign effort</text>
    <text x="1160" y="794" font-size="16" text-anchor="end" fill="#6E777E">F045</text>
    <text x="200" y="840" font-size="26" fill="#16232E"><tspan x="200" dy="0">Only 8% of Portuguese companies that made two or more organisational</tspan><tspan x="200" dy="38">changes reverted to five days, against 38% of those that made none or</tspan><tspan x="200" dy="38">one. Three-quarters made at least one change, and 87% reported active</tspan><tspan x="200" dy="38">worker participation in redesigning processes.</tspan></text>
  </g>

  <g id="driver-retention-economics" data-pptx-bounds="200 990 960 208">
    <text x="200" y="1024" font-size="34" font-weight="bold" fill="#16232E">3 Retention economics</text>
    <text x="1160" y="1024" font-size="16" text-anchor="end" fill="#6E777E">F008 · F065 · F070</text>
    <text x="200" y="1070" font-size="26" fill="#16232E"><tspan x="200" dy="0">Resignations fell from 2.0 to 0.8 per 100 employees in the UK pilot, and</tspan><tspan x="200" dy="38">Awin reports regrettable turnover down 33%. The most-cited UK</tspan><tspan x="200" dy="38">replacement cost, £30,614, is a 2014 figure and is not inflation-adjusted,</tspan><tspan x="200" dy="38">so any saving from it is illustrative arithmetic.</tspan></text>
  </g>

  <g id="driver-client-tolerance" data-pptx-bounds="200 1228 960 322">
    <line x1="200" y1="1230" x2="1160" y2="1230" stroke="#D6D2C9" stroke-width="1"/>
    <text x="200" y="1294" font-size="34" font-weight="bold" fill="#16232E">4 Client tolerance</text>
    <use data-icon="chunk-filled/triangle-exclamation" x="530" y="1270" width="28" height="28" fill="#B4471C"/>
    <text x="572" y="1294" font-size="16" font-weight="bold" letter-spacing="1.6" fill="#B4471C">EXTERNAL — NOT OURS TO DECIDE</text>
    <text x="1160" y="1294" font-size="16" text-anchor="end" fill="#6E777E">F028 · F037</text>
    <text x="200" y="1340" font-size="26" fill="#16232E"><tspan x="200" dy="0">The cohort’s only twelve-month discontinuation was a small consultancy</tspan><tspan x="200" dy="38">that stopped over client and stakeholder expectations. Belgium’s</tspan><tspan x="200" dy="38">reduced-hours pilot drew one fully participating company, citing sectoral</tspan><tspan x="200" dy="38">expectation.</tspan></text>
    <text x="200" y="1500" font-size="26" fill="#B4471C"><tspan x="200" dy="0">Three drivers respond to preparation; this one responds only to client</tspan><tspan x="200" dy="38">evidence.</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="80 1632 1080 42">
