    <text x="1160" y="112" font-size="16" text-anchor="end" fill="#5C6871">8 · Roadmap</text>
    <line x1="80" y1="132" x2="1160" y2="132" stroke="#D6D2C9" stroke-width="1"/>
  </g>

  <g id="page-title" data-pptx-bounds="80 160 1020 58">
    <text x="80" y="200" font-size="44" font-weight="bold" fill="#16232E">Two gates, and the firm can stop at either one</text>
  </g>

  <g id="page-lead" data-pptx-bounds="80 234 1020 80">
    <text x="80" y="260" font-size="30" fill="#4A6B7C"><tspan x="80" dy="0">The pilot is reversible by design, and the points of reversal are fixed</tspan><tspan x="80" dy="42">before it starts.</tspan></text>
  </g>

  <g id="pilot-band" data-pptx-bounds="80 388 1080 120">
    <text x="646" y="406" font-size="20" text-anchor="middle" fill="#B4471C">Gate A</text>
    <text x="1160" y="406" font-size="20" text-anchor="end" fill="#B4471C">Gate B</text>
    <rect x="80" y="420" width="257" height="56" fill="#4A6B7C"/>
    <rect x="337" y="420" width="617" height="56" fill="#16232E"/>
    <rect x="954" y="420" width="206" height="56" fill="#4A6B7C"/>
