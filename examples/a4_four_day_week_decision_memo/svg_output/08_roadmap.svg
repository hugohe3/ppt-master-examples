  <g id="phase-redesign-margin" data-pptx-bounds="80 564 330 104">
    <text x="80" y="590" font-size="30" font-weight="bold" fill="#16232E"><tspan x="80" dy="0">Phase 0</tspan><tspan x="80" dy="36">Redesign</tspan></text>
    <text x="80" y="660" font-size="20" fill="#5C6871">Weeks 1–10 · COO</text>
  </g>

  <g id="phase-redesign" data-pptx-bounds="460 566 700 112">
    <text x="460" y="590" font-size="26" fill="#16232E"><tspan x="460" dy="0">Cut meeting length and frequency and reform email</tspan><tspan x="460" dy="38">etiquette — the pilots’ most common changes. Agree</tspan><tspan x="460" dy="38">the metric set and the client communication plan.</tspan></text>
  </g>

  <g id="phase-operate-margin" data-pptx-bounds="80 724 330 104">
    <text x="80" y="750" font-size="30" font-weight="bold" fill="#16232E"><tspan x="80" dy="0">Phase 1</tspan><tspan x="80" dy="36">Operate</tspan></text>
    <text x="80" y="820" font-size="20" fill="#5C6871">Months 1–6 · Practice heads</text>
  </g>

  <g id="phase-operate" data-pptx-bounds="460 726 700 74">
    <text x="460" y="750" font-size="26" fill="#16232E"><tspan x="460" dy="0">Two practice groups, a universal day off, contractual</tspan><tspan x="460" dy="38">position unchanged.</tspan></text>
  </g>

  <g id="gate-a-margin" data-pptx-bounds="80 884 330 104">
    <text x="80" y="910" font-size="30" font-weight="bold" fill="#B4471C"><tspan x="80" dy="0">Gate A</tspan><tspan x="80" dy="36">Interim read</tspan></text>
    <text x="80" y="980" font-size="20" fill="#5C6871">Month 3 · Executive committee</text>
  </g>

  <g id="gate-a" data-pptx-bounds="460 886 700 148">
    <text x="460" y="910" font-size="26" fill="#16232E"><tspan x="460" dy="0">Are the kill criteria holding? Most Portuguese indicators</tspan><tspan x="460" dy="38">slipped between three and six months for reasons the</tspan><tspan x="460" dy="38">authors could not fully explain, so month 3 is the</tspan><tspan x="460" dy="38">high-water mark, not the trend.</tspan></text>
  </g>

  <g id="phase-evaluate-margin" data-pptx-bounds="80 1084 330 104">
    <text x="80" y="1110" font-size="30" font-weight="bold" fill="#16232E"><tspan x="80" dy="0">Phase 2</tspan><tspan x="80" dy="36">Evaluate</tspan></text>
    <text x="80" y="1180" font-size="20" fill="#5C6871">Month 7 · Finance director</text>
  </g>

  <g id="phase-evaluate" data-pptx-bounds="460 1086 700 112">
    <text x="460" y="1110" font-size="26" fill="#16232E"><tspan x="460" dy="0">Compare against the non-participating practice groups</tspan><tspan x="460" dy="38">as a control — the design Portugal used and the UK</tspan><tspan x="460" dy="38">2022 pilot lacked.</tspan></text>
  </g>

  <g id="gate-b-margin" data-pptx-bounds="80 1244 330 104">
    <text x="80" y="1270" font-size="30" font-weight="bold" fill="#B4471C"><tspan x="80" dy="0">Gate B</tspan><tspan x="80" dy="36">Decide</tspan></text>
    <text x="80" y="1340" font-size="20" fill="#5C6871">Month 8 · Executive committee</text>
  </g>

  <g id="gate-b" data-pptx-bounds="460 1246 700 74">
    <text x="460" y="1270" font-size="26" fill="#16232E"><tspan x="460" dy="0">Extend, adjust, or stop. A decision to extend is a</tspan><tspan x="460" dy="38">decision to reopen contracts.</tspan></text>
  </g>

  <g id="roadmap-scenario-note" data-pptx-bounds="80 1400 1020 30">
    <text x="80" y="1414" font-size="16" fill="#6E777E">Scenario data — owners, dates and phase lengths are illustrative and are the firm’s to set.</text>
  </g>

