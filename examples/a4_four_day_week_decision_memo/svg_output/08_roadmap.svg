    <text x="80" y="500" font-size="20" fill="#5C6871">Weeks 1–10 · Redesign</text>
    <text x="337" y="500" font-size="20" fill="#5C6871">Months 1–6 · Operate</text>
    <text x="954" y="500" font-size="20" fill="#5C6871">Months 7–8 · Decide</text>
