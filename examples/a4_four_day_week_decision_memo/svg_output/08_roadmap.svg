    <g id="p08-gate-b" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="flowChartDecision" data-pptx-frame="1120 428 40 40" fill="#B4471C" stroke="#FFFFFF" stroke-width="2">
