<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" font-family="Arial" data-pptx-page-role="content">
  <rect id="page-field" x="0" y="0" width="1240" height="1754" fill="#FFFFFF"/>

  <g id="page-header" data-pptx-role="header" data-pptx-bounds="80 96 1080 41">
    <text x="80" y="112" font-size="16" letter-spacing="1.6" fill="#5C6871">FOUR-DAY WEEK — DECISION MEMO</text>
    <text x="1160" y="112" font-size="16" text-anchor="end" fill="#5C6871">7 · Recommendation</text>
    <line x1="80" y1="132" x2="1160" y2="132" stroke="#D6D2C9" stroke-width="1"/>
  </g>

  <g id="page-title" data-pptx-bounds="80 160 1020 112">
    <text x="80" y="200" font-size="44" font-weight="bold" fill="#16232E"><tspan x="80" dy="0">Pilot 100-80-100 in two practice groups, after</tspan><tspan x="80" dy="54">ten weeks of redesign</tspan></text>
  </g>

  <g id="the-action" data-pptx-bounds="80 298 1080 184">
    <g id="p07-action-plate" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="80 300 1080 180" data-pptx-av-adj="val 12000" fill="#F2F0EB" stroke="none">
<path d="M 80 300 L 1138.4 300 L 1160 321.6 L 1160 480 L 80 480 Z"/>
</g>
    <text x="120" y="342" font-size="26" fill="#16232E"><tspan x="120" dy="0">Two whole practice groups, about 60 people (illustrative scope), on 100% pay</tspan><tspan x="120" dy="38">and a universal day off with a target 32-hour week. Ten weeks of redesign first,</tspan><tspan x="120" dy="38">six months of operation, one interim gate, and no change to contracts for the</tspan><tspan x="120" dy="38">duration.</tspan></text>
  </g>

  <g id="pilot-band" data-pptx-bounds="80 508 1080 124">
    <rect x="80" y="540" width="300" height="56" fill="#4A6B7C"/>
    <rect x="380" y="540" width="780" height="56" fill="#16232E"/>
    <text x="100" y="576" font-size="22" fill="#FFFFFF">Weeks 1–10 · Redesign</text>
    <text x="400" y="576" font-size="22" fill="#FFFFFF">Months 1–6 · Operate at 100-80-100</text>
    <text x="80" y="624" font-size="16" fill="#5C6871">The pilot is bounded in time and reversible at its interim gate.</text>
  </g>

  <g id="choice-redesign-first" data-pptx-bounds="80 676 1064 110">
    <text x="80" y="700" font-size="26" fill="#16232E"><tspan x="80" dy="0"><tspan font-weight="bold">Redesign before, not during.</tspan></tspan><tspan x="80" dy="38">8% of Portuguese companies reverted after two or more organisational changes,</tspan><tspan x="80" dy="38">against 38% after none or one. Two to three months of preparation is the norm.</tspan></text>
  </g>

  <g id="choice-universal-day" data-pptx-bounds="80 804 1064 110">
    <text x="80" y="828" font-size="26" fill="#16232E"><tspan x="80" dy="0"><tspan font-weight="bold">A universal day off, not a flexible model.</tspan></tspan><tspan x="80" dy="38">Universal or staggered models converted to permanence in 95% of cases against</tspan><tspan x="80" dy="38">60% for flexible ones, on a sample the authors call too small for significance.</tspan></text>
  </g>

  <g id="choice-measure-first" data-pptx-bounds="80 932 1064 110">
    <text x="80" y="956" font-size="26" fill="#16232E"><tspan x="80" dy="0"><tspan font-weight="bold">Measure before you promise.</tspan></tspan><tspan x="80" dy="38">Half the Portuguese companies could not define productivity metrics at all, so the</tspan><tspan x="80" dy="38">metric set is agreed in redesign and published before the pilot starts.</tspan></text>
  </g>

  <g id="choice-no-entitlement" data-pptx-bounds="80 1060 1064 110">
    <text x="80" y="1084" font-size="26" fill="#16232E"><tspan x="80" dy="0"><tspan font-weight="bold">No entitlement.</tspan></tspan><tspan x="80" dy="38">Nearly half the permanent cases in the UK follow-up never changed contracts.</tspan><tspan x="80" dy="38">This pilot is stated as non-contractual in writing.</tspan></text>
  </g>

  <g id="kill-criteria" data-pptx-bounds="80 1208 1064 116">
    <use data-icon="chunk-filled/target" x="80" y="1210" width="28" height="28" fill="#B4471C"/>
    <text x="124" y="1232" font-size="26" fill="#16232E"><tspan x="124" dy="0">Kill criteria, agreed before the start and reviewed at the interim gate: client</tspan><tspan x="124" dy="38">satisfaction, on-time delivery, realisation, utilisation, voluntary attrition.</tspan></text>
    <text x="124" y="1314" font-size="16" fill="#6E777E">Scenario data — thresholds are the firm’s to set and are illustrative here.</text>
  </g>

  <g id="not-recommended" data-pptx-bounds="80 1354 1032 154">
    <rect x="80" y="1356" width="5" height="150" fill="#4A6B7C"/>
    <text x="112" y="1380" font-size="26" fill="#16232E"><tspan x="112" dy="0"><tspan font-weight="bold">Not recommended, and why:</tspan></tspan><tspan x="112" dy="38">a firm-wide permanent commitment, which has no evidence at this scale or</tspan><tspan x="112" dy="38">sector; a compressed four-day week, which keeps total hours; and an hours cut</tspan><tspan x="112" dy="38">spread across five days, which drifts from the intervention tested.</tspan></text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="80 1632 1080 42">
    <line x1="80" y1="1636" x2="1160" y2="1636" stroke="#D6D2C9" stroke-width="1"/>
    <text x="80" y="1668" font-size="16" fill="#5C6871">Sources: Portugal final report (2024) · 4 Day Week Foundation follow-up (2024) · Belgian Labour Deal · Germany pilot (2024)</text>
    <text x="1160" y="1668" font-size="16" text-anchor="end" fill="#5C6871">10 September 2026 · Page 7 of 10</text>
  </g>
</svg>
