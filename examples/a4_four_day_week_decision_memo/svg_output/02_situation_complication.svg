<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" font-family="Arial" data-pptx-page-role="content">
  <rect id="page-field" x="0" y="0" width="1240" height="1754" fill="#FFFFFF" />
  <line id="evidence-rule" data-pptx-role="decoration" x1="430" y1="360" x2="430" y2="1600" stroke="#D6D2C9" stroke-width="1" />

  <g id="page-header" data-pptx-role="header" data-pptx-bounds="80 96 1080 41">
    <text x="80" y="112" font-size="16" letter-spacing="1.6" fill="#5C6871">FOUR-DAY WEEK — DECISION MEMO</text>
    <text x="1160" y="112" font-size="16" text-anchor="end" fill="#5C6871">2 · Situation, complication, resolution</text>
    <line x1="80" y1="132" x2="1160" y2="132" stroke="#D6D2C9" stroke-width="1" />
  </g>

  <g id="page-title" data-pptx-bounds="80 160 1020 112">
    <text x="80" y="200" font-size="44" font-weight="bold" fill="#16232E"><tspan x="80" dy="0">Every pilot promised eight hours back and</tspan><tspan x="80" dy="54">delivered four to five</tspan></text>
  </g>

  <g id="page-lead" data-pptx-bounds="80 290 1020 38">
    <text x="80" y="316" font-size="30" fill="#4A6B7C">The decision is about recoverable hours, not about a day of the week.</text>
  </g>

  <g id="situation-margin" data-pptx-bounds="80 386 330 148">
    <text x="80" y="400" font-size="16" font-weight="bold" letter-spacing="1.6" fill="#B4471C">SITUATION</text>
    <text x="80" y="434" font-size="20" fill="#5C6871"><tspan x="80" dy="0">100-80-100, defined by 4 Day</tspan><tspan x="80" dy="26">Week Global in 2018. UK hours</tspan><tspan x="80" dy="26">and productivity: ONS.</tspan></text>
    <text x="80" y="526" font-size="16" fill="#6E777E">F064 · F068 · F069</text>
  </g>

  <g id="situation-column" data-pptx-bounds="460 378 700 432" fill="#16232E" font-size="26">
    <text x="460" y="400"><tspan x="460" dy="0">100-80-100 means 100% pay for 80% of the time while</tspan><tspan x="460" dy="38">maintaining 100% output. It was created in 2018 by</tspan><tspan x="460" dy="38">Andrew Barnes and Charlotte Lockhart at Perpetual</tspan><tspan x="460" dy="38">Guardian, and 4 Day Week Global defines it as a</tspan><tspan x="460" dy="38">32-hour week rather than compressed hours.</tspan></text>
    <text x="460" y="610"><tspan x="460" dy="0">Against the UK norm the cut is smaller than it sounds.</tspan><tspan x="460" dy="38">Average actual weekly hours for UK full-time workers</tspan><tspan x="460" dy="38">were 36.7 in April–June 2026, so a 32-hour week is</tspan><tspan x="460" dy="38">about a 13% reduction, not 20% — while UK output per</tspan><tspan x="460" dy="38">hour, at £46.92 in 2021, was already 10% below the</tspan><tspan x="460" dy="38">average of the other G7 nations excluding Japan.</tspan></text>
  </g>

  <g id="complication-margin" data-pptx-bounds="80 856 330 162">
    <text x="80" y="870" font-size="16" font-weight="bold" letter-spacing="1.6" fill="#B4471C">COMPLICATION</text>
    <text x="80" y="904" font-size="20" fill="#5C6871"><tspan x="80" dy="0">Nominal target against hours</tspan><tspan x="80" dy="26">actually worked, by study.</tspan></text>
    <text x="80" y="1012" font-size="16" fill="#6E777E">F011 · F040 · F054 · F063</text>
  </g>

  <g id="complication-column" data-pptx-bounds="460 848 700 146">
    <text x="460" y="870" font-size="26" fill="#16232E"><tspan x="460" dy="0">In every measured pilot the realised reduction was</tspan><tspan x="460" dy="38">smaller than the nominal one. Across the UK cohort,</tspan><tspan x="460" dy="38">71% of employees reported fewer hours — and 15%</tspan><tspan x="460" dy="38">reported working more.</tspan></text>
  </g>

