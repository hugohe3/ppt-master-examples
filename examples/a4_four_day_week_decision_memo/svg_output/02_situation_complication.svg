  <g id="resolution-margin" data-pptx-bounds="80 1426 330 82">
    <text x="80" y="1440" font-size="16" font-weight="bold" letter-spacing="1.6" fill="#B4471C">RESOLUTION</text>
    <text x="80" y="1474" font-size="20" fill="#5C6871"><tspan x="80" dy="0">The question this memo</tspan><tspan x="80" dy="26">answers.</tspan></text>
  </g>

  <g id="governing-question" data-pptx-bounds="460 1418 700 170">
    <rect x="460" y="1420" width="700" height="166" fill="#F2F0EB" />
    <text x="480" y="1452" font-size="26" fill="#16232E"><tspan x="480" dy="0">So the question is not “should we adopt a four-day</tspan><tspan x="480" dy="38">week”. It is: how many hours can this firm recover</tspan><tspan x="480" dy="38">through redesign, and what does removing the rest</tspan><tspan x="480" dy="38">cost in client service?</tspan></text>
  </g>

