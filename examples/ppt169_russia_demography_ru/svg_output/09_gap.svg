  <g id="page-header" data-pptx-bounds="72 58 1136 126">
    <text x="72" y="96" font-family="Times New Roman, serif" font-size="40" font-weight="bold" fill="#1B2B3A">Сверхсмертность мужчин: 14,2 года разрыва</text>
    <text x="72" y="136" font-size="28" fill="#232A31">Максимум разрыва — 1994 год;<tspan x="72" dy="34">к 2024 году он сократился до 10,6 года</tspan></text>
  </g>

