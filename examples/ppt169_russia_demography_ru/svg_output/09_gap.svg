  <g id="gap-note" data-pptx-bounds="72 494 1136 82">
    <text x="72" y="512" font-size="18" fill="#5B6670">Разрыв расширялся в годы падения мужской продолжительности жизни (1992–1994)<tspan x="72" dy="26">и сужался в годы её роста (2006–2019). Минимум периода — 9,0 года в 2021 году,</tspan><tspan x="72" dy="26">когда женская продолжительность жизни упала сильнее мужской.</tspan></text>
