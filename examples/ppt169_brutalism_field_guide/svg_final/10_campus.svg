  <line id="col-rule-1" data-pptx-role="decoration" x1="438" y1="186" x2="438" y2="586" stroke="#9A958B" stroke-width="1" />
  <line id="col-rule-2" data-pptx-role="decoration" x1="842" y1="186" x2="842" y2="586" stroke="#9A958B" stroke-width="1" />
