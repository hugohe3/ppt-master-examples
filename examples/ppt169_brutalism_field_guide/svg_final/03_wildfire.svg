  <g id="p03-slug" data-pptx-bounds="48 36 660 28">
    <text x="48" y="54" font-family="Consolas" font-size="16" fill="#55514A" letter-spacing="1.4">PART ONE · THE WORD</text>
  </g>

  <g id="p03-numeral" data-pptx-bounds="1050 36 182 148">
    <text x="1232" y="140" text-anchor="end" font-family="Arial Black" font-size="120" fill="#14110F">03</text>
  </g>

  <g id="p03-headline" data-pptx-bounds="48 86 992 48">
    <text x="48" y="118" font-family="Arial Black" font-size="36" fill="#14110F">Then it spread like wildfire</text>
  </g>

  <g id="p03-entry-1" data-pptx-bounds="48 186 802 98">
    <rect x="252" y="198" width="16" height="16" fill="#14110F" />
    <text x="48" y="220" font-family="Arial Black" font-size="36" fill="#14110F">1950</text>
    <text font-size="20" fill="#1C1A17" x="290" y="212">English architects visiting Sweden — Michael</text><text font-size="20" fill="#1C1A17" x="290" y="242">Ventris, Oliver Cox, Graeme Shankland — carry</text><text font-size="20" fill="#1C1A17" x="290" y="272">the term home, where it "spread like wildfire".</text></g>

  <g id="p03-entry-2" data-pptx-bounds="48 306 802 98">
    <rect x="252" y="318" width="16" height="16" fill="#C8331E" />
    <text x="48" y="340" font-family="Arial Black" font-size="36" fill="#14110F">1953</text>
    <text font-size="20" fill="#1C1A17" x="290" y="332">Alison Smithson puts <tspan font-weight="bold">"new brutalism"</tspan> in print</text><text font-size="20" fill="#1C1A17" x="290" y="362">for the first time, describing the unbuilt Soho</text><text font-size="20" fill="#1C1A17" x="290" y="392"><tspan>house in <tspan font-style="italic">Architectural Design</tspan>.</tspan></text></g>

  <g id="p03-entry-3" data-pptx-bounds="48 426 802 98">
    <rect x="252" y="438" width="16" height="16" fill="#14110F" />
    <text x="48" y="460" font-family="Arial Black" font-size="36" fill="#14110F">1954</text>
    <text font-size="20" fill="#1C1A17" x="290" y="452">Hunstanton School completes in Norfolk: the</text><text font-size="20" fill="#1C1A17" x="290" y="482"><tspan><tspan font-weight="bold">first finished building in the world</tspan> its own</tspan></text><text font-size="20" fill="#1C1A17" x="290" y="512">architects called "new brutalist".</text></g>

  <g id="p03-entry-4" data-pptx-bounds="48 546 802 98">
    <rect x="252" y="558" width="16" height="16" fill="#14110F" />
    <text x="48" y="580" font-family="Arial Black" font-size="36" fill="#14110F">1955</text>
    <text font-size="20" fill="#1C1A17" x="290" y="572">The Sugden House completes in Watford.</text><text font-size="20" fill="#1C1A17" x="290" y="602">Hunstanton was likely inspired by Mies van der</text><text font-size="20" fill="#1C1A17" x="290" y="632">Rohe's 1946 Alumni Memorial Hall in Chicago.</text></g>

  <g id="p03-pullquote" data-pptx-bounds="888 294 346 250">
    <rect x="890" y="296" width="342" height="244" fill="none" stroke="#C8331E" stroke-width="3" />
    <text font-size="20" fill="#1C1A17" x="912" y="336">It is our intention in</text><text font-size="20" fill="#1C1A17" x="912" y="366">this building to have the</text><text font-size="20" fill="#1C1A17" x="912" y="396">structure exposed</text><text font-size="20" fill="#1C1A17" x="912" y="426">entirely, without</text><text font-size="20" fill="#1C1A17" x="912" y="456">interior finishes</text><text font-size="20" fill="#1C1A17" x="912" y="486">wherever practicable.</text><text x="912" y="516" font-family="Consolas" font-size="16" fill="#55514A">— ALISON SMITHSON, 1953</text>
  </g>

  <g id="p03-footer" data-pptx-bounds="48 686 1184 24" fill="#55514A" font-family="Consolas" font-size="12">
    <text x="48" y="700">BRUTALIST ARCHITECTURE · A FIELD GUIDE</text>
    <text x="1232" y="700" text-anchor="end">03 / 16</text>
  </g>
</svg>