    <text x="616" y="500" font-family="Consolas" font-size="16" fill="#6E6A62">01</text>
    <text x="668" y="500" font-size="20" fill="#1C1A17">visible I-beams over the windows</text>
    <text x="616" y="560" font-family="Consolas" font-size="16" fill="#C8331E">02</text>
    <text x="668" y="560" font-size="20" fill="#F2F0EA">exposed brick, inside and out</text>
    <text x="616" y="616" font-family="Consolas" font-size="16" fill="#6E6A62">03</text>
    <text font-size="20" fill="#1C1A17" x="668" y="616">poured concrete keeping the</text><text font-size="20" fill="#1C1A17" x="668" y="646">tongue-and-groove pattern of its forms</text></g>

