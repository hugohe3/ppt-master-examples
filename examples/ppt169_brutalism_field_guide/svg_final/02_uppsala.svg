  <g id="p02-headline" data-pptx-bounds="48 86 992 48">
    <text x="48" y="118" font-family="Arial Black" font-size="36" fill="#14110F">1950: a name for a house in Kåbo</text>
  </g>

  <g id="p02-origin-column" data-pptx-bounds="48 168 508 470">
    <text x="48" y="272" font-family="Arial Black" font-size="120" fill="#14110F">1950</text>
    <rect x="48" y="286" width="286" height="8" fill="#C8331E" />
    <text x="48" y="326" font-family="Consolas" font-size="16" fill="#C8331E" letter-spacing="1.6">THE FIRST USE</text>
    <text font-size="20" fill="#1C1A17" x="48" y="368">The word arrived before the concrete.</text><text font-size="20" fill="#1C1A17" x="48" y="398">The Swedish architect Hans Asplund</text><text font-size="20" fill="#1C1A17" x="48" y="428"><tspan>coined the term <tspan font-style="italic">nybrutalism</tspan> — new</tspan></text><text font-size="20" fill="#1C1A17" x="48" y="458">brutalism — to describe Villa Göth, a</text><text font-size="20" fill="#1C1A17" x="48" y="488">modern brick home in Uppsala.</text><text font-size="20" fill="#1C1A17" x="48" y="538">The house was designed in January 1950</text><text font-size="20" fill="#1C1A17" x="48" y="568"><tspan>by <tspan font-weight="bold">Bengt Edman</tspan> and <tspan font-weight="bold">Lennart Holm</tspan>,</tspan></text><text font-size="20" fill="#1C1A17" x="48" y="598">contemporaries of Asplund. Nothing</text><text font-size="20" fill="#1C1A17" x="48" y="628">about it was monumental.</text></g>

  <g id="p02-asfound-argument" data-pptx-bounds="600 190 632 268" fill="#1C1A17" font-size="20">
    <text x="600" y="210">What it showed was the "as found" approach that</text><text x="600" y="240">would later sit at the core of brutalism: the</text><text x="600" y="270">building was allowed to say what it was made of,</text><text x="600" y="300">and no finish was added to soften the answer.</text><text x="600" y="350">Villa Göth was listed as historically significant</text><text x="600" y="380"><tspan>by the Uppsala county board on <tspan font-weight="bold">3 March 1995</tspan> — the</tspan></text><text x="600" y="410">house that named the movement outlived most of</text><text x="600" y="440">the towers built in its name.</text></g>

  <g id="p02-asfound-bracket" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="leftBracket" data-pptx-frame="550 464 26 200" fill="none" stroke="#14110F" stroke-width="3">
