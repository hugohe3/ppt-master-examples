  <g id="p07-headline" data-pptx-bounds="48 86 992 48">
    <text x="48" y="118" font-family="Arial Black" font-size="36" fill="#14110F">A façade that admits what it is doing</text>
  </g>

  <g id="p07-claim" data-pptx-bounds="48 186 1184 66">
    <text x="48" y="210" font-size="24" fill="#14110F">A common theme is the exposure of the building's inner workings — structure,<tspan x="48" dy="30">services and human use — on the exterior.</tspan></text>
  </g>

  <g id="p07-boston" data-pptx-bounds="48 266 660 168">
    <text x="48" y="282" font-family="Consolas" font-size="16" fill="#C8331E" letter-spacing="1.6">EXAMPLE ONE · BOSTON</text>
    <text x="48" y="316" font-size="20" fill="#1C1A17">Boston City Hall, designed in 1962: the strikingly<tspan x="48" dy="28">different and projected portions of the building</tspan><tspan x="48" dy="28">indicate the special nature of the rooms behind those</tspan><tspan x="48" dy="28">walls, such as the mayor's office or the city council</tspan><tspan x="48" dy="28">chambers.</tspan></text>
  </g>

  <g id="p07-hunstanton" data-pptx-bounds="48 458 660 188">
    <rect x="48" y="460" width="660" height="184" fill="#14110F" />
    <rect x="48" y="460" width="6" height="184" fill="#C8331E" />
    <text x="80" y="494" font-size="20" fill="#F2F0EA">Hunstanton School put the facility's water tank —<tspan x="80" dy="28">normally a hidden service feature — in a</tspan><tspan x="80" dy="28">prominent, visible tower. Its water and electric</tspan><tspan x="80" dy="28">utilities were delivered via readily visible</tspan><tspan x="80" dy="28">pipes and conduits rather than hidden in the</tspan><tspan x="80" dy="28">walls.</tspan></text>
  </g>

