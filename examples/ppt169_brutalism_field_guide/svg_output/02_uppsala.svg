  <g id="p02-headline" data-pptx-bounds="48 86 992 48">
    <text x="48" y="118" font-family="Arial Black" font-size="36" fill="#14110F">1950: a name for a house in Kåbo</text>
  </g>

  <g id="p02-origin-column" data-pptx-bounds="48 168 508 470">
    <text x="48" y="272" font-family="Arial Black" font-size="120" fill="#14110F">1950</text>
    <rect x="48" y="286" width="286" height="8" fill="#C8331E" />
    <text x="48" y="326" font-family="Consolas" font-size="16" fill="#C8331E" letter-spacing="1.6">THE FIRST USE</text>
    <text x="48" y="368" font-size="20" fill="#1C1A17">The word arrived before the concrete.<tspan x="48" dy="30">The Swedish architect Hans Asplund</tspan><tspan x="48" dy="30">coined the term <tspan font-style="italic">nybrutalism</tspan> — new</tspan><tspan x="48" dy="30">brutalism — to describe Villa Göth, a</tspan><tspan x="48" dy="30">modern brick home in Uppsala.</tspan></text>
    <text x="48" y="538" font-size="20" fill="#1C1A17">The house was designed in January 1950<tspan x="48" dy="30">by <tspan font-weight="bold">Bengt Edman</tspan> and <tspan font-weight="bold">Lennart Holm</tspan>,</tspan><tspan x="48" dy="30">contemporaries of Asplund. Nothing</tspan><tspan x="48" dy="30">about it was monumental.</tspan></text>
  </g>

  <g id="p02-asfound-argument" data-pptx-bounds="600 190 632 268" fill="#1C1A17" font-size="20">
    <text x="600" y="210">What it showed was the "as found" approach that<tspan x="600" dy="30">would later sit at the core of brutalism: the</tspan><tspan x="600" dy="30">building was allowed to say what it was made of,</tspan><tspan x="600" dy="30">and no finish was added to soften the answer.</tspan></text>
    <text x="600" y="350">Villa Göth was listed as historically significant<tspan x="600" dy="30">by the Uppsala county board on <tspan font-weight="bold">3 March 1995</tspan> — the</tspan><tspan x="600" dy="30">house that named the movement outlived most of</tspan><tspan x="600" dy="30">the towers built in its name.</tspan></text>
  </g>

