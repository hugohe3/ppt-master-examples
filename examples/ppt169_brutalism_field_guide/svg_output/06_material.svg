  </g>

  <g id="p06-numeral" data-pptx-bounds="1050 36 182 148">
    <text x="1232" y="140" text-anchor="end" font-family="Arial Black" font-size="120" fill="#14110F">06</text>
  </g>

  <g id="p06-headline" data-pptx-bounds="48 86 992 48">
    <text x="48" y="118" font-family="Arial Black" font-size="36" fill="#14110F">The grain of the formwork stays in the wall</text>
  </g>

  <g id="p06-materials" data-pptx-bounds="48 188 1184 74">
    <line x1="48" y1="190" x2="1232" y2="190" stroke="#14110F" stroke-width="2" />
    <rect x="48" y="190" width="160" height="6" fill="#C8331E" />
    <text x="48" y="240" font-family="Arial Black" font-size="36" fill="#14110F">CONCRETE</text>
    <text x="248" y="240" font-family="Consolas" font-size="22" fill="#55514A">BRICK</text>
    <text x="349" y="240" font-family="Consolas" font-size="22" fill="#55514A">GLASS</text>
    <text x="450" y="240" font-family="Consolas" font-size="22" fill="#55514A">STEEL</text>
    <text x="551" y="240" font-family="Consolas" font-size="22" fill="#55514A">TIMBER</text>
    <text x="664" y="240" font-family="Consolas" font-size="22" fill="#55514A">ROUGH-HEWN STONE</text>
    <text x="899" y="240" font-family="Consolas" font-size="22" fill="#55514A">GABIONS</text>
    <line x1="48" y1="258" x2="1232" y2="258" stroke="#14110F" stroke-width="1" />
  </g>

  <g id="p06-shuttering" data-pptx-bounds="48 268 560 416" fill="#1C1A17" font-size="20">
    <text x="48" y="286">Raw concrete is often used because of its low<tspan x="48" dy="28">cost, and then left to reveal the basic nature</tspan><tspan x="48" dy="28">of its construction — rough surfaces carrying</tspan><tspan x="48" dy="28">the wood <tspan fill="#C8331E" font-weight="bold">"shuttering"</tspan> pattern produced when</tspan><tspan x="48" dy="28">the forms were cast in situ.</tspan></text>
    <text x="48" y="438">The style commonly uses exposed, unpainted<tspan x="48" dy="28">concrete or brick, angular geometric shapes</tspan><tspan x="48" dy="28">and a predominantly monochrome colour palette;</tspan><tspan x="48" dy="28">steel, timber and glass also feature.</tspan></text>
    <text x="48" y="562">Examples are frequently massive in character<tspan x="48" dy="28">even when not large, and challenge traditional</tspan><tspan x="48" dy="28">notions of what a building should look like,</tspan><tspan x="48" dy="28">with focus given to interior spaces as much as</tspan><tspan x="48" dy="28">exterior.</tspan></text>
  </g>

  <g id="p06-modular" data-pptx-bounds="640 268 490 264" fill="#1C1A17" font-size="20">
    <text x="640" y="286">Buildings are constructed with recurring<tspan x="640" dy="28">modular elements representing specific</tspan><tspan x="640" dy="28">functional zones, distinctly articulated</tspan><tspan x="640" dy="28">and grouped into a unified whole.</tspan></text>
    <text x="640" y="410">Emphasis falls on graphic expression in<tspan x="640" dy="28">the external elevations and in the</tspan><tspan x="640" dy="28">whole-site plan, in regard to the main</tspan><tspan x="640" dy="28">functions and people-flows of the</tspan><tspan x="640" dy="28">building.</tspan></text>
  </g>

  <g id="p06-screen-edge" data-pptx-bounds="1160 268 72 416">
    <rect x="1160" y="268" width="72" height="416" fill="url(#halftone-screen)" />
    <line x1="1160" y1="268" x2="1160" y2="684" stroke="#14110F" stroke-width="2" />
  </g>

  <g id="p06-footer" data-pptx-bounds="48 686 1184 24" fill="#55514A" font-family="Consolas" font-size="12">
