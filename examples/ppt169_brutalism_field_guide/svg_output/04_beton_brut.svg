  <g id="p04-headline" data-pptx-bounds="48 86 992 48">
    <text x="48" y="118" font-family="Arial Black" font-size="36" fill="#14110F">Raw concrete, raw art</text>
  </g>

  <g id="p04-banham-column" data-pptx-bounds="48 190 400 400" fill="#1C1A17" font-size="20">
    <text x="48" y="210">Reyner Banham, British<tspan x="48" dy="30">architectural historian, used</tspan><tspan x="48" dy="30">"new brutalism" to identify both</tspan><tspan x="48" dy="30">an ethic and an aesthetic in his</tspan><tspan x="48" dy="30"><tspan font-weight="bold">1955 essay</tspan> <tspan font-style="italic">The New Brutalism</tspan>.</tspan></text>
    <text x="48" y="380">He named Hunstanton and the Soho<tspan x="48" dy="30">house as "the reference by which</tspan><tspan x="48" dy="30">The New Brutalism in</tspan><tspan x="48" dy="30">architecture may be defined".</tspan></text>
    <text x="48" y="520">He expanded the argument in his<tspan x="48" dy="30">1966 book <tspan font-style="italic">The New Brutalism:</tspan></tspan><tspan x="48" dy="30"><tspan font-style="italic">Ethic or Aesthetic?</tspan></tspan></text>
  </g>

  <g id="p04-phrases" data-pptx-bounds="470 192 762 274">
    <text x="470" y="208" font-family="Consolas" font-size="16" fill="#55514A" letter-spacing="1.6">THE CRITIC NAMES THE MATERIAL</text>
    <text x="470" y="292" font-family="Arial Black" font-size="80" fill="#14110F">béton <tspan fill="#C8331E">brut</tspan></text>
    <text x="470" y="330" font-family="Consolas" font-size="22" fill="#1C1A17" letter-spacing="1.6">RAW CONCRETE</text>
    <text x="470" y="416" font-family="Arial Black" font-size="80" fill="#14110F">art <tspan fill="#C8331E">brut</tspan></text>
    <text x="470" y="454" font-family="Consolas" font-size="22" fill="#1C1A17" letter-spacing="1.6">RAW ART</text>
  </g>

  <g id="p04-corbusier-cell" data-pptx-bounds="470 486 762 180">
    <rect x="470" y="488" width="762" height="176" fill="#14110F" />
    <text x="502" y="528" font-size="20" fill="#F2F0EA">"if there is one single verbal formula that has made the<tspan x="502" dy="30">concept of Brutalism admissible in most of the world's</tspan><tspan x="502" dy="30">Western languages, it is that Le Corbusier himself</tspan><tspan x="502" dy="30">described that concrete work as 'béton-brut'"</tspan></text>
    <text x="502" y="648" font-family="Consolas" font-size="16" fill="#9A958B">— REYNER BANHAM, 1966</text>
  </g>

