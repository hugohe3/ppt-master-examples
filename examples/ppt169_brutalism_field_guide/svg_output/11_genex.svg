  <g id="p11-form" data-pptx-bounds="48 468 560 216" fill="#1C1A17" font-size="20">
    <text x="48" y="490">Formed by two towers connected with a two-<tspan x="48" dy="28">storey bridge, with a revolving restaurant at</tspan><tspan x="48" dy="28">the top. With the restaurant it reaches</tspan><tspan x="48" dy="28">135–140 m (443–459 ft).</tspan></text>
    <text x="48" y="614">Considered a prime representative of the style<tspan x="48" dy="28">in Serbia, and one of the best built anywhere</tspan><tspan x="48" dy="28">in the 1960s and 1970s.</tspan></text>
  </g>

