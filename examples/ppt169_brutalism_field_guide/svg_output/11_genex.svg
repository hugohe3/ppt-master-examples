    <text x="692" y="562" font-size="20" fill="#1C1A17">The source calls the Genex Tower the<tspan x="692" dy="28">second-tallest high-rise in Belgrade,</tspan><tspan x="692" dy="28">after Ušće Tower — but gives no height</tspan><tspan x="692" dy="28">for it. The gap is printed, not estimated.</tspan></text>
