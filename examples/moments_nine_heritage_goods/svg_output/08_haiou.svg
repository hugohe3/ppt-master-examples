  <g id="p08-facts" data-pptx-bounds="72 696 936 372">
    <use data-icon="chunk-filled/calendar" x="84" y="700" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="726" font-size="22" fill="#6B5C4A">诞生</text>
    <text x="196" y="726" font-size="30" fill="#2A2420">1963 年底 4 型双反相机开始批量生产（厂 1958 年成立）</text>

    <use data-icon="chunk-filled/factory" x="84" y="764" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="790" font-size="22" fill="#6B5C4A">产地</text>
    <text x="196" y="790" font-size="30" fill="#2A2420">上海 · 上海照相机厂<tspan x="196" dy="44">1967 年为出口把「上海牌」改为「海鸥牌」</tspan></text>

    <use data-icon="chunk-filled/trophy" x="84" y="872" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="898" font-size="22" fill="#6B5C4A">当年</text>
    <text x="196" y="898" font-size="30" fill="#2A2420"><tspan fill="#B3402F" font-weight="bold">中国第一款出口的相机</tspan><tspan x="196" dy="44">1980 年年产 20 万架，累计产量超 2066 万台</tspan></text>

    <use data-icon="chunk-filled/shop" x="84" y="980" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="1006" font-size="22" fill="#6B5C4A">今天</text>
    <text x="196" y="1006" font-size="30" fill="#2A2420">2004 年停产，2011 年海鸥数码成立<tspan x="196" dy="44">2014 年推出复古数码相机，2020 年转做工业相机</tspan></text>
  </g>
