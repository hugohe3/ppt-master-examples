  </g>

  <g id="p09-number-badge" data-pptx-bounds="150 520 100 100">
    <circle cx="200" cy="570" r="46" fill="#B3402F"/>
    <text x="200" y="584" font-family="SimHei" font-size="38" text-anchor="middle" fill="#F4E7CE">08</text>
  </g>

  <g id="p09-facts" data-pptx-bounds="72 676 936 378">
    <use data-icon="chunk-filled/calendar" x="84" y="680" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="706" font-size="22" fill="#6B5C4A">诞生</text>
    <text x="196" y="706" font-size="30" fill="#2A2420">1966 年商标由「无敌牌」改名「蝴蝶牌」<tspan x="196" dy="44">前身是 1919 年创办的协昌铁车铺</tspan></text>

    <use data-icon="chunk-filled/factory" x="84" y="788" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="814" font-size="22" fill="#6B5C4A">产地</text>
    <text x="196" y="814" font-size="30" fill="#2A2420">上海 · 上海协昌缝纫机厂（1982 年定名）</text>

    <use data-icon="chunk-filled/fire" x="84" y="852" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="878" font-size="22" fill="#6B5C4A">当年</text>
    <text x="196" y="878" font-size="30" fill="#2A2420">1972 年起凭票供应，上海约 80 人才配一张券<tspan x="196" dy="44">售价 <tspan fill="#B3402F" font-weight="bold">130–140 元</tspan>，而月工资只有 30–40 元</tspan></text>

    <use data-icon="chunk-filled/shop" x="84" y="960" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="986" font-size="22" fill="#6B5C4A">今天</text>
    <text x="196" y="986" font-size="30" fill="#2A2420">上海蝴蝶进出口仍做蝴蝶牌家用缝纫机<tspan x="196" dy="44">主攻电商与非洲等海外市场</tspan></text>
  </g>
</svg>
