    <text x="130" y="914" font-size="22" fill="#6B5C4A">当年</text>
    <text x="196" y="914" font-size="30" fill="#2A2420">鼎盛期占国内钢笔市场<tspan fill="#B3402F" font-weight="bold">约五成</tspan>，远销 60 多个国家<tspan x="196" dy="44">1984 年中英联合声明的签字用笔就是它</tspan></text>

    <use data-icon="chunk-filled/shop" x="84" y="996" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="1022" font-size="22" fill="#6B5C4A">今天</text>
    <text x="196" y="1022" font-size="30" fill="#2A2420">上海英雄仍在运营，2017 年网上销售额约 4000 万元</text>
