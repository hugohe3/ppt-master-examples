  </g>

  <g id="p10-lead" data-pptx-bounds="596 426 412 110">
    <text x="600" y="470" font-family="SimHei" font-size="36" fill="#2F6B5E">「三转一响」里的</text>
    <text x="600" y="518" font-family="SimHei" font-size="36" fill="#2F6B5E">那一响</text>
  </g>

  <g id="p10-good" data-pptx-bounds="116 396 428 309">
    <image href="../images/good_radio.png" x="120" y="400" width="420" height="301" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="p10-number-badge" data-pptx-bounds="880 560 100 100">
    <circle cx="930" cy="610" r="46" fill="#B3402F"/>
    <text x="930" y="624" font-family="SimHei" font-size="38" text-anchor="middle" fill="#F4E7CE">09</text>
  </g>

  <g id="p10-facts" data-pptx-bounds="72 756 936 292">
    <use data-icon="chunk-filled/calendar" x="84" y="760" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="786" font-size="22" fill="#6B5C4A">诞生</text>
    <text x="196" y="786" font-size="30" fill="#2A2420">1972 年 6 月红灯牌 711 型电子管收音机上市</text>

    <use data-icon="chunk-filled/factory" x="84" y="824" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="850" font-size="22" fill="#6B5C4A">产地</text>
    <text x="196" y="850" font-size="30" fill="#2A2420">上海 · 上海无线电二厂</text>

    <use data-icon="chunk-filled/trophy" x="84" y="888" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="914" font-size="22" fill="#6B5C4A">当年</text>
    <text x="196" y="914" font-size="30" fill="#2A2420">1972–1980 年累计约 <tspan fill="#B3402F" font-weight="bold">186 万台</tspan>，创同期单一型号纪录<tspan x="196" dy="44">全国厂家纷纷仿制，一度供不应求</tspan></text>

    <use data-icon="chunk-filled/shop" x="84" y="996" width="32" height="32" fill="#B3402F"/>
    <text x="130" y="1022" font-size="22" fill="#6B5C4A">今天</text>
    <text x="196" y="1022" font-size="30" fill="#2A2420">藏于上海无线电博物馆，2017 年 11 月起免费开放</text>
  </g>
