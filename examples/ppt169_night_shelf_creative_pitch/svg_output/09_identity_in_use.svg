<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="identityScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08080A" stop-opacity="0.66"/>
      <stop offset="55%" stop-color="#08080A" stop-opacity="0.86"/>
      <stop offset="100%" stop-color="#08080A" stop-opacity="0.93"/>
    </linearGradient>
  </defs>
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0E0E10"/>
  <image id="identity-field" data-pptx-role="decoration" href="../images/hero_dim.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect id="identity-scrim" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#identityScrim)"/>
  <g id="page-title" data-pptx-bounds="72 68 470 66">
    <text x="72" y="112" font-family="Georgia, serif" font-size="48" fill="#EDEAE3">The identity, in use</text>
  </g>
  <g id="identity-type-voice" data-pptx-bounds="72 178 820 118">
    <text x="72" y="200" font-size="24" fill="#7FA69B">Type voice</text>
    <text x="72" y="250" font-family="Georgia, serif" font-size="38" fill="#EDEAE3">The last hour belongs to a book.</text>
    <text x="72" y="288" font-size="18" fill="#A29E97">Georgia for everything the campaign says; a quiet sans for everything the shop adds later.</text>
  </g>
  <g id="identity-palette" data-pptx-bounds="72 328 776 140">
    <text x="72" y="350" font-size="24" fill="#7FA69B">Palette, by job</text>
    <rect x="72" y="372" width="176" height="44" fill="#0E0E10" stroke="#3A3A40" stroke-width="1"/>
    <text x="72" y="436" font-size="18" fill="#EDEAE3">Night ink</text>
    <text x="72" y="458" font-size="18" fill="#A29E97">the ground</text>
    <rect x="272" y="372" width="176" height="44" fill="#E9C877"/>
    <text x="272" y="436" font-size="18" fill="#EDEAE3">Lamplight</text>
    <text x="272" y="458" font-size="18" fill="#A29E97">the only light</text>
    <rect x="472" y="372" width="176" height="44" fill="#F4F1EA"/>
    <text x="472" y="436" font-size="18" fill="#EDEAE3">Paper cream</text>
    <text x="472" y="458" font-size="18" fill="#A29E97">what readers touch</text>
    <rect x="672" y="372" width="176" height="44" fill="#7FA69B"/>
    <text x="672" y="436" font-size="18" fill="#EDEAE3">Fern</text>
    <text x="672" y="458" font-size="18" fill="#A29E97">the shop's own mark</text>
  </g>
  <g id="identity-mark-scales" data-pptx-bounds="72 498 480 142">
    <text x="72" y="520" font-size="24" fill="#7FA69B">The mark, at three scales</text>
    <g id="p09-mark-poster" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="moon" data-pptx-frame="120 554 36 46" fill="#E9C877" stroke="none">
<path d="M 156 600 A 36 23 0 0 1 156 554 A 45 28.75 0 0 0 156 600 Z"/>
</g>
    <rect x="72" y="600" width="132" height="3" fill="#EDEAE3"/>
    <text x="72" y="630" font-size="18" fill="#A29E97">poster</text>
    <g id="p09-mark-window" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="moon" data-pptx-frame="281 570 30 30" fill="#E9C877" stroke="none">
<path d="M 311 600 A 30 15 0 0 1 311 570 A 37.5 18.75 0 0 0 311 600 Z"/>
</g>
    <rect x="252" y="600" width="88" height="2" fill="#EDEAE3"/>
    <text x="252" y="630" font-size="18" fill="#A29E97">window</text>
    <g id="p09-mark-bookmark" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="moon" data-pptx-frame="409 582 18 18" fill="#E9C877" stroke="none">
<path d="M 427 600 A 18 9 0 0 1 427 582 A 22.5 11.25 0 0 0 427 600 Z"/>
</g>
    <rect x="396" y="600" width="44" height="2" fill="#EDEAE3"/>
    <text x="396" y="630" font-size="18" fill="#A29E97">bookmark</text>
  </g>
  <g id="identity-elements" data-pptx-bounds="920 178 288 486">
    <image href="../images/element_lamp.png" x="960" y="180" width="110" height="173" preserveAspectRatio="xMidYMid meet"/>
    <text x="920" y="386" font-size="18" fill="#A29E97">Lamplight is a light source, never<tspan x="920" dy="24">a type colour.</tspan></text>
    <image href="../images/element_fern.png" x="960" y="446" width="110" height="153" preserveAspectRatio="xMidYMid meet"/>
    <text x="920" y="632" font-size="18" fill="#A29E97">Fern marks only the surfaces the<tspan x="920" dy="24">shop itself owns.</tspan></text>
  </g>
  <g id="identity-rule" data-pptx-bounds="72 672 790 28">
    <text x="72" y="690" font-size="18" fill="#C4553F">Ember appears only where a screen is being referred to; nothing else in the campaign is red.</text>
  </g>
</svg>
