    <text x="120" y="252" font-size="36" fill="#D8E0F0">中国着眼于国家安全和经济社会发展需要,<tspan x="120" dy="58">自主建设运行的全球卫星导航系统。</tspan></text>
    <text x="120" y="364" font-family="Consolas" font-size="18" fill="#8FA0C0">来源:中国卫星导航系统管理办公室官网《系统介绍》</text>
  </g>

