<g id="damping" data-pptx-bounds="56 486 600 164">
  <text x="56" y="502" font-size="12" font-weight="bold" fill="#1B2430" letter-spacing="2">WHY IT TERMINATES</text>
  <line x1="56" y1="510" x2="656" y2="510" stroke="#1B2430" stroke-width="1"/>
  <circle cx="60" cy="522.2" r="3" fill="#1D4ED8"/>
  <text x="72" y="526" font-size="12" fill="#2F3A48">Each move is sized by the signed pixel delta the measurement reports, never guessed</text>
  <circle cx="60" cy="543.2" r="3" fill="#1D4ED8"/>
  <text x="72" y="547" font-size="12" fill="#2F3A48">The loop refuses to re-apply a move that already overshot the band on a section</text>
  <circle cx="60" cy="564.2" r="3" fill="#1D4ED8"/>
  <text x="72" y="568" font-size="12" fill="#2F3A48">An on-disk round counter trips a circuit breaker (bounded ≈ 12 rounds) and ships the best-measured<tspan x="72" dy="16">state</tspan></text>
  <circle cx="60" cy="601.2" r="3" fill="#1D4ED8"/>
  <text x="72" y="605" font-size="12" fill="#2F3A48">Exit: every section reads FULL and no figure trips the figure-fill gate (≥ 90% of its card on one axis); a<tspan x="72" dy="16">render-time pass then stretches under-filled cards toward 98% by growing row whitespace, figures not</tspan><tspan x="72" dy="16">resized</tspan></text>
</g>
