<g id="title" data-pptx-bounds="56 56 1168 74">
  <text x="56" y="84" font-size="28" font-weight="bold" fill="#1B2430">The fill loop is discrete: five verdict bands, one section edited per round,<tspan x="56" dy="34">termination as a categorical fixed point</tspan></text>
</g>
<g id="claim-line" data-pptx-bounds="56 136 1168 24">
  <text x="56" y="152" font-size="18" fill="#6B7684">fullRatio = content height ÷ card height; the verdict alone selects the move; Figure 4 shows one poster converging</text>
</g>
