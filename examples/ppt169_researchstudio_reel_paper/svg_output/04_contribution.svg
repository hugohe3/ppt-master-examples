  <text x="1224" y="44" font-size="12" fill="#6B7684" text-anchor="end" letter-spacing="1">§1 CONTRIBUTIONS · FIGURE 2</text>
</g>
<g id="title" data-pptx-bounds="56 56 1168 74">
  <text x="56" y="84" font-size="28" font-weight="bold" fill="#1B2430">The answer: a native-editable workspace of five skills — one shared extractor,<tspan x="56" dy="34">three editable generators, one convergence layer</tspan></text>
</g>
<g id="claim-line" data-pptx-bounds="56 136 1168 24">
  <text x="56" y="152" font-size="18" fill="#6B7684">Figure 2: one PDF in, three editor-ready artifacts out, one shared extraction in the middle (§1, §2)</text>
</g>
<line id="title-rule" data-pptx-role="decoration" x1="56" y1="170" x2="1224" y2="170" stroke="#C9D0D8" stroke-width="1"/>
