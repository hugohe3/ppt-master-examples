  <text x="968" y="420" font-size="12" fill="#2F3A48">splits a raster that packs two figures; raw<tspan x="968" dy="16">extract backed up once</tspan></text>
</g>
<g id="bundle-contents" data-pptx-bounds="56 472 700 168">
  <text x="56" y="486" font-size="12" font-weight="bold" fill="#1B2430" letter-spacing="2">WHAT THE BUNDLE HOLDS</text>
  <line x1="56" y1="494" x2="756" y2="494" stroke="#1B2430" stroke-width="1"/>
  <circle cx="60" cy="512.2" r="3" fill="#1D4ED8"/>
  <text x="72" y="516" font-size="12" fill="#2F3A48">Full body text with page breaks; detected figure captions; a per-figure manifest; cleaned figure images</text>
  <circle cx="60" cy="536.2" r="3" fill="#1D4ED8"/>
  <text x="72" y="540" font-size="12" fill="#2F3A48">Metadata: title, authors, institutes, venue, paper and code links; best-effort institution and venue logos; QR codes</text>
  <circle cx="60" cy="560.2" r="3" fill="#1D4ED8"/>
  <text x="72" y="564" font-size="12" fill="#2F3A48">The nine-section summary — Problem, Motivation, Contribution, Method, Dataset/Benchmark, Key Result, Ablation,<tspan x="72" dy="16">Headline Numbers, Takeaway — plus the inventory manifest, per-section records with stable ids, and the narration clip</tspan><tspan x="72" dy="16">list</tspan></text>
</g>
<g id="single-owner" data-pptx-bounds="788 472 436 168">
  <rect x="788" y="472" width="436" height="168" fill="#F3F5F8"/><rect x="788" y="472" width="4" height="168" fill="#1D4ED8"/>
  <text x="806" y="496" font-size="14" font-weight="bold" fill="#1B2430">Single-owner extraction</text>
  <text x="806" y="520" font-size="12" fill="#2F3A48">Downstream skills read the bundle and never re-open the PDF. A<tspan x="806" dy="16">stable figure-naming invariant means the figure the poster's method</tspan><tspan x="806" dy="16">card embeds is the one the video's slide cites and the blog's evidence</tspan><tspan x="806" dy="16">map references, without any cross-skill coordination. Each step is an</tspan><tspan x="806" dy="16">idempotent script, so a failed stage re-runs in isolation.</tspan></text>
</g>
