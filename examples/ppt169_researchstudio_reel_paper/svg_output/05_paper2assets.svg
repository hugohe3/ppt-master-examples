  <text x="56" y="84" font-size="28" font-weight="bold" fill="#1B2430">Paper2Assets reads the PDF once and emits one bundle every generator<tspan x="56" dy="34">consumes verbatim; figure cleanup runs once</tspan></text>
</g>
<g id="claim-line" data-pptx-bounds="56 136 1168 24">
