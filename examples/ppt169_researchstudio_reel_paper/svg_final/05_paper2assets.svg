  <text x="68" y="400" font-size="14" font-weight="bold" fill="#1B2430">Deterministic prefix</text>
  <text fill="#2F3A48" font-size="12" x="68" y="420">strips chrome residue, baked-in caption</text><text fill="#2F3A48" font-size="12" x="68" y="436">strips, uniform margins</text></g>
<line id="cleanup-link-1" data-pptx-role="decoration" x1="322" y1="411" x2="352" y2="411" stroke="#6B7684" stroke-width="1.5" marker-end="url(#arrow)" />
