  <text fill="#2F3A48" font-size="12" x="968" y="420">splits a raster that packs two figures; raw</text><text fill="#2F3A48" font-size="12" x="968" y="436">extract backed up once</text></g>
<g id="bundle-contents" data-pptx-bounds="56 472 700 168">
  <text x="56" y="486" font-size="12" font-weight="bold" fill="#1B2430" letter-spacing="2">WHAT THE BUNDLE HOLDS</text>
  <line x1="56" y1="494" x2="756" y2="494" stroke="#1B2430" stroke-width="1" />
  <circle cx="60" cy="512.2" r="3" fill="#1D4ED8" />
  <text x="72" y="516" font-size="12" fill="#2F3A48">Full body text with page breaks; detected figure captions; a per-figure manifest; cleaned figure images</text>
  <circle cx="60" cy="536.2" r="3" fill="#1D4ED8" />
  <text x="72" y="540" font-size="12" fill="#2F3A48">Metadata: title, authors, institutes, venue, paper and code links; best-effort institution and venue logos; QR codes</text>
  <circle cx="60" cy="560.2" r="3" fill="#1D4ED8" />
  <text fill="#2F3A48" font-size="12" x="72" y="564">The nine-section summary — Problem, Motivation, Contribution, Method, Dataset/Benchmark, Key Result, Ablation,</text><text fill="#2F3A48" font-size="12" x="72" y="580">Headline Numbers, Takeaway — plus the inventory manifest, per-section records with stable ids, and the narration clip</text><text fill="#2F3A48" font-size="12" x="72" y="596">list</text></g>
<g id="single-owner" data-pptx-bounds="788 472 436 168">
  <rect x="788" y="472" width="436" height="168" fill="#F3F5F8" /><rect x="788" y="472" width="4" height="168" fill="#1D4ED8" />
  <text x="806" y="496" font-size="14" font-weight="bold" fill="#1B2430">Single-owner extraction</text>
  <text fill="#2F3A48" font-size="12" x="806" y="520">Downstream skills read the bundle and never re-open the PDF. A</text><text fill="#2F3A48" font-size="12" x="806" y="536">stable figure-naming invariant means the figure the poster's method</text><text fill="#2F3A48" font-size="12" x="806" y="552">card embeds is the one the video's slide cites and the blog's evidence</text><text fill="#2F3A48" font-size="12" x="806" y="568">map references, without any cross-skill coordination. Each step is an</text><text fill="#2F3A48" font-size="12" x="806" y="584">idempotent script, so a failed stage re-runs in isolation.</text></g>
