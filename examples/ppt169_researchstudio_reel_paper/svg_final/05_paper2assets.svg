  <text fill="#1B2430" font-size="28" font-weight="bold" x="56" y="84">Paper2Assets reads the PDF once and emits one bundle every generator</text><text fill="#1B2430" font-size="28" font-weight="bold" x="56" y="118">consumes verbatim; figure cleanup runs once</text></g>
<g id="claim-line" data-pptx-bounds="56 136 1168 24">
