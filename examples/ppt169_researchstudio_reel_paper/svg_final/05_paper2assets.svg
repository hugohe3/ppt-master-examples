  <text fill="#2F3A48" font-size="12" x="368" y="420">judges a tight bounding box for the hard</text><text fill="#2F3A48" font-size="12" x="368" y="436">cases</text></g>
<line id="cleanup-link-2" data-pptx-role="decoration" x1="622" y1="411" x2="652" y2="411" stroke="#6B7684" stroke-width="1.5" marker-end="url(#arrow)" />
