    <text x="944" y="324" font-size="40" font-weight="bold" fill="#1F3A5F">2057 年</text>
    <text x="944" y="360" font-size="18" fill="#5A6270">扶養比超過 100<tspan x="944" dy="26">（中推估）</tspan></text>
    <line x1="944" y1="440" x2="1176" y2="440" stroke="#D5CCBC" stroke-width="1" />
    <text x="944" y="474" font-size="18" font-weight="bold" fill="#1F3A5F">報告中的課題</text>
    <text x="944" y="504" font-size="18" fill="#1E232B">公共與家庭照護資源<tspan x="944" dy="26">逐步向高齡傾斜</tspan></text>
  </g>  <g id="scene-separators" data-pptx-role="decoration" data-pptx-bounds="338 188 604 356">
