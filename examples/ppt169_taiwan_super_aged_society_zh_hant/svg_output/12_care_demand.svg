  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F6F3EC" />
  <g id="page-title" data-pptx-bounds="64 60 1152 64">
    <text x="64" y="106" font-size="40" font-weight="bold" fill="#1F3A5F">長者不只變多，也更高齡</text>
  </g>
  <g id="care-image" data-pptx-bounds="52 138 384 504">
    <image href="../images/care_home.jpg" x="64" y="150" width="360" height="480" preserveAspectRatio="xMidYMid slice" clip-path="url(#care-arch)" />
    <path d="M 54 640 L 54 330 A 190 190 0 0 1 434 330 L 434 640" fill="none" stroke="#B5462F" stroke-width="2" />
  </g>
  <g id="hero-85plus" data-pptx-bounds="480 160 736 200">
    <text x="480" y="196" font-size="18" font-weight="bold" fill="#B5462F">85 歲以上的超高齡人口（中推估）</text>
    <text x="480" y="296" font-size="88" font-weight="bold" fill="#B5462F">208 萬人</text>
    <text x="480" y="340" font-size="24" fill="#1E232B">2075 年約為 2026 年的 4 倍多</text>
  </g>
  <g id="care-milestones" data-pptx-bounds="480 380 736 150">
    <line x1="480" y1="400" x2="1216" y2="400" stroke="#1F3A5F" stroke-width="2" />
    <circle cx="500" cy="400" r="8" fill="#1F3A5F" />
    <circle cx="683" cy="400" r="8" fill="#1F3A5F" />
    <circle cx="1190" cy="400" r="10" fill="#B5462F" />
    <text x="500" y="440" font-size="24" font-weight="bold" fill="#1F3A5F">2026</text>
    <text x="500" y="470" font-size="18" fill="#1E232B">48 萬人<tspan x="500" dy="26">每 10 位長者 1 位</tspan></text>
    <text x="683" y="440" font-size="24" font-weight="bold" fill="#1F3A5F">2039</text>
    <text x="683" y="470" font-size="18" fill="#1E232B">超過 100 萬人<tspan x="683" dy="26">每 6.5 位長者 1 位</tspan></text>
    <text x="1190" y="440" font-size="24" font-weight="bold" fill="#B5462F" text-anchor="end">2075</text>
    <text x="1190" y="470" font-size="18" fill="#1E232B" text-anchor="end">208 萬人<tspan x="1190" dy="26">約每 10 位長者 3 位</tspan></text>
  </g>
  <g id="report-note" data-pptx-bounds="480 548 736 86">
