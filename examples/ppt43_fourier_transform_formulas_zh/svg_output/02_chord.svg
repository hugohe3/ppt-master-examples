  <g id="chord-note" data-pptx-bounds="64 552 896 72">
    <text x="64" y="576" fill="#1B2027">同时按下三个琴键,耳朵听到一个和弦,空气里其实是三条正弦在相加。<tspan x="64" dy="36">每条分量只要交代两件事:幅度 <tspan data-pptx-inline-formula="A_n">Aₙ</tspan> 和频率 <tspan data-pptx-inline-formula="f_n">fₙ</tspan>。</tspan></text>
  </g>
  <g id="chord-formula" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="628" data-pptx-width="896" data-pptx-height="92" data-pptx-bounds="64 628 896 92">
    <metadata type="application/json">
      {"latex":"x(t) = \\sum_{n=1}^{N} A_n \\sin(2\\pi f_n t + \\varphi_n)",
       "display":"block","font_size":28,"color":"#123B63","align":"center"}
    </metadata>
    <text x="512" y="684" text-anchor="middle" font-family="Cambria Math, serif" font-size="28" fill="#123B63">x(t) = ∑ₙ₌₁..ₙ Aₙ sin(2πfₙt + φₙ)</text>
  </g>
