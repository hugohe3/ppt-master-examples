<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" data-pptx-page-role="content" font-family="Microsoft YaHei, Cambria, sans-serif" font-size="24">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1024" height="768" fill="#FFFFFF" />
  <line id="title-rule" data-pptx-role="decoration" x1="64" y1="180" x2="960" y2="180" stroke="#D6DBE1" stroke-width="1" />
  <rect id="formula-band" data-pptx-role="decoration" x="64" y="326" width="896" height="104" fill="#F2F4F7" />
  <rect id="formula-band-bar" data-pptx-role="decoration" x="64" y="326" width="3" height="104" fill="#123B63" />
  <g id="section-kicker" data-pptx-bounds="64 56 480 40">
    <rect x="64" y="58" width="28" height="3" fill="#C2452D" />
    <text x="64" y="88" font-size="18" fill="#5A6472">第 5 节 · 离散与快速</text>
  </g>
  <g id="page-title" data-pptx-bounds="64 106 896 60">
    <text x="64" y="146" font-family="SimSun, Cambria, serif" font-size="42" fill="#123B63">采样让积分变成有限求和</text>
  </g>
  <g id="sampling-fact" data-pptx-bounds="64 200 896 106">
    <use data-icon="tabler-outline/clock" x="64" y="204" width="22" height="22" fill="#5A6472" stroke-width="2" />
    <text x="94" y="221" font-size="18" fill="#5A6472">先解决合法性:凭什么可以只取样本</text>
    <text x="64" y="260" fill="#1B2027">采样定理(Shannon,1949):带宽限于 W 的信号,<tspan x="64" dy="36">可以由每秒 <tspan font-weight="bold" fill="#123B63">2W 个采样</tspan>完全确定——信息一点不少。</tspan></text>
  </g>
  <g id="dft-formula" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="326" data-pptx-width="896" data-pptx-height="104" data-pptx-bounds="64 326 896 104">
    <metadata type="application/json">
      {"latex":"X_k = \\sum_{n=0}^{N-1} x_n\\, e^{-i 2\\pi k n / N}, \\quad k = 0, 1, \\dots, N-1",
       "display":"block","font_size":28,"color":"#123B63","align":"center"}
    </metadata>
    <text x="512" y="390" text-anchor="middle" font-family="Cambria Math, serif" font-size="28" fill="#123B63">Xₖ = ∑ₙ₌₀⋯ᴺ⁻¹ xₙ e⁻ⁱ²πᵏⁿ/ᴺ,  k = 0, 1, …, N−1</text>
  </g>
  <g id="dft-reading" data-pptx-bounds="64 444 896 144" fill="#1B2027">
    <text x="64" y="468">和连续版对着看:积分换成 N 项求和,连续频率换成 N 个频点,</text>
    <text x="64" y="504">指数里的 <tspan data-pptx-inline-formula="\omega t">ωt</tspan> 换成 <tspan data-pptx-inline-formula="2\pi k n / N">2πkn/N</tspan>——形状没变,只是把「所有」改成「有限个」。</text>
    <text x="64" y="576">N 个复数进去,N 个复数出来:信息不增不减,只是换了坐标。</text>
  </g>
  <g id="dft-note" data-pptx-bounds="64 600 896 110" fill="#1B2027">
    <text x="64" y="624">这就是计算机里真正跑的那条公式:麦克风采到的是一串数,<tspan x="64" dy="36">频谱图上的每一根竖线,都是上面这条求和算出来的一个 <tspan data-pptx-inline-formula="X_k">Xₖ</tspan>。</tspan></text>
    <text x="64" y="696">下一个问题只剩一个:这条求和,算起来贵不贵?</text>
  </g>
  <g id="page-footer" data-pptx-bounds="64 722 896 22" fill="#5A6472" font-size="16">
    <text x="64" y="736">来源:Shannon, Communication in the Presence of Noise, Proc. IRE 37(1):10–21, 1949(F009)</text>
    <text x="960" y="736" text-anchor="end">11</text>
  </g>
</svg>
