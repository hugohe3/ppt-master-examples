  <g id="app-audio" data-pptx-bounds="530 390 430 150">
<g id="p14-card-audio" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="530 390 430 150" fill="#F2F4F7" stroke="#D6DBE1" stroke-width="1">
<path d="M 530 390 L 935 390 L 960 415 L 960 540 L 530 540 Z" />
</g>
    <use data-icon="tabler-outline/music" x="554" y="414" width="28" height="28" fill="#123B63" stroke-width="2" />
    <text x="594" y="438" font-weight="bold" fill="#123B63">声音:均衡</text>
    <text x="554" y="478" font-size="18" fill="#1B2027">按频段乘一条传递函数再变回时域,<tspan x="554" dy="24">频谱分析工具普遍用 FFT 实现。</tspan></text>
    <text x="554" y="526" font-size="18" fill="#5A6472">卷积定理的工程读法(F010)</text>
  </g>
  <g id="dct-formula" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="570" data-pptx-width="896" data-pptx-height="104" data-pptx-bounds="64 570 896 104">
    <metadata type="application/json">
      {"latex":"S_{vu} = \\frac{1}{4} C_u C_v \\sum_{x=0}^{7} \\sum_{y=0}^{7} s_{yx} \\cos\\frac{(2x+1)u\\pi}{16} \\cos\\frac{(2y+1)v\\pi}{16}",
       "display":"block","font_size":28,"color":"#123B63","align":"center"}
    </metadata>
    <text x="512" y="616" text-anchor="middle" font-family="Cambria Math, serif" font-size="28" fill="#123B63">Sᵥᵤ = ¼ Cᵤ Cᵥ ∑ₓ₌₀⁷ ∑ᵥ₌₀⁷ sᵥₓ ×<tspan x="512" dy="38">cos((2x+1)uπ/16) cos((2y+1)vπ/16)</tspan></text>
  </g>
  <g id="applications-note" data-pptx-bounds="64 686 896 36">
    <text x="64" y="710" fill="#1B2027">上面这条就是 JPEG 里那次 DCT——同一套思路,换了一组基函数。</text>
  </g>
  <g id="page-footer" data-pptx-bounds="64 722 896 22" fill="#5A6472" font-size="16">
    <text x="64" y="736">来源见各卡片;子载波间隔 312.5 kHz = 20 MHz ÷ 64,为本卷整理结果</text>
    <text x="960" y="736" text-anchor="end">14</text>
  </g>
</svg>
