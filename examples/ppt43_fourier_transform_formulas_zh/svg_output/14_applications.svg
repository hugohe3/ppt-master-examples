  <g id="page-title" data-pptx-bounds="64 106 896 60">
    <text x="64" y="146" font-family="SimSun, Cambria, serif" font-size="42" fill="#123B63">图像、医学、无线、声音</text>
  </g>
  <g id="app-jpeg" data-pptx-bounds="64 210 430 150">
<g id="p14-card-jpeg" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="64 210 430 150" fill="#F2F4F7" stroke="#D6DBE1" stroke-width="1">
<path d="M 64 210 L 469 210 L 494 235 L 494 360 L 64 360 Z" />
</g>
    <use data-icon="tabler-outline/photo" x="88" y="234" width="28" height="28" fill="#123B63" stroke-width="2" />
    <text x="128" y="258" font-weight="bold" fill="#123B63">图像:JPEG</text>
    <text x="88" y="298" font-size="18" fill="#1B2027">基线 JPEG 把图像切成 8×8 块,<tspan x="88" dy="24">每块做一次离散余弦变换(DCT)。</tspan></text>
    <text x="88" y="346" font-size="18" fill="#5A6472">ITU-T T.81,1992(F005)</text>
  </g>
  <g id="app-mri" data-pptx-bounds="530 210 430 150">
<g id="p14-card-mri" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="530 210 430 150" fill="#F2F4F7" stroke="#D6DBE1" stroke-width="1">
<path d="M 530 210 L 935 210 L 960 235 L 960 360 L 530 360 Z" />
</g>
    <use data-icon="tabler-outline/activity-heartbeat" x="554" y="234" width="28" height="28" fill="#123B63" stroke-width="2" />
    <text x="594" y="258" font-weight="bold" fill="#123B63">医学:MRI</text>
    <text x="554" y="298" font-size="18" fill="#1B2027">采集等于在傅里叶空间(k 空间)<tspan x="554" dy="24">沿轨迹采样,再变换回图像。</tspan></text>
    <text x="554" y="346" font-size="18" fill="#5A6472">Twieg, Med. Phys. 10(5), 1983(F006)</text>
  </g>
  <g id="app-wifi" data-pptx-bounds="64 390 430 150">
<g id="p14-card-wifi" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="64 390 430 150" fill="#F2F4F7" stroke="#D6DBE1" stroke-width="1">
<path d="M 64 390 L 469 390 L 494 415 L 494 540 L 64 540 Z" />
</g>
    <use data-icon="tabler-outline/wifi" x="88" y="414" width="28" height="28" fill="#123B63" stroke-width="2" />
    <text x="128" y="438" font-weight="bold" fill="#123B63">无线:OFDM</text>
    <text x="88" y="478" font-size="18" fill="#1B2027">20 MHz OFDM 用 64 点 FFT,<tspan x="88" dy="24">含 48 个数据子载波与 4 个导频。</tspan></text>
    <text x="88" y="526" font-size="18" fill="#5A6472">IEEE 802.11a-1999(F007、F008)</text>
