  <g id="series-coefficient-morph" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="430" data-pptx-width="896" data-pptx-height="104" data-pptx-bounds="64 430 896 104">
    <metadata type="application/json">
      {"latex":"c_n = \\frac{1}{T} \\int_{-T/2}^{T/2} f(t)\\, e^{-i 2\\pi n t / T}\\, dt",
       "display":"block","font_size":28,"color":"#123B63","align":"center"}
    </metadata>
    <text x="512" y="494" text-anchor="middle" font-family="Cambria Math, serif" font-size="28" fill="#123B63">cₙ = (1/T) ∫₋T/₂ᵀ/² f(t) e⁻ⁱ²πⁿᵗ/ᵀ dt</text>
  </g>
  <g id="limit-reasoning" data-pptx-bounds="64 540 896 108" fill="#1B2027">
    <text x="64" y="564">这条系数式就是「第 n 条频率占多少」:积分区间是<tspan font-weight="bold" fill="#123B63">一个周期</tspan>,</text>
    <text x="64" y="600">前面还挂着 <tspan data-pptx-inline-formula="1/T">1/T</tspan>。T 变大,频率间隔 <tspan data-pptx-inline-formula="1/T">1/T</tspan> 变小,清单越排越密,</text><text x="64" y="636">直到相邻两条挨在一起,离散的清单变成一条连续的谱。</text></g>
