  </g>
  <g id="dct-formula" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="570" data-pptx-width="896" data-pptx-height="104" data-pptx-bounds="64 570 896 104">
    <metadata type="application/json">
      {"latex":"S_{vu} = \\frac{1}{4} C_u C_v \\sum_{x=0}^{7} \\sum_{y=0}^{7} s_{yx} \\cos\\frac{(2x+1)u\\pi}{16} \\cos\\frac{(2y+1)v\\pi}{16}",
       "display":"block","font_size":28,"color":"#123B63","align":"center"}
    </metadata>
    <text font-size="28" text-anchor="middle" font-family="Cambria Math, serif" fill="#123B63" x="512" y="616">Sᵥᵤ = ¼ Cᵤ Cᵥ ∑ₓ₌₀⁷ ∑ᵥ₌₀⁷ sᵥₓ ×</text><text font-size="28" text-anchor="middle" font-family="Cambria Math, serif" fill="#123B63" x="512" y="654">cos((2x+1)uπ/16) cos((2y+1)vπ/16)</text></g>
  <g id="applications-note" data-pptx-bounds="64 686 896 36">
    <text x="64" y="710" fill="#1B2027">上面这条就是 JPEG 里那次 DCT——同一套思路,换了一组基函数。</text>
  </g>
