    <text x="650" y="227" font-size="18" fill="#5A6472">这张清单怎么读</text>
    <text fill="#1B2027" x="620" y="268">只剩<tspan font-weight="bold" fill="#C2452D">奇次谐波</tspan>:</text><text fill="#1B2027" x="620" y="304">偶次项的系数全是零。</text><text fill="#1B2027" x="620" y="348">第 k 项的幅度正比于</text><text fill="#1B2027" x="620" y="384"><tspan><tspan data-pptx-inline-formula="1/k">1/k</tspan>,掉得相当快。</tspan></text><text fill="#1B2027" x="620" y="428">项数越多拐角越方,</text><text fill="#1B2027" x="620" y="464">但永远留一点过冲。</text></g>
  <g id="square-formula" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="490" data-pptx-width="896" data-pptx-height="110" data-pptx-bounds="64 490 896 110">
    <metadata type="application/json">
      {"latex":"f(t) = \\frac{4}{\\pi} \\sum_{k=1,3,5,\\dots} \\frac{1}{k} \\sin(k\\omega t)",
       "display":"block","font_size":28,"color":"#123B63","align":"center"}
    </metadata>
    <text x="512" y="556" text-anchor="middle" font-family="Cambria Math, serif" font-size="28" fill="#123B63">f(t) = (4/π) ∑ₖ₌₁,₃,₅,⋯ (1/k) sin(kωt)</text>
  </g>
  <g id="square-takeaway" data-pptx-bounds="64 626 896 72">
    <text fill="#1B2027" x="64" y="650">级数把「形状」换成了一串可以逐项检查的数:方波不再是一个图形,</text><text fill="#1B2027" x="64" y="686">而是「1、1/3、1/5、1/7…」这份可以照着合成回去的频率清单。</text></g>
