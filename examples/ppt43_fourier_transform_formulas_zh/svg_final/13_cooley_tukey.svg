    <text x="650" y="419" font-size="18" fill="#5A6472">拆一次,省一半</text>
    <text fill="#1B2027" x="620" y="458">偶数下标给出 <tspan data-pptx-inline-formula="E_k">Eₖ</tspan>,</text><text fill="#1B2027" x="620" y="494"><tspan>奇数下标给出 <tspan data-pptx-inline-formula="O_k">Oₖ</tspan>,</tspan></text><text fill="#1B2027" x="620" y="530">再用一个旋转因子合起来。</text><text fill="#1B2027" x="620" y="566">对 N/2 继续同样拆分,</text><text fill="#1B2027" x="620" y="602">一共只有 log₂N 层,</text><text fill="#1B2027" x="620" y="638">每层 N 次——代价落到这里。</text></g>
