    <text font-size="18" text-anchor="middle" fill="#1B2027" x="220" y="336">提交热传导手稿</text><text font-size="18" text-anchor="middle" fill="#1B2027" x="220" y="362">拉格朗日反对,未发表</text><text font-size="18" text-anchor="middle" fill="#1B2027" x="512" y="336">修订稿赢得悬赏</text><text font-size="18" text-anchor="middle" fill="#1B2027" x="512" y="362">评审仍批评不够严格</text><text font-size="18" text-anchor="middle" fill="#1B2027" x="804" y="336">《热的解析理论》出版</text><text font-size="18" text-anchor="middle" fill="#1B2027" x="804" y="362">级数写法由此进入数学</text></g>
  <g id="series-formula" data-pptx-replace-with="formula" data-pptx-x="64" data-pptx-y="420" data-pptx-width="896" data-pptx-height="120" data-pptx-bounds="64 420 896 120">
    <metadata type="application/json">
      {"latex":"f(x) = \\frac{a_0}{2} + \\sum_{n=1}^{\\infty} \\left( a_n \\cos \\frac{2\\pi n x}{T} + b_n \\sin \\frac{2\\pi n x}{T} \\right)",
       "display":"block","font_size":28,"color":"#123B63","align":"center"}
    </metadata>
    <text x="512" y="492" text-anchor="middle" font-family="Cambria Math, serif" font-size="28" fill="#123B63">f(x) = a₀/2 + ∑ₙ₌₁⋯∞ ( aₙ cos(2πnx/T) + bₙ sin(2πnx/T) )</text>
  </g>
  <g id="series-reading" data-pptx-bounds="64 560 896 108" fill="#1B2027">
    <text x="64" y="584">读法:任何周期为 <tspan data-pptx-inline-formula="T">T</tspan> 的函数,都能用<tspan font-weight="bold" fill="#123B63">整数倍频率</tspan>的正弦与余弦堆出来。</text>
    <text x="64" y="620">傅里叶要解的是「热怎么在固体里扩散」,级数是解方程时逼出来的工具,</text><text x="64" y="656">不是为信号处理设计的写法——它比信号处理早了一百多年。</text></g>
