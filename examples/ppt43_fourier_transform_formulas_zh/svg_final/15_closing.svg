    <text x="92" y="240"><tspan font-weight="bold" fill="#123B63">一 </tspan>时域与频域是同一份信息的两种写法,靠一对积分互相翻译。</text>
    <text x="92" y="320"><tspan font-weight="bold" fill="#123B63">二 </tspan>滤波、均衡、模糊在频域都只是一次乘法——卷积定理。</text>
    <text x="92" y="400"><tspan font-weight="bold" fill="#123B63">三 </tspan>FFT 没换数学,只换了算路:从 N² 到 N log N。</text>
