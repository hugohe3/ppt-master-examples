    <text x="556" y="212" font-size="30" font-weight="bold" fill="#C8952B">1</text>
    <text x="596" y="212" font-size="24" fill="#26241F">พันธุ์ที่ให้กลิ่นหอมคือพันธุ์ที่ไม่ต้านทานโรคใบสีส้ม<tspan x="596" dy="34">ขอบใบแห้ง ไหม้ ใบหงิก เพลี้ยกระโดดสีน้ำตาล</tspan><tspan x="596" dy="34">เพลี้ยจักจั่นสีเขียว และหนอนกอ</tspan></text>
