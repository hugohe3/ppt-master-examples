  <g id="caution-band" data-pptx-bounds="64 608 1152 46">
    <rect x="64" y="608" width="1152" height="46" fill="#F57C00" fill-opacity="0.12"/>
    <use data-icon="chunk-filled/bug" x="88" y="618" width="26" height="26" fill="#8C3B2E"/>
    <text x="128" y="638" font-size="18" font-weight="bold" fill="#8C3B2E">ข้อควรระวัง</text>
    <text x="240" y="638" font-size="18" fill="#26241F">ไม่ต้านทานโรคใบสีส้ม ขอบใบแห้ง ไหม้ ใบหงิก และไม่ต้านทานเพลี้ยกระโดดสีน้ำตาล เพลี้ยจักจั่นสีเขียว หนอนกอ</text>
  </g>
  <g id="page-footer" data-pptx-bounds="64 672 1152 26" font-family="Tahoma, sans-serif" font-size="16" fill="#5F5A50">
