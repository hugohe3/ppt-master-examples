  <g id="zoom-explain" data-pptx-bounds="56 552 1168 126">
    <text x="60" y="584" font-size="22" fill="#2B2621">就像轮唱《两只老虎》:后一组晚一步,唱<tspan fill="#9E2A2B" font-weight="bold">同一段旋律</tspan>。巴赫的变化是让后起的声部<tspan fill="#9E2A2B" font-weight="bold">换一个高度</tspan>:</text>
    <text x="60" y="620" font-size="22" fill="#2B2621">这里高出三度;同度 = 一样高,九度 = 高出九度。两条虚线的<tspan font-weight="bold">起伏形状完全一样</tspan>。</text>
