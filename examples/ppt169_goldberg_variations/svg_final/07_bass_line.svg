      <ellipse cx="575" cy="270" rx="14" ry="10" />
      <ellipse cx="660" cy="260" rx="14" ry="10" />
      <ellipse cx="745" cy="300" rx="14" ry="10" />
    </g>
    <g font-size="18" fill="#1F2A36" font-weight="bold" text-anchor="middle">
      <text x="150" y="340">G</text>
      <text x="235" y="340">升F</text>
      <text x="320" y="340">E</text>
      <text x="405" y="340">D</text>
      <text x="490" y="340">B</text>
      <text x="575" y="340">C</text>
      <text x="660" y="340">D</text>
      <text x="745" y="340">G</text>
    </g>
  </g>
  <g id="bwv1087-note" data-pptx-bounds="876 158 348 196">
    
  <g transform="translate(880, 166) scale(1.16667)" fill="none" stroke="#A88452" stroke-width="1.5">
    <path d="M4 20l10 -10m0 -5v5h5m-9 -1v5h5m-9 -1v5h5m-5 -5l4 -4l4 -4" />
    <path d="M19 10c.638 -.636 1 -1.515 1 -2.486a3.515 3.515 0 0 0 -3.517 -3.514c-.97 0 -1.847 .367 -2.483 1m-3 13l4 -4l4 -4" />
  </g>
    <text x="918" y="188" font-size="20" font-weight="bold" fill="#A88452">这八个音还有下文</text>
    <text font-size="20" fill="#2B2621" x="880" y="228">巴赫在自用的初版印本末页,</text><text font-size="20" fill="#2B2621" x="880" y="258">手写了十四首卡农(BWV 1087),</text><text font-size="20" fill="#2B2621" x="880" y="288">全都建在这八个低音上;这本</text><text font-size="20" fill="#2B2621" x="880" y="318">自用本 1974 年才被发现。</text></g>
  <g id="bar-map" data-pptx-bounds="56 372 1168 136">
    <text x="60" y="396" font-size="16" fill="#6E655A">32 小节的和声地图:每首变奏都照这张图走</text>
    <text x="640" y="396" font-size="16" fill="#1F2A36" font-weight="bold" text-anchor="middle">前半 16 小节 | 后半 16 小节(各奏两遍)</text>
    <rect x="60" y="412" width="290" height="40" fill="#E9E1D0" />
    <rect x="350" y="412" width="290" height="40" fill="#D9CBB0" />
    <rect x="640" y="412" width="290" height="40" fill="#4F6A80" fill-opacity="0.35" />
    <rect x="930" y="412" width="290" height="40" fill="#E9E1D0" />
    <path d="M96.25 412V452 M132.5 412V452 M168.75 412V452 M205 412V452 M241.25 412V452 M277.5 412V452 M313.75 412V452 M386.25 412V452 M422.5 412V452 M458.75 412V452 M495 412V452 M531.25 412V452 M567.5 412V452 M603.75 412V452 M676.25 412V452 M712.5 412V452 M748.75 412V452 M785 412V452 M821.25 412V452 M857.5 412V452 M893.75 412V452 M966.25 412V452 M1002.5 412V452 M1038.75 412V452 M1075 412V452 M1111.25 412V452 M1147.5 412V452 M1183.75 412V452" fill="none" stroke="#F4EFE4" stroke-width="1.5" />
    <line x1="640" y1="404" x2="640" y2="460" stroke="#1F2A36" stroke-width="3" />
    <g font-size="18" fill="#2B2621" text-anchor="middle">
      <text x="205" y="484">1–8 小节 → <tspan font-weight="bold">G 大调</tspan></text>
      <text x="495" y="484">9–16 小节 → <tspan font-weight="bold">D 大调</tspan></text>
      <text x="785" y="484">17–24 小节 → <tspan font-weight="bold" fill="#4F6A80">e 小调</tspan></text>
      <text x="1075" y="484">25–32 小节 → <tspan font-weight="bold">G 大调</tspan></text>
    </g>
  </g>
  <g id="bass-takeaway" data-pptx-bounds="56 528 1168 132">
    <rect x="60" y="532" width="1160" height="124" fill="#1F2A36" fill-opacity="0.06" />
    <rect x="60" y="532" width="4" height="124" fill="#9E2A2B" />
    <text x="88" y="578" font-size="26" fill="#1F2A36">巴赫变奏的<tspan font-weight="bold">不是咏叹调的旋律</tspan>,而是<tspan fill="#9E2A2B" font-weight="bold">每小节低音线暗示的和声</tspan>。</text>
    <text x="88" y="624" font-size="22" fill="#2B2621">所以 30 个变奏的旋律可以听起来毫不相像,却都踩在同一条地基上——这正是“对称建筑”的秘密。</text>
  </g>
  <g id="footer" data-pptx-bounds="56 690 1168 22" font-size="14" fill="#6E655A">
    <text x="60" y="706">来源:Bloomfield 节目单 2016;Tafelmusik(Nediger);维基百科转引 Kirkpatrick 1938;Crean 2010;Boston Baroque(Pearlman)</text>
    <text x="1220" y="706" text-anchor="end">07</text>
  </g>
</svg>