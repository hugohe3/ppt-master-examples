<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Segoe UI, sans-serif" data-pptx-page-role="content">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#F4EFE4" />
  <g id="header" data-pptx-bounds="56 54 1168 92">
    <text x="60" y="80" font-size="16" fill="#9E2A2B" letter-spacing="2">地基 · 低音线</text>
    <text x="60" y="128" font-size="38" fill="#1F2A36" font-family="SimSun, Cambria, serif" font-weight="bold">地基:所有变奏共用一条低音线</text>
  </g>
  <g id="bass-staff" data-pptx-bounds="56 158 790 196">
    <text x="60" y="182" font-size="16" fill="#6E655A">咏叹调低音线的开头八个音(低音谱表,据 Kirkpatrick 1938 版记谱)</text>
    <g stroke="#1F2A36" stroke-width="1.2" stroke-opacity="0.6">
      <line x1="90" y1="220" x2="820" y2="220" />
      <line x1="90" y1="240" x2="820" y2="240" />
      <line x1="90" y1="260" x2="820" y2="260" />
      <line x1="90" y1="280" x2="820" y2="280" />
      <line x1="90" y1="300" x2="820" y2="300" />
      <line x1="820" y1="220" x2="820" y2="300" />
    </g>
    <path d="M136 202 L419 232" fill="none" stroke="#9E2A2B" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="440" y="214" font-size="16" fill="#9E2A2B">前四个音一步步往下走</text>
    <g fill="none" stroke="#1F2A36" stroke-width="3">
      <ellipse cx="150" cy="230" rx="14" ry="10" />
      <ellipse cx="235" cy="240" rx="14" ry="10" />
      <ellipse cx="320" cy="250" rx="14" ry="10" />
      <ellipse cx="405" cy="260" rx="14" ry="10" />
