<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Segoe UI, sans-serif" data-pptx-page-role="ending">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#F4EFE4" />
  <g id="closing-title" data-pptx-bounds="56 64 900 300" font-family="SimSun, Cambria, serif">
    <text x="60" y="96" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#9E2A2B" letter-spacing="2">收束</text>
    <text font-size="60" fill="#1F2A36" font-weight="bold" x="60" y="180">同一条低音线,</text><text font-size="60" fill="#1F2A36" font-weight="bold" x="60" y="258"><tspan>撑起 <tspan fill="#9E2A2B">32</tspan> 段音乐</tspan></text><text x="60" y="336" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="26" fill="#2B2621">结构是地图,耳朵才是终点。</text>
  </g>
  <g id="key-foundation" data-pptx-bounds="56 392 364 150">
    <line x1="60" y1="396" x2="400" y2="396" stroke="#1F2A36" stroke-width="2" />
    <text x="60" y="444" font-size="38" font-weight="bold" fill="#1F2A36" font-family="SimSun, Cambria, serif">地基</text>
    <text font-size="20" fill="#2B2621" x="60" y="486">一条 32 小节的低音线,</text><text font-size="20" fill="#2B2621" x="60" y="516">所有变奏共用。</text></g>
  <g id="key-beams" data-pptx-bounds="456 392 364 150">
    <line x1="460" y1="396" x2="800" y2="396" stroke="#9E2A2B" stroke-width="2" />
    <text x="460" y="444" font-size="38" font-weight="bold" fill="#9E2A2B" font-family="SimSun, Cambria, serif">梁柱</text>
    <text font-size="20" fill="#2B2621" x="460" y="486">9 首卡农,每三首一首,</text><text font-size="20" fill="#2B2621" x="460" y="516">音程从同度升到九度。</text></g>
  <g id="key-loop" data-pptx-bounds="856 392 368 150">
    <line x1="860" y1="396" x2="1220" y2="396" stroke="#A88452" stroke-width="2" />
