    <text x="60" y="128" font-size="38" fill="#1F2A36" font-family="SimSun, Cambria, serif" font-weight="bold">终点回到起点:民歌玩笑之后,咏叹调原样回来</text>
  </g>
  <g id="quodlibet-intro" data-pptx-bounds="56 164 600 108">
    <use data-icon="tabler-outline/music" x="60" y="170" width="28" height="28" fill="#A88452" stroke-width="1.5"/>
    <text x="98" y="192" font-size="22" font-weight="bold" fill="#A88452">第 30 变奏 · 集腔曲(Quodlibet)</text>
    <text x="60" y="230" font-size="20" fill="#2B2621">拉丁语“随心所欲”:把流行歌曲拼接起来一起唱,<tspan x="60" dy="30">是巴赫家族聚会时的即兴习俗。</tspan></text>
  </g>
  <g id="quodlibet-lanes" data-pptx-bounds="56 284 590 184">
    <rect x="60" y="292" width="580" height="48" fill="#E9E1D0"/>
    <rect x="60" y="292" width="5" height="48" fill="#A88452"/>
    <text x="80" y="323" font-size="18" fill="#1F2A36">“Ich bin so lang nicht bey dir g'west”<tspan font-size="16" fill="#6E655A"> 我好久没和你在一起</tspan></text>
    <rect x="60" y="352" width="580" height="48" fill="#E9E1D0"/>
    <rect x="60" y="352" width="5" height="48" fill="#A88452"/>
    <text x="80" y="383" font-size="18" fill="#1F2A36">“Kraut und Rüben haben mich vertrieben”<tspan font-size="16" fill="#6E655A"> 白菜萝卜把我赶走了</tspan></text>
    <rect x="60" y="412" width="580" height="48" fill="#1F2A36" fill-opacity="0.12"/>
    <rect x="60" y="412" width="5" height="48" fill="#1F2A36"/>
    <text x="80" y="443" font-size="18" fill="#1F2A36" font-weight="bold">低音主题<tspan font-size="16" font-weight="normal" fill="#6E655A"> 同一条地基,照常在下面走</tspan></text>
  </g>
