  <g id="quodlibet-caution" data-pptx-bounds="56 488 600 80">
    <text x="60" y="516" font-size="16" fill="#6E655A">三条线同时响起。注意:两首民歌的认定只来自巴赫学生 Kittel<tspan x="60" dy="26">约 1801 年的口述记录,宜当作“相传”来听。</tspan></text>
  </g>
