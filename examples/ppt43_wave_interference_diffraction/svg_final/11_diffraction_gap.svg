  </g>
  <g id="footnote" data-pptx-bounds="60 668 900 52">
    <text font-size="16" fill="#B9C2B4" x="60" y="688">衍射是一切波的共性,任何时候都在发生,区别只在"明显不明显"。</text><text font-size="16" fill="#B9C2B4" x="60" y="712">声波波长约 0.02–17 m,和门窗同数量级,所以隔墙有耳。</text></g>
