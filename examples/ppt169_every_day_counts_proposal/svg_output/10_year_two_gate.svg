    <text x="640" y="558" font-size="18" fill="#5A6368">Jan-Apr 2028 · partner agreements, home-visit protocol</text>
    <text x="640" y="606" font-size="24" font-weight="bold" fill="#1F4B57">Phase 7 — Hand-off</text>
    <text x="640" y="634" font-size="18" fill="#5A6368">May-Jun 2028 · Riverbend runs it, Lantern reviews and leaves</text>
