    <text x="64" y="450" font-size="28" font-weight="bold" fill="#1F4B57">The gate: June 2027</text>
    <text x="64" y="494" font-size="24" fill="#23282D">The board reviews pilot results against<tspan x="64" dy="32">the baseline and decides to continue,</tspan><tspan x="64" dy="32">adjust, or stop.</tspan></text>
    <text x="64" y="600" font-size="18" fill="#B0722B">Lantern's year-two fee is not committed until that vote.</text>
    <text x="64" y="626" font-size="18" fill="#5A6368">No ongoing retainer is proposed after hand-off.</text>
