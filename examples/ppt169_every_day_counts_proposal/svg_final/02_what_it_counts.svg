  <g id="p02-baseline" data-pptx-bounds="624 476 592 164">
    <text x="624" y="512" font-size="28" font-weight="bold" fill="#1F4B57">All three count the same way</text>
    <text font-size="24" fill="#23282D" x="624" y="556">Riverbend's own baseline for 2025-26 is <tspan font-weight="bold" fill="#1F4B57">31%</tspan> —</text><text font-size="24" fill="#23282D" x="624" y="590">about 3,100 of 10,000 students. That is the</text><text font-size="24" fill="#23282D" x="624" y="624">number this proposal moves.</text><text x="624" y="632" font-size="18" fill="#B0722B">Illustrative district figures</text>
