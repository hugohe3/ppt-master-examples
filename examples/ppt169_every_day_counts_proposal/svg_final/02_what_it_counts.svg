  <g id="p02-topbar" data-pptx-bounds="64 76 1152 30">
    <text x="64" y="94" font-size="18" letter-spacing="2" fill="#5A6368">THE SITUATION</text>
    <rect x="938" y="76" width="278" height="28" rx="14" fill="#B0722B" fill-opacity="0.12" />
    <text x="1077" y="95" font-size="16" text-anchor="middle" fill="#B0722B">Contains illustrative figures</text>
  </g>
  <g id="p02-title" data-pptx-bounds="64 116 1152 64">
    <text x="64" y="150" font-family="Trebuchet MS, sans-serif" font-size="40" font-weight="bold" fill="#1F4B57">Chronically absent without ever being truant</text>
    <line x1="64" y1="176" x2="1216" y2="176" stroke="#DDD8D0" stroke-width="1" />
  </g>
  <g id="p02-lead" data-pptx-bounds="64 194 1152 78">
    <text font-size="28" fill="#23282D" x="64" y="220">Chronic absenteeism is a count of missed days for any reason —</text><text font-size="28" fill="#23282D" x="64" y="258">which is why it can be managed like any other operating metric.</text></g>
  <g id="p02-hero" data-pptx-bounds="64 280 356 180">
    <rect x="64" y="280" width="356" height="180" rx="16" fill="#FAF8F5" stroke="#DDD8D0" stroke-width="1" />
    <text x="100" y="360" font-family="Trebuchet MS, sans-serif" font-size="72" font-weight="bold" fill="#E07A3F">18</text>
    <text x="204" y="360" font-family="Trebuchet MS, sans-serif" font-size="32" fill="#1F4B57">days</text>
    <text x="100" y="404" font-size="24" fill="#23282D">10% of a 180-day school year</text>
    <text x="100" y="436" font-size="20" fill="#5A6368">0.10 × 180 = 18</text>
  </g>
  <g id="p02-definition" data-pptx-bounds="456 280 760 176">
    <text x="456" y="302" font-size="18" letter-spacing="2" fill="#5A6368">HOW IT IS COUNTED</text>
    <text font-size="24" fill="#23282D" x="456" y="340">Missing <tspan font-weight="bold" fill="#1F4B57">10 percent or more</tspan> of school days for any reason —</text><text font-size="24" fill="#23282D" x="456" y="374">excused, unexcused, or suspension.</text><text x="456" y="410" font-size="16" fill="#5A6368">Framework for Action: Addressing Chronic Absenteeism through ESSA (ERIC ED617466, 2017)</text>
    <text x="456" y="442" font-size="18" fill="#5A6368">The federal report-card measure counts 15 days or more; ESSA requires the rate on report cards.</text>
  </g>
  <g id="p02-absence-types" data-pptx-bounds="64 476 440 172">
    <rect x="64" y="480" width="440" height="48" rx="24" fill="#F4F1EC" />
    
