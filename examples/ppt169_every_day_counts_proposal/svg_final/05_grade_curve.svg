  <g id="p05-consequence" data-pptx-bounds="840 262 376 372">
    <text x="840" y="286" font-size="18" letter-spacing="2" fill="#5A6368">WHY BOTH ENDS MATTER</text>
    <line x1="840" y1="300" x2="1216" y2="300" stroke="#DDD8D0" stroke-width="1" />
    <text font-size="18" fill="#23282D" x="840" y="332">Students chronically absent in both</text><text font-size="18" fill="#23282D" x="840" y="358">kindergarten and first grade are much</text><text font-size="18" fill="#23282D" x="840" y="384">less likely to read at grade level by third</text><text font-size="18" fill="#23282D" x="840" y="410">grade.</text><text font-size="18" fill="#23282D" x="840" y="446">Students not reading at grade level by</text><text font-size="18" fill="#23282D" x="840" y="472">third grade are four times more likely to</text><text font-size="18" fill="#23282D" x="840" y="498">drop out of high school.</text><text font-size="18" fill="#23282D" x="840" y="534">By sixth grade chronic absenteeism is a</text><text font-size="18" fill="#23282D" x="840" y="560">leading dropout indicator; by high school</text><text font-size="18" fill="#23282D" x="840" y="586">attendance predicts dropout better than</text><text font-size="18" fill="#23282D" x="840" y="612">test scores.</text></g>
  <g id="p05-source" data-pptx-bounds="64 644 1152 50" fill="#5A6368" font-size="16">
    <text x="64" y="666">Chart source: NYC Open Data — End-of-Year Attendance and Chronic Absenteeism (sgsi-66kk), 2022-23; student-weighted rate per grade, computed by Lantern.</text>
    <text x="64" y="688">Consequence evidence: Framework for Action: Addressing Chronic Absenteeism through ESSA Implementation (ERIC ED617466, 2017).</text>
  </g>
