    <text x="640" y="360" font-size="24" fill="#23282D">Students already chronically absent</text>
    <text x="640" y="428" font-size="28" font-weight="bold" fill="#1F4B57">Tier 2 — Early intervention</text>
    <text x="640" y="462" font-size="24" fill="#23282D">Students approaching the 10% line</text>
    <text x="640" y="530" font-size="28" font-weight="bold" fill="#1F4B57">Tier 1 — Universal prevention</text>
    <text x="640" y="564" font-size="24" fill="#23282D">All students, every day</text>
