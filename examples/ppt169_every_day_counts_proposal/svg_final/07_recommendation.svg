  <g id="p07-delivery" data-pptx-bounds="64 624 1152 92">
    <text x="64" y="648" font-size="24" fill="#23282D">Lantern designs the system and trains the site leads; <tspan font-weight="bold" fill="#1F4B57">Riverbend runs it.</tspan></text>
    <text x="64" y="680" font-size="18" fill="#B0722B">Illustrative staffing: one attendance lead per site, one district coordinator.</text>
    <text x="64" y="706" font-size="16" fill="#5A6368">The multi-tiered system of supports comes from Framework for Action (ERIC ED617466, 2017).</text>
