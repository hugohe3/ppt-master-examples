  <g id="p08-tier3-detail" data-pptx-bounds="460 296 756 88">
    <text font-size="18" fill="#23282D" x="460" y="318"><tspan font-weight="bold" fill="#1F4B57">Trigger</tspan> — already chronically absent, or referred by the attendance team</text><text font-size="18" fill="#23282D" x="460" y="344"><tspan><tspan font-weight="bold" fill="#1F4B57">Action</tspan> — case review, home visit, community partner referral, family attendance plan</tspan></text><text font-size="18" fill="#23282D" x="460" y="370"><tspan><tspan font-weight="bold" fill="#1F4B57">Owner</tspan> — district attendance coordinator</tspan></text></g>
  <g id="p08-tier2-detail" data-pptx-bounds="460 384 756 88">
    <text font-size="18" fill="#23282D" x="460" y="406"><tspan font-weight="bold" fill="#1F4B57">Trigger</tspan> — passes the early-warning threshold in a rolling window</text><text font-size="18" fill="#23282D" x="460" y="432"><tspan><tspan font-weight="bold" fill="#1F4B57">Action</tspan> — same-week family contact, a named adult, a barrier check on health/transport</tspan></text><text font-size="18" fill="#23282D" x="460" y="458"><tspan><tspan font-weight="bold" fill="#1F4B57">Owner</tspan> — site attendance lead</tspan></text></g>
  <g id="p08-tier1-detail" data-pptx-bounds="460 472 756 88">
    <text font-size="18" fill="#23282D" x="460" y="494"><tspan font-weight="bold" fill="#1F4B57">Trigger</tspan> — enrolled</text><text font-size="18" fill="#23282D" x="460" y="520"><tspan><tspan font-weight="bold" fill="#1F4B57">Action</tspan> — attendance expectations, positive messaging, daily data for every teacher</tspan></text><text font-size="18" fill="#23282D" x="460" y="546"><tspan><tspan font-weight="bold" fill="#1F4B57">Owner</tspan> — site principal</tspan></text></g>
  <g id="p08-boundary" data-pptx-bounds="64 584 1152 100">
    <rect x="64" y="584" width="1152" height="100" rx="12" fill="#F4F1EC" />
    <rect x="64" y="584" width="4" height="100" fill="#B0722B" />
    
  <g transform="translate(92, 596) scale(1.08333)" fill="none" stroke="#B0722B" stroke-width="2">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
    <text x="130" y="618" font-size="24" fill="#23282D">The boundary: legal action is used only as a <tspan font-weight="bold" fill="#B0722B">very last resort</tspan>.</text>
    <text font-size="18" fill="#5A6368" x="130" y="650">England's statutory guidance takes the same shape: schools and local authorities support first, and legal</text><text font-size="18" fill="#5A6368" x="130" y="674">interventions apply only where attendance support does not work, is not engaged with, or is not appropriate.</text></g>
  <g id="p08-source" data-pptx-bounds="64 690 1152 30">
    <text x="64" y="708" font-size="16" fill="#5A6368">Sources: Framework for Action (ERIC ED617466, 2017); Department for Education, Working together to improve school attendance, first published 6 May 2022.</text>
  </g>
