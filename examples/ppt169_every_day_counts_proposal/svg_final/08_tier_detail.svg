<path d="M 104 556 L 124 476 L 396 476 L 416 556 Z" />
</g>
    <text x="260" y="528" font-family="Trebuchet MS, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#1F4B57">1</text>
