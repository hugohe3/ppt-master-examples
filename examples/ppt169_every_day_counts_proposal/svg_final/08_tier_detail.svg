  <g id="p08-topbar" data-pptx-bounds="64 76 1152 30">
    <text x="64" y="94" font-size="18" letter-spacing="2" fill="#5A6368">HOW THE SYSTEM WORKS</text>
    <rect x="938" y="76" width="278" height="28" rx="14" fill="#B0722B" fill-opacity="0.12" />
