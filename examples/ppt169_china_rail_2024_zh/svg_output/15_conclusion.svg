<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="ending">
  <defs>
    <filter id="softShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>
  <image id="p15-photo" data-pptx-role="background" href="../images/fuxing_train_wash.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice" />
  <rect id="closing-panel" data-pptx-role="decoration" x="72" y="140" width="760" height="520" fill="#FFFFFF" filter="url(#softShadow)" />
  <g id="closing-title" data-pptx-bounds="112 170 680 90">
    <rect x="112" y="176" width="80" height="4" fill="#C8102E" />
    <text x="112" y="232" font-family="SimHei, Arial, sans-serif" font-size="40" font-weight="bold" fill="#0B3A6F">三条判断</text>
  </g>
  <g id="judgement-1" data-pptx-bounds="112 280 680 110">
    <text x="112" y="312" font-family="SimHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#C8102E">1</text>
    <text x="160" y="312" font-size="24" font-weight="bold" fill="#1E2733">客运已越过疫情前水平并创历史高位</text>
    <text x="160" y="350" font-size="24" fill="#5A6775">43.12 亿人(+11.9%),高于 2019 年的 366002 万人</text>
  </g>
  <g id="judgement-2" data-pptx-bounds="112 400 680 110">
    <text x="112" y="432" font-family="SimHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#C8102E">2</text>
    <text x="160" y="432" font-size="24" font-weight="bold" fill="#1E2733">货运总量升而周转量落,结构继续分化</text>
    <text x="160" y="470" font-size="24" fill="#5A6775">集装箱 <tspan fill="#2E7D32" font-weight="bold">+15.5%</tspan> 领涨,粮食 <tspan fill="#C62828" font-weight="bold">-17.6%</tspan> 领跌</text>
  </g>
  <g id="judgement-3" data-pptx-bounds="112 520 680 80">
    <text x="112" y="552" font-family="SimHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#C8102E">3</text>
    <text x="160" y="552" font-size="24" font-weight="bold" fill="#1E2733">网络与装备继续扩张,主要污染物持续下降</text>
    <text x="160" y="590" font-size="24" fill="#5A6775">新线 3113 公里、高铁 4.8 万公里;二氧化硫降至 456 吨</text>
  </g>
  <g id="closing-note" data-pptx-bounds="112 606 680 44">
    <text x="112" y="630" font-size="18" fill="#5A6775">整理:三条判断由编者归纳,支撑数值全部取自附件,未作改动</text>
  </g>
  <g id="closing-source" data-pptx-role="footer" data-pptx-bounds="872 636 336 74" fill="#FFFFFF" font-size="15" text-anchor="end">
    <text x="1208" y="660">数据来源:国家铁路局《2024年铁道统计公报》</text>
    <text x="1208" y="682">国际对照:World Bank IS.RRS.TOTL.KM</text>
