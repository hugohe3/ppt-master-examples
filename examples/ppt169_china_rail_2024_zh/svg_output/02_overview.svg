<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="content">
  <defs>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="brief-hero-photo" data-pptx-bounds="980 0 300 720">
    <image href="../images/fuxing_train.jpg" x="980" y="0" width="300" height="720" preserveAspectRatio="xMidYMid slice"/>
    <rect x="980" y="0" width="96" height="720" fill="url(#fadeLeft)"/>
    <text x="1256" y="696" font-size="15" fill="#FFFFFF" text-anchor="end">摄影 N509FZ · CC BY-SA 4.0</text>
  </g>
  <g id="page-frame" data-pptx-role="header" data-pptx-bounds="72 48 868 48">
    <rect x="72" y="56" width="868" height="3" fill="#0B3A6F"/>
    <text x="72" y="86" font-size="18" fill="#5A6775">一、全年总览</text>
    <text x="940" y="86" font-size="18" fill="#5A6775" text-anchor="end">02 / 15</text>
  </g>
  <g id="page-title" data-pptx-bounds="72 104 868 60">
    <text x="72" y="150" font-family="SimHei, Arial, sans-serif" font-size="40" font-weight="bold" fill="#0B3A6F">四个数字看懂 2024 年</text>
  </g>
  <g id="page-lead" data-pptx-bounds="72 172 868 44">
    <text x="72" y="200" font-size="28" fill="#1E2733">客运创新高、货运稳中有升,投资与新线保持高位</text>
  </g>
  <g id="kpi-pax" data-pptx-bounds="72 236 414 190">
    <rect x="72" y="236" width="414" height="3" fill="#C8102E"/>
    <use data-icon="chunk-filled/users" x="72" y="256" width="36" height="36" fill="#C8102E"/>
    <text x="120" y="284" font-size="18" fill="#5A6775">旅客发送量</text>
    <text x="72" y="372" font-family="SimHei, Arial, sans-serif" font-size="64" font-weight="bold" fill="#C8102E">43.12<tspan font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="normal" fill="#1E2733"> 亿人</tspan></text>
    <text x="72" y="406" font-size="18" fill="#2E7D32">比上年增长 11.9%(增加 4.58 亿人)</text>
  </g>
  <g id="kpi-freight" data-pptx-bounds="526 236 414 190">
    <rect x="526" y="236" width="414" height="3" fill="#0B3A6F"/>
    <use data-icon="chunk-filled/truck" x="526" y="256" width="36" height="36" fill="#0B3A6F"/>
    <text x="574" y="284" font-size="18" fill="#5A6775">货运总发送量</text>
    <text x="526" y="372" font-family="SimHei, Arial, sans-serif" font-size="64" font-weight="bold" fill="#0B3A6F">51.75<tspan font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="normal" fill="#1E2733"> 亿吨</tspan></text>
    <text x="526" y="406" font-size="18" fill="#2E7D32">比上年增长 2.8%(增加 1.39 亿吨)</text>
  </g>
  <g id="kpi-invest" data-pptx-bounds="72 446 414 190">
    <rect x="72" y="446" width="414" height="3" fill="#0B3A6F"/>
    <use data-icon="chunk-filled/coin" x="72" y="466" width="36" height="36" fill="#0B3A6F"/>
    <text x="120" y="494" font-size="18" fill="#5A6775">固定资产投资</text>
    <text x="72" y="582" font-family="SimHei, Arial, sans-serif" font-size="64" font-weight="bold" fill="#0B3A6F">8506<tspan font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="normal" fill="#1E2733"> 亿元</tspan></text>
    <text x="72" y="616" font-size="18" fill="#5A6775">公报未列同比口径</text>
  </g>
  <g id="kpi-newline" data-pptx-bounds="526 446 414 190">
    <rect x="526" y="446" width="414" height="3" fill="#0B3A6F"/>
    <use data-icon="chunk-filled/route" x="526" y="466" width="36" height="36" fill="#0B3A6F"/>
    <text x="574" y="494" font-size="18" fill="#5A6775">投产新线</text>
    <text x="526" y="582" font-family="SimHei, Arial, sans-serif" font-size="64" font-weight="bold" fill="#0B3A6F">3113<tspan font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="normal" fill="#1E2733"> 公里</tspan></text>
    <text x="526" y="616" font-size="18" fill="#5A6775">其中高速铁路 2457 公里</text>
  </g>
  <g id="source-bar" data-pptx-role="footer" data-pptx-bounds="72 652 868 48">
    <rect x="72" y="656" width="868" height="1" fill="#D8DEE6"/>
    <text x="72" y="688" font-size="15" fill="#5A6775">数据来源:国家铁路局《2024年铁道统计公报》· 整理:四项总量由编者从公报正文汇总,数值未作改动</text>
  </g>
</svg>
