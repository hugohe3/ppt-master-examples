    <text x="100" y="402" font-size="28" fill="#232A31">在履行职责或提供服务过程中获得的，上述数量或数额<tspan font-weight="bold" fill="#C0392B">减半</tspan>即达「情节严重」。</text>
    <text x="100" y="430" font-size="18" fill="#232A31">即 25 条 / 250 条 / 2500 条 / 违法所得 2500 元（依该规则折算）。</text>
