    <text x="136" y="260" font-size="24" font-weight="bold" fill="#1F2A37">设备</text>
    <text font-size="18" fill="#5A6068" x="136" y="296">公司数据只落在公司管控的终端上，个人电脑</text><text font-size="18" fill="#5A6068" x="136" y="322">不做公司数据的落地存储。</text></g>
