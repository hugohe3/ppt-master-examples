    <text font-size="18" fill="#5A6068" x="720" y="296">公共 Wi-Fi 下先连公司 VPN 再访问内部系统；</text><text font-size="18" fill="#5A6068" x="720" y="322">不为「网速快」绕过管控通道。</text></g>
