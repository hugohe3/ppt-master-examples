    <text font-size="24" fill="#232A31" x="210" y="292">发生网络安全事件时，网络运营者已采取合理必要的防护措施、按照应急预案</text><text font-size="24" fill="#232A31" x="210" y="326">进行处置并有效降低影响危害、且按照本办法规定及时报告的，</text><text font-size="24" fill="#232A31" x="210" y="360">可视情从轻或不予追究相关单位和人员责任。</text><text x="210" y="394" font-size="18" fill="#5A6068">——《国家网络安全事件报告管理办法》第十一条</text>
