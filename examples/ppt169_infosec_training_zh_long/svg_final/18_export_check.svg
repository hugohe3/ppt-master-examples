  </g>
  <g id="question-1" data-pptx-bounds="72 230 828 80">
    <text x="72" y="282" font-family="SimSun, Cambria, serif" font-size="56" fill="#D5CEC2">一</text>
    <text x="160" y="264" font-size="24" font-weight="bold" fill="#1F2A37">这是哪一档数据？</text>
    <text x="160" y="294" font-size="18" fill="#5A6068">分不清就按敏感处理。</text>
    <line x1="160" y1="308" x2="900" y2="308" stroke="#D5CEC2" stroke-width="1" />
  </g>
  <g id="question-2" data-pptx-bounds="72 315 828 80">
    <text x="72" y="367" font-family="SimSun, Cambria, serif" font-size="56" fill="#D5CEC2">二</text>
    <text x="160" y="349" font-size="24" font-weight="bold" fill="#1F2A37">收件人有权知道吗？</text>
    <text x="160" y="379" font-size="18" fill="#5A6068">对外发送要有合同或授权依据。</text>
    <line x1="160" y1="393" x2="900" y2="393" stroke="#D5CEC2" stroke-width="1" />
  </g>
  <g id="question-3" data-pptx-bounds="72 400 828 80">
    <text x="72" y="452" font-family="SimSun, Cambria, serif" font-size="56" fill="#D5CEC2">三</text>
    <text x="160" y="434" font-size="24" font-weight="bold" fill="#1F2A37">有没有更小的范围？</text>
    <text x="160" y="464" font-size="18" fill="#5A6068">能发摘要就不发全量，能去标识化就不发原始个人信息。</text>
    <line x1="160" y1="478" x2="900" y2="478" stroke="#D5CEC2" stroke-width="1" />
  </g>
  <g id="question-4" data-pptx-bounds="72 485 828 80">
    <text x="72" y="537" font-family="SimSun, Cambria, serif" font-size="56" fill="#D5CEC2">四</text>
    <text x="160" y="519" font-size="24" font-weight="bold" fill="#1F2A37">留痕了吗？</text>
    <text x="160" y="549" font-size="18" fill="#5A6068">谁批的、什么时候发的、发了哪一版，要能查得到。</text>
    <line x1="160" y1="563" x2="900" y2="563" stroke="#D5CEC2" stroke-width="1" />
  </g>
