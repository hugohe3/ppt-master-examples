    <text x="850" y="312" font-size="18" fill="#5A6068">2026 年 2 月至 5 月注册的 439 个<tspan x="850" dy="26">钓鱼域名中，仿冒 wps、chrome</tspan><tspan x="850" dy="26">的合计 340 个，占 77.4%。</tspan></text>
