    <text x="72" y="312" font-size="18" fill="#5A6068">钓鱼演练中，语音和短信等移动<tspan x="72" dy="26">端渠道的成功点击率中位数，</tspan><tspan x="72" dy="26">比电子邮件渠道高 40%。</tspan></text>
