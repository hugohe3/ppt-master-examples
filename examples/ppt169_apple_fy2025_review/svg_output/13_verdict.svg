    <text x="64" y="328" font-size="64" font-weight="bold" font-family="Consolas" fill="#1E293B">+6.43%</text>
    <text x="64" y="380" font-size="28" fill="#1E293B"><tspan x="64" dy="0">收入 <tspan font-family="Consolas">416,161</tspan></tspan><tspan x="64" dy="34">四季同比全为正</tspan></text>
    <text x="64" y="452" font-size="18" fill="#64748B">FY2024 为 391,035</text>
  </g>

  <g id="verdict-quality" data-pptx-bounds="448 238 352 226">
