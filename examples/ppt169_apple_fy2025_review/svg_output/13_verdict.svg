    <text x="64" y="146" font-size="28" fill="#64748B">FY2025 可以用三个数字复述:+6.43%、46.91%、可比口径 +7.72%</text>
  </g>

  <g id="verdict-scale" data-pptx-bounds="64 238 352 226">
