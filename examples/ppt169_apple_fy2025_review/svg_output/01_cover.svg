<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="cover">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="cover-headline" data-pptx-bounds="64 110 800 296">
    <text x="64" y="140" font-size="18" fill="#64748B" letter-spacing="2">APPLE INC. · 财年 2025 经营复盘</text>
    <text x="64" y="252" font-size="72" font-weight="bold" fill="#1E293B">FY2025:收入创新高<tspan x="64" dy="90">增长的一半来自服务</tspan></text>
    <line x1="64" y1="400" x2="864" y2="400" stroke="#1E293B" stroke-width="3"/>
  </g>

  <g id="metric-net-sales" data-pptx-bounds="64 440 300 160">
    <text x="64" y="470" font-size="18" fill="#64748B">净销售额合计(百万美元)</text>
    <text x="64" y="546" font-size="64" font-weight="bold" font-family="Consolas" fill="#1E293B">416,161</text>
    <text x="64" y="584" font-size="24" fill="#2E7D5B">▲ 同比 <tspan font-family="Consolas" font-weight="bold">+6.43%</tspan></text>
  </g>

  <g id="metric-increment" data-pptx-bounds="404 440 300 160">
    <text x="404" y="470" font-size="18" fill="#64748B">收入增量(百万美元)</text>
    <text x="404" y="546" font-size="64" font-weight="bold" font-family="Consolas" fill="#1E293B">25,126</text>
    <text x="404" y="584" font-size="24" fill="#64748B">FY2024 为 <tspan font-family="Consolas">391,035</tspan></text>
  </g>

  <g id="metric-services-share" data-pptx-bounds="744 440 320 160">
    <text x="744" y="470" font-size="18" fill="#64748B">服务在增量中的贡献</text>
    <text x="744" y="546" font-size="64" font-weight="bold" font-family="Consolas" fill="#2B6CB0">51.7%</text>
    <text x="744" y="584" font-size="24" fill="#1E293B">高于全部产品之和</text>
  </g>

  <g id="cover-meta" data-pptx-bounds="1020 104 196 112">
    <use data-icon="simple-icons/apple" x="1168" y="110" width="48" height="48" fill="#1E293B"/>
    <text x="1216" y="196" font-size="18" fill="#64748B" text-anchor="end">财年截止 2025-09-27</text>
  </g>

  <g id="cover-source" data-pptx-bounds="64 640 1152 54">
    <line x1="64" y1="648" x2="1216" y2="648" stroke="#D8DEE6" stroke-width="1"/>
    <text x="64" y="684" font-size="16" fill="#64748B">数据来源:Apple Inc. 各季度 Condensed Consolidated Financial Statements(Unaudited),Apple Newsroom 公开 PDF</text>
  </g>
