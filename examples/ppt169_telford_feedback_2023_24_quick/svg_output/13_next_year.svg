<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI" data-pptx-page-role="ending">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F6F4EF"/>
  <g id="closing-field" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="800 0 480 720" data-pptx-av-adj="val 18750" fill="#1F4E79" stroke="none">
<path d="M 800 0 L 1190 0 L 1280 90 L 1280 720 L 800 720 Z"/>
