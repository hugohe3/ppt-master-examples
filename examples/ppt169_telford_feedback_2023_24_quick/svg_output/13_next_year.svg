  <g id="title" data-pptx-bounds="56 70 720 380">
    <text x="56" y="96" font-size="14" font-weight="bold" fill="#B83B26">WHAT CHANGES IN 2024/25</text>
    <text x="56" y="172" font-family="Cambria" font-size="58" font-weight="bold" fill="#1B2A3A">From May 2024, the<tspan x="56" dy="68">complaints clock</tspan><tspan x="56" dy="68">runs shorter</tspan></text>
    <text x="56" y="370" font-size="24" fill="#3A4654">Stage One replies now have 10 working days, not 15,<tspan x="56" dy="34">under the Ombudsman’s complaint handling code —</tspan><tspan x="56" dy="34">and the on-time target rises from 87% to 90%.</tspan></text>
  </g>
  <g id="timeline" data-pptx-bounds="56 474 720 150">
    <line x1="56" y1="496" x2="760" y2="496" stroke="#8A8F96" stroke-width="1.5"/>
    <circle cx="62" cy="496" r="7" fill="#1F4E79"/>
    <circle cx="242" cy="496" r="7" fill="#B83B26"/>
    <circle cx="422" cy="496" r="7" fill="#1F4E79"/>
    <circle cx="602" cy="496" r="7" fill="#1F4E79"/>
    <g font-size="16" font-weight="bold" fill="#1B2A3A">
      <text x="56" y="532">1 April 2024</text>
      <text x="236" y="532" fill="#B83B26">May 2024</text>
      <text x="416" y="532">Autumn 2024</text>
      <text x="596" y="532">2025</text>
    </g>
    <g font-size="16" fill="#3A4654">
      <text x="56" y="558">Tenant complaints<tspan x="56" dy="22">move into the</tspan><tspan x="56" dy="22">corporate procedure</tspan></text>
      <text x="236" y="558">Stage Two: 20–40<tspan x="236" dy="22">working days</tspan><tspan x="236" dy="22">(was 25–65)</tspan></text>
      <text x="416" y="558">Second ICS<tspan x="416" dy="22">benchmarking and</tspan><tspan x="416" dy="22">workforce surveys</tspan></text>
      <text x="596" y="558">Customer Service<tspan x="596" dy="22">Strategy updated</tspan><tspan x="596" dy="22">and relaunched</tspan></text>
    </g>
  </g>
  <g id="source-link" data-pptx-bounds="56 646 720 30">
    <text x="56" y="668" font-size="16" fill="#3A4654">Full report: <a href="https://www.telford.gov.uk/media/iyaj4b1z/corporate_feedback_report_2023_24.docx"><tspan font-weight="bold" fill="#1F4E79">Corporate Feedback Report 2023/24 (telford.gov.uk)</tspan></a></text>
  </g>
  <g id="test-numbers" data-pptx-bounds="848 130 376 330" fill="#FFFFFF">
    <text x="848" y="150" font-size="14" font-weight="bold" fill="#C9D6E3">THE 2024/25 TEST</text>
    <text x="848" y="236" font-family="Cambria" font-size="60" font-weight="bold">10 days</text>
    <text x="848" y="272" font-size="22" fill="#C9D6E3">Stage One limit (was 15)</text>
    <text x="848" y="376" font-family="Cambria" font-size="60" font-weight="bold">90%</text>
    <text x="848" y="412" font-size="22" fill="#C9D6E3">on time (87% in 2023/24)</text>
  </g>
  <line id="closing-divider" data-pptx-role="decoration" x1="848" y1="470" x2="1224" y2="470" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
  <g id="scrutiny-role" data-pptx-bounds="848 486 376 150">
    <text x="848" y="516" font-size="16" font-weight="bold" fill="#FFFFFF">Planned with scrutiny members</text>
    <text x="848" y="544" font-size="16" fill="#E3E9F0">Mystery Customer assignments for the<tspan x="848" dy="24">Communities Scrutiny Committee, senior</tspan><tspan x="848" dy="24">managers and volunteer Mystery Customers,</tspan><tspan x="848" dy="24">informing the Customer Strategy from 2025.</tspan></text>
  </g>
