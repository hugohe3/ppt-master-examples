    <text x="56" y="334" font-size="22" fill="#3A4654">2022/23: 601</text>
    <text x="56" y="372" font-size="16" fill="#5E6873">From 619 complainants; still<tspan x="56" dy="24">under 1% of all transactions</tspan></text>
