  <g id="closing-field" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="800 0 480 720" data-pptx-av-adj="val 18750" fill="#1F4E79" stroke="none">
