  <g id="nextindex-note" data-pptx-bounds="890 226 318 252">
    <line x1="890" y1="232" x2="1208" y2="232" stroke="#4A7BA7" stroke-width="1" />
    <text x="890" y="262" font-family="Consolas, Microsoft YaHei" font-size="18" letter-spacing="1" fill="#4FC9E8">nextIndex</text>
    <text font-size="18" fill="#C7D5E4" x="890" y="296">领导者上任时，把每个跟随者的</text><text font-size="18" fill="#C7D5E4" x="890" y="322">nextIndex 初始化为「自己最后</text><text font-size="18" fill="#C7D5E4" x="890" y="348">一条日志的索引 + 1」；论文图 7</text><text font-size="18" fill="#C7D5E4" x="890" y="374">中这个值是 11。</text><rect x="890" y="386" width="20" height="14" fill="#1E4E63" stroke="#4FC9E8" stroke-width="1.2" />
    <text x="920" y="398" font-size="16" fill="#9FB3C8">与领导者匹配</text>
