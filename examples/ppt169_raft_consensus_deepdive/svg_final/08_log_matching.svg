  <g id="repair-rule" data-pptx-bounds="72 492 1136 82">
    <text fill="#C7D5E4" x="72" y="522">一致性检查失败后，领导者递减 nextIndex 重试；到达匹配点后 AppendEntries 成功，</text><text fill="#C7D5E4" x="72" y="556">跟随者的冲突条目被删除、领导者的条目被追加。领导者永远不覆盖或删除自己的日志。</text></g>

  <g id="repair-optimization" data-pptx-bounds="72 586 1136 44">
