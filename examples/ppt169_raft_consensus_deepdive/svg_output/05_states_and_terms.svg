      <rect x="0" y="0" width="32" height="32" fill="#0F1C2B" />
      <path d="M32 0H0V32" fill="none" stroke="#1C3149" stroke-width="1" />
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#4FC9E8" stroke-width="1.6" />
    </marker>
    <marker id="arrowSteelP5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
