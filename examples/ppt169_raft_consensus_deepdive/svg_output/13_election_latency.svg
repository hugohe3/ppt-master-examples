<path d="M 1191.33 620 L 1194.67 606.67 L 1208 603.33 L 1191.33 620 L 800 620 L 800 520 L 1208 520 L 1208 603.33" fill="none" />
</g>
    <text x="822" y="552" font-family="Consolas, Microsoft YaHei" font-size="16" letter-spacing="1" fill="#E8A54F">论文建议</text>
    <text x="822" y="582" font-size="18" fill="#C7D5E4">保守取 150–300ms：更低会违反时序要求，<tspan x="822" dy="26">带来不必要的领导者更替与可用性下降。</tspan></text>
  </g>

