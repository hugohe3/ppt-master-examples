  <g id="setup-note" data-pptx-bounds="800 250 408 116">
    <text x="800" y="272" font-family="Consolas, Microsoft YaHei" font-size="16" letter-spacing="1" fill="#7A8FA6">实验条件</text>
    <text x="800" y="302" font-size="18" fill="#C7D5E4">五台服务器集群，广播时间约 15ms；<tspan x="800" dy="26">每条曲线代表 1000 次试验。</tspan><tspan x="800" dy="26">领导者在心跳间隔内被均匀随机地崩溃。</tspan></text>
  </g>

  <g id="latency-findings" data-pptx-bounds="800 386 408 116">
    <text x="800" y="408" font-family="Consolas, Microsoft YaHei" font-size="16" letter-spacing="1" fill="#4FC9E8">随机化的效果</text>
    <text x="800" y="438" font-size="18" fill="#C7D5E4">不加随机时选举一直超过 10 秒；<tspan x="800" dy="26">加 5ms 随机，中位停机降到 287ms；</tspan><tspan x="800" dy="26">加 50ms 随机，1000 次里的最坏值 513ms。</tspan></text>
  </g>

