<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Microsoft YaHei" font-size="24" data-pptx-page-role="content">
  <defs>
    <pattern id="blueprintGrid" data-pptx-pattern="smGrid" data-pptx-fg="#1C3149" data-pptx-bg="#0F1C2B" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="32" height="32" fill="#0F1C2B" />
      <path d="M32 0H0V32" fill="none" stroke="#1C3149" stroke-width="1" />
    </pattern>
    <marker id="arrowSteel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#4A7BA7" stroke-width="1.6" />
    </marker>
  </defs>

  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" />
  <rect id="grid-field" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#blueprintGrid)" />

  <g id="page-title" data-pptx-bounds="72 64 1136 96">
    <text x="72" y="92" font-family="Consolas, Microsoft YaHei" font-size="18" letter-spacing="2" fill="#4FC9E8">§5.2 LEADER ELECTION</text>
    <text x="72" y="140" font-size="40" font-weight="bold" fill="#E6EDF5">选举：心跳、随机超时，和一张先到先得的选票</text>
  </g>

  <g id="page-lead" data-pptx-bounds="72 164 1136 64">
    <line x1="72" y1="170" x2="1208" y2="170" stroke="#4A7BA7" stroke-width="1" />
    <text x="72" y="212" font-size="28" fill="#9FB3C8">领导者靠周期性心跳维持权威；心跳一断，跟随者就把自己变成候选人。</text>
  </g>

  <g id="state-strip" data-pptx-bounds="72 244 588 78">
    <circle cx="140" cy="284" r="30" fill="#16283C" stroke="#4A7BA7" stroke-width="2" />
    <text x="140" y="291" font-size="16" fill="#E6EDF5" text-anchor="middle">跟随者</text>
    <line x1="176" y1="284" x2="298" y2="284" stroke="#4A7BA7" stroke-width="2" marker-end="url(#arrowSteel)" />
    <circle cx="340" cy="284" r="30" fill="#16283C" stroke="#E8A54F" stroke-width="2" />
    <text x="340" y="291" font-size="16" fill="#E8A54F" text-anchor="middle">候选人</text>
    <line x1="376" y1="284" x2="498" y2="284" stroke="#4A7BA7" stroke-width="2" marker-end="url(#arrowSteel)" />
    <circle cx="540" cy="284" r="30" fill="#16283C" stroke="#4FC9E8" stroke-width="2.5" />
    <text x="540" y="291" font-size="16" fill="#4FC9E8" text-anchor="middle">领导者</text>
  </g>

  <g id="election-steps" data-pptx-bounds="72 336 588 246">
    <line x1="96" y1="366" x2="96" y2="546" stroke="#2A4361" stroke-width="2" />
    <circle cx="96" cy="366" r="13" fill="#0F1C2B" stroke="#4FC9E8" stroke-width="2" />
    <text x="96" y="372" font-family="Consolas, Microsoft YaHei" font-size="14" fill="#4FC9E8" text-anchor="middle">1</text>
    <text x="132" y="373" fill="#C7D5E4">跟随者在选举超时内没收到任何通信</text>
    <circle cx="96" cy="426" r="13" fill="#0F1C2B" stroke="#4FC9E8" stroke-width="2" />
    <text x="96" y="432" font-family="Consolas, Microsoft YaHei" font-size="14" fill="#4FC9E8" text-anchor="middle">2</text>
    <text x="132" y="433" fill="#C7D5E4">自增任期、转为候选人，先投自己一票</text>
    <circle cx="96" cy="486" r="13" fill="#0F1C2B" stroke="#4FC9E8" stroke-width="2" />
    <text x="96" y="492" font-family="Consolas, Microsoft YaHei" font-size="14" fill="#4FC9E8" text-anchor="middle">3</text>
    <text x="132" y="493" fill="#C7D5E4">并行发出 RequestVote RPC</text>
    <circle cx="96" cy="546" r="13" fill="#0F1C2B" stroke="#4FC9E8" stroke-width="2" />
    <text x="96" y="552" font-family="Consolas, Microsoft YaHei" font-size="14" fill="#4FC9E8" text-anchor="middle">4</text>
    <text x="132" y="553" fill="#C7D5E4">拿到多数选票 → 成为领导者并发心跳</text>
  </g>

  <g id="election-outcomes" data-pptx-bounds="680 240 528 198">
    <g id="p06-outcomes-bracket" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="bracketPair" data-pptx-frame="684 244 520 190" fill="none" stroke="#4A7BA7" stroke-width="2">
<path d="M 684 275.67 A 31.67 31.67 0 0 1 715.67 244 L 1172.33 244 A 31.67 31.67 0 0 1 1204 275.67 L 1204 402.33 A 31.67 31.67 0 0 1 1172.33 434 L 715.67 434 A 31.67 31.67 0 0 1 684 402.33 Z" stroke="none" />
<path d="M 715.67 434 A 31.67 31.67 0 0 1 684 402.33 L 684 275.67 A 31.67 31.67 0 0 1 715.67 244 M 1172.33 244 A 31.67 31.67 0 0 1 1204 275.67 L 1204 402.33 A 31.67 31.67 0 0 1 1172.33 434" />
</g>
    <text x="716" y="282" font-family="Consolas, Microsoft YaHei" font-size="16" letter-spacing="2" fill="#4FC9E8">候选人的三种结局</text>
    <text x="716" y="322" font-size="22" fill="#C7D5E4"><tspan font-family="Consolas, Microsoft YaHei" fill="#4FC9E8">a</tspan>　赢得选举：同任期内拿到多数选票</text>
    <text x="716" y="360" font-size="22" fill="#C7D5E4"><tspan font-family="Consolas, Microsoft YaHei" fill="#4FC9E8">b</tspan>　别人先确立为领导者，自己退位</text>
    <text x="716" y="398" font-size="22" fill="#C7D5E4"><tspan font-family="Consolas, Microsoft YaHei" fill="#E8A54F">c</tspan>　一段时间无人胜出：票被分裂</text>
    <text x="716" y="424" font-size="16" fill="#7A8FA6">每台服务器在给定任期内最多投一票，先到先得。</text>
  </g>

  <g id="randomized-timeout" data-pptx-bounds="680 450 528 164">
    <g id="p06-randomized-plaque" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="plaque" data-pptx-frame="680 450 528 164" fill="#16283C" stroke="#E8A54F" stroke-width="1.5">
<path d="M 680 477.33 A 27.33 27.33 0 0 0 707.33 450 L 1180.67 450 A 27.33 27.33 0 0 0 1208 477.33 L 1208 586.67 A 27.33 27.33 0 0 0 1180.67 614 L 707.33 614 A 27.33 27.33 0 0 0 680 586.67 Z" />
</g>
    <use data-icon="tabler-outline/stopwatch" x="712" y="470" width="32" height="32" fill="#E8A54F" stroke-width="2" />
    <text x="756" y="494" font-size="22" font-weight="bold" fill="#E8A54F">随机化选举超时</text>
    <text x="712" y="530" font-size="20" fill="#C7D5E4">论文举例 150–300ms：多数情况下只有一台<tspan x="712" dy="28">服务器先超时，它赢得选举并在别人超时前</tspan><tspan x="712" dy="28">发出心跳，票分裂因此罕见且能快速化解。</tspan></text>
  </g>

  <g id="page-footnote" data-pptx-bounds="72 640 888 48">
    <line x1="72" y1="646" x2="956" y2="646" stroke="#2A4361" stroke-width="1" />
    <text x="72" y="678" font-size="16" fill="#7A8FA6">来源：论文 §5.2。心跳即不带日志条目的 AppendEntries RPC。</text>
  </g>

