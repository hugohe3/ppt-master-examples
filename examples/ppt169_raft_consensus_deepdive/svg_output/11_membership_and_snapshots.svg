<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial, Microsoft YaHei" font-size="24" data-pptx-page-role="content">
  <defs>
    <pattern id="blueprintGrid" data-pptx-pattern="smGrid" data-pptx-fg="#1C3149" data-pptx-bg="#0F1C2B" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="32" height="32" fill="#0F1C2B" />
      <path d="M32 0H0V32" fill="none" stroke="#1C3149" stroke-width="1" />
    </pattern>
  </defs>

  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F1C2B" />
  <rect id="grid-field" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#blueprintGrid)" />

  <g id="page-title" data-pptx-bounds="72 64 1136 96">
    <text x="72" y="92" font-family="Consolas, Microsoft YaHei" font-size="18" letter-spacing="2" fill="#4FC9E8">§6 MEMBERSHIP · §7 LOG COMPACTION</text>
    <text x="72" y="140" font-size="40" font-weight="bold" fill="#E6EDF5">换机器与清日志：两个必须做、又不能出错的运维动作</text>
  </g>

  <g id="page-lead" data-pptx-bounds="72 164 1136 52">
    <line x1="72" y1="170" x2="1208" y2="170" stroke="#4A7BA7" stroke-width="1" />
    <text x="72" y="206" fill="#9FB3C8">直接从旧配置切到新配置不安全：切换不是原子的，集群可能分裂成两个各自为政的多数。</text>
  </g>

  <g id="config-change" data-pptx-bounds="72 240 568 108">
    <text x="72" y="262" font-family="Consolas, Microsoft YaHei" font-size="18" letter-spacing="1" fill="#4FC9E8">§6　联合共识</text>
    <g id="p11-config-cold" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="72 280 200 60" fill="#16283C" stroke="#4A7BA7" stroke-width="1.5">
<path d="M 72 280 L 242 280 L 272 310 L 242 340 L 72 340 L 102 310 Z" />
</g>
    <g id="p11-config-joint" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="242 280 200 60" fill="#1E4E63" stroke="#4FC9E8" stroke-width="2">
<path d="M 242 280 L 412 280 L 442 310 L 412 340 L 242 340 L 272 310 Z" />
</g>
    <g id="p11-config-cnew" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="412 280 200 60" fill="#16283C" stroke="#4A7BA7" stroke-width="1.5">
<path d="M 412 280 L 582 280 L 612 310 L 582 340 L 412 340 L 442 310 Z" />
</g>
    <text x="172" y="317" font-family="Consolas, Microsoft YaHei" font-size="18" fill="#9FB3C8" text-anchor="middle">C-old</text>
    <text x="342" y="317" font-family="Consolas, Microsoft YaHei" font-size="18" fill="#4FC9E8" text-anchor="middle">C-old,new</text>
    <text x="512" y="317" font-family="Consolas, Microsoft YaHei" font-size="18" fill="#9FB3C8" text-anchor="middle">C-new</text>
  </g>

  <g id="config-desc" data-pptx-bounds="72 366 568 100">
    <text x="72" y="386" font-size="20" fill="#C7D5E4">过渡期用联合共识：日志复制到两个配置的<tspan x="72" dy="32">所有服务器；选举与提交都要求旧、新</tspan><tspan x="72" dy="32">两个配置各自都达到多数。</tspan></text>
  </g>

  <g id="config-extras" data-pptx-bounds="72 474 568 118">
    <rect x="72" y="474" width="4" height="118" fill="#E8A54F" />
    <text x="94" y="494" font-size="18" fill="#9FB3C8">新服务器先作为无投票权成员追赶日志；<tspan x="94" dy="28">领导者不在新配置里时，提交 C-new 后退位；</tspan><tspan x="94" dy="28">被移除的服务器可能捣乱：在最小选举超时内</tspan><tspan x="94" dy="28">听到过现任领导者，就忽略 RequestVote。</tspan></text>
  </g>

  <g id="snapshot-text" data-pptx-bounds="680 240 528 200">
    <text x="680" y="262" font-family="Consolas, Microsoft YaHei" font-size="18" letter-spacing="1" fill="#4FC9E8">§7　快照</text>
    <text x="680" y="304" font-size="20" fill="#C7D5E4">快照把当前状态写入稳定存储，然后丢弃该点<tspan x="680" dy="28">之前的整段日志；每台服务器独立快照，只覆盖</tspan><tspan x="680" dy="28">已提交条目。</tspan><tspan x="680" dy="28">快照另存 last included index / term，以及</tspan><tspan x="680" dy="28">截至该索引的最新配置。</tspan></text>
  </g>

  <g id="snapshot-transfer" data-pptx-bounds="680 456 350 134">
    <use data-icon="tabler-outline/camera" x="680" y="462" width="28" height="28" fill="#4FC9E8" stroke-width="2" />
    <text x="680" y="516" font-size="20" fill="#C7D5E4">领导者对落后太多的跟随者，用<tspan x="680" dy="28">InstallSnapshot RPC 分块</tspan><tspan x="680" dy="28">发送快照。</tspan></text>
  </g>

  <g id="snapshot-art" data-pptx-bounds="1050 440 158 190">
    <image href="../images/iso_snapshot_fit.png" x="1054" y="444" width="140" height="181" preserveAspectRatio="xMidYMid meet" />
  </g>

  <g id="page-footnote" data-pptx-bounds="72 640 888 48">
    <line x1="72" y1="646" x2="956" y2="646" stroke="#2A4361" stroke-width="1" />
    <text x="72" y="678" font-size="16" fill="#7A8FA6">来源：论文 §6（含图 10、图 11）与 §7（含图 12、图 13）。</text>
  </g>

  <g id="title-block" data-pptx-role="chrome" data-pptx-bounds="1000 650 208 44">
    <text x="1208" y="678" font-family="Consolas, Microsoft YaHei" font-size="16" fill="#7A8FA6" text-anchor="end">RAFT / 11</text>
  </g>
</svg>
