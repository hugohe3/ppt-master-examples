    <text x="664" y="516" font-size="16" fill="#111827">· 10G PON 端口超 <tspan font-family="Arial" font-weight="bold">1000</tspan> 万个,城镇千兆住宅覆盖率超 <tspan font-family="Arial" font-weight="bold">97%</tspan></text>
