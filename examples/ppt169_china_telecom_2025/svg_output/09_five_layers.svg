    <text x="260" y="558" font-size="15" fill="#111827">从基础算力底座升级为 AI 原生算力底座,强化算、存、网协同</text>
  </g>

  <g id="core-summary" data-pptx-bounds="808 180 376 392">
    <text x="808" y="204" font-size="15" fill="#6B7280">以“息壤”第一科技为核心</text>
    <text x="808" y="238" font-size="20" font-weight="bold" fill="#111827">可规模化生产、调度并交付</text>
