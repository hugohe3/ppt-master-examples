    <line x1="808" y1="292" x2="1184" y2="292" stroke="#D1D5DB" stroke-width="1"/>
    <text x="808" y="348" font-family="Arial" font-size="40" font-weight="bold" fill="#111827">91<tspan font-size="18" font-weight="normal" fill="#6B7280"> EFLOPS</tspan></text>
    <text x="808" y="372" font-size="14" fill="#6B7280">自有及接入智算总规模</text>
    <text x="1000" y="348" font-family="Arial" font-size="40" font-weight="bold" fill="#111827">10<tspan font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#6B7280"> 万亿+ Token</tspan></text>
    <text x="1000" y="372" font-size="14" fill="#6B7280">通用模型语料</text>
    <text x="808" y="444" font-family="Arial" font-size="40" font-weight="bold" fill="#111827">500<tspan font-size="18" font-weight="normal" fill="#6B7280"> TB+</tspan></text>
    <text x="808" y="468" font-size="14" fill="#6B7280">14 个以上行业数据集</text>
    <text x="1000" y="444" font-family="Arial" font-size="40" font-weight="bold" fill="#111827">5<tspan font-family="Microsoft YaHei" font-size="18" font-weight="normal" fill="#6B7280"> 层能力</tspan></text>
    <text x="1000" y="468" font-size="14" fill="#6B7280">从 IaaS 到 SaaS</text>
    <line x1="808" y1="500" x2="1184" y2="500" stroke="#D1D5DB" stroke-width="1"/>
    <text x="808" y="534" font-size="15" fill="#111827">五层能力自下而上叠加,<tspan x="808" dy="26">目标是形成可交付 AI Token 的产品体系</tspan></text>
  </g>

