  </g>

  <g id="page-lead" data-pptx-bounds="88 130 1104 82">
    <text x="88" y="156" font-size="28" fill="#A8A396">八座坑分两批被发现，碳十四把它们的埋藏年代<tspan x="88" dy="42">收进公元前 1131 年至前 1012 年</tspan></text>
  </g>

