<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0E1512" />

  <g id="artifact-title" data-pptx-bounds="88 70 700 56">
    <rect x="88" y="78" width="4" height="44" fill="#C9A227" />
    <text x="108" y="108" font-family="SimHei, Arial, sans-serif" font-size="42" fill="#E9E5D9">青铜大立人像</text>
  </g>

  <g id="page-lead" data-pptx-bounds="88 130 1104 40">
    <text x="88" y="156" font-size="28" fill="#A8A396">一尊连底座 2.61 米高的青铜人像，双手虚握之物至今无定论</text>
  </g>

  <g id="artifact-photo" data-pptx-bounds="88 208 280 364">
    <image href="../images/bronze_standing_figure.jpg" x="88" y="210" width="280" height="360" preserveAspectRatio="xMidYMid meet" />
  </g>

  <g id="fact-era" data-pptx-bounds="408 194 784 60">
    <text x="408" y="216" font-size="18" fill="#4FB9A5">年代</text>
    <text x="408" y="244" font-size="24" fill="#E9E5D9">商代晚期</text>
  </g>

  <g id="fact-pit" data-pptx-bounds="408 256 784 86">
    <text x="408" y="278" font-size="18" fill="#4FB9A5">出土坑号</text>
    <text x="408" y="306" font-size="24" fill="#E9E5D9">2 号祭祀坑（1986 年）</text>
    <text x="408" y="331" font-size="18" fill="#A8A396">出土时已被拦腰砸断，经数年修复还原</text>
  </g>

  <g id="fact-size" data-pptx-bounds="408 344 784 86">
    <text x="408" y="366" font-size="18" fill="#4FB9A5">尺寸</text>
    <text x="408" y="394" font-size="24" fill="#C9A227">人像高 1.8 米，加底座通高 2.61 米</text>
    <text x="408" y="419" font-size="18" fill="#A8A396">修复档案另记总高 260.8 厘米、人像高 172 厘米、冠高 10 厘米</text>
  </g>

  <g id="fact-grade" data-pptx-bounds="408 432 784 86">
    <text x="408" y="454" font-size="18" fill="#4FB9A5">文物级别</text>
    <text x="408" y="482" font-size="24" fill="#E9E5D9">商铜立人像 · 收藏单位广汉三星堆博物馆</text>
    <text x="408" y="507" font-size="18" fill="#A8A396">列入<a href="https://wwj.beijing.gov.cn/bjww/362760/362767/556574/556644/bwgjcjzl/557087/index.html"><tspan fill="#C9A227">《第三批禁止出境展览文物目录》</tspan></a>（文物博函〔2013〕1320 号）</text>
  </g>

  <g id="fact-highlight" data-pptx-bounds="408 520 784 78" font-size="18">
    <text x="408" y="542" fill="#4FB9A5">看点</text>
    <text x="408" y="566" fill="#E9E5D9">双手呈虚握状，所持之物尚无定论；学界对其身份有大巫师、蜀王或两者兼具等<tspan x="408" dy="24">观点，无论何说都代表执掌宗教权力或行政权力的上层贵族</tspan></text>
  </g>

  <g id="source-note" data-pptx-role="footer" data-pptx-bounds="64 600 1152 26">
    <text x="88" y="616" font-size="16" fill="#A8A396">来源：四川在线《三星堆馆长讲国宝②》2022；经济观察网 2021；北京市文物局第三批禁止出境展览文物目录</text>
  </g>

