    <text x="700" y="288" font-size="18" fill="#A8A396">金杖、黄金面具</text>
  </g>

  <g id="craft-jade" data-pptx-bounds="472 314 720 62">
    <rect x="472" y="316" width="720" height="58" rx="8" fill="#17211D" stroke="#2A3630" stroke-width="1"/>
    <rect x="472" y="316" width="720" height="3" fill="#4FB9A5"/>
    <text x="492" y="354" font-size="24" fill="#E9E5D9">玉器制作</text>
    <text x="700" y="354" font-size="18" fill="#A8A396">与青铜器同出的玉石器</text>
  </g>

  <g id="craft-bronze" data-pptx-bounds="472 380 720 62">
    <rect x="472" y="382" width="720" height="58" rx="8" fill="#17211D" stroke="#2A3630" stroke-width="1"/>
    <rect x="472" y="382" width="720" height="3" fill="#C6704A"/>
    <text x="492" y="420" font-size="24" fill="#E9E5D9">青铜冶铸</text>
    <text x="700" y="404" font-size="18" fill="#A8A396">大立人、神树、纵目面具；神树采用分段铸造法，<tspan x="700" dy="24">运用套铸、铆铸、嵌铸、铸接等当时最先进的手法</tspan></text>
  </g>

