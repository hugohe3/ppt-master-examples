<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Arial, sans-serif" data-pptx-page-role="content">
  <rect id="page-bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0E1512"/>

  <g id="page-header" data-pptx-bounds="88 70 700 56">
    <rect x="88" y="78" width="4" height="44" fill="#C9A227"/>
    <text x="108" y="108" font-family="SimHei, Arial, sans-serif" font-size="42" fill="#E9E5D9">一座 12 平方公里的都城</text>
  </g>

  <g id="page-lead" data-pptx-bounds="88 130 1104 82">
    <text x="88" y="156" font-size="28" fill="#A8A396">遗址位于四川省广汉市，面积约 12 平方公里，最早发现于 20 世纪 20 年代<tspan x="88" dy="42">历年出土文物跨越距今约 3000～5000 年</tspan></text>
  </g>

  <g id="scale-card" data-pptx-bounds="88 248 352 194">
    <rect x="88" y="250" width="352" height="190" rx="8" fill="#17211D" stroke="#C9A227" stroke-opacity="0.35" stroke-width="1"/>
    <text x="120" y="340" font-family="SimHei, Arial, sans-serif" font-size="72" fill="#C9A227">12</text>
    <text x="216" y="340" font-size="28" fill="#E9E5D9">平方公里</text>
    <text x="120" y="390" font-size="18" fill="#A8A396">1988 年 1 月国务院公布为<tspan x="120" dy="24">全国重点文物保护单位</tspan></text>
  </g>

  <g id="craft-gold" data-pptx-bounds="472 248 720 62">
    <rect x="472" y="250" width="720" height="58" rx="8" fill="#17211D" stroke="#2A3630" stroke-width="1"/>
    <rect x="472" y="250" width="720" height="3" fill="#C9A227"/>
