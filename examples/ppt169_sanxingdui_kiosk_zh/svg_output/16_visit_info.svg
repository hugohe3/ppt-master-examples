    <text x="108" y="280" font-size="18" fill="#4FB9A5">开放时间</text>
    <text x="108" y="310" font-size="18" fill="#E9E5D9">新馆（陈列馆）<tspan x="108" dy="24">08:30–18:00</tspan><tspan x="108" dy="24">停止入馆 17:00</tspan><tspan x="108" dy="24">修复馆 09:00–17:00</tspan><tspan x="108" dy="24">原综合馆、青铜馆</tspan><tspan x="108" dy="24">停止对外开放</tspan></text>
