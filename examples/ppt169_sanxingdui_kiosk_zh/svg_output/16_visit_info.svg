    <text x="388" y="310" font-size="18" fill="#E9E5D9">普通票 72 元<tspan x="388" dy="24">学生票 36 元</tspan><tspan x="388" dy="24">试运行期间暂</tspan><tspan x="388" dy="24">执行原票价</tspan><tspan x="388" dy="24">优惠政策详见</tspan><tspan x="388" dy="24">票务预约系统</tspan></text>
  </g>

  <g id="info-booking" data-pptx-bounds="648 198 264 264">
