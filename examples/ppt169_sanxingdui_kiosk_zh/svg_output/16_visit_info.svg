    <text x="668" y="310" font-size="18" fill="#E9E5D9">须提前通过微信公<tspan x="668" dy="24">众号或官网预约购</tspan><tspan x="668" dy="24">票，按预约时段入馆</tspan><tspan x="668" dy="24">未授权第三方机构</tspan><tspan x="668" dy="24">或个人销售门票和</tspan><tspan x="668" dy="24">讲解票</tspan></text>
