    <text x="664" y="284" font-family="SimHei, Arial, sans-serif" font-size="72" fill="#E9E5D9">超过 500 克</text>
  </g>

  <g id="weight-comparison" data-pptx-bounds="640 330 552 116">
    <rect x="640" y="332" width="552" height="112" rx="8" fill="#17211D" stroke="#2A3630" stroke-width="1" />
    <text x="664" y="360" font-size="18" fill="#4FB9A5">比较</text>
    <text fill="#E9E5D9" font-size="18" x="664" y="388">比成都金沙遗址出土的黄金面具更大更重，</text><text fill="#E9E5D9" font-size="18" x="664" y="412">也比金杖（463 克）更重</text></g>

  <g id="fact-discovery" data-pptx-bounds="640 456 552 80" font-size="18">
    <text x="640" y="478" fill="#4FB9A5">发现经过</text>
    <text fill="#E9E5D9" x="640" y="502">2021 年 1 月 5 日，四川大学考古队在</text><text fill="#E9E5D9" x="640" y="526">5 号坑中发现半张黄金面具</text></g>

  <g id="fact-highlight" data-pptx-bounds="88 494 512 102" font-size="18">
    <text x="88" y="516" fill="#4FB9A5">看点</text>
    <text fill="#E9E5D9" x="88" y="540">出土时像被揉皱压扁的纸团，逐步清理中才辨</text><text fill="#E9E5D9" x="88" y="564">出鼻子、耳朵；发掘领队黎海超称其为迄今发</text><text fill="#E9E5D9" x="88" y="588">现的体量最大的一件金面具</text></g>

  <g id="caliber-note" data-pptx-bounds="640 544 552 54" font-size="18">
