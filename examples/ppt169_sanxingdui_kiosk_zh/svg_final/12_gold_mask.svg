  </g>

  <g id="page-lead" data-pptx-bounds="88 130 1104 40">
    <text x="88" y="156" font-size="28" fill="#A8A396">出土的是半张面具，280 克，推测完整时超过 500 克</text>
  </g>

  <g id="weight-hero" data-pptx-bounds="88 184 512 120">
