<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" lang="zh-CN"
  font-family="Arial, Microsoft YaHei"
  data-pptx-master="moments_square_master" data-pptx-master-name="Moments Square"
  data-pptx-layout="cover" data-pptx-layout-name="Cover">
  <defs>
    <radialGradient id="coverHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F2C66D" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#7F8FC4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B1026" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect id="master-background" x="0" y="0" width="1080" height="1080" fill="#0B1026"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="cover-accent" x="490" y="300" width="100" height="8" rx="4" fill="#F2C66D"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="cover-brand-band" x="0" y="900" width="1080" height="180" fill="#151C3A"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <g id="cover-title-slot" data-pptx-placeholder="title"
    data-pptx-bounds="100 360 880 240">
    <text id="cover-title-carrier" data-pptx-carrier="true"
      x="540" y="470" text-anchor="middle" fill="#F3EFE2"
      font-size="72" font-weight="bold">十五的月亮<tspan fill="#F2C66D">十六圆？</tspan></text>
  </g>
  <g id="cover-subtitle-slot" data-pptx-placeholder="subtitle" data-pptx-idx="1"
    data-pptx-bounds="140 640 800 100">
    <text id="cover-subtitle-carrier" data-pptx-carrier="true"
      x="540" y="692" text-anchor="middle" fill="#A9B3D1"
      font-size="30">2026 年中秋：今年要到<tspan fill="#F2C66D" font-weight="bold">八月十七</tspan>才最圆</text>
  </g>
  <g id="cover-brand-slot" data-pptx-placeholder="body" data-pptx-idx="2"
    data-pptx-bounds="100 960 880 60">
    <text id="cover-brand-carrier" data-pptx-carrier="true"
      x="540" y="1000" text-anchor="middle" fill="#A9B3D1"
      font-size="26">中秋月相小科普 · 1 / 8</text>
  </g>
  <g id="star-field" data-pptx-role="decoration" data-pptx-bounds="0 0 1080 900" fill="#F3EFE2">
    <circle cx="96" cy="118" r="2.5" fill-opacity="0.7"/>
    <circle cx="214" cy="232" r="1.5" fill-opacity="0.5"/>
    <circle cx="318" cy="84" r="2" fill-opacity="0.6"/>
    <circle cx="772" cy="96" r="2.5" fill-opacity="0.7"/>
    <circle cx="892" cy="210" r="1.5" fill-opacity="0.5"/>
    <circle cx="984" cy="126" r="2" fill-opacity="0.6"/>
    <circle cx="140" cy="790" r="2" fill-opacity="0.45"/>
    <circle cx="936" cy="812" r="1.5" fill-opacity="0.45"/>
    <circle cx="62" cy="560" r="1.5" fill-opacity="0.4"/>
    <circle cx="1020" cy="520" r="2" fill-opacity="0.4"/>
  </g>
  <g id="moon-halo" data-pptx-role="decoration" data-pptx-bounds="380 20 320 320">
    <circle cx="540" cy="180" r="160" fill="url(#coverHalo)"/>
  </g>
  <g id="moon-hero" data-pptx-bounds="440 80 200 200">
    <image href="../images/phase_full.png" x="440" y="80" width="200" height="200"
      preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="osmanthus-sprig" data-pptx-bounds="858 770 132 146">
    <image href="../images/osmanthus.png" x="858" y="770" width="132" height="146"
      preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
