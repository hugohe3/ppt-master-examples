  <g id="entry-notes" data-pptx-bounds="520 406 696 158">
    <text x="536" y="432" font-size="24" fill="#F4F0E6">传说：唐代罗定龙龛寺的“龙龛糍”，乾隆改名肠粉。</text>
    <text x="536" y="466" font-size="24" fill="#F4F0E6">本卷把它<tspan fill="#FFCD4D" font-weight="bold">标注为传说性叙述</tspan>，不作定论。</text>
    <text x="536" y="500" font-size="24" fill="#F4F0E6">清末广州街头已有叫卖，当时分咸、甜两种。</text>
    <text x="536" y="534" font-size="24" fill="#F4F0E6">茶楼、酒家与夜市的经典品项，也是早餐必选。</text>
    <text x="536" y="558" font-size="16" fill="#A0A8C0">Fact IDs: F016 · F017 · F018　｜　来源：百度百科（罗定肠粉、肠粉）</text>
