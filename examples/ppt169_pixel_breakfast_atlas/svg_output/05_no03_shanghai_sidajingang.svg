    <text x="536" y="466" font-size="24" fill="#F4F0E6">豆浆分淡、甜、咸三种，咸豆浆是咸党代表。</text>
    <text x="536" y="500" font-size="24" fill="#F4F0E6"><tspan fill="#FFCD4D" font-weight="bold">1912</tspan> 年南码头街 108 号“兴隆记”是最早大饼店。</text>
    <text x="536" y="534" font-size="24" fill="#F4F0E6">1936 年《社会日报》记它们是最大众化的早餐。</text>
