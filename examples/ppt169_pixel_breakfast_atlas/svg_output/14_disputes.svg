    <text x="64" y="592" font-size="30" font-weight="bold" fill="#EF8A3C">另一处：胡辣汤的南北之别</text>
    <text x="64" y="624" font-size="18" fill="#F4F0E6">河南多是<tspan fill="#FFCD4D" font-weight="bold">肉丁</tspan>胡辣汤，陕西是<tspan fill="#FFCD4D" font-weight="bold">肉丸</tspan>胡辣汤；河南内部又分逍遥镇、北舞渡、开封素三派，逍遥镇以胡椒为主角。</text>
    <text x="64" y="650" font-size="16" fill="#A0A8C0">Fact IDs: F046 – F051　｜　来源：知乎、搜狐、澎湃新闻　·　粽子甜咸不属早餐范围，本卷不收</text>
