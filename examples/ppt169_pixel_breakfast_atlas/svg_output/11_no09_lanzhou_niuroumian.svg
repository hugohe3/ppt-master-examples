  <g id="entry-notes" data-pptx-bounds="520 406 696 158">
    <text x="536" y="432" font-size="24" fill="#F4F0E6"><tspan fill="#FFCD4D" font-weight="bold">1915</tspan> 年马保子开面馆，推出免费“进店一碗汤”。</text>
    <text x="536" y="466" font-size="24" fill="#F4F0E6">同年把凉面改为现场抻拉，汤底换成秘制肉汤。</text>
    <text x="536" y="500" font-size="24" fill="#F4F0E6">五色：汤清、萝卜白、辣子红、蒜苗绿、面条黄。</text>
    <text x="536" y="534" font-size="24" fill="#F4F0E6">本地 6–7 元、高端 8 元；一线均价 <tspan fill="#FFCD4D" font-weight="bold">24 元</tspan> (2020)。</text>
    <text x="536" y="558" font-size="16" fill="#A0A8C0">Fact IDs: F031 – F035　｜　来源：新浪、搜狐、澎湃新闻、央广网</text>
  </g>
