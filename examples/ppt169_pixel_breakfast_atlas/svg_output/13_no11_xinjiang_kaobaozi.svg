  <g id="entry-notes" data-pptx-bounds="520 406 696 158">
    <text x="536" y="432" font-size="24" fill="#F4F0E6">维吾尔语称 samsa（萨木萨），流行于新疆与中亚。</text>
    <text x="536" y="466" font-size="24" fill="#F4F0E6">死面擀薄包羊肉洋葱孜然，贴<tspan fill="#FFCD4D" font-weight="bold">馕坑壁</tspan>烤制。</text>
    <text x="536" y="500" font-size="24" fill="#F4F0E6">成品金黄，皮脆肉嫩多汁；奶茶多为咸口。</text>
    <text x="536" y="534" font-size="24" fill="#F4F0E6">需求量大，店家每天第一炉常备 <tspan fill="#FFCD4D" font-weight="bold">1000</tspan> 个以上。</text>
    <text x="536" y="558" font-size="16" fill="#A0A8C0">Fact IDs: F039 – F042　｜　来源：维基百科、喀什地区行署、搜狐</text>
  </g>
