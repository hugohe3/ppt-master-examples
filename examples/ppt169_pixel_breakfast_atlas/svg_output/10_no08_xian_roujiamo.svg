    <text x="536" y="432" font-size="24" fill="#F4F0E6">白吉馍讲究“<tspan fill="#FFCD4D" font-weight="bold">铁圈虎背菊花心</tspan>”，三层圈型花纹。</text>
    <text x="536" y="466" font-size="24" fill="#F4F0E6">皮薄松脆内心软绵，配糜而不烂的腊汁肉。</text>
