    <text fill="#3A3A3A" font-size="48" x="80" y="502">孙子把情报放在胜负的中心：</text><text fill="#3A3A3A" font-size="48" x="80" y="574">了解对手，也了解自己，</text><text fill="#3A3A3A" font-size="48" x="80" y="646"><tspan>打一百仗都<tspan fill="#A8322D" font-weight="bold">不至于危险</tspan>。</tspan></text></g>
  <g id="body-note-08" data-pptx-bounds="80 800 920 170">
    <text fill="#3A3A3A" font-size="48" x="80" y="862">只了解自己，胜负各半；</text><text fill="#3A3A3A" font-size="48" x="80" y="934">两边都不了解，就每战都危险。</text></g>
