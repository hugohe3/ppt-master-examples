    <text fill="#3A3A3A" font-style="italic" font-family="Cambria" font-size="40" x="132" y="1252">If you know the enemy and know yourself,</text><text fill="#3A3A3A" font-style="italic" font-family="Cambria" font-size="40" x="132" y="1306">you need not fear the result of a hundred</text><text fill="#3A3A3A" font-style="italic" font-family="Cambria" font-size="40" x="132" y="1360">battles.</text><text id="quote-cite-08" x="132" y="1430" font-size="34" fill="#7A756B">第三篇 ATTACK BY STRATAGEM · 第 18 节</text>
