    <text id="quote-text-07" x="132" y="1322" font-family="Cambria" font-style="italic"
      font-size="40" fill="#3A3A3A">Hence to fight and conquer in all your<tspan x="132" dy="54">battles is not supreme excellence; supreme</tspan><tspan x="132" dy="54">excellence consists in breaking the</tspan><tspan x="132" dy="54">enemy’s resistance without fighting.</tspan></text>
