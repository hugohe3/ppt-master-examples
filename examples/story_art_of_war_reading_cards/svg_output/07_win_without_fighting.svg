    <text id="image-top-text-body-carrier" data-pptx-carrier="true" x="80" y="1120" font-size="48" fill="#3A3A3A">百战百胜还不是最上乘；<tspan x="80" dy="72">不交手就让对方<tspan fill="#A8322D" font-weight="bold">放弃</tspan>，才是。</tspan></text>
