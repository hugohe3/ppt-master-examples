<path d="M 112 1378 A 32 2.67 0 0 1 80 1375.33 L 80 1216.67 A 32 2.67 0 0 1 112 1214"/>
</g>
    <text id="quote-text-08" x="132" y="1252" font-family="Cambria" font-style="italic"
      font-size="40" fill="#3A3A3A">If you know the enemy and know yourself,<tspan x="132" dy="54">you need not fear the result of a hundred</tspan><tspan x="132" dy="54">battles.</tspan></text>
    <text id="quote-cite-08" x="132" y="1430" font-size="34" fill="#7A756B">第三篇 ATTACK BY STRATAGEM · 第 18 节</text>
