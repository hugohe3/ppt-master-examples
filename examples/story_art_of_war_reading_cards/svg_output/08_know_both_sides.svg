  <g id="title-content-body-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="80 440 920 340">
    <text id="title-content-body-carrier" data-pptx-carrier="true" x="80" y="502" font-size="48" fill="#3A3A3A">孙子把情报放在胜负的中心：<tspan x="80" dy="72">了解对手，也了解自己，</tspan><tspan x="80" dy="72">打一百仗都<tspan fill="#A8322D" font-weight="bold">不至于危险</tspan>。</tspan></text>
  </g>
  <g id="body-note-08" data-pptx-bounds="80 800 920 170">
    <text id="body-note-text-08" x="80" y="862" font-size="48" fill="#3A3A3A">只了解自己，胜负各半；<tspan x="80" dy="72">两边都不了解，就每战都危险。</tspan></text>
  </g>
  <g id="quote-plate-08" data-pptx-bounds="80 1200 920 300">
