  <g id="two-block-top-slot" data-pptx-placeholder="object" data-pptx-idx="1" data-pptx-bounds="120 480 840 280">
    <text id="two-block-top-carrier" data-pptx-carrier="true" x="120" y="540" font-size="48" fill="#3A3A3A">他先把打仗的花费算清楚：<tspan x="120" dy="72">人力、车马、补给，</tspan><tspan x="120" dy="72">每多一天都在<tspan fill="#A8322D" font-weight="bold">消耗国力</tspan>。</tspan></text>
  </g>
  <g id="two-block-bottom-slot" data-pptx-placeholder="object" data-pptx-idx="2" data-pptx-bounds="120 880 840 280">
    <text id="two-block-bottom-carrier" data-pptx-carrier="true" x="120" y="940" font-size="48" fill="#3A3A3A">所以孙子反对久战：<tspan x="120" dy="72">拖得越久，国力越弱，</tspan><tspan x="120" dy="72">别人就会趁虚而入。</tspan></text>
