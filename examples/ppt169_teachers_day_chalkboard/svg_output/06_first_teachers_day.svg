    <use data-icon="tabler-outline/bulb" x="1160" y="504" width="32" height="32" fill="#9FD0C0" stroke-width="2"/>
    <text x="584" y="522" font-size="18" fill="#9FD0C0">小知识角</text>
    <text x="584" y="556" font-size="16" fill="#E8E4D8">教师节是我国仅有的三个行业性节日之一,另两个是护士节、记者节。</text>
    <text x="584" y="584" font-size="16" fill="#E8E4D8">按《全国年节及纪念日放假办法》第五条,教师节不放假。</text>
