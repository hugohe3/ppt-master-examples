    <path d="M560 296 Q700 291 840 297" fill="none" stroke="#46564F" stroke-width="2" stroke-linecap="round"/>
    <text x="560" y="330" font-size="24" fill="#E8E4D8">· 国家主席李先念向全国教师发出慰问信</text>
    <text x="560" y="372" font-size="24" fill="#E8E4D8">· 首都召开万人庆祝大会</text>
    <text x="560" y="414" font-size="24" fill="#E8E4D8">· 教师节期间 20 个省市共表彰 11871 个<tspan x="560" dy="42">省级优秀教师集体和个人</tspan></text>
