    <text x="1224" y="100" font-size="16">四次改期 · 下</text>
  </g>

  <g id="lead-claim" data-pptx-bounds="56 134 1168 56">
    <text x="56" y="172" font-family="KaiTi, &quot;Trebuchet MS&quot;, serif" font-size="32" fill="#F4F1E8">并进「五一」的教师节缺少教师的特点,直到 1985 年才落定。</text>
  </g>

  <g id="chalk-timeline" data-pptx-bounds="56 194 1168 130">
    <path d="M72 292 C300 244 640 240 902 262 C1010 271 1120 280 1204 288" fill="none" stroke="#F4F1E8" stroke-width="5" stroke-linecap="round"/>
    <path d="M76 299 C302 252 640 248 900 270 C1008 279 1118 288 1200 296" fill="none" stroke="#F4F1E8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.32"/>
    <circle cx="180" cy="271" r="8" fill="#46564F"/>
    <circle cx="380" cy="257" r="8" fill="#46564F"/>
    <circle cx="680" cy="252" r="11" fill="#9FD0C0"/>
    <circle cx="1050" cy="271" r="15" fill="#F3C969"/>
    <text x="180" y="244" text-anchor="middle" font-family="&quot;Trebuchet MS&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" fill="#6E7A72">1931</text>
    <text x="380" y="230" text-anchor="middle" font-family="&quot;Trebuchet MS&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="22" fill="#6E7A72">1939</text>
    <text x="680" y="222" text-anchor="middle" font-family="&quot;Trebuchet MS&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" fill="#9FD0C0">1951</text>
    <text x="1050" y="240" text-anchor="middle" font-family="&quot;Trebuchet MS&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="34" fill="#F3C969">1985</text>
  </g>

  <g id="p04-focus-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="downArrow" data-pptx-frame="1032 296 36 44" data-pptx-av-adj1="val 50000" data-pptx-av-adj2="val 50000" fill="#F3C969" stroke="none">
<path d="M 1032 322 L 1041 322 L 1041 296 L 1059 296 L 1059 322 L 1068 322 L 1050 340 Z"/>
</g>

  <g id="era-1951" data-pptx-bounds="72 350 544 246">
    <text x="72" y="380" font-size="28" fill="#9FD0C0">1951 · 「五·一」教师节</text>
    <path d="M72 396 Q220 390 366 397" fill="none" stroke="#46564F" stroke-width="2" stroke-linecap="round"/>
    <text x="72" y="430" font-size="24" fill="#E8E4D8">1951 年 4 月 19 日,教育部长和中国教育<tspan x="72" dy="38">工会全国委员会主席发表书面谈话,宣布</tspan><tspan x="72" dy="38">「五一国际劳动节」同时为教师节。</tspan></text>
    <text x="72" y="580" font-size="18" fill="#B4AE9E">由于这一天缺少教师的特点,执行结果并不理想。</text>
  </g>

  <g id="era-1985" data-pptx-bounds="680 350 544 246">
    <text x="680" y="380" font-size="28" fill="#F3C969">1985 · 「九·一〇」教师节</text>
    <path d="M680 396 Q828 390 974 397" fill="none" stroke="#F3C969" stroke-width="3" stroke-linecap="round"/>
    <text x="680" y="430" font-size="24" fill="#E8E4D8">1985 年 1 月 11 日,国务院向全国人大常<tspan x="680" dy="38">委会提出确定每年 9 月 10 日为教师节的</tspan><tspan x="680" dy="38">议案;同月 21 日会议作出决议。</tspan></text>
    <text x="680" y="580" font-size="18" fill="#B4AE9E">至此,老师有了自己的日子。</text>
  </g>

  <g id="number-corner" data-pptx-bounds="56 612 560 60">
    <text x="56" y="634" font-size="18" fill="#9FD0C0">数字角</text>
    <text x="56" y="664" font-size="16" fill="#B4AE9E">从 1931 年到 1985 年,54 年里改了四次(依前述年份推算)。</text>
  </g>

  <g id="source-note" data-pptx-bounds="680 612 544 60">
    <text x="1224" y="664" text-anchor="end" font-size="16" fill="#B4AE9E">资料来源:教育部《教师节的由来》《我国教师节简介》</text>
  </g>
</svg>
