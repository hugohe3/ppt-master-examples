    <path d="M62 112 Q206 106 348 113" fill="none" stroke="#F3C969" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="page-mark" data-pptx-bounds="1000 48 224 60" text-anchor="end" fill="#B4AE9E">
    <text x="1224" y="76" font-size="18">第 02 版</text>
    <text x="1224" y="100" font-size="16">教师节黑板报</text>
  </g>

  <g id="lead-claim" data-pptx-bounds="56 138 1168 96">
    <text x="56" y="176" font-family="KaiTi, &quot;Trebuchet MS&quot;, serif" font-size="32" fill="#F4F1E8">1985 年 1 月 21 日,第六届全国人大常委会第九次会议<tspan x="56" dy="44">作出决议,将每年的 9 月 10 日定为我国的教师节。</tspan></text>
  </g>

  <g id="p02-date-plate" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="plaque" data-pptx-frame="76 246 430 210" fill="none" stroke="#9FD0C0" stroke-width="3">
<path d="M 76 281 A 35 35 0 0 0 111 246 L 471 246 A 35 35 0 0 0 506 281 L 506 421 A 35 35 0 0 0 471 456 L 111 456 A 35 35 0 0 0 76 421 Z"/>
</g>

  <g id="decision-date" data-pptx-bounds="96 268 390 170" text-anchor="middle">
    <text x="291" y="300" font-size="18" fill="#9FD0C0">决定的那一天</text>
    <text x="291" y="374" font-family="&quot;Trebuchet MS&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="64" fill="#F3C969">1985.01.21</text>
    <text x="291" y="414" font-size="18" fill="#B4AE9E">六届全国人大常委会第九次会议</text>
  </g>

  <g id="number-corner" data-pptx-bounds="76 490 430 140">
    <text x="96" y="520" font-size="18" fill="#9FD0C0">数字角</text>
    <text x="96" y="586" font-family="&quot;Trebuchet MS&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="64" fill="#F4F1E8">9 · 10</text>
    <text x="96" y="618" font-size="16" fill="#B4AE9E">从此,老师有了自己的节日</text>
  </g>

  <g id="reason-one" data-pptx-bounds="566 246 658 170">
    <use data-icon="tabler-outline/school" x="1176" y="250" width="36" height="36" fill="#F3C969" stroke-width="2"/>
    <text x="566" y="278" font-size="28" fill="#F3C969">理由一 · 开学第一课</text>
    <path d="M566 292 Q700 287 830 293" fill="none" stroke="#46564F" stroke-width="2" stroke-linecap="round"/>
    <text x="566" y="330" font-size="24" fill="#E8E4D8">新生入学伊始,即开始尊师重教活动,<tspan x="566" dy="38">可以给教师教好、学生学好创造良好的</tspan><tspan x="566" dy="38">气氛。</tspan></text>
  </g>

  <g id="reason-two" data-pptx-bounds="566 436 658 170">
    <use data-icon="tabler-outline/calendar-event" x="1176" y="440" width="36" height="36" fill="#9FD0C0" stroke-width="2"/>
    <text x="566" y="468" font-size="28" fill="#9FD0C0">理由二 · 九月节日少</text>
    <path d="M566 482 Q700 477 830 483" fill="none" stroke="#46564F" stroke-width="2" stroke-linecap="round"/>
    <text x="566" y="520" font-size="24" fill="#E8E4D8">9 月份全国性节日少,便于各方面集中<tspan x="566" dy="38">时间组织活动和突出宣传报道,推动形</tspan><tspan x="566" dy="38">成尊师重教的社会风尚。</tspan></text>
  </g>

  <g id="source-note" data-pptx-bounds="566 626 658 30">
    <text x="566" y="642" font-size="16" fill="#B4AE9E">资料来源:教育部《我国教师节简介》《教师节的由来》</text>
  </g>
</svg>
