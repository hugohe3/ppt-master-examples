  <g id="era-1931" data-pptx-bounds="72 344 544 252">
    <text x="72" y="374" font-size="28" fill="#F3C969">1931 · 「六·六」教师节</text>
    <path d="M72 390 Q220 384 366 391" fill="none" stroke="#46564F" stroke-width="2" stroke-linecap="round"/>
    <text x="72" y="424" font-size="24" fill="#E8E4D8">教育界知名教授邰爽秋、程其保等发起,<tspan x="72" dy="38">拟定每年 6 月 6 日为教师节,并发表</tspan><tspan x="72" dy="38">《教师节宣言》,提出改善教师待遇、</tspan><tspan x="72" dy="38">保障教师工作、增进教师修养三项目标。</tspan></text>
    <text x="72" y="578" font-size="18" fill="#B4AE9E">教师自发设立,当时的国民党政府没有承认。</text>
  </g>

  <g id="era-1939" data-pptx-bounds="680 344 544 252">
    <text x="680" y="374" font-size="28" fill="#9FD0C0">1939 · 「八·二七」教师节</text>
    <path d="M680 390 Q828 384 974 391" fill="none" stroke="#46564F" stroke-width="2" stroke-linecap="round"/>
    <text x="680" y="424" font-size="24" fill="#E8E4D8">鉴于「六·六」教师节是教师自发组织<tspan x="680" dy="38">设立、政府没有承认,1939 年决定另立</tspan><tspan x="680" dy="38">孔子诞辰日 8 月 27 日为教师节,并颁</tspan><tspan x="680" dy="38">发《教师节纪念暂行办法》。</tspan></text>
    <text x="680" y="578" font-size="18" fill="#B4AE9E">当时未能在全国推行。</text>
  </g>

  <g id="fact-corner" data-pptx-bounds="56 616 1168 56">
    <text x="56" y="638" font-size="18" fill="#9FD0C0">小知识</text>
    <text x="56" y="664" font-size="16" fill="#B4AE9E">自 1931 年以来,我国在不同历史时期共有过 4 种不同日期和性质的教师节。 资料来源:教育部《我国教师节简介》</text>
  </g>
</svg>
