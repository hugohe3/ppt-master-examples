  <rect id="chalk-ledge" data-pptx-role="decoration" x="24.48" y="676" width="1231.04" height="19.52" fill="#33291F" />

  <g id="masthead" data-pptx-bounds="56 40 700 72">
    <image href="../images/head_p12.png" x="60" y="44" width="200" height="63" preserveAspectRatio="xMidYMid meet" />
  </g>

  <g id="page-mark" data-pptx-bounds="1000 44 224 60" text-anchor="end" fill="#B4AE9E">
    <text x="1224" y="72" font-size="18">第 12 版</text>
    <text x="1224" y="96" font-size="16">小栏目</text>
  </g>

  <g id="lead-claim" data-pptx-bounds="56 132 1168 56">
    <text x="56" y="170" font-family="KaiTi, &quot;Trebuchet MS&quot;, serif" font-size="32" fill="#F4F1E8">名言、谜语、画法 —— 黑板报该有的三个小栏目。</text>
  </g>

  <g id="quote-corner" data-pptx-bounds="56 224 384 376">
    <g id="p12-col-a" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="56 224 384 376" data-pptx-av-adj="val 9000" fill="none" stroke="#46564F" stroke-width="2">
<path d="M 56 224 L 406.16 224 L 440 257.84 L 440 600 L 56 600 Z" />
</g>
    <use data-icon="tabler-outline/quote" x="386" y="238" width="34" height="34" fill="#F3C969" stroke-width="2"/>
    <text x="80" y="264" font-size="28" fill="#F3C969">名言角</text>
    <path d="M80 278 Q170 273 258 279" fill="none" stroke="#46564F" stroke-width="2" stroke-linecap="round" />
    <text x="80" y="316" font-family="KaiTi, &quot;Times New Roman&quot;, serif" font-size="24" fill="#E8E4D8">「三人行,必有我师焉。<tspan x="80" dy="36">择其善者而从之,</tspan><tspan x="80" dy="36">其不善者而改之。」</tspan></text>
    <text x="80" y="416" font-size="16" fill="#B4AE9E">《论语·述而》</text>
    <text x="80" y="466" font-family="KaiTi, &quot;Times New Roman&quot;, serif" font-size="24" fill="#E8E4D8">「温故而知新,<tspan x="80" dy="36">可以为师矣。」</tspan></text>
    <text x="80" y="546" font-size="16" fill="#B4AE9E">《论语·为政》</text>
  </g>

  <g id="riddle-corner" data-pptx-bounds="448 224 384 376">
    <g id="p12-col-b" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="448 224 384 376" data-pptx-av-adj="val 9000" fill="none" stroke="#46564F" stroke-width="2">
<path d="M 448 224 L 798.16 224 L 832 257.84 L 832 600 L 448 600 Z" />
</g>
    <use data-icon="tabler-outline/bulb" x="778" y="238" width="34" height="34" fill="#9FD0C0" stroke-width="2"/>
    <text x="472" y="264" font-size="28" fill="#9FD0C0">谜语角</text>
    <path d="M472 278 Q562 273 650 279" fill="none" stroke="#46564F" stroke-width="2" stroke-linecap="round" />
    <text x="472" y="326" font-family="KaiTi, &quot;Times New Roman&quot;, serif" font-size="24" fill="#E8E4D8">一身白衣不怕脏,<tspan x="472" dy="40">越写越短越漂亮;</tspan><tspan x="472" dy="40">黑板上面留下字,</tspan><tspan x="472" dy="40">自己却是无声响。</tspan></text>
    <text x="472" y="512" font-size="18" fill="#F3C969">打一文具</text>
    <text x="472" y="552" font-size="16" fill="#B4AE9E">编者出题,不是古籍典故;</text>
    <text x="472" y="576" font-size="16" fill="#B4AE9E">答案由讲板报的人当场揭晓。</text>
  </g>

  <g id="technique-corner" data-pptx-bounds="840 224 384 376">
    <g id="p12-col-c" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="840 224 384 376" data-pptx-av-adj="val 9000" fill="none" stroke="#46564F" stroke-width="2">
<path d="M 840 224 L 1190.16 224 L 1224 257.84 L 1224 600 L 840 600 Z" />
</g>
    <use data-icon="tabler-outline/pencil" x="1170" y="238" width="34" height="34" fill="#E8A0A8" stroke-width="2"/>
    <text x="864" y="264" font-size="28" fill="#E8A0A8">粉笔技法角</text>
    <path d="M864 278 Q972 273 1078 279" fill="none" stroke="#46564F" stroke-width="2" stroke-linecap="round" />
    <text x="864" y="322" font-size="18" fill="#E8E4D8">· 握笔要平推,不要立着戳</text>
    <text x="864" y="366" font-size="18" fill="#E8E4D8">· 用粉笔侧面拖出的宽笔画<tspan x="864" dy="28">适合写报头</tspan></text>
    <text x="864" y="438" font-size="18" fill="#E8E4D8">· 先用点定四角再连线,<tspan x="864" dy="28">框才不会歪</tspan></text>
    <text x="864" y="510" font-size="18" fill="#E8E4D8">· 写完用手指抹一下笔画外<tspan x="864" dy="28">缘,粉笔字才有毛边</tspan></text>
  </g>

  <g id="chalk-stub" data-pptx-bounds="1126 604 106 70">
    <image href="../images/art_chalk_stub.png" x="1130" y="604" width="98" height="68" preserveAspectRatio="xMidYMid meet" />
  </g>

  <g id="source-note" data-pptx-bounds="56 616 1040 56" fill="#B4AE9E" font-size="16">
    <text x="56" y="640">名言角资料来源:中国哲学书电子化计划《论语·述而》第二十二章、《论语·为政》第十一章。</text>
    <text x="56" y="664">谜语与技法为板报组自撰,不引自文献。</text>
  </g>
</svg>
