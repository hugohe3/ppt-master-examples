  <g id="lead-claim" data-pptx-bounds="56 130 1168 56">
    <text x="56" y="168" font-family="KaiTi, &quot;Trebuchet MS&quot;, serif" font-size="32" fill="#F4F1E8">尊师在古人那里,是站在雪里等一个人醒来。</text>
  </g>

  <g id="gushi-column" data-pptx-bounds="56 212 580 392">
    <use data-icon="tabler-outline/snowflake" x="588" y="216" width="34" height="34" fill="#9FD0C0" stroke-width="2"/>
    <text x="66" y="240" font-size="28" fill="#F3C969">程门立雪 ·《宋史·杨时传》</text>
    <image href="../images/art_snow_gate.png" x="66" y="252" width="260" height="197" preserveAspectRatio="xMidYMid meet" />
    <g id="p11-gloss-callout" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="wedgeRectCallout" data-pptx-frame="346 252 280 130" data-pptx-av-adj1="val -62000" data-pptx-av-adj2="val 24000" fill="#26352F" stroke="#9FD0C0" stroke-width="2">
<path d="M 346 252 L 392.67 252 L 392.67 252 L 462.67 252 L 626 252 L 626 327.83 L 626 327.83 L 626 360.33 L 626 382 L 462.67 382 L 392.67 382 L 392.67 382 L 346 382 L 346 360.33 L 312.4 348.2 L 346 327.83 Z" />
</g>
    <text x="368" y="284" font-size="18" fill="#9FD0C0">白话</text>
    <text x="368" y="314" font-size="18" fill="#E8E4D8">杨时和游酢去洛阳见程颐,<tspan x="368" dy="28">程颐正闭目坐着,两人就站</tspan><tspan x="368" dy="28">着等,不肯离开。</tspan></text>
    <text x="66" y="490" font-family="KaiTi, &quot;Times New Roman&quot;, serif" font-size="28" fill="#F4F1E8">「又见程颐于洛,时盖年四十矣。<tspan x="66" dy="42">一日见颐,颐偶瞑坐,时与游酢侍立</tspan><tspan x="66" dy="42">不去。颐既觉,则门外雪深一尺矣。」</tspan></text>
  </g>

  <g id="shishuo-column" data-pptx-bounds="664 212 560 392">
    <text x="664" y="240" font-size="28" fill="#9FD0C0">韩愈《师说》</text>
    <path d="M664 254 Q790 249 914 255" fill="none" stroke="#46564F" stroke-width="2" stroke-linecap="round" />
    <text x="664" y="296" font-family="KaiTi, &quot;Times New Roman&quot;, serif" font-size="30" fill="#F4F1E8">「古之学者必有师。师者,<tspan x="664" dy="44">所以传道、受业、解惑也。」</tspan></text>
    <text x="664" y="404" font-family="KaiTi, &quot;Times New Roman&quot;, serif" font-size="30" fill="#F4F1E8">「是故无贵无贱,无长无少,<tspan x="664" dy="44">道之所存,师之所存也。」</tspan></text>
    <image href="../images/art_book_brush.png" x="664" y="466" width="210" height="138" preserveAspectRatio="xMidYMid meet" />
    <text x="904" y="512" font-size="18" fill="#B4AE9E">唐 · 韩愈</text>
    <text x="904" y="542" font-size="18" fill="#B4AE9E">《师说》</text>
  </g>

  <g id="citation-note" data-pptx-bounds="56 616 1168 56" fill="#B4AE9E" font-size="16">
    <text x="56" y="638">引用注:两段引文的权威底本为繁体,此处转写为简体,原字词未改;《师说》中「受业」不写作「授业」。</text>
    <text x="56" y="664">资料来源:香港教育局指定文言经典学习材料《师说》;《郁文华章》选篇《程门立雪》(录自《宋史·杨时传》)。</text>
  </g>
</svg>
