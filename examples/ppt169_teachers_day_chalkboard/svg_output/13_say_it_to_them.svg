    <text x="56" y="464" font-size="24" fill="#E8E4D8">「老师,您上次讲的那道题,我到现在还会做。」</text>
    <text x="56" y="506" font-size="24" fill="#E8E4D8">「老师,那天您多留了十分钟,我记住了。」</text>
    <text x="56" y="548" font-size="24" fill="#E8E4D8">「老师,我以后想做和您一样的事。」</text>
