<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Nirmala UI" data-pptx-page-role="content">
  <defs>
    <pattern id="gridPat" data-pptx-pattern="smGrid" data-pptx-fg="#16324F" data-pptx-bg="#0B1A2B" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="16" height="16" fill="#0B1A2B" />
      <path d="M0 0H16M0 0V16" stroke="#16324F" stroke-width="1" />
    </pattern>
    <radialGradient id="vignette" cx="0.28" cy="0.5" r="0.8">
      <stop offset="45%" stop-color="#0B1A2B" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </radialGradient>
    <filter id="accentGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b" />
      <feFlood flood-color="#FF7A3D" flood-opacity="0.5" result="c" />
      <feComposite in="c" in2="b" operator="in" result="g" />
      <feMerge><feMergeNode in="g" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#0B1A2B" />
  <rect id="grid-field" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#gridPat)" />
  <rect id="vignette-field" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#vignette)" />

