<g id="insights" data-pptx-bounds="916 160 316 472">
  <text x="916" y="176" font-size="11" fill="#051C2C" font-weight="bold" letter-spacing="2">关键信息</text>
  <line x1="916" y1="184" x2="1232" y2="184" stroke="#051C2C" stroke-width="1" />
  <circle cx="924" cy="205" r="8" fill="#051C2C" /><text x="924" y="208.5" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text fill="#333333" x="940" y="210">中国占存量 62%、占增量 50%:</text><text fill="#333333" x="940" y="230">1,100 万→1,300 万辆,仍是最大单一</text><text fill="#333333" x="940" y="250">增量来源,但份额已从 2024 年 65% 回落。</text><circle cx="924" cy="281" r="8" fill="#051C2C" /><text x="924" y="284.5" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text fill="#333333" x="940" y="286">其他市场增量 110 万辆,首次超过欧洲</text><text fill="#333333" x="940" y="306">的 100 万辆:存量占比只有 11%,</text><text fill="#333333" x="940" y="326">增量占比却有 28%(B、右表)。</text><circle cx="924" cy="357" r="8" fill="#051C2C" /><text x="924" y="360.5" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text fill="#333333" x="940" y="362">美国 −10 万辆,是四个分区里唯一</text><text fill="#333333" x="940" y="382">为负的:2020 年以来它从未贡献</text><text fill="#333333" x="940" y="402">超过 10% 的年度增量。</text><circle cx="924" cy="433" r="8" fill="#051C2C" /><text x="924" y="436.5" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text fill="#333333" x="940" y="438">结论:按存量地图分配预算会把</text><text fill="#333333" x="940" y="458">一半以上投向增速放缓的市场;</text><text fill="#333333" x="940" y="478">增量地图才是 2026–28 的依据。</text><rect x="916" y="516" width="316" height="116" fill="#F7F7F7" /><rect x="916" y="516" width="4" height="116" fill="#2251FF" />
  <text x="932" y="538" font-size="12" font-weight="bold" fill="#051C2C">对决策的含义</text>
  <text fill="#333333" x="932" y="560">预算依据从存量地图切换到增量地图:</text><text fill="#333333" x="932" y="580">中国保份额、其他市场抢增量、美国</text><text fill="#333333" x="932" y="600">不追加(第 10 页分级)。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 650 1184 44">
  <text x="48" y="660" font-size="10" fill="#7F7F7F">1. 电动车 = 纯电(BEV)+ 插电混动(PHEV),乘用车口径;渗透率 = 电动车占新车销量的比例</text>
  <text x="48" y="674" font-size="10" fill="#7F7F7F">2. 「其他市场」= 全球 − 中国 − 欧洲 − 美国,为本报告计算值;增量 = 2025 年销量 − 2024 年销量</text>
  <text x="48" y="690" font-size="10" fill="#7F7F7F">资料来源:IEA (2025), Global EV Outlook 2025, Global EV Data Explorer(CC BY 4.0);2025 年为 IEA 全年估计;本报告分析</text>
  <text x="1232" y="690" font-family="Arial" font-size="10" fill="#7F7F7F" text-anchor="end">4</text>
