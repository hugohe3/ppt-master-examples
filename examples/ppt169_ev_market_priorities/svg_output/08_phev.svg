  <text x="48" y="70" font-size="24" font-weight="bold" fill="#051C2C">PHEV 已占全球电动车销量的 34%,在中国三年增长 3.4 倍<tspan x="48" dy="30">——它是低渗透市场的破冰产品,不是过渡产品</tspan></text>
