<g id="insights" data-pptx-bounds="916 160 316 472">
  <text x="916" y="176" font-size="11" fill="#051C2C" font-weight="bold" letter-spacing="2">关键信息</text>
  <line x1="916" y1="184" x2="1232" y2="184" stroke="#051C2C" stroke-width="1"/>
  <circle cx="924" cy="205" r="8" fill="#051C2C"/><text x="924" y="208.5" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="940" y="210" fill="#333333">全球 2,100 万辆电动车里 PHEV 占 720 万<tspan x="940" dy="20">(34%);2019 年以来 PHEV 增 12 倍,</tspan><tspan x="940" dy="20">BEV 增 9 倍(A)。</tspan></text>
  <circle cx="924" cy="281" r="8" fill="#051C2C"/><text x="924" y="284.5" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="940" y="286" fill="#333333">中国 PHEV 占比 38%,三年从 150 万<tspan x="940" dy="20">增到 510 万辆(3.4 倍),BEV 同期</tspan><tspan x="940" dy="20">450 万→820 万辆(1.8 倍)(C)。</tspan></text>
  <circle cx="924" cy="357" r="8" fill="#051C2C"/><text x="924" y="360.5" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="940" y="362" fill="#333333">PHEV 占比与渗透率并不同向:美国<tspan x="940" dy="20">渗透率 10%、PHEV 占比只有 22%,是</tspan><tspan x="940" dy="20">唯一占比低于 25% 的大市场(B)。</tspan></text>
  <circle cx="924" cy="433" r="8" fill="#051C2C"/><text x="924" y="436.5" font-family="Arial" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="940" y="438" fill="#333333">推论:进入渗透率低于 10% 的市场<tspan x="940" dy="20">(拉美、印度、东南亚多数国家),</tspan><tspan x="940" dy="20">以 PHEV 先行、BEV 跟进。</tspan></text>
  <rect x="916" y="516" width="316" height="116" fill="#F7F7F7"/><rect x="916" y="516" width="4" height="116" fill="#2251FF"/>
  <text x="932" y="538" font-size="12" font-weight="bold" fill="#051C2C">对决策的含义</text>
  <text x="932" y="560" fill="#333333">产品节奏改为 PHEV 先行:渗透率低于<tspan x="932" dy="20">10% 的市场先上 PHEV,渗透率过 15%</tspan><tspan x="932" dy="20">后 BEV 跟进(第 11 页)。</tspan></text>
</g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="48 650 1184 44">
  <text x="48" y="660" font-size="10" fill="#7F7F7F">1. 电动车 = 纯电(BEV)+ 插电混动(PHEV),乘用车口径;渗透率 = 电动车占新车销量的比例</text>
  <text x="48" y="674" font-size="10" fill="#7F7F7F">2. PHEV 占比 = PHEV ÷ (BEV + PHEV);中国 2022→2025 倍数:PHEV 5.1 ÷ 1.5 = 3.4,BEV 8.2 ÷ 4.5 = 1.8</text>
  <text x="48" y="690" font-size="10" fill="#7F7F7F">资料来源:IEA (2025), Global EV Outlook 2025, Global EV Data Explorer(CC BY 4.0);2025 年为 IEA 全年估计;本报告分析</text>
  <text x="1232" y="690" font-family="Arial" font-size="10" fill="#7F7F7F" text-anchor="end">8</text>
</g>
</svg>
