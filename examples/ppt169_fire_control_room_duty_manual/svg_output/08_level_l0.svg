    <text x="816" y="458" font-size="24" fill="#DCE6F0">先按经验判断是不是常报点位</text>
    <text x="816" y="500" font-size="24" fill="#DCE6F0">先消音让声音停下来</text>
    <text x="816" y="542" font-size="24" fill="#DCE6F0">先复位,再补一句没事</text>
    <text x="816" y="582" font-size="18" fill="#8FA3BC">查完历史记录再决定去不去</text>
