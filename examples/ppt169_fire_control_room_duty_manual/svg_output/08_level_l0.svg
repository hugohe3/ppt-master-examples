  <g id="do-column" data-pptx-bounds="360 374 400 218">
    <use data-icon="tabler-outline/clipboard-check" x="360" y="382" width="26" height="26" fill="#D8F04A" stroke-width="2" />
    <text x="400" y="402" font-size="28" fill="#D8F04A">该做</text>
    <text x="360" y="458" font-size="24" fill="#DCE6F0">一人到现场核实,一人留守工作面</text>
    <text x="360" y="500" font-size="24" fill="#DCE6F0">核实前不消音、不复位</text>
    <text x="360" y="542" font-size="24" fill="#DCE6F0">记录接报时间与报警部位</text>
    <text x="360" y="582" font-size="18" fill="#8FA3BC">每班不少于 2 人的编制正为此而设</text>
  </g>
  <g id="dont-column" data-pptx-bounds="816 374 400 218">
    <use data-icon="tabler-outline/ban" x="816" y="382" width="26" height="26" fill="#E85D2B" stroke-width="2" />
