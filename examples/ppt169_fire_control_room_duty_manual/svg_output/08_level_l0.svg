  <g id="clause-quote" data-pptx-bounds="392 272 792 84">
    <text x="400" y="302" font-size="18" letter-spacing="2" fill="#4A9FD8">GB 25506-2010 第 4.2.2 条 a)</text>
    <text x="400" y="344" font-size="24" fill="#DCE6F0">接到火灾警报后,值班人员应<tspan font-weight="bold" fill="#D8F04A">立即以最快方式确认</tspan>。</text>
