</g>
  <g id="replacement-practice" data-pptx-bounds="820 578 396 82" font-size="18">
    <text x="820" y="596" fill="#D8F04A">替代做法(整理)</text>
    <text x="820" y="626" fill="#8FA3BC">临时转手动须记录原因与恢复人,<tspan x="820" dy="26">并在本班内恢复自动位。</tspan></text>
  </g>
