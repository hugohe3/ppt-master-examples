      <text x="720" y="382" font-size="18" fill="#8FA3BC">L0 起开始计时,越往下每一步越影响到场时间</text>
    </g>
    <g id="cost-irreversible">
      <!-- icon: tabler-outline/ban -->
  <g transform="translate(680, 400) scale(1.08333)" fill="none" stroke="#E85D2B" stroke-width="2">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M5.7 5.7l12.6 12.6" />
  </g>
      <text x="720" y="420" font-size="24" fill="#DCE6F0">动作的不可撤销性上升</text>
      <text x="720" y="446" font-size="18" fill="#8FA3BC">L1 可以复位,L2 之后的联动与疏散不能撤回</text>
    </g>
  </g>
