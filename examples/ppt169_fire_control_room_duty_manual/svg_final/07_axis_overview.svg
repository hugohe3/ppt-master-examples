      <text x="680" y="536" font-size="22" font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#D8F04A">L0</text>
      <text x="728" y="536" font-size="24" fill="#DCE6F0">立即以最快方式确认</text>
      <text x="1216" y="536" font-size="18" fill="#8FA3BC" text-anchor="end">第 4.2.2 条 a)</text>
      <text x="680" y="572" font-size="22" font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#D8F04A">L1</text>
      <text x="728" y="572" font-size="24" fill="#DCE6F0">记录、归档、复盘</text>
      <text x="1216" y="572" font-size="18" fill="#8FA3BC" text-anchor="end">第 4.1 条 e)、h)</text>
      <text x="680" y="608" font-size="22" font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#D8F04A">L2</text>
      <text x="728" y="608" font-size="24" fill="#DCE6F0">三项动作同时启动</text>
      <text x="1216" y="608" font-size="18" fill="#8FA3BC" text-anchor="end">第 4.2.2 条 b)、c)</text>
      <text x="680" y="644" font-size="22" font-family="Arial, 'Microsoft YaHei', sans-serif" fill="#D8F04A">L3</text>
      <text x="728" y="644" font-size="24" fill="#DCE6F0">移交、记录、交接</text>
