  <g id="rising-costs" data-pptx-bounds="680 262 536 198">
    <line x1="680" y1="268" x2="1216" y2="268" stroke="#4A9FD8" stroke-width="3" />
    <text x="680" y="310" font-size="28" fill="#DCE6F0">随级别上升的两项代价</text>
    <g id="cost-time">
      <!-- icon: tabler-outline/clock -->
  <g transform="translate(680, 336) scale(1.08333)" fill="none" stroke="#D8F04A" stroke-width="2">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
    <path d="M12 7v5l3 3" />
  </g>
