      <text x="760" y="332" font-size="18" fill="#D8F04A" text-anchor="end">第 14 页</text>
      <text x="96" y="380" font-size="24" fill="#DCE6F0">接警后立即到现场核实</text>
      <text x="760" y="380" font-size="18" fill="#D8F04A" text-anchor="end">第 08 页 · 第 06 页</text>
      <text x="96" y="428" font-size="24" fill="#DCE6F0">误报也必须留痕归档</text>
      <text x="760" y="428" font-size="18" fill="#D8F04A" text-anchor="end">第 09 页 · 第 05 页</text>
      <text x="96" y="476" font-size="24" fill="#DCE6F0">确认火警三动作同时开始</text>
      <text x="760" y="476" font-size="18" fill="#D8F04A" text-anchor="end">第 10 页</text>
      <text x="96" y="524" font-size="24" fill="#DCE6F0">报警必须说满五个要素</text>
      <text x="760" y="524" font-size="18" fill="#D8F04A" text-anchor="end">第 11 页</text>
      <text x="96" y="572" font-size="24" fill="#DCE6F0">禁止把该自动的设成手动</text>
      <text x="760" y="572" font-size="18" fill="#E85D2B" text-anchor="end">第 15 页 · 第 06 页</text>
