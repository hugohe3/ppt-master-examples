  <g id="journey-lead" data-pptx-bounds="64 396 1088 106">
    <text x="64" y="420" font-size="24" fill="#3A3128">Mỗi chặng trả lời một câu hỏi: cây cà phê đến từ đâu, trồng ở đâu, đi tới thị<tspan x="64" dy="36">trường nào, ai giữ phần giá trị, và điều gì đang đe doạ chuỗi cung ứng.</tspan></text>
    <text x="64" y="492" font-size="18" fill="#6B5B4A">Khung năm chặng là cách sắp xếp của bài giảng (tổng hợp), không phải cấu trúc của nguồn.</text>
  </g>

