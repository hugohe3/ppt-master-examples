    <text x="728" y="456" font-size="28" font-weight="600" fill="#221C15">Quy định EUDR</text>
    <text x="672" y="504" font-size="24" fill="#3A3128">Quy định chống mất rừng của EU có hiệu<tspan x="672" dy="36">lực từ <tspan font-weight="bold" fill="#9C2B1B">tháng 12/2026</tspan>; khoảng <tspan font-weight="bold" fill="#9C2B1B">40%</tspan> diện</tspan><tspan x="672" dy="36">tích đã có chứng nhận bền vững.</tspan></text>
  </g>

  <g id="challenge-note" data-pptx-bounds="64 624 1152 30">
    <text x="64" y="642" font-size="18" fill="#6B5B4A">Hơn 600.000 hộ nông dân nhỏ tham gia sản xuất; nhiều hộ từng chuyển một phần diện tích sang sầu riêng khi giá cà phê thấp.</text>
