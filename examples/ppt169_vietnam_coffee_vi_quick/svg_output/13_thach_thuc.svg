    <line x1="640" y1="200" x2="640" y2="376" stroke="#E4DACB" stroke-width="1" />
    <use data-icon="tabler-outline/droplet" x="96" y="212" width="40" height="40" fill="#9C2B1B" stroke-width="2" />
    <text x="152" y="248" font-size="28" font-weight="600" fill="#221C15">Khí hậu và nước</text>
    <text x="96" y="296" font-size="24" fill="#3A3128">Lượng mưa tháng 1–3/2026 thấp hơn mức<tspan x="96" dy="36">bình thường; NOAA dự báo <tspan font-weight="bold" fill="#9C2B1B">62%</tspan> khả năng</tspan><tspan x="96" dy="36">El Niño xuất hiện trong 6–8/2026.</tspan></text>
  </g>

  <g id="pressure-replant" data-pptx-bounds="640 184 576 208">
    <line x1="640" y1="184" x2="1216" y2="184" stroke="#D9CDBA" stroke-width="1.5" />
    <use data-icon="tabler-outline/calendar" x="672" y="212" width="40" height="40" fill="#9C2B1B" stroke-width="2" />
    <text x="728" y="248" font-size="28" font-weight="600" fill="#221C15">Vườn cây già</text>
    <text x="672" y="296" font-size="24" fill="#3A3128">Khoảng <tspan font-weight="bold" fill="#9C2B1B">30%</tspan> diện tích cà phê đã 20 năm<tspan x="672" dy="36">tuổi trở lên và cần tái canh hoặc cải</tspan><tspan x="672" dy="36">tạo, theo WASI.</tspan></text>
  </g>

