    <use data-icon="tabler-outline/coins" x="96" y="420" width="40" height="40" fill="#9C2B1B" stroke-width="2" />
    <text x="152" y="456" font-size="28" font-weight="600" fill="#221C15">Chi phí sản xuất</text>
    <text x="96" y="504" font-size="24" fill="#3A3128">Phân bón và nhiên liệu tăng khoảng <tspan font-weight="bold" fill="#9C2B1B">30%</tspan>,<tspan x="96" dy="36">chi phí lao động tăng <tspan font-weight="bold" fill="#9C2B1B">33%</tspan> so với năm</tspan><tspan x="96" dy="36">trước.</tspan></text>
