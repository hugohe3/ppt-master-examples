  <g id="culture-note" data-pptx-bounds="64 540 1152 104">
    <text x="64" y="566" font-size="28" fill="#3A3128">Phin nhôm, cà phê sữa đá và cà phê trứng là ba cách người Việt<tspan x="64" dy="36">biến vị đắng đậm của Robusta thành thói quen hằng ngày.</tspan></text>
    <text x="64" y="636" font-size="18" fill="#6B5B4A">Cách nhóm ba biểu hiện văn hoá này là tổng hợp của bài giảng; mốc 1946 dẫn nguồn ở dưới.</text>
  </g>

  <g id="page-footer" data-pptx-role="footer" data-pptx-bounds="64 668 1152 38" fill="#6B5B4A" font-size="16">
