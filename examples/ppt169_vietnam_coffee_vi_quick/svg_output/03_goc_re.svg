  <g id="era-1-note" data-pptx-bounds="64 396 376 144">
    <text x="64" y="420" font-size="24" fill="#3A3128">Người Pháp đưa cây cà phê<tspan x="64" dy="36">du nhập vào Việt Nam, mở</tspan><tspan x="64" dy="36">đầu hơn một thế kỷ rưỡi gắn</tspan><tspan x="64" dy="36">bó với đất Việt.</tspan></text>
