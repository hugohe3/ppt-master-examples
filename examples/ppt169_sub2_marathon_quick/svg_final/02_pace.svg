    <text x="60" y="112" font-family="Arial Black, SimHei" font-size="40" fill="#F2F4F5">两小时，意味着每公里都要 2:50</text>
    <rect x="60" y="128" width="80" height="3" fill="#7CFF4F"/>
  </g>
  <g id="pace-hero" data-pptx-bounds="40 160 560 190">
