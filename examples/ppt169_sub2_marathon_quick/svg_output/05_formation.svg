    <text x="930" y="580" font-size="18" fill="#C9D3DB">领跑车恒速行驶，向路面
      <tspan x="930" dy="26">投射绿色激光</tspan></text>
  </g>
  <g id="footer" data-pptx-bounds="40 666 1200 40">
    <text x="60" y="692" font-size="13" fill="#9AA7B2">来源：World Athletics 赛报（2019）；INEOS 1:59 官方网站 Formation 页（2019）；Sports Illustrated（2019）</text>
    <text x="1220" y="692" font-size="13" fill="#9AA7B2" text-anchor="end">05</text>
  </g>
