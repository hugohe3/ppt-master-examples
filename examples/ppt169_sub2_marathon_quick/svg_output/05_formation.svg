<path d="M 1000 396.4 A 14.4 14.4 0 0 1 1014.4 382 L 1095.6 382 A 14.4 14.4 0 0 1 1110 396.4 L 1110 415.6 A 14.4 14.4 0 0 1 1095.6 430 L 1014.4 430 A 14.4 14.4 0 0 1 1000 415.6 Z"/>
</g>
