<path d="M 1110 199 L 1182 199 L 1182 190 L 1200 208 L 1182 226 L 1182 217 L 1110 217 Z"/>
</g>
    <text x="1096" y="214" font-size="16" fill="#9AA7B2" text-anchor="end">前进方向</text>
