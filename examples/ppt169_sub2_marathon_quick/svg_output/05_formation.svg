      <tspan x="60" dy="26">前 5 挡风，后 2 护侧</tspan></text>
  </g>
  <g id="fact-rotation" data-pptx-bounds="330 510 290 140">
    <text x="350" y="548" font-size="26" font-weight="bold" fill="#F2F4F5">每 5 公里换班</text>
    <text x="350" y="580" font-size="18" fill="#C9D3DB">换班动作事先在肯尼亚
