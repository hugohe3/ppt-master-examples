<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" data-pptx-page-role="content">
  <rect id="page-field" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="page-header" data-pptx-bounds="64 60 1152 100">
    <text x="64" y="92" font-size="36" font-weight="bold" fill="#1F2933">Detection took three minutes; identifying the failing<tspan x="64" dy="43">module took two hours and fifty-three</tspan></text>
    <line x1="64" y1="158" x2="1216" y2="158" stroke="#D7DDE3" stroke-width="1"/>
  </g>
  <g id="duration-detection" data-pptx-bounds="64 190 436 136">
    <use data-icon="chunk-filled/clock" x="64" y="192" width="12" height="12" fill="#2E7D5B"/>
    <text x="82" y="202" font-size="12" font-weight="bold" fill="#1F2933">AUTOMATED DETECTION</text>
    <text x="64" y="262" font-family="Consolas" font-size="56" font-weight="bold" fill="#2E7D5B">3 min</text>
    <text x="64" y="292" font-size="16" fill="#5A6673">11:28 impact starts to 11:31, the first automated<tspan x="64" dy="22">test that detects the issue.</tspan></text>
  </g>
  <g id="p08-gap-arrow" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="rightArrow" data-pptx-frame="520 236 80 28" data-pptx-av-adj1="val 50000" data-pptx-av-adj2="val 50000" fill="#D7DDE3" stroke="none">
<path d="M 520 243 L 586 243 L 586 236 L 600 250 L 586 264 L 586 257 L 520 257 Z"/>
</g>
  <g id="duration-diagnosis" data-pptx-bounds="620 190 596 136">
    <use data-icon="chunk-filled/clock" x="620" y="192" width="12" height="12" fill="#B4342C"/>
    <text x="638" y="202" font-size="12" font-weight="bold" fill="#1F2933">TIME TO IDENTIFY THE FAILING MODULE</text>
    <text x="620" y="262" font-family="Consolas" font-size="56" font-weight="bold" fill="#B4342C">2 h 53 min</text>
    <text x="620" y="292" font-size="16" fill="#5A6673">11:31 detection to 14:24, when Bot Management<tspan x="620" dy="22">was identified as the source of the 500 errors.</tspan></text>
  </g>
  <g id="reason-alternating" data-pptx-bounds="64 380 356 160">
    <text x="64" y="392" font-size="12" font-weight="bold" fill="#B4342C">THE FAILURE ALTERNATED</text>
    <text x="64" y="420" font-size="16" fill="#1F2933">The system failed and then recovered as<tspan x="64" dy="22">good and bad files alternated every five</tspan><tspan x="64" dy="22">minutes — behaviour the published account</tspan><tspan x="64" dy="22">calls very unusual for an internal error.</tspan></text>
  </g>
  <g id="reason-status-page" data-pptx-bounds="462 380 356 160">
    <text x="462" y="392" font-size="12" font-weight="bold" fill="#B4342C">THE STATUS PAGE WENT DOWN TOO</text>
    <text x="462" y="420" font-size="16" fill="#1F2933">Cloudflare’s status page, hosted<tspan x="462" dy="22">completely off Cloudflare’s</tspan><tspan x="462" dy="22">infrastructure with no dependencies on</tspan><tspan x="462" dy="22">it, went down at the same time. The</tspan><tspan x="462" dy="22">published account calls this a</tspan><tspan x="462" dy="22">coincidence.</tspan></text>
  </g>
  <g id="reason-ddos-context" data-pptx-bounds="860 380 356 160">
    <text x="860" y="392" font-size="12" font-weight="bold" fill="#B4342C">RECENT DDoS ACTIVITY</text>
    <text x="860" y="420" font-size="16" fill="#1F2933">In the internal incident chat room the<tspan x="860" dy="22">team was concerned this might continue</tspan><tspan x="860" dy="22">the recent spate of high-volume Aisuru</tspan><tspan x="860" dy="22">DDoS attacks.</tspan></text>
  </g>
  <g id="detection-claim-label" data-pptx-bounds="64 560 1152 48">
    <text x="64" y="574" font-size="16" fill="#5A6673">Inferred sequence: the attack hypothesis is what the published account says the team held at the time. Naming it here is not a<tspan x="64" dy="22">criticism of holding it, and the account is explicit that no cyber attack or malicious activity was involved.</tspan></text>
  </g>
  <g id="page-footer" data-pptx-bounds="64 680 1152 22" fill="#5A6673" font-size="12">
    <text x="64" y="692">Cloudflare, “Cloudflare outage on November 18, 2025”, incident timeline and status-page section. All times UTC.</text>
    <text x="1216" y="692" text-anchor="end">08</text>
  </g>
</svg>
