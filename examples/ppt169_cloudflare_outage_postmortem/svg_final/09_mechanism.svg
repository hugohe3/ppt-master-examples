    <text text-anchor="middle" font-size="16" fill="#1F2933" x="1077" y="210">Thread panics,</text><text text-anchor="middle" font-size="16" fill="#1F2933" x="1077" y="232">5xx returned</text></g>
  <g id="mechanism-query" data-pptx-bounds="64 284 560 268">
    <text x="64" y="296" font-size="12" font-weight="bold" fill="#B4342C">THE QUERY</text>
    <rect x="64" y="316" width="560" height="150" fill="#F2F4F6" />
    <text font-family="Consolas" font-size="16" fill="#1F2933" x="88" y="342">SELECT</text><text font-family="Consolas" font-size="16" fill="#1F2933" x="88" y="364">  name,</text><text font-family="Consolas" font-size="16" fill="#1F2933" x="88" y="386">  type</text><text font-family="Consolas" font-size="16" fill="#1F2933" x="88" y="408">FROM system.columns</text><text font-family="Consolas" font-size="16" fill="#1F2933" x="88" y="430">WHERE table = 'http_requests_features'</text><text font-family="Consolas" font-size="16" fill="#1F2933" x="88" y="452">order by name;</text><text font-size="16" fill="#1F2933" x="64" y="496">The feature-file query filtered on the table name but</text><text font-size="16" fill="#1F2933" x="64" y="518">not the database name, so after the 11:05 change made</text><text font-size="16" fill="#1F2933" x="64" y="540">access to the r0 database explicit it returned columns twice.</text></g>
  <g id="mechanism-limit" data-pptx-bounds="656 284 560 268">
    <text x="656" y="296" font-size="12" font-weight="bold" fill="#B4342C">THE LIMIT</text>
    <rect x="656" y="316" width="560" height="150" fill="#F2F4F6" />
    <text font-family="Consolas" font-size="16" fill="#B4342C" x="680" y="380">thread fl2_worker_thread panicked:</text><text font-family="Consolas" font-size="16" fill="#B4342C" x="680" y="402">called Result::unwrap() on an Err value</text><text font-size="16" fill="#1F2933" x="656" y="496">The bots module preallocates memory for at most 200</text><text font-size="16" fill="#1F2933" x="656" y="518">features, well above the roughly 60 in use. The oversized</text><text font-size="16" fill="#1F2933" x="656" y="540">file hit that limit and the check produced an unhandled error.</text></g>
  <g id="mechanism-claim-label" data-pptx-bounds="64 566 1152 48">
    <text font-size="16" fill="#5A6673" x="64" y="580">Observed facts: the access change, the query form, the file growth and the 200-feature limit are each stated in the published</text><text font-size="16" fill="#5A6673" x="64" y="602">account. The order that connects them into one chain is that account’s own inferred sequence.</text></g>
  <g id="page-footer" data-pptx-bounds="64 680 1152 22" fill="#5A6673" font-size="12">
    <text x="64" y="692">Cloudflare, “Cloudflare outage on November 18, 2025”, query-behaviour-change and memory-preallocation sections.</text>
    <text x="1216" y="692" text-anchor="end">09</text>
  </g>
