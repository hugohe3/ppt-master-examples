  <g id="source-primary" data-pptx-bounds="64 180 1152 120">
    <text x="64" y="198" font-size="12" font-weight="bold" fill="#B4342C">PRIMARY SOURCE</text>
    <text x="64" y="228" font-size="20" font-weight="bold" fill="#1F2933">Cloudflare outage on November 18, 2025 — Matthew Prince, 18 November 2025</text>
    <text font-family="Consolas" font-size="16" fill="#B4342C" x="64" y="256"><tspan><a href="https://blog.cloudflare.com/18-november-2025-outage/"><tspan>https://blog.cloudflare.com/18-november-2025-outage/</tspan></a></tspan></text><text x="64" y="280" font-size="16" fill="#5A6673">Supports slides 1–10 and 12–14: the timeline, the impact table, the mechanism, the factors, the controls and the actions.</text>
  </g>
  <g id="source-comparison" data-pptx-bounds="64 320 1152 120">
    <text x="64" y="338" font-size="12" font-weight="bold" fill="#B4342C">COMPARISON SOURCE</text>
    <text x="64" y="368" font-size="20" font-weight="bold" fill="#1F2933">Details of the Cloudflare outage on July 2, 2019</text>
    <text font-family="Consolas" font-size="16" fill="#B4342C" x="64" y="396"><tspan><a href="https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/"><tspan>https://blog.cloudflare.com/details-of-the-cloudflare-outage-on-july-2-2019/</tspan></a></tspan></text><text x="64" y="420" font-size="16" fill="#5A6673">Supports slide 11: the 2019 trigger, the Quicksilver propagation path, the global kill switch and the 27-minute recovery.</text>
  </g>
