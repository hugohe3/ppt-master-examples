  </g>
  <g id="verification-policy" data-pptx-bounds="64 586 1152 86">
    <text font-size="16" fill="#1F2933" x="64" y="600">All times in this deck are UTC to the minute, exactly as published. Elapsed durations are arithmetic on published timestamps</text><text font-size="16" fill="#1F2933" x="64" y="622">and are labelled as derived. No figure originates outside these documents; where the account states no value, the page says</text><text font-size="16" fill="#1F2933" x="64" y="644">NO DATA or marks the item unconfirmed. The schematic chart on slide 5 carries no published magnitudes, and the severity</text><text font-size="16" fill="#1F2933" x="64" y="666">bands on slides 5 to 7 are this review’s reading of the published status column.</text></g>
