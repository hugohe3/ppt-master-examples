  <g id="cycle-explanation" data-pptx-bounds="64 590 1152 68" fill="#1F2933" font-size="16">
    <text x="64" y="604">The feature file was regenerated every five minutes by a query on a ClickHouse cluster that was being gradually updated, so each</text><text x="64" y="626">cycle could produce either a good or a bad file — until every ClickHouse node generated the bad file and the failure stabilised.</text><text x="64" y="648" font-weight="bold">Schematic reconstruction from the published account, not the original monitoring record. No error-rate magnitude is published.</text>
  </g>
