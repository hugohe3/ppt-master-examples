    <text x="638" y="202" font-size="12" font-weight="bold" fill="#1F2933">TIME TO IDENTIFY THE FAILING MODULE</text>
    <text x="620" y="262" font-family="Consolas" font-size="56" font-weight="bold" fill="#B4342C">2 h 53 min</text>
    <text font-size="16" fill="#5A6673" x="620" y="292">11:31 detection to 14:24, when Bot Management</text><text font-size="16" fill="#5A6673" x="620" y="314">was identified as the source of the 500 errors.</text></g>
  <g id="reason-alternating" data-pptx-bounds="64 380 356 160">
    <text x="64" y="392" font-size="12" font-weight="bold" fill="#B4342C">THE FAILURE ALTERNATED</text>
    <text font-size="16" fill="#1F2933" x="64" y="420">The system failed and then recovered as</text><text font-size="16" fill="#1F2933" x="64" y="442">good and bad files alternated every five</text><text font-size="16" fill="#1F2933" x="64" y="464">minutes — behaviour the published account</text><text font-size="16" fill="#1F2933" x="64" y="486">calls very unusual for an internal error.</text></g>
  <g id="reason-status-page" data-pptx-bounds="462 380 356 160">
    <text x="462" y="392" font-size="12" font-weight="bold" fill="#B4342C">THE STATUS PAGE WENT DOWN TOO</text>
    <text font-size="16" fill="#1F2933" x="462" y="420">Cloudflare’s status page, hosted</text><text font-size="16" fill="#1F2933" x="462" y="442">completely off Cloudflare’s</text><text font-size="16" fill="#1F2933" x="462" y="464">infrastructure with no dependencies on</text><text font-size="16" fill="#1F2933" x="462" y="486">it, went down at the same time. The</text><text font-size="16" fill="#1F2933" x="462" y="508">published account calls this a</text><text font-size="16" fill="#1F2933" x="462" y="530">coincidence.</text></g>
  <g id="reason-ddos-context" data-pptx-bounds="860 380 356 160">
    <text x="860" y="392" font-size="12" font-weight="bold" fill="#B4342C">RECENT DDoS ACTIVITY</text>
    <text font-size="16" fill="#1F2933" x="860" y="420">In the internal incident chat room the</text><text font-size="16" fill="#1F2933" x="860" y="442">team was concerned this might continue</text><text font-size="16" fill="#1F2933" x="860" y="464">the recent spate of high-volume Aisuru</text><text font-size="16" fill="#1F2933" x="860" y="486">DDoS attacks.</text></g>
  <g id="detection-claim-label" data-pptx-bounds="64 560 1152 48">
    <text font-size="16" fill="#5A6673" x="64" y="574">Inferred sequence: the attack hypothesis is what the published account says the team held at the time. Naming it here is not a</text><text font-size="16" fill="#5A6673" x="64" y="596">criticism of holding it, and the account is explicit that no cyber attack or malicious activity was involved.</text></g>
  <g id="page-footer" data-pptx-bounds="64 680 1152 22" fill="#5A6673" font-size="12">
