  <g id="page-header" data-pptx-bounds="64 60 1152 100">
    <text font-weight="bold" font-size="36" fill="#1F2933" x="64" y="92">Detection took three minutes; identifying the failing</text><text font-weight="bold" font-size="36" fill="#1F2933" x="64" y="135">module took two hours and fifty-three</text><line x1="64" y1="158" x2="1216" y2="158" stroke="#D7DDE3" stroke-width="1" />
  </g>
