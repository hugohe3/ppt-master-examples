    <path fill-rule="evenodd" clip-rule="evenodd" d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM12.7071 5.70711L11.2929 4.29289L6.5 9.08579L4.70711 7.29289L3.29289 8.70711L6.5 11.9142L12.7071 5.70711Z" />
  </g>
    <text x="106" y="224" font-size="12" font-weight="bold" fill="#2E7D5B">PROTECT THIS</text>
    <text font-weight="bold" font-size="28" fill="#1F2933" x="88" y="266">Automated detection</text><text font-weight="bold" font-size="28" fill="#1F2933" x="88" y="300">was fast</text><text font-size="16" fill="#1F2933" x="88" y="352">The first automated test detected</text><text font-size="16" fill="#1F2933" x="88" y="374">the issue at 11:31, three minutes</text><text font-size="16" fill="#1F2933" x="88" y="396">after impact began at 11:28. Manual</text><text font-size="16" fill="#1F2933" x="88" y="418">investigation started the following</text><text font-size="16" fill="#1F2933" x="88" y="440">minute and the incident call was</text><text font-size="16" fill="#1F2933" x="88" y="462">created at 11:35.</text></g>
  <g id="control-bypass" data-pptx-bounds="462 190 356 280">
    <g id="p12-control-2-frame" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="snip1Rect" data-pptx-frame="462 190 356 280" fill="none" stroke="#2E7D5B" stroke-width="1.5">
