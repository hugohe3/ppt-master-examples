    <text font-weight="bold" font-size="36" fill="#1F2933" x="64" y="92">Three controls limited the damage</text><text font-weight="bold" font-size="36" fill="#1F2933" x="64" y="135">and are the ones to protect</text><line x1="64" y1="158" x2="1216" y2="158" stroke="#D7DDE3" stroke-width="1" />
