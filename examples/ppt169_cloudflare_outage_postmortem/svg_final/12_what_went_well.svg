    <path fill-rule="evenodd" clip-rule="evenodd" d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM12.7071 5.70711L11.2929 4.29289L6.5 9.08579L4.70711 7.29289L3.29289 8.70711L6.5 11.9142L12.7071 5.70711Z" />
  </g>
    <text x="902" y="224" font-size="12" font-weight="bold" fill="#2E7D5B">PROTECT THIS</text>
    <text font-weight="bold" font-size="28" fill="#1F2933" x="884" y="266">The older engine</text><text font-weight="bold" font-size="28" fill="#1F2933" x="884" y="300">degraded, not failed</text><text font-size="16" fill="#1F2933" x="884" y="352">Customers on the old FL proxy</text><text font-size="16" fill="#1F2933" x="884" y="374">engine did not see errors, and</text><text font-size="16" fill="#1F2933" x="884" y="396">customers who were not using the</text><text font-size="16" fill="#1F2933" x="884" y="418">bot score in their rules saw no</text><text font-size="16" fill="#1F2933" x="884" y="440">impact at all.</text></g>
  <g id="controls-claim-label" data-pptx-bounds="64 506 1152 26">
    <text x="64" y="520" font-size="16" fill="#5A6673">Observed facts from the published account; the judgement that these three are worth protecting is this review’s.</text>
