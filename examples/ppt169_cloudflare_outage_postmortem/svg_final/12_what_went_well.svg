  <g transform="translate(486, 214) scale(0.75)" fill="#2E7D5B">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM12.7071 5.70711L11.2929 4.29289L6.5 9.08579L4.70711 7.29289L3.29289 8.70711L6.5 11.9142L12.7071 5.70711Z" />
  </g>
    <text x="504" y="224" font-size="12" font-weight="bold" fill="#2E7D5B">PROTECT THIS</text>
    <text font-weight="bold" font-size="28" fill="#1F2933" x="486" y="266">A bypass existed</text><text font-weight="bold" font-size="28" fill="#1F2933" x="486" y="300">and was used</text><text font-size="16" fill="#1F2933" x="486" y="352">At 13:05, internal system bypasses</text><text font-size="16" fill="#1F2933" x="486" y="374">failed Workers KV and Cloudflare</text><text font-size="16" fill="#1F2933" x="486" y="396">Access back to a prior version of</text><text font-size="16" fill="#1F2933" x="486" y="418">the core proxy, reducing impact for</text><text font-size="16" fill="#1F2933" x="486" y="440">every downstream system — before</text><text font-size="16" fill="#1F2933" x="486" y="462">the trigger was known.</text></g>
