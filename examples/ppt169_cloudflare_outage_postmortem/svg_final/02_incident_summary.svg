<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Arial" data-pptx-page-role="content">
  <rect id="page-field" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  <g id="page-header" data-pptx-bounds="64 60 1152 100">
    <text font-weight="bold" font-size="36" fill="#1F2933" x="64" y="92">One feature file doubled in size and a fixed 200-feature</text><text font-weight="bold" font-size="36" fill="#1F2933" x="64" y="135">limit turned it into a global 5xx event</text><line x1="64" y1="158" x2="1216" y2="158" stroke="#D7DDE3" stroke-width="1" />
  </g>
  <g id="summary-lead" data-pptx-bounds="64 166 1152 70">
    <text font-size="26" fill="#1F2933" x="64" y="190">The failure was in the ingestion of Cloudflare’s own generated</text><text font-size="26" fill="#1F2933" x="64" y="226">configuration, not in the traffic that configuration governs.</text></g>
  <g id="moment-change-deployed" data-pptx-bounds="64 246 264 122">
    
  <g transform="translate(64, 248) scale(0.75)" fill="#4A5568">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM12 9V7L4 7V9H12Z" />
  </g>
    <text x="82" y="258" font-size="12" font-weight="bold" fill="#5A6673">NORMAL · CHANGE DEPLOYED</text>
    <text x="64" y="316" font-family="Consolas" font-size="56" font-weight="bold" fill="#4A5568">11:05</text>
    <text font-size="16" fill="#5A6673" x="64" y="342">Database access control</text><text font-size="16" fill="#5A6673" x="64" y="362">change deployed</text></g>
  <g id="moment-impact-starts" data-pptx-bounds="360 246 264 122">
    
