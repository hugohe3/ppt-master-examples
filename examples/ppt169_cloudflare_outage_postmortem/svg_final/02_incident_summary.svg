    <text x="952" y="316" font-family="Consolas" font-size="56" font-weight="bold" fill="#2E7D5B">17:06</text>
    <text font-size="16" fill="#5A6673" x="952" y="342">All downstream services</text><text font-size="16" fill="#5A6673" x="952" y="362">restarted and restored</text></g>
  <g id="fact-trigger" data-pptx-bounds="64 400 552 112">
    <text x="64" y="412" font-size="12" font-weight="bold" fill="#B4342C">TRIGGER</text>
    <text font-size="20" fill="#1F2933" x="64" y="442">A change to one of Cloudflare’s database</text><text font-size="20" fill="#1F2933" x="64" y="472">systems’ permissions made the query output</text><text font-size="20" fill="#1F2933" x="64" y="502">duplicate entries into the feature file.</text></g>
  <g id="fact-mechanism" data-pptx-bounds="664 400 552 112">
    <text x="664" y="412" font-size="12" font-weight="bold" fill="#B4342C">MECHANISM</text>
    <text font-size="20" fill="#1F2933" x="664" y="442">The file doubled in size and passed the</text><text font-size="20" fill="#1F2933" x="664" y="472">bots module’s preallocated limit of 200</text><text font-size="20" fill="#1F2933" x="664" y="502">features, against roughly 60 then in use.</text></g>
  <g id="fact-scope" data-pptx-bounds="64 548 552 112">
    <text x="64" y="560" font-size="12" font-weight="bold" fill="#B4342C">SCOPE</text>
    <text font-size="20" fill="#1F2933" x="64" y="590">Core CDN and security services, Turnstile,</text><text font-size="20" fill="#1F2933" x="64" y="620">Workers KV, Dashboard, Email Security and</text><text font-size="20" fill="#1F2933" x="64" y="650">Access were affected, in different ways.</text></g>
  <g id="fact-recovery" data-pptx-bounds="664 548 552 112">
    <text x="664" y="560" font-size="12" font-weight="bold" fill="#B4342C">RECOVERY</text>
    <text font-size="20" fill="#1F2933" x="664" y="590">Core traffic was largely flowing as normal</text><text font-size="20" fill="#1F2933" x="664" y="620">by 14:30, and all remaining services were</text><text font-size="20" fill="#1F2933" x="664" y="650">restored at 17:06.</text></g>
  <g id="page-footer" data-pptx-bounds="64 680 1152 22" fill="#5A6673" font-size="12">
    <text x="64" y="692">Cloudflare, “Cloudflare outage on November 18, 2025”. All times UTC.</text>
    <text x="1216" y="692" text-anchor="end">02</text>
