  <g id="grid-picture-one-slot" data-pptx-placeholder="picture" data-pptx-idx="1"
    data-pptx-bounds="0 0 640 360">
    <image id="grid-picture-one-carrier" data-pptx-carrier="true"
      x="0" y="0" width="640" height="360" preserveAspectRatio="xMidYMid slice"
