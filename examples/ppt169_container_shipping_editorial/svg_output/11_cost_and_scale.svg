  <rect id="grid-scrim-four" x="640" y="600" width="640" height="120"
    fill="url(#grid-scrim-paint)" data-pptx-role="decoration"/>
  <g id="grid-caption-one-slot" data-pptx-placeholder="object" data-pptx-idx="5"
    data-pptx-bounds="32 268 576 64">
    <text id="grid-caption-one-carrier" data-pptx-carrier="true"
      x="32" y="296" fill="#E8EFF6" font-size="20">纽约港在册码头工人<tspan x="32" dy="28">1953 年 <tspan font-weight="bold">5 万余人</tspan> → 1967 年 <tspan font-weight="bold">2.3 万</tspan></tspan></text>
  </g>
  <g id="grid-caption-two-slot" data-pptx-placeholder="object" data-pptx-idx="6"
    data-pptx-bounds="672 268 576 64">
    <text id="grid-caption-two-carrier" data-pptx-carrier="true"
      x="672" y="296" fill="#E8EFF6" font-size="20">1962 年伊丽莎白港启用,90 英亩<tspan x="672" dy="28">Sea-Land 码头成为几乎所有集装箱码头的原型</tspan></text>
  </g>
  <g id="grid-caption-three-slot" data-pptx-placeholder="object" data-pptx-idx="7"
    data-pptx-bounds="32 628 576 64">
    <text id="grid-caption-three-carrier" data-pptx-carrier="true"
      x="32" y="656" fill="#E8EFF6" font-size="20">上海港 2024 年 <tspan font-weight="bold">5151 万 TEU</tspan><tspan x="32" dy="28">全球首个突破 5000 万 TEU 的港口</tspan></text>
  </g>
  <g id="grid-caption-four-slot" data-pptx-placeholder="object" data-pptx-idx="8"
    data-pptx-bounds="672 628 576 64">
    <text id="grid-caption-four-carrier" data-pptx-carrier="true"
      x="672" y="656" fill="#E8EFF6" font-size="20">MSC Irina <tspan font-weight="bold">24346 TEU</tspan>,长 399.9 米<tspan x="672" dy="28">1956 年那一船约合 100 TEU</tspan></text>
  </g>
  <g id="source-note" data-pptx-bounds="606 338 642 24">
    <text x="1248" y="352" text-anchor="end" fill="#C7D3DE" font-size="16">来源:纽新港务局;Seatrade Maritime(2024);Port Houston;1971 年专著转引</text>
  </g>
