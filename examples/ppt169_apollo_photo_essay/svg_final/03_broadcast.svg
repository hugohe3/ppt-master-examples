  <g id="p03-count-orbits" data-pptx-bounds="72 306 340 142">
    <text x="72" y="380" font-family="Times New Roman, SimSun" font-size="78" fill="#D2622B">10<tspan font-family="Arial, Microsoft YaHei" font-size="30" fill="#E9E4D9"> 圈</tspan></text>
    <text x="72" y="430" font-size="22" fill="#98A0A9">绕着另一个天体</text>
