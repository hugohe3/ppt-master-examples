  <g id="p03-broadcast" data-pptx-bounds="72 506 1136 100">
    <text fill="#DAD5CA" font-size="30" x="72" y="540">平安夜第九圈绕月，三人轮流朗读<tspan fill="#E9E4D9" font-weight="bold">《创世记》前十节</tspan>。</text><text fill="#DAD5CA" font-size="30" x="72" y="584">NASA 说，乘组刻意挑了适合全球不同信仰听众的内容。</text></g>

